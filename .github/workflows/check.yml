name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: docker build --tag faza:runtime-check .
      - run: npm run check:runtime
      - run: docker run --rm faza:runtime-check npm audit --omit=dev --omit=optional --audit-level=moderate
