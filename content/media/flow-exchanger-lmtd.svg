<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Пластинчатый теплообменник: противоток и прямоток, логарифмический температурный напор LMTD">
  <defs>
    <marker id="hxHot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#C4382A"/>
    </marker>
    <marker id="hxCold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#0C5E80"/>
    </marker>
    <marker id="hxGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#047857"/>
    </marker>
    <marker id="hxAmb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#B45309"/>
    </marker>
  </defs>
  <rect width="760" height="320" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Пластинчатый теплообменник: противоток vs прямоток и напор ΔT_lm (LMTD)</text>

  <!-- Левая панель: Противоток -->
  <rect x="20" y="42" width="352" height="214" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="196" y="61" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">Противоток (равномерный напор)</text>

  <!-- Мини-схема пластины (противоток) -->
  <rect x="72" y="68" width="252" height="22" rx="6" fill="#EFF9FF" stroke="#DCE6EE"/>
  <path d="M78 79 L90 76 L102 82 L114 76 L126 82 L138 76 L150 82 L162 76 L174 82 L186 76 L198 82 L210 76 L222 82 L234 76 L246 82 L258 76 L270 82 L282 76 L294 82 L306 76 L318 79" fill="none" stroke="#64748B" stroke-width="1"/>
  <line x1="92" y1="73" x2="170" y2="73" stroke="#E05545" stroke-width="1.8" marker-end="url(#hxHot)"/>
  <line x1="302" y1="85" x2="224" y2="85" stroke="#0C5E80" stroke-width="1.8" marker-end="url(#hxCold)"/>

  <!-- Оси противотока -->
  <line x1="72" y1="98" x2="72" y2="212" stroke="#182026" stroke-width="1.4"/>
  <line x1="72" y1="212" x2="328" y2="212" stroke="#182026" stroke-width="1.4"/>
  <text x="64" y="102" text-anchor="end" font-family="monospace" font-size="10" fill="#C4382A">80°</text>
  <text x="64" y="164" text-anchor="end" font-family="monospace" font-size="10" fill="#0C5E80">44°</text>
  <text x="64" y="210" text-anchor="end" font-family="monospace" font-size="9.5" fill="#5B6770">T</text>
  <text x="332" y="156" text-anchor="start" font-family="monospace" font-size="10" fill="#C4382A">48°</text>
  <text x="332" y="204" text-anchor="start" font-family="monospace" font-size="10" fill="#0C5E80">20°</text>
  <text x="198" y="226" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B6770">Длина теплообменника L (0 → L)</text>

  <!-- Температурные профили противотока -->
  <path d="M72 102 Q198 126 324 152" fill="none" stroke="#E05545" stroke-width="2.6"/>
  <path d="M324 200 Q198 182 72 160" fill="none" stroke="#0C5E80" stroke-width="2.6" stroke-dasharray="6 3"/>
  <text x="196" y="118" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#C4382A">T_гор (крем →)</text>
  <text x="196" y="196" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0C5E80">T_хол (← вода)</text>

  <!-- ΔT1 и ΔT2 противотока -->
  <line x1="84" y1="108" x2="84" y2="154" stroke="#047857" stroke-width="1.6" marker-start="url(#hxGrn)" marker-end="url(#hxGrn)"/>
  <text x="90" y="135" font-family="monospace" font-size="10" font-weight="700" fill="#047857">ΔT₁ = 36 K</text>
  <line x1="312" y1="158" x2="312" y2="195" stroke="#047857" stroke-width="1.6" marker-start="url(#hxGrn)" marker-end="url(#hxGrn)"/>
  <text x="305" y="178" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#047857">ΔT₂ = 28 K</text>

  <rect x="34" y="232" width="324" height="18" rx="6" fill="#ECFDF5"/>
  <text x="196" y="244" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#047857">ΔT_lm = 31,8 K · −35 % площади пластин A</text>

  <!-- Правая панель: Прямоток -->
  <rect x="388" y="42" width="352" height="214" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="564" y="61" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#B45309">Прямоток (ограничение «щипком»)</text>

  <!-- Мини-схема пластины (прямоток) -->
  <rect x="440" y="68" width="252" height="22" rx="6" fill="#FFF7ED" stroke="#DCE6EE"/>
  <path d="M446 79 L458 76 L470 82 L482 76 L494 82 L506 76 L518 82 L530 76 L542 82 L554 76 L566 82 L578 76 L590 82 L602 76 L614 82 L626 76 L638 82 L650 76 L662 82 L674 76 L686 79" fill="none" stroke="#64748B" stroke-width="1"/>
  <line x1="460" y1="73" x2="538" y2="73" stroke="#E05545" stroke-width="1.8" marker-end="url(#hxHot)"/>
  <line x1="460" y1="85" x2="538" y2="85" stroke="#0C5E80" stroke-width="1.8" marker-end="url(#hxCold)"/>

  <!-- Оси прямотока -->
  <line x1="440" y1="98" x2="440" y2="212" stroke="#182026" stroke-width="1.4"/>
  <line x1="440" y1="212" x2="696" y2="212" stroke="#182026" stroke-width="1.4"/>
  <text x="432" y="104" text-anchor="end" font-family="monospace" font-size="10" fill="#C4382A">80°</text>
  <text x="432" y="204" text-anchor="end" font-family="monospace" font-size="10" fill="#0C5E80">20°</text>
  <text x="700" y="152" text-anchor="start" font-family="monospace" font-size="10" fill="#C4382A">48°</text>
  <text x="700" y="168" text-anchor="start" font-family="monospace" font-size="10" fill="#0C5E80">44°</text>
  <text x="566" y="226" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B6770">Длина теплообменника L (0 → L)</text>

  <!-- Температурные профили прямотока -->
  <path d="M440 102 Q546 136 692 152" fill="none" stroke="#E05545" stroke-width="2.6"/>
  <path d="M440 200 Q546 172 692 162" fill="none" stroke="#0C5E80" stroke-width="2.6" stroke-dasharray="6 3"/>
  <text x="572" y="124" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#C4382A">T_гор →</text>
  <text x="572" y="192" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0C5E80">T_хол →</text>

  <!-- ΔT1 и ΔT2 прямотока -->
  <line x1="452" y1="108" x2="452" y2="194" stroke="#B45309" stroke-width="1.6" marker-start="url(#hxAmb)" marker-end="url(#hxAmb)"/>
  <text x="458" y="155" font-family="monospace" font-size="10" font-weight="700" fill="#B45309">ΔT₁ = 60 K</text>
  <line x1="684" y1="150" x2="684" y2="164" stroke="#C4382A" stroke-width="2"/>
  <text x="680" y="138" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#C4382A">ΔT₂ = 4 K</text>

  <rect x="402" y="232" width="324" height="18" rx="6" fill="#FFF1F0"/>
  <text x="564" y="244" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#C4382A">ΔT_lm = 20,7 K · T_хол,вых всегда &lt; T_гор,вых</text>

  <!-- Нижняя плашка формулы LMTD -->
  <rect x="20" y="264" width="720" height="40" rx="11" fill="#EFF9FF" stroke="#0C5E80" stroke-width="1.3"/>
  <text x="40" y="288" font-family="monospace" font-size="12" font-weight="700" fill="#0C5E80">Q = U · A · ΔT_lm</text>
  <line x1="190" y1="272" x2="190" y2="296" stroke="#DCE6EE" stroke-width="1.5"/>
  <text x="208" y="288" font-family="monospace" font-size="12" font-weight="700" fill="#182026">ΔT_lm = (ΔT₁ − ΔT₂) / ln(ΔT₁ / ΔT₂)</text>
  <line x1="504" y1="272" x2="504" y2="296" stroke="#DCE6EE" stroke-width="1.5"/>
  <text x="622" y="282" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#047857">При ΔT₁ ≈ ΔT₂: ΔT_lm → ΔT_ср</text>
  <text x="622" y="296" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Противоток допускает перекрёст T</text>
</svg>
