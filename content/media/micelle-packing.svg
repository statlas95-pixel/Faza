<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Эволюция мицелл на солевой кривой">
  <rect width="760" height="250" rx="18" fill="#FBF8F3" stroke="#E4DACB"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#2A1B3D">Солевая кривая ПАВ: переход мицелл от сферических к разветвлённым</text>
  <!-- График -->
  <g transform="translate(36,44)">
    <rect width="688" height="186" rx="14" fill="#FFFFFF" stroke="#E6DACB"/>
    <line x1="56" y1="152" x2="648" y2="152" stroke="#2A1B3D" stroke-width="1.5"/>
    <line x1="56" y1="26" x2="56" y2="152" stroke="#2A1B3D" stroke-width="1.5"/>
    <text x="350" y="174" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2A1B3D">Концентрация электролита NaCl, %</text>
    <text x="18" y="92" transform="rotate(-90 18 92)" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2A1B3D">Вязкость η</text>
    <!-- Рабочая зона -->
    <rect x="240" y="28" width="110" height="123" fill="#DDF3EC" opacity="0.7"/>
    <text x="295" y="42" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0B6B5D">Безопасная зона</text>
    <!-- Кривая -->
    <path d="M62 146 C140 144 210 132 275 88 C320 58 358 38 392 40 C432 42 470 96 520 136 C560 148 605 148 640 148" fill="none" stroke="#D9482B" stroke-width="3"/>
    <!-- Пик -->
    <line x1="392" y1="36" x2="392" y2="152" stroke="#D9482B" stroke-dasharray="4 3"/>
    <circle cx="392" cy="40" r="4.5" fill="#D9482B"/>
    <!-- Мицеллы 1: сферы -->
    <g fill="#0E7C7B" opacity="0.85">
      <circle cx="116" cy="112" r="8"/><circle cx="142" cy="124" r="8"/><circle cx="152" cy="100" r="8"/>
    </g>
    <text x="136" y="84" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2A1B3D">1. Сферические</text>
    <text x="136" y="144" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B4C6E">низкая вязкость</text>
    <!-- Мицеллы 2: червеобразные -->
    <g fill="none" stroke="#0E7C7B" stroke-width="5" stroke-linecap="round">
      <path d="M268 78 Q292 60 318 76 T364 68"/>
      <path d="M276 96 Q304 82 326 102 T366 94"/>
    </g>
    <text x="382" y="24" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0B6B5D">2. Переплетённые червеобразные (максимум)</text>
    <!-- Мицеллы 3: разветвлённые (пересол) -->
    <g fill="none" stroke="#6E4FA3" stroke-width="4" stroke-linecap="round">
      <path d="M510 74 L548 88 L586 72 M548 88 L552 118 M548 88 L592 108"/>
    </g>
    <text x="556" y="60" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#D9482B">3. Разветвлённые (пересол!)</text>
    <text x="556" y="138" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B4C6E">узлы скользят → обвал η</text>
  </g>
</svg>
