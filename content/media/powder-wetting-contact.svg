<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Краевой угол смачивания и образование рыбьего глаза в порошке полимера">
  <rect width="760" height="300" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">Смачивание порошка (угол θ) и механизм образования «рыбьего глаза»</text>

  <!-- Panel 1: Contact angle -->
  <rect x="24" y="48" width="230" height="232" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="139" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0C5E80">1. Краевой угол Юнга θ</text>
  <!-- Good wetting -->
  <line x1="44" y1="145" x2="234" y2="145" stroke="#182026" stroke-width="2"/>
  <path d="M84 145 Q139 112 194 145 Z" fill="#E6F6FE" stroke="#0E8B99" stroke-width="2"/>
  <text x="139" y="138" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#047857">θ &lt; 90° (смачивается)</text>
  <text x="139" y="160" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Капиллярное впитывание по Уошберну</text>

  <!-- Poor wetting -->
  <line x1="44" y1="238" x2="234" y2="238" stroke="#182026" stroke-width="2"/>
  <circle cx="139" cy="214" r="24" fill="#FFEAE7" stroke="#C4382A" stroke-width="2"/>
  <text x="139" y="218" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#C4382A">θ &gt; 90°</text>
  <text x="139" y="256" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Гидрофобный порошок плавает комком</text>

  <!-- Panel 2: Fish-eye -->
  <rect x="268" y="48" width="232" height="232" rx="12" fill="#FFF1F0" stroke="#E05545" stroke-width="1.2"/>
  <text x="384" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#C4382A">2. Ошибка: «рыбий глаз»</text>
  <text x="384" y="86" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B6770">Засыпка ксантана/карбомера сразу в воду</text>
  <!-- Swollen outer gel shell -->
  <circle cx="384" cy="158" r="52" fill="#E6F6FE" stroke="#0E8B99" stroke-width="2.5" stroke-dasharray="5 3"/>
  <circle cx="384" cy="158" r="30" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="384" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#B45309">Сухое</text>
  <text x="384" y="168" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#B45309">ядро</text>
  <text x="384" y="121" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0C5E80">Плотная гель-корка</text>
  <text x="384" y="232" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#C4382A">Вода не может диффундировать</text>
  <text x="384" y="247" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#C4382A">через набухшую плёнку полимера</text>

  <!-- Panel 3: Pre-dispersion in glycol -->
  <rect x="514" y="48" width="222" height="232" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="1.2"/>
  <text x="625" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">3. Решение: премикс в гликоле</text>
  <text x="625" y="86" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B6770">Глицерин / пропандиол (3:1 – 5:1)</text>
  <!-- Dispersed individual granules -->
  <rect x="540" y="106" width="170" height="96" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.4"/>
  <circle cx="570" cy="134" r="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="606" cy="148" r="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="645" cy="130" r="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="680" cy="156" r="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="585" cy="176" r="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="635" cy="178" r="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="625" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857">Частицы разделены смачивателем</text>
  <text x="625" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">Не набухают до ввода в воду →</text>
  <text x="625" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">быстрая гидратация без комков</text>
</svg>