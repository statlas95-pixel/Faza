<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Двойной электрический слой и кривая энергии ДЛФО">
  <rect width="760" height="280" rx="18" fill="#FBF8F3" stroke="#E4DACB"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#2A1B3D">Двойной электрический слой (ДЭС) и энергетический барьер ДЛФО</text>
  <!-- Левая часть: ДЭС -->
  <g transform="translate(24,46)">
    <rect width="340" height="212" rx="14" fill="#FFFFFF" stroke="#E6DACB"/>
    <text x="170" y="22" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2A1B3D">Строение ДЭС и дебаевская длина κ⁻¹</text>
    <!-- Заряженная частица -->
    <rect x="20" y="38" width="46" height="148" rx="8" fill="#4B2E83"/>
    <g fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">
      <text x="43" y="64">−</text><text x="43" y="92">−</text><text x="43" y="120">−</text><text x="43" y="148">−</text><text x="43" y="172">−</text>
    </g>
    <!-- Слой Штерна -->
    <rect x="66" y="38" width="28" height="148" fill="#EDE4FF"/>
    <g fill="#0E7C7B" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">
      <text x="80" y="68">+</text><text x="80" y="104">+</text><text x="80" y="140">+</text><text x="80" y="170">+</text>
    </g>
    <!-- Диффузный слой -->
    <rect x="94" y="38" width="120" height="148" fill="url(#diffGrad)"/>
    <defs>
      <linearGradient id="diffGrad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#DDF3EC"/>
        <stop offset="100%" stop-color="#FFFFFF"/>
      </linearGradient>
    </defs>
    <!-- Плоскость скольжения (дзетта-потенциал) -->
    <line x1="94" y1="36" x2="94" y2="192" stroke="#D9482B" stroke-width="1.8" stroke-dasharray="4 3"/>
    <!-- Кривая потенциала -->
    <path d="M66 56 L94 82 Q140 135 280 158" fill="none" stroke="#2A1B3D" stroke-width="2.4"/>
    <circle cx="94" cy="82" r="4" fill="#D9482B"/>
    <text x="102" y="79" font-family="sans-serif" font-size="11" font-weight="700" fill="#D9482B">ζ-потенциал</text>
    <!-- Стрелка дебаевской длины -->
    <line x1="94" y1="176" x2="196" y2="176" stroke="#0E7C7B" stroke-width="2"/>
    <text x="145" y="171" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0E7C7B">κ⁻¹ ≈ 0,304 / √I нм</text>
    <text x="274" y="114" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B4C6E">При росте соли I↑</text>
    <text x="274" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B4C6E">слой сжимается →</text>
    <text x="274" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#D9482B">коагуляция!</text>
  </g>
  <!-- Правая часть: Кривая ДЛФО -->
  <g transform="translate(384,46)">
    <rect width="352" height="212" rx="14" fill="#FFFFFF" stroke="#E6DACB"/>
    <text x="176" y="22" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2A1B3D">Энергия взаимодействия V(h) = V_эл + V_ВдВ</text>
    <!-- Оси -->
    <line x1="42" y1="120" x2="328" y2="120" stroke="#8A7D9A" stroke-width="1.4"/>
    <line x1="42" y1="36" x2="42" y2="194" stroke="#8A7D9A" stroke-width="1.4"/>
    <text x="320" y="135" font-family="sans-serif" font-size="10.5" fill="#5B4C6E">h</text>
    <text x="34" y="46" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#5B4C6E">+V</text>
    <text x="34" y="190" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#5B4C6E">−V</text>
    <!-- Отталкивание -->
    <path d="M50 42 Q105 92 270 116" fill="none" stroke="#0E7C7B" stroke-width="1.8" stroke-dasharray="5 3"/>
    <!-- Притяжение -->
    <path d="M52 192 Q80 134 270 123" fill="none" stroke="#6E4FA3" stroke-width="1.8" stroke-dasharray="5 3"/>
    <!-- Суммарная кривая -->
    <path d="M55 190 C68 122 86 58 118 62 C152 66 178 130 220 126 C255 123 285 120 322 120" fill="none" stroke="#D9482B" stroke-width="2.8"/>
    <circle cx="116" cy="62" r="4" fill="#D9482B"/>
    <text x="128" y="57" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#D9482B">Барьер V_max (защита)</text>
    <text x="218" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B4C6E">Вторичный минимум</text>
    <text x="218" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B4C6E">(обратимая флокуляция)</text>
    <text x="86" y="186" font-family="sans-serif" font-size="10" fill="#6E4FA3">Первичный минимум</text>
  </g>
</svg>
