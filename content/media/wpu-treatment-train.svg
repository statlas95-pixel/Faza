<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Каскад очистки воды WPU">
  <style>
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes rise{0%{transform:translateY(14px);opacity:.25}50%{opacity:.95}100%{transform:translateY(-22px);opacity:.1}}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.55}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .flow{stroke-dasharray:6 4;animation:flow 1.8s linear infinite}
  .rise{animation:rise 2.8s ease-in-out infinite}
  .rise2{animation:rise 3.4s ease-in-out infinite .9s}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @media (prefers-reduced-motion:reduce){.flow,.rise,.rise2,.pulse,.spin{animation:none!important}}
</style>
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Каскад подготовки воды (WPU): Умягчение → RO → EDI → УФ 254 нм</text>
  <g transform="translate(24,58)">
        
          <rect x="0" y="22" width="124" height="114" rx="14" fill="#FFF1F0" stroke="#FF968A" stroke-width="1.8"/>
          <text x="62" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#9A3528">Исходная</text>
          <text x="62" y="94" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#182026">400 μS/cm</text>
          <line x1="124" y1="79" x2="144" y2="79" stroke="#0284C7" stroke-width="3" class="flow"/>
        
          <rect x="144" y="22" width="124" height="114" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.8"/>
          <text x="206" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400E">Умягчитель</text>
          <text x="206" y="94" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#182026">Ca²⁺→Na⁺</text>
          <line x1="268" y1="79" x2="288" y2="79" stroke="#0284C7" stroke-width="3" class="flow"/>
        
          <rect x="288" y="22" width="124" height="114" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.8"/>
          <text x="350" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0C5E80">RO</text>
          <text x="350" y="94" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#182026">~10 μS/cm</text>
          <line x1="412" y1="79" x2="432" y2="79" stroke="#0284C7" stroke-width="3" class="flow"/>
        
          <rect x="432" y="22" width="124" height="114" rx="14" fill="#ECFDF5" stroke="#34D399" stroke-width="1.8"/>
          <text x="494" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#065F46">EDI</text>
          <text x="494" y="94" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#182026">< 1.3 μS/cm</text>
          <line x1="556" y1="79" x2="576" y2="79" stroke="#0284C7" stroke-width="3" class="flow"/>
        
          <rect x="576" y="22" width="124" height="114" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.8"/>
          <text x="638" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#5B21B6">UV + 0.22 μm</text>
          <text x="638" y="94" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#182026">< 100 CFU/mL</text>
          
        
        <text x="356" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Низкая электропроводность защищает карбомеры; постоянная циркуляция в петле не даёт расти биоплёнке</text>
      </g>
</svg>
