<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Архитектура косметической регуляторики и стандартов GMP">
  <rect width="760" height="310" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">Карта косметической регуляторики и системы качества GMP</text>

  <!-- Top tier: Market access -->
  <rect x="24" y="46" width="348" height="106" rx="12" fill="#EFF9FF" stroke="#0C5E80" stroke-width="1.5"/>
  <text x="198" y="68" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0C5E80">EU Regulation 1223/2009</text>
  <text x="198" y="86" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">Прил. II (запреты) · III (лимиты) · IV (красители)</text>
  <text x="198" y="102" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">Прил. V (консерванты) · VI (УФ-фильтры) · CosIng</text>
  <rect x="44" y="114" width="308" height="26" rx="6" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="198" y="131" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0C5E80">Досье PIF + отчёт безопасности CPSR (части A и B)</text>

  <rect x="388" y="46" width="348" height="106" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="562" y="68" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#6D28D9">ТР ТС 009/2011 (ЕАЭС) + IFRA 51</text>
  <text x="562" y="86" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">Декларация ЕАС · СГР (детская, SPF, пилинги, нано)</text>
  <text x="562" y="102" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">IFRA 51: лимиты отдушек по 12 категориям + 82 аллергена</text>
  <rect x="408" y="114" width="308" height="26" rx="6" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="562" y="131" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#6D28D9">Протоколы физико-химии, микробиологии и токсикологии</text>

  <!-- Connector arrows down to ISO pillars -->
  <line x1="140" y1="152" x2="140" y2="174" stroke="#5B6770" stroke-width="1.6"/>
  <line x1="380" y1="152" x2="380" y2="174" stroke="#5B6770" stroke-width="1.6"/>
  <line x1="620" y1="152" x2="620" y2="174" stroke="#5B6770" stroke-width="1.6"/>

  <!-- Pillar 1: ISO 11930 -->
  <rect x="24" y="176" width="226" height="114" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="1.4"/>
  <text x="137" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">ISO 11930</text>
  <text x="137" y="216" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#182026">Эффективность консервации</text>
  <text x="137" y="236" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Челлендж-тест на 5 штаммах</text>
  <text x="137" y="252" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">(бактерии, дрожжи, плесень)</text>
  <text x="137" y="270" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#047857">Критерий A / B · 28 суток</text>

  <!-- Pillar 2: ISO/TR 18811 -->
  <rect x="267" y="176" width="226" height="114" rx="12" fill="#FFF7ED" stroke="#B45309" stroke-width="1.4"/>
  <text x="380" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#B45309">ISO/TR 18811</text>
  <text x="380" y="216" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#182026">Стабильность и совместимость</text>
  <text x="380" y="236" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Термостат 40–45 °C, холод,</text>
  <text x="380" y="252" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">циклы заморозки, свет и тара</text>
  <text x="380" y="270" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#B45309">Срок годности и PAO</text>

  <!-- Pillar 3: ISO 22716 -->
  <rect x="510" y="176" width="226" height="114" rx="12" fill="#FFF1F0" stroke="#C4382A" stroke-width="1.4"/>
  <text x="623" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#C4382A">ISO 22716 (GMP)</text>
  <text x="623" y="216" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#182026">Надлежащее производство</text>
  <text x="623" y="236" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Входной контроль CoA, карантин,</text>
  <text x="623" y="252" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Batch Record, OOS, архив проб</text>
  <text x="623" y="270" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#C4382A">Отклонение → Расследование → CAPA</text>
</svg>