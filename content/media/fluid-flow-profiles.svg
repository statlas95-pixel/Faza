<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Сравнение профилей скорости в трубе: ламинарный ньютоновский параболический, пробковый профиль крема Гершеля-Балкли и турбулентный плоский профиль">
  <defs>
    <marker id="arrSky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#0C5E80"/>
    </marker>
    <marker id="arrAmb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#B45309"/>
    </marker>
    <marker id="arrEm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="760" height="320" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Профили скорости в трубе: Ньютон, крем (пробка) и турбулентность</text>

  <!-- Card 1: Laminar Newtonian -->
  <g transform="translate(24,46)">
    <rect width="228" height="254" rx="14" fill="#EFF9FF" stroke="#0C5E80" stroke-width="1.4"/>
    <text x="114" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0C5E80">1. Ламинарный (Ньютон)</text>
    <text x="114" y="38" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B6770">Re &lt; 2100 · n = 1, τ₀ = 0</text>

    <!-- Pipe cutaway panel -->
    <rect x="12" y="48" width="204" height="128" rx="10" fill="#FFFFFF" stroke="#DCE6EE"/>
    <!-- Pipe walls -->
    <rect x="20" y="60" width="188" height="9" fill="#CBD5E1"/>
    <line x1="20" y1="69" x2="208" y2="69" stroke="#182026" stroke-width="1.5"/>
    <rect x="20" y="153" width="188" height="9" fill="#CBD5E1"/>
    <line x1="20" y1="153" x2="208" y2="153" stroke="#182026" stroke-width="1.5"/>
    <!-- Centerline & baseline -->
    <line x1="24" y1="111" x2="204" y2="111" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="42" y1="69" x2="42" y2="153" stroke="#64748B" stroke-width="1.2"/>
    <!-- Filled parabolic envelope (apex at x=142) -->
    <path d="M 42 69 Q 242 111 42 153 Z" fill="#E6F6FE" opacity="0.75"/>
    <path d="M 42 69 Q 242 111 42 153" fill="none" stroke="#0C5E80" stroke-width="2.6"/>
    <!-- Velocity arrows -->
    <g stroke="#0C5E80" stroke-width="1.6" marker-end="url(#arrSky)">
      <line x1="42" y1="80" x2="86" y2="80"/>
      <line x1="42" y1="95" x2="124" y2="95"/>
      <line x1="42" y1="111" x2="138" y2="111"/>
      <line x1="42" y1="127" x2="124" y2="127"/>
      <line x1="42" y1="142" x2="86" y2="142"/>
    </g>
    <text x="150" y="114" font-family="monospace" font-size="9.5" font-weight="700" fill="#0C5E80">v_max=2v̄</text>
    <text x="26" y="79" font-family="monospace" font-size="8.5" fill="#5B6770">v=0</text>

    <!-- Summary text -->
    <text x="114" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">Параболический профиль</text>
    <text x="114" y="216" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Скорость сдвига растёт к стенке,</text>
    <text x="114" y="229" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">в центре трубы сдвиг γ̇ = 0</text>
    <text x="114" y="245" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#0C5E80">Вода (медл.), глицерин, масла</text>
  </g>

  <!-- Card 2: Herschel-Bulkley Cream Plug Flow -->
  <g transform="translate(266,46)">
    <rect width="228" height="254" rx="14" fill="#FFF7ED" stroke="#B45309" stroke-width="1.4"/>
    <text x="114" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#B45309">2. Крем (Гершель–Балкли)</text>
    <text x="114" y="38" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B6770">n &lt; 1 · τ₀ &gt; 0 (пробка)</text>

    <!-- Pipe cutaway panel -->
    <rect x="12" y="48" width="204" height="128" rx="10" fill="#FFFFFF" stroke="#DCE6EE"/>
    <rect x="20" y="60" width="188" height="9" fill="#CBD5E1"/>
    <line x1="20" y1="69" x2="208" y2="69" stroke="#182026" stroke-width="1.5"/>
    <rect x="20" y="153" width="188" height="9" fill="#CBD5E1"/>
    <line x1="20" y1="153" x2="208" y2="153" stroke="#182026" stroke-width="1.5"/>
    <line x1="42" y1="69" x2="42" y2="153" stroke="#64748B" stroke-width="1.2"/>

    <!-- Plug-flow envelope + shaded unyielded core -->
    <path d="M 42 69 Q 124 72 132 88 L 132 134 Q 124 150 42 153 Z" fill="#FFF7ED"/>
    <rect x="42" y="88" width="90" height="46" fill="#FEF3C7"/>
    <line x1="30" y1="88" x2="146" y2="88" stroke="#B45309" stroke-width="1.1" stroke-dasharray="3 2"/>
    <line x1="30" y1="134" x2="146" y2="134" stroke="#B45309" stroke-width="1.1" stroke-dasharray="3 2"/>
    <path d="M 42 69 Q 124 72 132 88 L 132 134 Q 124 150 42 153" fill="none" stroke="#B45309" stroke-width="2.8"/>

    <!-- Equal velocity arrows in plug core + wall shear arrows -->
    <g stroke="#B45309" stroke-width="1.6" marker-end="url(#arrAmb)">
      <line x1="42" y1="78" x2="104" y2="78"/>
      <line x1="42" y1="96" x2="128" y2="96"/>
      <line x1="42" y1="111" x2="128" y2="111"/>
      <line x1="42" y1="126" x2="128" y2="126"/>
      <line x1="42" y1="144" x2="104" y2="144"/>
    </g>
    <text x="142" y="108" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#B45309">Ядро пробки</text>
    <text x="142" y="121" font-family="monospace" font-size="9" fill="#B45309">|τ| &lt; τ₀</text>

    <!-- Summary text -->
    <text x="114" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">Неразрушенное ядро + сдвиг у стенки</text>
    <text x="114" y="216" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Центр едет «монолитной пробкой»,</text>
    <text x="114" y="229" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">весь сдвиг — в пристеночном слое</text>
    <text x="114" y="245" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#B45309">Эмульсионные кремы, карбомер-гели</text>
  </g>

  <!-- Card 3: Turbulent Flow -->
  <g transform="translate(508,46)">
    <rect width="228" height="254" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="1.4"/>
    <text x="114" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">3. Турбулентный поток</text>
    <text x="114" y="38" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B6770">Re &gt; 4000 (вихревой)</text>

    <!-- Pipe cutaway panel -->
    <rect x="12" y="48" width="204" height="128" rx="10" fill="#FFFFFF" stroke="#DCE6EE"/>
    <rect x="20" y="60" width="188" height="9" fill="#CBD5E1"/>
    <line x1="20" y1="69" x2="208" y2="69" stroke="#182026" stroke-width="1.5"/>
    <rect x="20" y="153" width="188" height="9" fill="#CBD5E1"/>
    <line x1="20" y1="153" x2="208" y2="153" stroke="#182026" stroke-width="1.5"/>
    <line x1="42" y1="69" x2="42" y2="153" stroke="#64748B" stroke-width="1.2"/>

    <!-- Flat 1/7th-power turbulent profile -->
    <path d="M 42 69 C 68 70 132 71 142 82 L 142 140 C 132 151 68 152 42 153 Z" fill="#ECFDF5" opacity="0.9"/>
    <path d="M 42 69 C 68 70 132 71 142 82 L 142 140 C 132 151 68 152 42 153" fill="none" stroke="#047857" stroke-width="2.6"/>

    <!-- Nearly uniform arrows -->
    <g stroke="#047857" stroke-width="1.6" marker-end="url(#arrEm)">
      <line x1="42" y1="81" x2="128" y2="81"/>
      <line x1="42" y1="96" x2="136" y2="96"/>
      <line x1="42" y1="111" x2="138" y2="111"/>
      <line x1="42" y1="126" x2="136" y2="126"/>
      <line x1="42" y1="141" x2="128" y2="141"/>
    </g>
    <!-- Small turbulent eddies -->
    <g fill="none" stroke="#0E8B99" stroke-width="1.3">
      <path d="M 162 86 A 7 7 0 1 1 156 92"/>
      <path d="M 184 106 A 8 8 0 1 0 176 113"/>
      <path d="M 165 130 A 7 7 0 1 1 159 136"/>
    </g>
    <text x="148" y="148" font-family="monospace" font-size="9" font-weight="700" fill="#047857">v_max≈1,2v̄</text>

    <!-- Summary text -->
    <text x="114" y="198" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">Пологий профиль + вихри</text>
    <text x="114" y="216" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Радиальные вихри выравнивают скорость</text>
    <text x="114" y="229" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">и смывают отложения со стенок</text>
    <text x="114" y="245" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#047857">Петля воды WPU, CIP-мойка (v ≥ 1,5 м/с)</text>
  </g>
</svg>
