<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Ионная сила и сжатие полимера">
  <style>
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes rise{0%{transform:translateY(14px);opacity:.25}50%{opacity:.95}100%{transform:translateY(-22px);opacity:.1}}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.55}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .flow{stroke-dasharray:6 4;animation:flow 1.8s linear infinite}
  .rise{animation:rise 2.8s ease-in-out infinite}
  .rise2{animation:rise 3.4s ease-in-out infinite .9s}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @media (prefers-reduced-motion:reduce){.flow,.rise,.rise2,.pulse,.spin{animation:none!important}}
</style>
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Ионная сила I = ½ Σ cᵢ·zᵢ²: расправление полимера и солевой коллапс</text>
  <g transform="translate(28,48)">
        <rect width="340" height="198" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0C5E80">Очищенная вода (низкая I → большая κ⁻¹)</text>
        <path d="M36,104 Q92,62 170,104 T304,104" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
        <g fill="#10B981"><circle cx="72" cy="82" r="8"/><circle cx="132" cy="88" r="8"/><circle cx="208" cy="118" r="8"/><circle cx="268" cy="116" r="8"/></g>
        <g fill="#FFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle"><text x="72" y="86">−</text><text x="132" y="92">−</text><text x="208" y="122">−</text><text x="268" y="120">−</text></g>
        <text x="170" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C5E80" font-weight="600">Отталкивание COO⁻ → высокая вязкость геля</text>
      </g>
      <g transform="translate(392,48)">
        <rect width="340" height="198" rx="14" fill="#FFF1F0" stroke="#FF968A" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#9A3528">Ввод солей (Na⁺ / Ca²⁺ → κ⁻¹ &lt; 1 нм)</text>
        <path d="M120,104 C130,68 164,142 174,102 C184,66 210,136 220,104" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
        <g class="pulse" fill="#EF4444"><circle cx="128" cy="82" r="9"/><circle cx="164" cy="126" r="9"/><circle cx="198" cy="80" r="9"/><circle cx="218" cy="122" r="9"/></g>
        <g fill="#FFF" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle"><text x="128" y="85">Na⁺</text><text x="164" y="129">Ca²⁺</text><text x="198" y="83">Na⁺</text><text x="218" y="125">Na⁺</text></g>
        <text x="170" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9A3528" font-weight="600">Заряды экранированы → клубок схлопнулся</text>
      </g>
</svg>
