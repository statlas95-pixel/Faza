<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Пути деградации капризных активов и защитная матрица">
  <rect width="760" height="264" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">Пути распада лабильных активов и матрица стабилизации R&amp;D</text>
  <g transform="translate(26,48)">
    <rect width="224" height="194" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
    <rect x="20" y="18" width="184" height="28" rx="8" fill="#FFEAE7"/>
    <text x="112" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#C4382A">L-Аскорбиновая кислота</text>
    <text x="112" y="68" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Риск: O₂ + Fe³⁺ + pH &gt; 3,8</text>
    <text x="112" y="86" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#C4382A">→ бурение (дегидроаскорбат)</text>
    <rect x="18" y="114" width="188" height="60" rx="10" fill="#F2FBD9"/>
    <text x="112" y="136" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#3D5A08">Защита: pH 2,8–3,4 + EDTA</text>
    <text x="112" y="154" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3D5A08">+ феруловая/вит. E + тёмный airless</text>
  </g>
  <g transform="translate(268,48)">
    <rect width="224" height="194" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
    <rect x="20" y="18" width="184" height="28" rx="8" fill="#E6F6FE"/>
    <text x="112" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0C5E80">Ретинол (EU 2024/996)</text>
    <text x="112" y="68" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Риск: УФ + O₂ + кислый pH &lt; 5,0</text>
    <text x="112" y="86" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#C4382A">→ изомеризация и потеря титра</text>
    <rect x="18" y="114" width="188" height="60" rx="10" fill="#F2FBD9"/>
    <text x="112" y="136" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#3D5A08">Защита: pH 5,5–6,2 + BHT/вит. E</text>
    <text x="112" y="154" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3D5A08">ввод ≤ 35 °C + непрозрачный airless</text>
  </g>
  <g transform="translate(510,48)">
    <rect width="224" height="194" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
    <rect x="20" y="18" width="184" height="28" rx="8" fill="#E6F6FE"/>
    <text x="112" y="36" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0C5E80">Мочевина (Urea 5–20 %)</text>
    <text x="112" y="68" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Риск: гидролиз в воде при нагреве</text>
    <text x="112" y="86" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#C4382A">→ NH₃↑ (pH &gt; 8) + CO₂↑ (вздутие)</text>
    <rect x="18" y="114" width="188" height="60" rx="10" fill="#F2FBD9"/>
    <text x="112" y="136" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#3D5A08">Защита: лактатный буфер pH ~5,2</text>
    <text x="112" y="154" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3D5A08">+ триэтилцитрат, ввод ≤ 40 °C</text>
  </g>
</svg>
