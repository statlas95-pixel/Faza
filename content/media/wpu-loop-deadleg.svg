<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Циркуляционная петля очищенной воды и застойный тупик">
  <rect width="760" height="264" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">Циркуляционная петля очищенной воды (WPU) и риск «мёртвых зон» (dead legs)</text>
  <rect x="34" y="88" width="96" height="64" rx="12" fill="#E6F6FE" stroke="#0E8B99" stroke-width="2"/>
  <text x="82" y="116" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#182026">RO + EDI</text>
  <text x="82" y="133" text-anchor="middle" font-family="monospace" font-size="10" fill="#0C5E80">0,8 мкСм/см</text>
  <rect x="170" y="76" width="102" height="88" rx="16" fill="#FFFFFF" stroke="#0E8B99" stroke-width="2"/>
  <text x="221" y="114" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#182026">Сборник WPU</text>
  <text x="221" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B6770">Санитация 80 °C</text>
  <rect x="312" y="96" width="84" height="48" rx="10" fill="#F2FBD9" stroke="#3D5A08" stroke-width="1.8"/>
  <text x="354" y="124" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#3D5A08">УФ 254 нм</text>
  <!-- Петля подачи и возврата -->
  <path d="M130 120 L170 120 M272 120 L312 120 M396 120 L688 120 Q712 120 712 156 L712 194 Q712 218 688 218 L221 218 L221 164" fill="none" stroke="#0E8B99" stroke-width="4"/>
  <!-- Нормальная точка POU (L < 3d) -->
  <line x1="476" y1="120" x2="476" y2="142" stroke="#0E8B99" stroke-width="4"/>
  <circle cx="476" cy="144" r="6" fill="#0E7B68"/>
  <text x="476" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0E7B68">Т1: L ≤ 3d (чисто)</text>
  <!-- Опасный тупиковый отвод (L >> 3d) -->
  <line x1="608" y1="120" x2="608" y2="184" stroke="#E05545" stroke-width="5"/>
  <rect x="556" y="176" width="104" height="32" rx="8" fill="#FFEAE7" stroke="#E05545" stroke-width="1.5"/>
  <text x="608" y="191" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#C4382A">Тупик L &gt; 6d: застой</text>
  <text x="608" y="203" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#C4382A">Биоплёнка B. cepacia!</text>
  <text x="456" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#182026">Постоянная турбулентная циркуляция (v ≥ 1,2–1,5 м/с) не заходит в длинный тупиковый патрубок</text>
</svg>
