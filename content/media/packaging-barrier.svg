<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Взаимодействие косметической рецептуры с полимерной тарой">
  <rect width="760" height="264" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
