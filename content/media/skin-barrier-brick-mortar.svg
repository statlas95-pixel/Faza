<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Модель рогового слоя кожи кирпичи и раствор: корнеоциты, липидные ламеллы, кислотная мантия и TEWL">
  <defs>
    <marker id="sbSky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#0C5E80"/>
    </marker>
    <marker id="sbCor" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M1 1L9 5L1 9z" fill="#C4382A"/>
    </marker>
  </defs>
  <rect width="760" height="320" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Барьер рогового слоя («кирпичи и раствор»): липидная матрица и TEWL</text>

  <!-- Левая панель: Интактный барьер -->
  <rect x="20" y="44" width="352" height="212" rx="14" fill="#FFFFFF" stroke="#047857" stroke-width="1.4"/>
  <text x="196" y="63" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">Интактный барьер · низкая потеря воды</text>

  <!-- Кислотная мантия -->
  <rect x="34" y="72" width="324" height="21" rx="6" fill="#E6F6FE" stroke="#0C5E80" stroke-width="1.2"/>
  <text x="196" y="86" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0C5E80">Кислотная мантия · pH 4,5–5,5 (защита микробиома)</text>

  <!-- Липидный раствор (межклеточные ламеллы) + кирпичи корнеоцитов -->
  <rect x="34" y="98" width="324" height="114" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.2"/>
  <!-- Тонкие полосы липидных ламелл в швах -->
  <line x1="40" y1="135" x2="352" y2="135" stroke="#047857" stroke-width="1" stroke-dasharray="4 2" opacity="0.65"/>
  <line x1="40" y1="170" x2="352" y2="170" stroke="#047857" stroke-width="1" stroke-dasharray="4 2" opacity="0.65"/>

  <!-- Ряд 1 корнеоцитов -->
  <g fill="#FEF3C7" stroke="#B45309" stroke-width="1.2">
    <rect x="42" y="106" width="92" height="23" rx="5"/>
    <rect x="144" y="106" width="94" height="23" rx="5"/>
    <rect x="248" y="106" width="102" height="23" rx="5"/>
    <!-- Ряд 2 -->
    <rect x="42" y="141" width="52" height="23" rx="5"/>
    <rect x="104" y="141" width="106" height="23" rx="5"/>
    <rect x="220" y="141" width="82" height="23" rx="5"/>
    <rect x="312" y="141" width="38" height="23" rx="5"/>
    <!-- Ряд 3 -->
    <rect x="42" y="176" width="92" height="23" rx="5"/>
    <rect x="144" y="176" width="94" height="23" rx="5"/>
    <rect x="248" y="176" width="102" height="23" rx="5"/>
  </g>
  <text x="157" y="156" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#B45309">Корнеоцит (NMF)</text>
  <text x="299" y="121" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#B45309">Кератин</text>

  <!-- Извилистый сдержанный путь H2O (TEWL блокирован) -->
  <polyline points="139,212 139,170 99,170 99,135 139,135 139,98" fill="none" stroke="#0C5E80" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#sbSky)"/>
  <text x="86" y="210" text-anchor="middle" font-family="monospace" font-size="8.8" font-weight="700" fill="#0C5E80">H₂O ↑</text>

  <rect x="34" y="220" width="324" height="26" rx="7" fill="#ECFDF5"/>
  <text x="196" y="237" text-anchor="middle" font-family="monospace" font-size="10.2" font-weight="700" fill="#047857">TEWL ≈ 5–10 г/м²·ч · плотный барьер</text>

  <!-- Правая панель: Повреждённый барьер -->
  <rect x="388" y="44" width="352" height="212" rx="14" fill="#FFFFFF" stroke="#C4382A" stroke-width="1.4"/>
  <text x="564" y="63" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#C4382A">Повреждение ПАВ · делипидизация</text>

  <!-- Нарушенная мантия -->
  <rect x="402" y="72" width="324" height="21" rx="6" fill="#FFF1F0" stroke="#C4382A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="564" y="86" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#C4382A">Нарушенная мантия · pH 6,5–8,0 + жёсткие ПАВ</text>

  <!-- Разреженный раствор с зазорами -->
  <rect x="402" y="98" width="324" height="114" rx="8" fill="#FFF7ED" stroke="#C4382A" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- Смещённые корнеоциты с широкими прорехами -->
  <g fill="#FEF3C7" stroke="#C4382A" stroke-width="1.2">
    <rect x="410" y="108" width="66" height="22" rx="5" transform="rotate(-3 443 119)"/>
    <rect x="506" y="106" width="66" height="22" rx="5" transform="rotate(2 539 117)"/>
    <rect x="606" y="109" width="66" height="22" rx="5" transform="rotate(-2 639 120)"/>

    <rect x="412" y="142" width="64" height="22" rx="5" transform="rotate(2 444 153)"/>
    <rect x="510" y="141" width="62" height="22" rx="5" transform="rotate(-3 541 152)"/>
    <rect x="608" y="142" width="64" height="22" rx="5" transform="rotate(2 640 153)"/>

    <rect x="410" y="176" width="66" height="22" rx="5"/>
    <rect x="506" y="176" width="66" height="22" rx="5"/>
    <rect x="606" y="176" width="66" height="22" rx="5"/>
  </g>

  <!-- Мощные стрелки утечки TEWL вверх -->
  <line x1="491" y1="208" x2="491" y2="95" stroke="#0C5E80" stroke-width="2.4" marker-end="url(#sbSky)"/>
  <line x1="590" y1="208" x2="590" y2="95" stroke="#0C5E80" stroke-width="2.4" marker-end="url(#sbSky)"/>
  <text x="491" y="210" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#0C5E80">TEWL</text>
  <text x="590" y="210" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#0C5E80">TEWL</text>

  <!-- Проникновение раздражителей вниз -->
  <line x1="698" y1="95" x2="698" y2="196" stroke="#C4382A" stroke-width="2.4" marker-end="url(#sbCor)"/>
  <text x="698" y="208" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#C4382A">ПАВ ↓</text>

  <rect x="402" y="220" width="324" height="26" rx="7" fill="#FFF1F0"/>
  <text x="564" y="237" text-anchor="middle" font-family="monospace" font-size="10.2" font-weight="700" fill="#C4382A">TEWL &gt; 25–40 г/м²·ч · сухость и раздражение</text>

  <!-- Нижняя панель состава липидного «раствора» -->
  <rect x="20" y="264" width="720" height="40" rx="11" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="34" y="288" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">Липидный «раствор» (моль ≈ 3 : 1 : 1):</text>
  <rect x="276" y="272" width="144" height="24" rx="7" fill="#ECFDF5" stroke="#047857" stroke-width="1.1"/>
  <text x="348" y="288" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857">Церамиды (3 части)</text>
  <rect x="430" y="272" width="140" height="24" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1.1"/>
  <text x="500" y="288" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#B45309">Холестерин (1 ч.)</text>
  <rect x="580" y="272" width="148" height="24" rx="7" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.1"/>
  <text x="654" y="288" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#6D28D9">Своб. жирные к-ты (1)</text>
</svg>
