<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Геометрическое масштабирование от стакана 1 кг к реактору 1000 кг">
  <rect width="760" height="310" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">Масштабирование 1 кг → 1 000 кг: падение A/V и конфликт критериев</text>

  <!-- Beaker 1 kg -->
  <rect x="24" y="48" width="188" height="240" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="118" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0C5E80">Стакан 1 кг (D₁)</text>
  <rect x="78" y="96" width="80" height="90" rx="6" fill="#EFF9FF" stroke="#1F648A" stroke-width="2"/>
  <line x1="118" y1="84" x2="118" y2="164" stroke="#182026" stroke-width="2"/>
  <rect x="96" y="156" width="44" height="8" rx="3" fill="#0E8B99"/>
  <text x="118" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#182026">D₁ = 0,10 м</text>
  <text x="118" y="228" text-anchor="middle" font-family="monospace" font-size="11" fill="#047857">A/V ≈ 40 м⁻¹</text>
  <text x="118" y="246" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Охлаждение: 15 мин</text>
  <text x="118" y="264" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Время циркуляции: ~2 с</text>

  <!-- Arrow -->
  <line x1="220" y1="155" x2="258" y2="155" stroke="#0C5E80" stroke-width="2.5"/>
  <polygon points="258,149 270,155 258,161" fill="#0C5E80"/>
  <text x="243" y="142" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0C5E80">×10 D</text>
  <text x="243" y="174" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B6770">×1000 V</text>

  <!-- Reactor 1000 kg -->
  <rect x="278" y="48" width="218" height="240" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="387" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#C4382A">Реактор 1 000 кг (D₂ = 10·D₁)</text>
  <!-- Jacket -->
  <rect x="318" y="84" width="138" height="114" rx="14" fill="#FFF1F0" stroke="#E05545" stroke-width="1.5"/>
  <!-- Inner vessel -->
  <rect x="330" y="92" width="114" height="98" rx="8" fill="#EFF9FF" stroke="#1F648A" stroke-width="2"/>
  <line x1="387" y1="80" x2="387" y2="174" stroke="#182026" stroke-width="2.5"/>
  <rect x="352" y="164" width="70" height="10" rx="3" fill="#0E8B99"/>
  <text x="387" y="216" text-anchor="middle" font-family="monospace" font-size="11" fill="#182026">D₂ = 1,00 м</text>
  <text x="387" y="234" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#C4382A">A/V ≈ 4 м⁻¹ (в 10 раз ниже!)</text>
  <text x="387" y="252" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Охлаждение: 2–3 часа</text>
  <text x="387" y="270" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Выраженный рост кристаллов воска</text>

  <!-- Trade-off box -->
  <rect x="512" y="48" width="224" height="240" rx="12" fill="#FFF7ED" stroke="#B45309" stroke-width="1.2"/>
  <text x="624" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#B45309">Почему нельзя сохранить всё</text>
  <rect x="526" y="86" width="196" height="58" rx="8" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="536" y="104" font-family="sans-serif" font-size="11" font-weight="700" fill="#0C5E80">1. v_tip = πND = const</text>
  <text x="536" y="120" font-family="sans-serif" font-size="10" fill="#5B6770">N₂ = N₁ / 10 → P/V падает в 10 раз</text>
  <text x="536" y="135" font-family="sans-serif" font-size="10" fill="#5B6770">Риск: застойная каверна у стенок</text>

  <rect x="526" y="154" width="196" height="58" rx="8" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="536" y="172" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857">2. P/V = const (турбул.)</text>
  <text x="536" y="188" font-family="sans-serif" font-size="10" fill="#5B6770">N₂ = N₁ · 10⁻²/³ ≈ 0,215·N₁</text>
  <text x="536" y="203" font-family="sans-serif" font-size="10" fill="#5B6770">v_tip растёт в 2,15 раза (сдвиг!)</text>

  <rect x="526" y="222" width="196" height="54" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.2"/>
  <text x="536" y="240" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#047857">Инженерное решение:</text>
  <text x="536" y="256" font-family="sans-serif" font-size="10" fill="#182026">Якорь для циркуляции + проточный</text>
  <text x="536" y="269" font-family="sans-serif" font-size="10" fill="#182026">гомогенизатор (число проходов)</text>
</svg>