<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Рабочий пост химика-разработчика: весы, воронка, pH-метр и вискозиметр">
  <rect width="760" height="310" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">Техника работы в лаборатории R&amp;D: 4 критических узла воспроизводимости</text>

  <!-- Card 1: Balances -->
  <rect x="24" y="48" width="168" height="240" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>
  <rect x="34" y="58" width="148" height="26" rx="6" fill="#EFF9FF"/>
  <text x="108" y="75" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0C5E80">1. Выбор весов</text>
  <rect x="46" y="102" width="124" height="50" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.3"/>
  <text x="108" y="122" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#047857">0,0001 г (аналит.)</text>
  <text x="108" y="139" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">Навески &lt; 1 г (активы,</text>
  <text x="108" y="150" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">EDTA, ретинол, камеди)</text>
  <rect x="46" y="166" width="124" height="50" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="1.3"/>
  <text x="108" y="186" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#B45309">0,01 г (техн.)</text>
  <text x="108" y="203" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">Вода, масла, гликоли</text>
  <text x="108" y="214" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">&gt; 2 г в стакане</text>
  <text x="108" y="244" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#C4382A">Ошибка 0,01 г на 0,1 г</text>
  <text x="108" y="258" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#C4382A">= ±10 % погрешности!</text>

  <!-- Card 2: Mixing & Vortex -->
  <rect x="206" y="48" width="168" height="240" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>
  <rect x="216" y="58" width="148" height="26" rx="6" fill="#EFF9FF"/>
  <text x="290" y="75" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0C5E80">2. Воронка и воздух</text>
  <!-- Beaker schematic -->
  <rect x="242" y="100" width="96" height="92" rx="6" fill="#E6F6FE" stroke="#1F648A" stroke-width="1.8"/>
  <path d="M242 118 Q272 118 290 144 Q308 118 338 118" fill="none" stroke="#0C5E80" stroke-width="2"/>
  <line x1="290" y1="92" x2="290" y2="176" stroke="#182026" stroke-width="2"/>
  <rect x="272" y="170" width="36" height="6" rx="2" fill="#0E8B99"/>
  <text x="290" y="214" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857">Воронка до 1/3 глубины</text>
  <text x="290" y="232" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Воронка до ротора =</text>
  <text x="290" y="246" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#C4382A">подсос воздуха и падение</text>
  <text x="290" y="260" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#C4382A">плотности крема</text>

  <!-- Card 3: pH meter -->
  <rect x="388" y="48" width="168" height="240" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>
  <rect x="398" y="58" width="148" height="26" rx="6" fill="#EFF9FF"/>
  <text x="472" y="75" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0C5E80">3. Калибровка pH</text>
  <rect x="412" y="102" width="54" height="36" rx="6" fill="#FFF1F0" stroke="#C4382A" stroke-width="1.3"/>
  <text x="439" y="124" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#C4382A">4,01</text>
  <rect x="478" y="102" width="54" height="36" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="1.3"/>
  <text x="505" y="124" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#047857">7,00</text>
  <text x="472" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#182026">2 буфера + ATC (25 °C)</text>
  <text x="472" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#0C5E80">Slope: 95–102 %</text>
  <text x="472" y="204" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Электрод хранить в 3 M KCl,</text>
  <text x="472" y="218" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#C4382A">НЕ в дистиллированной воде!</text>
  <text x="472" y="242" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Для плотных эмульсий —</text>
  <text x="472" y="256" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">прямой замер или 10 % р-р</text>

  <!-- Card 4: Brookfield -->
  <rect x="570" y="48" width="166" height="240" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>
  <rect x="580" y="58" width="146" height="26" rx="6" fill="#EFF9FF"/>
  <text x="653" y="75" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0C5E80">4. Вискозиметр</text>
  <!-- Torque bar -->
  <text x="653" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#182026">Окно момента (Torque)</text>
  <rect x="588" y="122" width="130" height="22" rx="5" fill="#FFF1F0" stroke="#DCE6EE"/>
  <rect x="601" y="122" width="104" height="22" fill="#ECFDF5" stroke="#047857" stroke-width="1.3"/>
  <text x="653" y="137" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#047857">10 – 90 %</text>
  <text x="588" y="158" font-family="monospace" font-size="9.5" fill="#C4382A">0%</text>
  <text x="698" y="158" font-family="monospace" font-size="9.5" fill="#C4382A">100%</text>
  <text x="653" y="182" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">Всегда записывать 4 числа:</text>
  <text x="653" y="200" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#0C5E80">Шпиндель · об/мин</text>
  <text x="653" y="216" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#0C5E80">T (°C) · выдержка (с)</text>
  <text x="653" y="242" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Замерять через 24 ч после</text>
  <text x="653" y="256" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">стабилизации структуры</text>
</svg>