<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Сравнение биомиметической мембраны DMS и безводного твёрдого шампуня на SCI">
  <rect width="760" height="310" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">Биомиметика DMS/MLE (без ПЭГ) и безводный синдет на SCI</text>

  <!-- Left panel: Biomimetic DMS -->
  <rect x="24" y="46" width="348" height="244" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
  <rect x="40" y="60" width="316" height="28" rx="8" fill="#EFF9FF"/>
  <text x="198" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0C5E80">1. Биомиметическая мембрана DMS / MLE</text>

  <!-- Lipid bilayer schematic -->
  <rect x="40" y="98" width="316" height="106" rx="10" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="198" y="114" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#5B6770">Липидный бислой 3 : 1 : 1 (без ПЭГ-эмульгаторов)</text>
  <!-- Upper leaflet heads & tails -->
  <g stroke="#0C5E80" stroke-width="1.5" fill="none">
    <line x1="68" y1="128" x2="68" y2="146"/><line x1="74" y1="128" x2="74" y2="146"/>
    <line x1="96" y1="128" x2="96" y2="146"/><line x1="102" y1="128" x2="102" y2="146"/>
    <line x1="124" y1="128" x2="124" y2="146"/><line x1="130" y1="128" x2="130" y2="146"/>
    <line x1="152" y1="128" x2="152" y2="146"/><line x1="158" y1="128" x2="158" y2="146"/>
    <line x1="180" y1="128" x2="180" y2="146"/><line x1="186" y1="128" x2="186" y2="146"/>
    <line x1="208" y1="128" x2="208" y2="146"/><line x1="214" y1="128" x2="214" y2="146"/>
    <line x1="236" y1="128" x2="236" y2="146"/><line x1="242" y1="128" x2="242" y2="146"/>
    <line x1="264" y1="128" x2="264" y2="146"/><line x1="270" y1="128" x2="270" y2="146"/>
    <line x1="292" y1="128" x2="292" y2="146"/><line x1="298" y1="128" x2="298" y2="146"/>
    <line x1="320" y1="128" x2="320" y2="146"/><line x1="326" y1="128" x2="326" y2="146"/>
  </g>
  <g stroke="#B45309" stroke-width="1.5" fill="none">
    <line x1="68" y1="154" x2="68" y2="172"/><line x1="74" y1="154" x2="74" y2="172"/>
    <line x1="96" y1="154" x2="96" y2="172"/><line x1="102" y1="154" x2="102" y2="172"/>
    <line x1="124" y1="154" x2="124" y2="172"/><line x1="130" y1="154" x2="130" y2="172"/>
    <line x1="152" y1="154" x2="152" y2="172"/><line x1="158" y1="154" x2="158" y2="172"/>
    <line x1="180" y1="154" x2="180" y2="172"/><line x1="186" y1="154" x2="186" y2="172"/>
    <line x1="208" y1="154" x2="208" y2="172"/><line x1="214" y1="154" x2="214" y2="172"/>
    <line x1="236" y1="154" x2="236" y2="172"/><line x1="242" y1="154" x2="242" y2="172"/>
    <line x1="264" y1="154" x2="264" y2="172"/><line x1="270" y1="154" x2="270" y2="172"/>
    <line x1="292" y1="154" x2="292" y2="172"/><line x1="298" y1="154" x2="298" y2="172"/>
    <line x1="320" y1="154" x2="320" y2="172"/><line x1="326" y1="154" x2="326" y2="172"/>
  </g>
  <g fill="#0C5E80">
    <circle cx="71" cy="127" r="4.5"/><circle cx="99" cy="127" r="4.5"/><circle cx="155" cy="127" r="4.5"/>
    <circle cx="183" cy="127" r="4.5"/><circle cx="239" cy="127" r="4.5"/><circle cx="267" cy="127" r="4.5"/>
    <circle cx="323" cy="127" r="4.5"/>
    <circle cx="71" cy="174" r="4.5"/><circle cx="99" cy="174" r="4.5"/><circle cx="155" cy="174" r="4.5"/>
    <circle cx="183" cy="174" r="4.5"/><circle cx="239" cy="174" r="4.5"/><circle cx="267" cy="174" r="4.5"/>
    <circle cx="323" cy="174" r="4.5"/>
  </g>
  <!-- Cholesterol / Ceramide markers -->
  <g fill="#B45309">
    <circle cx="127" cy="127" r="4.5"/><circle cx="211" cy="127" r="4.5"/><circle cx="295" cy="127" r="4.5"/>
    <circle cx="127" cy="174" r="4.5"/><circle cx="211" cy="174" r="4.5"/><circle cx="295" cy="174" r="4.5"/>
  </g>
  <text x="198" y="196" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">Hydr. Lecithin + Ceramide NP + Cholesterol + жирные спирты</text>

  <!-- DMS Process & Benefit -->
  <rect x="40" y="214" width="316" height="28" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1"/>
  <text x="198" y="232" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#047857">Нет эффекта wash-out липидов рогового слоя</text>
  <rect x="40" y="248" width="316" height="28" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="1"/>
  <text x="198" y="266" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#B45309">75–80 °C + гомогенизатор 300–800 бар</text>

  <!-- Right panel: Waterless SCI bar -->
  <rect x="388" y="46" width="348" height="244" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
  <rect x="404" y="60" width="316" height="28" rx="8" fill="#FFF7ED"/>
  <text x="562" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#B45309">2. Безводный твёрдый шампунь (SCI-синдет)</text>

  <!-- Bar schematic -->
  <rect x="424" y="98" width="276" height="58" rx="16" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.4"/>
  <text x="562" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#6D28D9">SCI (~50 %) + SCS / CAPB (пластификатор)</text>
  <text x="562" y="140" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">Цетиловый спирт + баттеры + лимонная к-та</text>

  <!-- pH comparison cards -->
  <rect x="404" y="166" width="152" height="72" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.2"/>
  <text x="480" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857">Синдет SCI</text>
  <text x="480" y="205" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#047857">pH 5,0–5,5</text>
  <text x="480" y="224" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">Щадит кутикулу</text>

  <rect x="568" y="166" width="152" height="72" rx="10" fill="#FFF1F0" stroke="#C4382A" stroke-width="1.2"/>
  <text x="644" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#C4382A">Обычное мыло</text>
  <text x="644" y="205" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#C4382A">pH 9,0–10,0</text>
  <text x="644" y="224" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">Налёт и набухание</text>

  <rect x="404" y="248" width="316" height="28" rx="8" fill="#EFF9FF" stroke="#0C5E80" stroke-width="1"/>
  <text x="562" y="266" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#0C5E80">Прессование / Melt-Pour · Влага 3–5 %</text>
</svg>
