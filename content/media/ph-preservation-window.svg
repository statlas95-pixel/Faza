<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Рабочие окна pH органических консервантов и феноксиэтанола">
  <rect width="760" height="250" rx="18" fill="#FBF8F3" stroke="#E4DACB"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#2A1B3D">Доля активной недиссоциированной формы консервантов по pH</text>
  <g transform="translate(36,44)">
    <rect width="688" height="186" rx="14" fill="#FFFFFF" stroke="#E6DACB"/>
    <line x1="56" y1="150" x2="646" y2="150" stroke="#2A1B3D" stroke-width="1.5"/>
    <line x1="56" y1="24" x2="56" y2="150" stroke="#2A1B3D" stroke-width="1.5"/>
    <!-- Горизонтальная линия 50% -->
    <line x1="56" y1="87" x2="646" y2="87" stroke="#E6DACB" stroke-dasharray="4 4"/>
    <text x="48" y="30" text-anchor="end" font-family="monospace" font-size="10" fill="#5B4C6E">100%</text>
    <text x="48" y="90" text-anchor="end" font-family="monospace" font-size="10" fill="#5B4C6E">50%</text>
    <text x="48" y="152" text-anchor="end" font-family="monospace" font-size="10" fill="#5B4C6E">0%</text>
    <!-- Шкала pH 3..8 -->
    <g font-family="monospace" font-size="10.5" fill="#2A1B3D" text-anchor="middle">
      <text x="56" y="168">pH 3</text><text x="174" y="168">pH 4</text><text x="292" y="168">pH 5</text>
      <text x="410" y="168">pH 6</text><text x="528" y="168">pH 7</text><text x="646" y="168">pH 8</text>
    </g>
    <!-- Феноксиэтанол (не зависит от pH) -->
    <line x1="56" y1="30" x2="646" y2="30" stroke="#6E4FA3" stroke-width="2.2" stroke-dasharray="6 4"/>
    <text x="534" y="24" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#6E4FA3">Феноксиэтанол (pH 3–10)</text>
    <!-- Бензойная pKa 4.2 -->
    <path d="M56 32 C125 36 168 58 198 87 C228 116 268 140 340 148 L646 150" fill="none" stroke="#D9482B" stroke-width="2.6"/>
    <text x="148" y="114" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#D9482B">Бензойная (pKa 4,2)</text>
    <!-- Сорбиновая pKa 4.76 -->
    <path d="M56 29 C170 32 232 54 264 87 C296 120 340 142 420 149 L646 150" fill="none" stroke="#0E7C7B" stroke-width="2.6"/>
    <text x="310" y="82" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0E7C7B">Сорбиновая (pKa 4,76)</text>
    <!-- DHA pKa 5.27 -->
    <path d="M56 27 C220 29 292 52 324 87 C358 122 406 143 490 149 L646 150" fill="none" stroke="#C98A00" stroke-width="2.6"/>
    <text x="392" y="116" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#9A6800">DHA (pKa 5,27)</text>
  </g>
</svg>
