<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Вакуумная деаэрация">
  <style>
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes rise{0%{transform:translateY(14px);opacity:.25}50%{opacity:.95}100%{transform:translateY(-22px);opacity:.1}}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.55}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .flow{stroke-dasharray:6 4;animation:flow 1.8s linear infinite}
  .rise{animation:rise 2.8s ease-in-out infinite}
  .rise2{animation:rise 3.4s ease-in-out infinite .9s}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @media (prefers-reduced-motion:reduce){.flow,.rise,.rise2,.pulse,.spin{animation:none!important}}
</style>
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Вакуумная деаэрация (−0,85 бар): расширение пузырьков и выход воздуха</text>
  <g transform="translate(28,46)">
        <rect width="340" height="202" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#9A3412">Атмосферное давление (1,0 бар): застрявший воздух</text>
        <rect x="74" y="46" width="192" height="114" rx="12" fill="#FDE68A" opacity=".55" stroke="#D97706" stroke-width="1.8"/>
        <g fill="#FFFFFF" stroke="#64748B" stroke-width="1.4">
          <circle cx="110" cy="134" r="4"/><circle cx="136" cy="116" r="3.5"/><circle cx="164" cy="142" r="4"/><circle cx="196" cy="122" r="3.5"/><circle cx="226" cy="138" r="4"/><circle cx="148" cy="86" r="3.5"/><circle cx="204" cy="92" r="4"/>
        </g>
        <text x="170" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9A3412">Сила Архимеда < τ₀ → пузырьки застревают в креме</text>
      </g>
      <g transform="translate(392,46)">
        <rect width="340" height="202" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0C5E80">Вакуум (−0,85 бар): рост диаметра и выход</text>
        <rect x="74" y="46" width="192" height="114" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.8"/>
        <g fill="#FFFFFF" stroke="#0284C7" stroke-width="1.6" class="rise">
          <circle cx="116" cy="124" r="9"/><circle cx="168" cy="108" r="11"/><circle cx="222" cy="118" r="10"/>
        </g>
        <g fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" class="rise2">
          <circle cx="142" cy="82" r="12"/><circle cx="198" cy="76" r="11"/>
        </g>
        <text x="170" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0C5E80" font-weight="600">Объём ×6 · всплывание ~d² (×3,3) · точная фасовка</text>
      </g>
</svg>
