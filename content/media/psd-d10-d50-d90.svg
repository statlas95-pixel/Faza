<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Распределение размеров капель d10 d50 d90">
  
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Распределение капель: узкий мономодальный пик vs бимодальный «хвост»</text>
  <g transform="translate(56,48)">
        <rect width="648" height="196" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
        <line x1="56" y1="158" x2="612" y2="158" stroke="#64748B" stroke-width="1.6"/>
        <line x1="56" y1="22" x2="56" y2="158" stroke="#64748B" stroke-width="1.6"/>
        <path d="M84,158 C126,156 154,32 194,32 C234,32 256,156 300,158 Z" fill="rgba(14,165,233,0.2)" stroke="#0EA5E9" stroke-width="2.6"/>
        <path d="M90,158 C134,154 166,76 208,76 C252,76 286,144 358,136 C428,128 454,84 494,96 C530,106 554,154 584,158" fill="none" stroke="#F97316" stroke-width="2.6" stroke-dasharray="6 3"/>
        <line x1="194" y1="32" x2="194" y2="158" stroke="#0284C7" stroke-dasharray="3 3"/>
        <text x="194" y="25" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#0369A1">d₅₀ ≈ 2.2 μm</text>
        <text x="130" y="172" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#0369A1">d₁₀</text>
        <text x="260" y="172" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#0369A1">d₉₀</text>
        <text x="488" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#C2410C">Хвост крупных капель (d₉₀ > 20 мкм)</text>
        <text x="334" y="188" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">Span = (d₉₀ − d₁₀) / d₅₀</text>
      </g>
</svg>
