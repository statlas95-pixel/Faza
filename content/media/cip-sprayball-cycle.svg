<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Мойка CIP и круг Синнера">
  <style>
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes rise{0%{transform:translateY(14px);opacity:.25}50%{opacity:.95}100%{transform:translateY(-22px);opacity:.1}}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.55}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .flow{stroke-dasharray:6 4;animation:flow 1.8s linear infinite}
  .rise{animation:rise 2.8s ease-in-out infinite}
  .rise2{animation:rise 3.4s ease-in-out infinite .9s}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @media (prefers-reduced-motion:reduce){.flow,.rise,.rise2,.pulse,.spin{animation:none!important}}
</style>
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Безразборная мойка CIP: орошение стенок и круг Синнера</text>
  <g transform="translate(36,46)">
        <rect width="316" height="202" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.6"/>
        <path d="M88,48 L228,48 L228,158 Q228,176 158,184 Q88,176 88,158 Z" fill="#FFFFFF" stroke="#0C5E80" stroke-width="2.4"/>
        <line x1="158" y1="30" x2="158" y2="74" stroke="#334155" stroke-width="4"/>
        <circle cx="158" cy="76" r="10" fill="#0EA5E9" class="spin"/>
        <g stroke="#0EA5E9" stroke-width="2.2" class="flow">
          <line x1="148" y1="76" x2="94" y2="62"/><line x1="168" y1="76" x2="222" y2="62"/>
          <line x1="148" y1="82" x2="94" y2="112"/><line x1="168" y1="82" x2="222" y2="112"/>
          <line x1="152" y1="86" x2="108" y2="152"/><line x1="164" y1="86" x2="208" y2="152"/>
        </g>
        <text x="158" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#0C5E80">Полное орошение 360° · без теневых зон</text>
      </g>
      <g transform="translate(384,46)">
        <rect width="340" height="202" rx="14" fill="#FFFFFF" stroke="#DCE6EE" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#182026">Круг Синнера (TACT) + Верификация</text>
        <g transform="translate(104,114)">
          <path d="M0,0 L0,-62 A62,62 0 0,1 62,0 Z" fill="#8ED6F8" opacity=".85"/>
          <path d="M0,0 L62,0 A62,62 0 0,1 0,62 Z" fill="#FF968A" opacity=".85"/>
          <path d="M0,0 L0,62 A62,62 0 0,1 -62,0 Z" fill="#C8E972" opacity=".85"/>
          <path d="M0,0 L-62,0 A62,62 0 0,1 0,-62 Z" fill="#C4B5FD" opacity=".85"/>
          <text x="26" y="-22" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0C5E80">T</text>
          <text x="26" y="30" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#9A3528">A</text>
          <text x="-26" y="30" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#3F6212">C</text>
          <text x="-26" y="-22" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#5B21B6">T°</text>
        </g>
        <g font-family="sans-serif" font-size="11" fill="#182026">
          <text x="184" y="68">• Время экспозиции</text>
          <text x="184" y="92">• Механика (≥ 1,5 м/с)</text>
          <text x="184" y="116">• Химия (щёлочь/кислота)</text>
          <text x="184" y="140">• Температура (65–80 °C)</text>
          <text x="184" y="170" font-weight="700" fill="#047857">Контроль: АТФ + смывы + TOC</text>
        </g>
      </g>
</svg>
