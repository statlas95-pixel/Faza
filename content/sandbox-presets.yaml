# Учебные пресеты и задания для песочницы рецептур «Фазы».

- id: cream-ow-hlb
  title: "Кейс 1: Базовый крем O/W — свести 100 % и подобрать ГЛБ"
  summary: "В рецептуре дневного крема не сходится баланс фаз, а эмульгатор подобран с низким ГЛБ. Доведите сумму до 100 %, подберите пару эмульгаторов под требуемый ГЛБ и перенесите термолабильный актив в фазу C."
  productType: leave-on
  targetPh: 5.5
  batchGrams: 500
  phaseTempC:
    A: 75
    B: 75
    C: 38
  rows:
    - ingredientId: aqua
      phase: A
      pct: 73.0
    - ingredientId: glycerin
      phase: A
      pct: 4.0
    - ingredientId: panthenol
      phase: A
      pct: 2.0
    - ingredientId: caprylic-triglyceride
      phase: B
      pct: 8.0
    - ingredientId: shea-butter
      phase: B
      pct: 4.0
    - ingredientId: cetearyl-alcohol
      phase: B
      pct: 3.0
    - ingredientId: sorbitan-stearate
      phase: B
      pct: 3.0
    - ingredientId: phenoxyethanol
      phase: C
      pct: 0.8
    - ingredientId: tocopherol
      phase: C
      pct: 0.2
  goals:
    noErrors: true
    requireBalance: true
    requireHlbMatch: true
    requirePreservative: true
    phMin: 5.0
    phMax: 6.0

- id: carbomer-conflict
  title: "Кейс 2: Гель с карбомером и витамином C — устранить конфликты"
  summary: "Сыворотка на карбомере разжижается, актив перегрет, а бензоат натрия не работает при целевом pH. Устраните несовместимость полимера с электролитами и приведите консервирование в рабочий режим."
  productType: leave-on
  targetPh: 6.2
  batchGrams: 1000
  phaseTempC:
    A: 70
    B: 70
    C: 45
  rows:
    - ingredientId: aqua
      phase: A
      pct: 90.0
    - ingredientId: glycerin
      phase: A
      pct: 5.0
    - ingredientId: carbomer
      phase: A
      pct: 0.5
    - ingredientId: sap
      phase: C
      pct: 2.0
    - ingredientId: sodium-benzoate
      phase: C
      pct: 0.8
    - ingredientId: sodium-hydroxide
      phase: C
      pct: 0.2
    - ingredientId: parfum
      phase: C
      pct: 0.3
  goals:
    noErrors: true
    requireBalance: true
    requirePreservative: true
    phMin: 5.5
    phMax: 7.0

