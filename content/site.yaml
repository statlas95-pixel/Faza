# Общие тексты и маршруты главной страницы.
name: Фаза
tagline: Технология и разработка косметики — от механизма к решению
intro: >-
  База знаний и интерактивные занятия для технологов производства и разработчиков рецептур.
  Каждая тема ведёт от наблюдаемого явления к механизму и к решению, каждое занятие — рабочая ситуация,
  в которой результат зависит от ваших действий.

# «Сразу к задаче»: формулировка проблемы -> куда вести. to — путь внутри приложения.
tasks:
  - text: Партия крема вышла с низкой вязкостью
    hint: Расследование по документам партии
    to: /labs/batch-2417
    area: production
  - text: Лосьон расслаивается при хранении
    hint: Механизмы и рычаги влияния
    to: /topics/emulsion-stability
    area: rnd
  - text: Нужно перенести рецептуру с 5 кг на реактор
    hint: Расчёт оборотов, проходов и охлаждения
    to: /labs/scale-up-2000
    area: both
  - text: Вязкость одинаковая, а продукты ведут себя по-разному
    hint: Какой реологический тест назначить
    to: /labs/rheo-cabinet
    area: both
  - text: Образец прошёл центрифугу, но расслоился через полгода
    hint: Границы ускоренных испытаний
    to: /topics/stability-testing
    area: rnd
  - text: Охлаждение на реакторе идёт в разы дольше, чем в лаборатории
    hint: Теплообмен и масштаб
    to: /topics/scale-up
    area: production

  - text: Нужно довести вязкость шампуня солью
    hint: Солевая кривая и дозирование порциями
    to: /labs/salt-batch
    area: production

  - text: Два фактора подобраны по отдельности, а вместе не работают
    hint: Взаимодействие факторов и план опытов
    to: /labs/doe-gel
    area: rnd

  - text: В партии обнаружен рост микроорганизмов
    hint: Источник контаминации и защита рецептуры
    to: /labs/batch-6102
    area: both
  - text: Крем у стенок реактора стоит, привод уходит в перегруз
    hint: Режим перемешивания и мощность
    to: /labs/mixing-sheet
    area: production

