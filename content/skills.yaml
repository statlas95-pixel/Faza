# Навыки — то, что человек способен сделать сам. Уровень навыка считается по действиям (shared/mastery.ts),
# а не по просмотру тем. outcome — измеримый результат: «после темы вы сможете…».
- id: mech
  name: Определять механизм нестабильности эмульсии
  outcome: по виду образца и размеру капель назвать механизм разрушения и выбрать рычаг — размер, плотность или реологию среды
  topics: [emulsion-stability]
  labs: [stability-bench]
- id: rheo
  name: Читать реологические данные
  outcome: выбрать измерение под вопрос и сделать из кривой только тот вывод, который она поддерживает
  topics: [rheology-basics]
  labs: [rheo-cabinet]
- id: struct
  name: Расследовать отклонение партии крема
  outcome: отделить артефакт измерения от дефекта и проверить гипотезы различающим наблюдением
  topics: [lamellar-gel-network]
  labs: [batch-2417, batch-3108]
- id: emul
  name: Задавать режим гомогенизации
  outcome: записать режим через интенсивность и число проходов, а не через минуты
  topics: [emulsification]
  labs: [scale-up-2000]
- id: scale
  name: Переносить процесс на другой масштаб
  outcome: пересчитать обороты, время и охлаждение и спланировать проверку до первой партии
  topics: [scale-up]
  labs: [scale-up-2000, scaleup-troubleshooting, night-shift-chp]
- id: stabtest
  name: Выбирать испытание стабильности под риск
  outcome: сказать, какой механизм ускоряет тест и какой вывод из него нельзя делать
  topics: [stability-testing]
  labs: [stability-bench]
- id: surf
  name: Корректировать вязкость ПАВ-систем
  outcome: довести партию до нормы солью, подходя к максимуму кривой с безопасной стороны
  topics: [surfactant-thickening]
  labs: [salt-batch, aqueous-clouding-branch]
- id: doe
  name: Планировать эксперимент
  outcome: распределить опыты так, чтобы оценить эффекты, взаимодействие и шум
  topics: [doe-basics]
  labs: [doe-gel]
- id: micro
  name: Оценивать консервирование и микробиологические риски
  outcome: рассчитать долю активной формы консерванта при заданном pH и найти источник контаминации по данным партии
  topics: [preservation]
  labs: [batch-6102, challenge-test-iso11930]
- id: mixing
  name: Оценивать режим перемешивания и мощность
  outcome: рассчитать число Рейнольдса для мешалки, определить режим и предсказать, как изменится мощность
  topics: [mixing-basics]
  labs: [mixing-sheet, reactor-control]
- id: solcalc
  name: Рассчитывать растворы и загрузки
  outcome: приготовить раствор нужной концентрации, пересчитать кристаллогидрат и товарную форму на активное вещество и свести баланс воды
  topics: [solutions-basics]
  labs: [solutions-sheet]
- id: acidbase
  name: Работать с pH и буферами
  outcome: рассчитать соотношение кислоты и соли для заданного pH, оценить буферную ёмкость и правильно измерить pH
  topics: [ph-buffers]
  labs: [ph-sheet, ph-titration-sim]
- id: water
  name: Оценивать воду как сырьё
  outcome: связать показатели воды (проводимость, жёсткость, микробиологию) с поведением продукта и найти воду среди причин отклонения
  topics: [water-raw]
  labs: [batch-6102]
- id: inci
  name: Читать рецептуру и состав по функциям
  outcome: назвать функцию каждого компонента и оценить границы концентраций по списку INCI
  topics: [raw-functions]
  labs: [inci-sheet, label-claims-audit, reverse-inci]
- id: disperse
  name: Описывать дисперсные системы количественно
  outcome: классифицировать систему по фазам, оценить удельную поверхность и сравнить броуновское движение с оседанием для заданного размера частиц
  topics: [disperse-systems]
  labs: [stability-bench]
- id: surface
  name: Интерпретировать поверхностное натяжение и адсорбцию ПАВ
  outcome: найти ККМ по изотерме, рассчитать адсорбцию по Гиббсу и площадь на молекулу, оценить расход ПАВ на поверхность
  topics: [surface-tension]
  labs: [cmc-sheet]
- id: colloidstab
  name: Оценивать электролитную устойчивость дисперсий
  outcome: рассчитать ионную силу и дебаевскую длину, оценить роль заряда противоиона и выбрать способ стабилизации
  topics: [colloid-stability]
  labs: [dlvo-sheet]
- id: flow
  name: Рассчитывать течение вязких сред в трубах
  outcome: определить режим течения, оценить перепад давления по кажущейся вязкости и выбрать способ снизить сопротивление линии
  topics: [fluid-flow]
  labs: [pump-sheet]
- id: heat
  name: Анализировать теплообмен в аппарате
  outcome: рассчитать коэффициент теплопередачи через сумму сопротивлений, найти лимитирующее звено и выбрать эффективную меру
  topics: [heat-transfer]
  labs: [jacket-sheet]

- id: dissolve
  name: Различать растворимость и скорость растворения
  outcome: оценить концентрационный напор, рассчитать время в заданной модели и отличить насыщение от плохого
    смачивания
  topics:
    - dissolution
  labs:
    - dissolution-sheet
- id: vacuum
  name: Оценивать деаэрацию и ограничения вакуума
  outcome: различать абсолютное и парциальное давление, оценить расширение пузырька и риск кипения, проверить
    ограничения вывода
  topics:
    - deaeration
  labs:
    - deaeration-sheet
    - shift-log-trend
