- id: sunscreens-spf
  name: Проектировать фотостабильные SPF-системы
  outcome: подбирать пары УФ-фильтров, растворители и проверять лимиты Прил. VI EU 1223/2009 и Прил. 5 ТР ТС 009/2011
  topics: [sunscreens-spf]
  labs: [spf-formulator-lab]
- id: hair-care-systems
  name: Разрабатывать кондиционирующие системы для волос
  outcome: различать катионные ламеллярные бальзамы и коацерватные шампуни с поликватерниумами и гуаром
  topics: [hair-care-systems]
  labs: []
- id: unstable-actives
  name: Стабилизировать капризные активы (вит. C, ретинол, кислоты)
  outcome: задавать рабочее окно pH, хелатно-антиоксидантную защиту и учитывать лимиты EU 2024/996
  topics: [unstable-actives]
  labs: [marketing-brief-branch, stability-triage]
- id: packaging-compatibility
  name: Подбирать упаковку и проверять совместимость с рецептурой
  outcome: выбирать материал тары (HDPE/PP/PET/airless) и планировать тесты совместимости по ISO/TR 18811
  topics: [packaging-compatibility]
  labs: [challenge-test-iso11930, packaging-iso18811]
- id: pigment-dispersions
  name: Диспергировать пигменты и стабилизировать суспензии в тональных системах
  outcome: рассчитывать маслоёмкость, подбирать полимерный диспергатор и предотвращать флокуляцию оксидов железа и TiO₂
  topics: [pigment-dispersions]
  labs: [stability-triage]
- id: anhydrous-sticks-balms
  name: Проектировать восковые матрицы безводных стиков и бальзамов
  outcome: балансировать твёрдые и микрокристаллические воски с маслами, управлять температурой розлива и исключать зернистость баттеров
  topics: [anhydrous-sticks-balms]
  labs: [stability-triage]
- id: inverse-emulsions-wo
  name: Создавать обратные эмульсии W/O со стабилизацией электролитами
  outcome: подбирать полиглицериловые и силиконовые эмульгаторы с низким ГЛБ (3–6), электролит водной фазы и гекторитовый реологический каркас
  topics: [inverse-emulsions-wo]
  labs: [spf-formulator-lab]
- id: fragrances-allergens
  name: Вводить парфюмерные композиции и рассчитывать декларируемые аллергены
  outcome: рассчитывать пороги маркировки 0,001 % (leave-on) и 0,01 % (rinse-off) по EU 2023/1545 и оценивать совместимость отдушки с полимерной тарой
  topics: [fragrances-allergens]
  labs: [packaging-iso18811]
- id: cosmetic-organic-chemistry
  name: Ориентироваться в классах органических соединений и показателях CoA
  outcome: различать углеводороды, эфиры, триглицериды, жирные спирты и силиконы, читать кислотное, йодное и гидроксильное числа
  topics: [cosmetic-organic-chemistry]
  labs: [inci-sheet]
- id: skin-barrier-biology
  name: Связывать строение рогового слоя кожи с выбором компонентов рецептуры
  outcome: подбирать хумектанты, эмоленты, окклюзивы и физиологический pH с учётом липидного барьера и TEWL
  topics: [skin-barrier-biology]
  labs: [inci-sheet]
- id: lab-bench-technique
  name: Воспроизводимо вести лабораторную варку и базовые измерения
  outcome: выбирать весы под навеску, исключать аэрацию при перемешивании, калибровать pH-метр и корректно снимать вязкость на ротационном вискозиметре
  topics: [lab-bench-technique]
  labs: [solutions-sheet, mixing-sheet]
- id: stoichiometry-active-matter
  name: Выполнять стехиометрические расчёты и пересчёт на активное вещество
  outcome: переходить от молярной массы к кристаллогидратам и товарным растворам по CoA со сведением баланса воды до 100 %
  topics: [stoichiometry-active-matter]
  labs: [solutions-sheet, ph-sheet]
- id: regulatory-gmp-map
  name: Ориентироваться в регламентах EU 1223/2009, ТР ТС 009/2011, IFRA и ISO GMP
  outcome: различать Приложения II–VI, PIF/CPSR, декларацию ЕАС и СГР, а также связывать ISO 11930, ISO/TR 18811 и ISO 22716
  topics: [regulatory-gmp-map]
  labs: [label-claims-audit, gmp-batch-record]

- id: d4-d5-microplastics-iso16128
  name: Заменять D4/D5/D6 и микропластики и рассчитывать индекс ISO 16128
  outcome: подбирать летучие биоалканы и целлюлозные микросферы по EU 2024/1328 и EU 2023/2055 и считать индекс натурального происхождения с водой и без воды
  topics: [d4-d5-microplastics-iso16128]
  labs: [label-claims-audit]
- id: peptides-pdrn-delivery
  name: Вводить пептиды, PDRN и липосомальные носители без потери активности
  outcome: учитывать несовместимость GHK-Cu с хелаторами и низким pH и исключать разрушение липосом при нагреве и гомогенизации
  topics: [peptides-pdrn-delivery]
  labs: [stability-triage]
- id: hurdle-preservation-microbiome
  name: Строить барьерную консервацию (Hurdle Technology) с защитой микробиома
  outcome: сочетать снижение активности воды, мультифункциональные диолы, зелёные хелаторы и пребиотики для прохождения ISO 11930
  topics: [hurdle-preservation-microbiome]
  labs: [challenge-test-iso11930]
- id: biomimetic-dms-waterless-sci
  name: Разрабатывать биомиметические DMS-эмульсии и твёрдые шампуни на SCI
  outcome: балансировать фосфолипидно-церамидные бислои без ПЭГ и проектировать безводные бары с pH 5,5 на базе Sodium Cocoyl Isethionate
  topics: [biomimetic-dms-waterless-sci]
  labs: [batch-2417]
- id: toxicology-pif-cpsr-mos
  name: Рассчитывать системную экспозицию (SED) и запас безопасности (MoS) для CPSR
  outcome: вычислять SED и MoS ≥ 100 по SCCS Notes of Guidance, проверять категории IFRA 51 и пороги 82 аллергенов EU 2023/1545
  topics: [toxicology-pif-cpsr-mos]
  labs: [label-claims-audit]
- id: kbeauty-hybrid-textures
  name: Проектировать трансформирующиеся текстуры K-Beauty (Water-Break и сукрогели)
  outcome: настраивать предел текучести W/Si-кремов Water-Break и собирать безводные сукрогели масло-в-молочко на лаурате сахарозы
  topics: [kbeauty-hybrid-textures]
  labs: [rheo-cabinet]
