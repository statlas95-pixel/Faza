# Навыки — то, что человек способен сделать сам. Уровень навыка считается по действиям (shared/mastery.ts),
# а не по просмотру тем. outcome — измеримый результат: «после темы вы сможете…».
- id: mech
  name: Определять механизм нестабильности эмульсии
  outcome: по виду образца и размеру капель назвать механизм разрушения и выбрать рычаг — размер, плотность или реологию среды
  topics: [emulsion-stability]
  labs: [stability-bench]
- id: rheo
  name: Читать реологические данные
  outcome: выбрать измерение под вопрос и сделать из кривой только тот вывод, который она поддерживает
  topics: [rheology-basics]
  labs: [rheo-cabinet]
- id: struct
  name: Расследовать отклонение партии крема
  outcome: отделить артефакт измерения от дефекта и проверить гипотезы различающим наблюдением
  topics: [lamellar-gel-network]
  labs: [batch-2417, batch-3108]
- id: emul
  name: Задавать режим гомогенизации
  outcome: записать режим через интенсивность и число проходов, а не через минуты
  topics: [emulsification]
  labs: [scale-up-2000]
- id: scale
  name: Переносить процесс на другой масштаб
  outcome: пересчитать обороты, время и охлаждение и спланировать проверку до первой партии
  topics: [scale-up]
  labs: [scale-up-2000]
- id: stabtest
  name: Выбирать испытание стабильности под риск
  outcome: сказать, какой механизм ускоряет тест и какой вывод из него нельзя делать
  topics: [stability-testing]
  labs: [stability-bench]
- id: surf
  name: Корректировать вязкость ПАВ-систем
  outcome: довести партию до нормы солью, подходя к максимуму кривой с безопасной стороны
  topics: [surfactant-thickening]
  labs: [salt-batch]
- id: doe
  name: Планировать эксперимент
  outcome: распределить опыты так, чтобы оценить эффекты, взаимодействие и шум
  topics: [doe-basics]
  labs: [doe-gel]
- id: micro
  name: Оценивать консервирование и микробиологические риски
  outcome: рассчитать долю активной формы консерванта при заданном pH и найти источник контаминации по данным партии
  topics: [preservation]
  labs: [batch-6102]
- id: mixing
  name: Оценивать режим перемешивания и мощность
  outcome: рассчитать число Рейнольдса для мешалки, определить режим и предсказать, как изменится мощность
  topics: [mixing-basics]
  labs: [mixing-sheet]
