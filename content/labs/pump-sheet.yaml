# Занятие-расчёт (движок worksheet). ВСЕ ДАННЫЕ — УЧЕБНЫЕ; расчёт ньютоновский, по кажущейся вязкости при скорости сдвига у стенки.
id: pump-sheet
engine: worksheet
order: 15
title: "Крем на фасовку: шланг, насос и вязкость"
summary: Насос не прокачивает крем по 10-метровому шлангу на фасовку. Оцените режим течения и перепад давления, найдите ошибку в исходном расчёте и выберите, что менять — шланг, насос или температуру.
area: production
role: Технолог участка фасовки
minutes: 15
skill: Гидравлический расчёт линии — оценить режим течения и перепад давления для вязкого продукта, выбрать правильную вязкость для расчёта и способ снизить сопротивление.
topics: [fluid-flow]
dataNote: Учебные данные. Расчёт по уравнению Хагена — Пуазейля с кажущейся вязкостью при скорости сдвига у стенки — первое приближение для псевдопластичного продукта; местные сопротивления не учитываются.
hints:
  - "Сначала переведите расход в м³/с и диаметр в метры."
  - "Δp = 128·μ·L·Q / (π·d⁴); диаметр в четвёртой степени."

brief:
  situation: |
    Новый крем подают из промежуточной ёмкости на фасовочный автомат кулачковым насосом по шлангу DN50 длиной 10 м.
    При расходе 2 м³/ч давление на выходе насоса доходит до предела, срабатывает защита. Механик пересчитал линию по паспортной вязкости продукта и получил 14,5 бар.
  goal: Проверить расчёт и предложить изменение, которое позволит работать с запасом.
  constraints: Данные — в выписке. Насос рассчитан на 6 бар на выходе.

sheet:
  title: Данные по линии подачи на фасовку
  origin: Паспорт насоса, план линии, протокол реологии продукта (учебные).
  rows:
    - ["Расход", "2 м³/ч"]
    - ["Шланг", "внутренний диаметр 50 мм, длина 10 м"]
    - ["Плотность продукта", "1000 кг/м³"]
    - ["Вязкость по спецификации (шпиндельный вискозиметр, ≈4 с⁻¹)", "40 Па·с"]
    - ["Кривая течения: кажущаяся вязкость при 45 с⁻¹, 30 °C", "10 Па·с"]
    - ["Насос", "кулачковый, допустимое давление на выходе 6 бар"]
    - ["Альтернативный шланг", "внутренний диаметр 65 мм"]

steps:
  - title: Режим течения
    text: Начните с режима — от него зависит, какую формулу применять.
    questions:
      - type: num
        q: Какова средняя скорость продукта в шланге, м/с?
        answer: 0.283
        tol: 0.03
        unit: м/с
        hint: "Q = 2/3600 = 5,56·10⁻⁴ м³/с; площадь сечения π·0,05²/4 = 1,96·10⁻³ м²."
        explain: "5,56·10⁻⁴ / 1,96·10⁻³ ≈ 0,283 м/с."
      - type: num
        q: Каково число Рейнольдса при кажущейся вязкости 10 Па·с?
        answer: 1.41
        tol: 0.04
        unit: ""
        hint: "Re = ρ·v·d/μ = 1000 · 0,283 · 0,05 / 10."
        explain: "≈ 1,4 — глубоко ламинарный режим; уравнение Хагена — Пуазейля применимо."
  - title: Перепад давления
    text: Механик подставил в расчёт вязкость из спецификации — 40 Па·с.
    questions:
      - type: num
        q: Каков перепад давления при кажущейся вязкости 10 Па·с, бар?
        answer: 3.62
        tol: 0.03
        unit: бар
        hint: "128 · 10 · 10 · 5,56·10⁻⁴ / (3,1416 · 6,25·10⁻⁶); 1 бар = 10⁵ Па."
        explain: "7,11 / 1,963·10⁻⁵ ≈ 3,62·10⁵ Па ≈ 3,6 бар."
      - type: mc
        q: Почему расчёт механика (14,5 бар) неверен?
        options:
          - { text: "Ошибка в формуле", why: "Формула та же; отличается вязкость." }
          - { text: "Подставлена вязкость при 4 с⁻¹, а у стенки шланга скорость сдвига около 45 с⁻¹; псевдопластичный крем там в четыре раза менее вязкий", correct: true, why: "Для оценки берут кажущуюся вязкость при скорости сдвига процесса." }
          - { text: "Режим турбулентный", why: "Re ≈ 1,4 — режим ламинарный." }
      - type: mc
        q: Почему тогда фактически срабатывает защита насоса?
        options:
          - { text: "Насос неисправен — 3,6 бар меньше 6", why: "Возможно, но сначала проверяют то, чего нет в расчёте." }
          - { text: "Расчёт не учитывает местные сопротивления, фильтр на входе автомата и температуру: если продукт подают холоднее 30 °C, его вязкость выше", correct: true, why: "Проверяют температуру продукта в линии и сопротивление фильтра и арматуры — запаса до 6 бар всего 2,4 бар." }
          - { text: "Перепад давления не зависит от вязкости", why: "В ламинарном режиме он ей прямо пропорционален." }
  - title: Что менять
    text: Предлагают заменить шланг DN50 на DN65.
    questions:
      - type: num
        q: Во сколько раз снизится перепад давления по ньютоновской оценке?
        answer: 2.86
        tol: 0.02
        unit: раз
        hint: "(65/50)⁴."
        explain: "1,3⁴ ≈ 2,86; ~3,6 бар → ~1,3 бар. Для псевдопластичного продукта выигрыш немного меньше: в широком шланге скорость сдвига ниже, вязкость выше."
      - type: mc
        q: Какое решение надёжнее для линии?
        options:
          - { text: "Заменить кулачковый насос на центробежный большей мощности", why: "Центробежный насос плохо работает с вязкими продуктами." }
          - { text: "Шланг DN65 и контроль температуры продукта в линии; проверить сопротивление фильтра", correct: true, why: "Диаметр — самый сильный рычаг, а температура и фильтр — неучтённые сопротивления." }
          - { text: "Снизить вязкость крема разбавлением водой", why: "Это изменение продукта, а не линии." }

transfer:
  title: "Перенос: другая линия"
  intro: |
    Гель подают по шлангу внутренним диаметром 40 мм длиной 20 м с расходом 1 м³/ч. Кажущаяся вязкость при скорости сдвига у стенки — 5 Па·с, плотность 1000 кг/м³.
  questions:
    - type: num
      q: Каков перепад давления, бар?
      answer: 4.42
      tol: 0.03
      unit: бар
      explain: "Q = 2,78·10⁻⁴ м³/с; d⁴ = 2,56·10⁻⁶ м⁴. Δp = 128·5·20·2,78·10⁻⁴ / (π·2,56·10⁻⁶) ≈ 4,42·10⁵ Па."
    - type: num
      q: Каково число Рейнольдса?
      answer: 1.77
      tol: 0.04
      unit: ""
      explain: "v = 2,78·10⁻⁴ / 1,257·10⁻³ ≈ 0,221 м/с; Re = 1000 · 0,221 · 0,04 / 5 ≈ 1,8."
    - type: mc
      q: Что сильнее снизит перепад давления — укоротить шланг вдвое или увеличить его диаметр на 25 %?
      options:
        - { text: "Укоротить вдвое", why: "Перепад снизится в 2 раза, а увеличение диаметра на 25 % — в 1,25⁴ ≈ 2,44 раза." }
        - { text: "Увеличить диаметр на 25 %", correct: true, why: "1,25⁴ ≈ 2,44 > 2. Диаметр входит в четвёртой степени, длина — в первой." }
        - { text: "Одинаково", why: "2 и 2,44 — заметная разница." }
