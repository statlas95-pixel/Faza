id: night-shift-chp
engine: night-shift
order: 54
title: "Ночная смена: генератор производственных ЧП"
summary: "Режим дежурного технолога с живым таймером, бюджетом партии и случайной генерацией 3 нештатных аварий из 10 сценариев косметического цеха."
area: production
role: Дежурный главный технолог смены
minutes: 12
skill: Переносить процесс на другой масштаб и локализовать производственные ЧП в условиях дефицита времени и бюджета
topics: [scale-up, surfactant-thickening, deaeration, heat-transfer, polymer-thickeners, preservation, pump-selection, inverse-emulsions-wo]
brief:
  situation: "02:30 ночи на косметическом заводе. В работе одновременно несколько реакторов, линия водоподготовки и участок фасовки. За смену на пульт поступают 3 непредсказуемых производственных инцидента из базы 10 реальных аварийных сценариев."
  goal: "Быстро диагностировать физико-химическую первопричину каждого ЧП по телеметрии и отдать в цех корректирующую команду, сохранив индекс качества партии ≥ 80 % и уложившись в резервный бюджет смены (150 000 ₽) и лимит простоя (120 мин)."
  constraints: "Каждое нажатие «Новая смена» генерирует новую комбинацию из 3 инцидентов. Неверная команда приводит к браку партии, потере времени или нарушению нормативов ТР ТС 009/2011 и EU 1223/2009."
dataNote: "Симуляция использует учебные технологические параметры и условные оценки стоимости переработки/брака для тренировки скорости и точности инженерных решений."
