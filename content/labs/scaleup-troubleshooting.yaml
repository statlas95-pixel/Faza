id: scaleup-troubleshooting
engine: branching
order: 41
area: production
minutes: 12
role: Технолог-масштабировщик
title: "Симулятор брака и масштабирования: перенос крема 500 г → 500 кг"
summary: "Ветвящийся кейс промышленной варки: устраните завоздушивание при загрузке, избежите потери вязкости после повторной гомогенизации и выберите правильный режим охлаждения реактора."
skill: Принимать последовательные технологические решения при переносе эмульсии со стакана на реактор, предотвращая завоздушивание и разрушение структуры
topics: [scale-up, emulsification, deaeration]
brief:
  situation: "Рецептура ламеллярного крема идеально получилась в лабораторном стакане 500 г (вязкость 24 Па·с, плотность 0,98 г/см³, гладкий глянец). Сегодня идёт первая опытно-промышленная варка 500 кг в вакуумном реакторе Р-205."
  goal: "Проведите партию через три критических этапа масштабирования (загрузка и воздух, сдвиг при охлаждении, отвод тепла и ввод фазы C) и получите кондиционную партию без брака."
  constraints: "Каждое ваше решение меняет состояние массы в реакторе и дальнейшие развилки. Показания приборов — учебная синтетическая модель."
dataNote: "Показания плотности, температуры и вязкости синтетические; отражают типовые физико-химические эффекты переноса эмульсий O/W."

start: load-phase-b
nodes:
  - id: load-phase-b
    title: "Этап 1: Загрузка масляной фазы B (75 °C) в водную фазу A"
    scene: "В реакторе 365 кг водной фазы A (75 °C). Сменный оператор начинает сливать масляную фазу B сверху через открытый люк при работающей якорной мешалке (45 об/мин). Через 3 минуты масса покрывается плотной пеной, уровень вырос на 12 %."
    readings:
      - { label: "Температура массы", value: "74 °C" }
      - { label: "Плотность пробы", value: "0,88 г/см³ (норма 0,97–0,99)" }
      - { label: "Давление в реакторе", value: "атмосферное (0 бар)" }
    choices:
      - id: under-surface-vacuum
        label: "Остановить подачу сверху, переключить подачу фазы B под уровень жидкости, закрыть люк, снизить мешалку до 20 об/мин и подать умеренный вакуум (−0,5 бар)"
        verdict: ok
        consequence: "Захват воздуха прекратился, крупные пузырьки выходят без вскипания воды (при 74 °C давление пара воды ≈ 37 кПа, абсолютное давление 50 кПа безопасно). Плотность восстановилась до 0,97 г/см³."
        next: shear-at-cooling
      - id: keep-open-homog
        label: "Не останавливать загрузку — сразу включить роторно-статорный гомогенизатор на 3000 об/мин, чтобы «разбить пену»"
        verdict: wrong
        consequence: "Высокий сдвиг в открытом реакторе диспергировал крупные пузыри в микропузырьки < 50 мкм — удалить их потом вакуумом почти невозможно. Плотность упала до 0,84 г/см³."
        next: aerated-branch
      - id: full-vacuum-hot
        label: "Закрыть люк и сразу дать глубокий вакуум −0,85 бар при 74 °C, чтобы мгновенно вытянуть весь воздух"
        verdict: weak
        consequence: "Абсолютное давление (~15 кПа) упало ниже давления насыщенного пара воды при 74 °C (~37 кПа): масса бурно закипела, часть воды ушла в вакуумную линию, состав сдвинулся. Вакуум пришлось экстренно сбросить до −0,45 бар."
        next: shear-at-cooling

  - id: aerated-branch
    title: "Последствие: микроаэрация в массе (0,84 г/см³)"
    scene: "Эмульсия превратилась в устойчивый суфлеобразный мусс: микропузырьки не всплывают в вязкой среде. При фасовке в тубы масса не поместится по номинальному весу, а через неделю даст усадку."
    readings:
      - { label: "Плотность пробы", value: "0,84 г/см³" }
      - { label: "Температура", value: "68 °C" }
      - { label: "Внешний вид", value: "матовая масса с микропорами" }
    choices:
      - id: slow-deaerate
        label: "Отключить гомогенизатор, держать температуру ~60 °C (вязкость ниже) и провести медленную деаэрацию под контролируемым вакуумом −0,65 бар при медленном скребке (12 об/мин)"
        verdict: ok
        consequence: "При сниженной вязкости и мягком вакууме большую часть воздуха удалось отвести (плотность выросла до 0,94 г/см³), но потеряно 45 минут времени цикла."
        next: shear-at-cooling
      - id: continue-as-is
        label: "Оставить как есть и начать быстрое охлаждение — «в банке осядет»"
        verdict: wrong
        consequence: "По мере охлаждения вязкость выросла в 10 раз и намертво «заморозила» микропузырьки внутри крема."
        next: end-aerated-scrap

  - id: shear-at-cooling
    title: "Этап 2: Внезапная потеря вязкости при охлаждении (42 °C)"
    scene: "Гомогенизация при 72 °C прошла штатно (d₃₂ ≈ 2,1 мкм). При охлаждении до 42 °C сменный технолог отобрал пробу: крем кажется жидковатым (9 Па·с вместо ожидаемых 24 Па·с в стакане через сутки). Оператор предлагает: «Давай прокрутим гомогенизатор на 2800 об/мин ещё 10 минут, он сразу загустеет!»"
    readings:
      - { label: "Температура массы", value: "42 °C" }
      - { label: "Текущая вязкость (42 °C)", value: "9,2 Па·с" }
      - { label: "d₃₂ капель (микроскоп)", value: "2,1 мкм (в норме)" }
    choices:
      - id: no-late-shear
        label: "Запретить повторный высокий сдвиг при 42 °C: оставить только медленную якорную мешалку (15 об/мин), плавно доохладить до 35 °C и оценить вязкость после созревания ламеллярной сетки (24 ч)"
        verdict: ok
        consequence: "Ламеллярная гелевая сетка жирных спиртов спокойно кристаллизовалась без механического разрушения; уже при 36 °C вязкость выросла до 16 Па·с."
        next: cooling-and-phase-c
      - id: run-late-homog
        label: "Согласиться и включить гомогенизатор 2800 об/мин на 10 минут при 42 °C"
        verdict: wrong
        consequence: "Высокий сдвиг в зоне кристаллизации разрушил формирующуюся ламеллярную гелевую сетку (и разогрел массу на +5 °C). После остывания вязкость необратимо рухнула до 4,5 Па·с — крем стал жидким молочком."
        next: end-shear-collapse
      - id: dump-dry-carbomer
        label: "Всыпать сверху 0,5 % сухого карбомера для быстрого загущения партии"
        verdict: wrong
        consequence: "Недиспергированный карбомер в готовой эмульсии мгновенно образовал нерастворимые «рыбьи глаза» (комки), которые уже не убрать без полной переделки партии."
        next: end-shear-collapse

  - id: cooling-and-phase-c
    title: "Этап 3: Охлаждение 500 кг и ввод термолабильной фазы C"
    scene: "Отношение площади рубашки к объёму на реакторе 500 кг в разы меньше, чем у стакана 500 г: охлаждение идёт медленно, температура 49 °C. Смена заканчивается через 30 минут. Нужно доохладить до ≤ 38 °C и ввести пантенол + феноксиэтанол + отдушку."
    readings:
      - { label: "Температура массы", value: "49 °C" }
      - { label: "Вода в рубашке", value: "20 °C" }
      - { label: "Режим ввода фазы C", value: "≤ 40 °C" }
    choices:
      - id: controlled-cool-wait
        label: "Выдержать контролируемое охлаждение водой 18–20 °C при плавном скребковом перемешивании до 37 °C, затем ввести фазу C и передать доохлаждение следующей смене по протоколу"
        verdict: ok
        consequence: "Пристеночный слой не переохлаждался и не налипал на рубашку; фаза C введена при 37 °C без потерь отдушки и активов. Через 24 часа вязкость вышла на 23,8 Па·с (эталон 24 Па·с), плотность 0,98 г/см³."
        next: end-success
      - id: chilled-water-shock
        label: "Подать в рубашку ледяной рассол 4 °C, чтобы резко ускорить охлаждение до конца смены"
        verdict: weak
        consequence: "У холодной стенки моментально застыла корка восков и цетилстеарилового спирта (эффект «шубы»): коэффициент теплопередачи резко упал, а в массе появились плотные крупинки."
        next: end-chilled-grains
      - id: hot-phase-c
        label: "Ввести фазу C прямо сейчас при 49 °C, чтобы успеть закончить варку в свою смену"
        verdict: wrong
        consequence: "Часть летучих нот отдушки испарилась, термолабильный актив частично деградировал, а в Batch Record зафиксировано критическое отклонение по температуре ввода."
        next: end-hot-phase-c

  - id: end-success
    title: "Партия 500 кг соответствует эталону!"
    scene: "Через 24 часа QC подтвердил: вязкость 23,8 Па·с, плотность 0,98 г/см³, микроскопия однородная без пузырьков и крупинок, все параметры в допуске Batch Record."
    outcome:
      verdict: ok
      score: 1.0
      title: "Успешный перенос на промышленный масштаб"
      summary: "Вы предотвратили завоздушивание, защитили ламеллярную сетку от позднего сдвига и сохранили контролируемый теплообмен."
      lesson: "При переносе со стакана на реактор главные враги — захват воздуха при загрузке, разрушение кристаллизующейся сетки поздней гомогенизацией и термический шок на рубашке."

  - id: end-chilled-grains
    title: "Партия с дефектом текстуры (крупинки восков)"
    scene: "Крем стабилен по pH и консерванту, но содержит мелкие ощутимые крупинки жирных спиртов из-за шокового охлаждения на холодной стенке реактора."
    outcome:
      verdict: weak
      score: 0.55
      title: "Частичный брак: шоковое охлаждение дало крупинки"
      summary: "Резкая подача рассола 4 °C создала застывший пристеночный слой и ухудшила теплообмен."
      lesson: "Для ламеллярных кремов разница температур между массой и хладагентом рубашки должна быть умеренной, чтобы не заморозить воски у стенки."

  - id: end-hot-phase-c
    title: "Отклонение качества: перегрев фазы C"
    scene: "Партия отправлена в карантин: нарушен температурный регламент ввода фазы C, запах искажён, активность термолабильных добавок под вопросом."
    outcome:
      verdict: wrong
      score: 0.35
      title: "Брак по регламенту ввода активов"
      summary: "Спешка к концу смены привела к вводу фазы C при 49 °C вместо ≤ 40 °C."
      lesson: "Нельзя сокращать время охлаждения за счёт температурного режима ввода фазы C — передача этапа следующей смене по протоколу всегда дешевле бракованной партии."

  - id: end-shear-collapse
    title: "Необратимая потеря вязкости / комки"
    scene: "Через 24 часа партия 500 кг имеет вязкость 4,5 Па·с (норма 18–26 Па·с) либо содержит нерастворимые комки полимера. Партия забракована."
    outcome:
      verdict: wrong
      score: 0.2
      title: "Разрушение структуры эмульсии при охлаждении"
      summary: "Высокий сдвиг ниже температуры кристаллизации (или сухой досып карбомера) необратимо испортил текстуру крема."
      lesson: "Если размер капель уже в норме, не гомогенизируйте остывающий ламеллярный крем: его вязкость нарастает при спокойном охлаждении и выдержке 24 ч."

  - id: end-aerated-scrap
    title: "Брак по завоздушиванию (недовес при фасовке)"
    scene: "Плотность готового крема 0,84 г/см³: фасовочный автомат не может дозировать нужную массу в тубу, а в банках через неделю образуются пустоты."
    outcome:
      verdict: wrong
      score: 0.15
      title: "Микроаэрация зафиксирована в вязкой матрице"
      summary: "Подача сверху + ранний гомогенизатор без вакуума превратили крем в стойкий мусс."
      lesson: "Воздух гораздо легче не впустить (подача под уровень + умеренный вакуум), чем пытаться вытянуть микропузырьки из остывшей вязкой эмульсии."

transfer:
  title: "Перенос принципа на другой масштаб"
  intro: "Теперь рецептуру переносят на реактор 2000 кг с рубашкой меньшей удельной площади."
  questions:
    - type: mc
      q: "Почему на реакторе 500–2000 кг время охлаждения с 75 до 35 °C растёт кратно по сравнению со стаканом 500 г?"
      options:
        - text: "Отношение площади теплообмена рубашки к массе (A/m) уменьшается примерно обратно пропорционально линейному размеру реактора"
          correct: true
          why: "При геометрическом подобии объём и масса растут как L³, а площадь рубашки — только как L², поэтому удельная поверхность охлаждения A/m падает."
        - text: "Удельная теплоёмкость крема увеличивается с ростом массы партии"
          why: "Теплоёмкость — интенсивное свойство материала и от массы партии не зависит."
        - text: "В больших реакторах не работает теплопроводность стали"
          why: "Главное ограничение — уменьшение удельной площади A/m и рост толщины вязкого пристеночного слоя."
