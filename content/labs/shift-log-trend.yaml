id: shift-log-trend
engine: shift-trend
order: 43
area: production
minutes: 10
role: Технолог варочного участка
title: "Разбор смены: журнал варки с приборным трендом (T · ток · вакуум)"
summary: "Проанализируйте синхронный график температуры, тока привода мешалки и вакуума за смену, найдите на тренде момент ухода процесса от режима и определите причину брака."
skill: Читать многоканальный тренд варки (температура, ток привода, вакуум) и связывать его изменения с физико-химическими событиями в реакторе
topics: [deaeration, heat-transfer, mixing-basics]
brief:
  situation: "Ночная варка партии крема (500 кг, реактор Р-205) на выходе дала заниженную плотность (0,89 г/см³ вместо 0,98) и неровную текстуру с мелкими воздушными порами. В журнале смены оператор написал «варка прошла штатно», но SCADA сохранила минутный тренд трёх датчиков."
  goal: "Найдите прямо на графике минуту, когда режим впервые ушёл в отклонение, определите физическую причину по совокупности трёх кривых и выберите верное действие технолога."
  constraints: "Показания датчиков синтетические (учебный журнал варки); сопоставляйте все три канала одновременно — одиночный график может ввести в заблуждение."
dataNote: "Синтетический приборный тренд реактора Р-205 для отработки чтения производственных журналов."

equipment: "Вакуумный реактор Р-205 (500 кг)"
batchInfo: "Эмульсия O/W · гомогенизация 10–25 мин · охлаждение 25–75 мин"
anomalyMin: 35
anomalyToleranceMin: 5
anomalyWhy: "На 35-й минуте (при охлаждении 64 °C) произошла разгерметизация вакуумного контура: вакуум резко упал с −0,60 до −0,08 бар, при этом мешалка продолжала вращаться, а с 40-й минуты ток привода неожиданно просел с 11,4 до 8,2 А из-за захвата воздуха (снижение эффективной плотности и кажущейся вязкости у лопастей) и замедлилось охлаждение."

points:
  - { min: 0, tempC: 75, currentA: 7.2, vacuumBar: -0.55, note: "Начало эмульгирования" }
  - { min: 10, tempC: 74, currentA: 8.5, vacuumBar: -0.60, note: "Гомогенизация" }
  - { min: 20, tempC: 72, currentA: 9.8, vacuumBar: -0.60, note: "Завершение гомогенизации" }
  - { min: 30, tempC: 68, currentA: 10.6, vacuumBar: -0.60, note: "Старт охлаждения рубашкой" }
  - { min: 35, tempC: 64, currentA: 11.4, vacuumBar: -0.08, note: "Резкая потеря вакуума!" }
  - { min: 40, tempC: 61, currentA: 9.1, vacuumBar: -0.05, note: "Падение тока привода при остывании" }
  - { min: 50, tempC: 55, currentA: 8.2, vacuumBar: -0.04, note: "Медленное охлаждение, низкий ток" }
  - { min: 60, tempC: 48, currentA: 8.6, vacuumBar: -0.05, note: "Завоздушенная масса" }
  - { min: 70, tempC: 40, currentA: 9.4, vacuumBar: -0.05, note: "Ввод фазы C без вакуума" }
  - { min: 80, tempC: 34, currentA: 10.2, vacuumBar: -0.05, note: "Выгрузка партии (ρ = 0,89)" }

causes:
  - id: vacuum-loss
    title: "На 35-й минуте пропал вакуум (−0,60 → −0,08 бар), из-за чего мешалка завоздушила массу — упал ток привода и ухудшился теплообмен у рубашки"
    verdict: ok
    why: "Точное физическое объяснение всех трёх кривых: разгерметизация (подсос воздуха через уплотнение/люк) → захват воздуха → падение плотности и крутящего момента (тока привода) вопреки охлаждению + пузырьки воздуха ухудшают теплопроводность пристеночного слоя."
  - id: heater-broken
    title: "На 10-й минуте сломался нагрев реактора, поэтому масса остыла слишком быстро"
    verdict: wrong
    why: "На 10–30-й минутах температура шла строго по регламенту (74 → 68 °C), а после 35-й минуты охлаждение наоборот замедлилось."
  - id: motor-overload
    title: "Произошла перегрузка двигателя якорной мешалки из-за чрезмерной вязкости крема"
    verdict: wrong
    why: "При чрезмерной вязкости ток привода резко вырос бы, а на тренде после 35-й минуты ток наоборот аномально упал (11,4 → 8,2 А)."

actions:
  - id: check-seal-interlock
    title: "Проверить уплотнение крышки/вакуумный клапан Р-205, настроить сигнал тревоги SCADA при падении вакуума выше −0,35 бар и перепроверить плотность перед фасовкой"
    verdict: ok
    why: "Устраняет техническую причину подсоса воздуха и вводит автоматический контроль критического параметра на будущих сменах."
  - id: raise-rpm
    title: "Увеличить обороты якорной мешалки вдвое, чтобы вернуть ток привода к 11 А"
    verdict: wrong
    why: "При отсутствии вакуума повышение оборотов лишь усилит захват воздуха и ухудшит брак."
  - id: ignore-trend
    title: "Игнорировать тренд, раз оператор написал «варка прошла штатно»"
    verdict: wrong
    why: "Объективные данные датчиков и заниженная плотность (0,89 г/см³) опровергают формальную запись оператора."

transfer:
  title: "Перенос: как отличить застывание восков на рубашке от завоздушивания по току привода?"
  intro: "В другой варке при подаче слишком холодной воды в рубашку вакуум остался стабильным (−0,60 бар), но на 45-й минуте ток привода резко подскочил вверх (с 11 до 19 А), а температура в центре массы перестала падать."
  questions:
    - type: mc
      q: "На что указывает сочетание «стабильный вакуум + резкий скачок тока скребковой мешалки + замедление охлаждения»?"
      options:
        - text: "Пристеночное налипание застывших восков («шуба») на холодной стенке рубашки: скребки встречают высокое сопротивление, а корка изолирует теплообмен"
          correct: true
          why: "Плотная корка у стенки резко повышает нагрузку на скребковую мешалку (рост тока) и служит теплоизолятором."
        - text: "Завоздушивание массы через вакуумную линию"
          why: "При завоздушивании вакуум падает, а ток привода снижается, а не растёт."
