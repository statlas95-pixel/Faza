# Занятие-симулятор. Движок: stability. Числа модели можно менять здесь; логика расчёта — в src/models/physics.ts.
# ВСЕ ЧИСЛА — УЧЕБНЫЕ: таблица вязкости растворов ксантана придумана по форме типичных зависимостей и не относится к конкретной марке.

id: stability-bench
engine: stability
order: 2
title: "Стенд стабильности: распыляемое молочко"
summary: Прототип расслаивается за месяц. Загустить «с запасом» нельзя — перестанет распыляться. Найдите состав, который простоит два года, и объясните, почему сработал именно он.
area: rnd
role: Разработчик рецептур
minutes: 25
skill: Выбор рычага стабилизации по механизму — количественно сравнить влияние размера капель, разности плотностей и реологии среды и проверить гипотезу контролируемым опытом.
topics: [emulsion-stability, stability-testing, rheology-basics]
dataNote: Учебная модель. Стокс со стеснённым движением (множитель (1−φ)^4,65) и вязкостью среды при малом сдвиге; коалесценция, флокуляция и оствальдово созревание не моделируются.

hints:
  - "Меняйте по одному параметру за прогон — иначе не поймёте, что именно дало эффект."
  - "Посмотрите, в какой степени каждый параметр входит в закон Стокса."
  - "Загуститель повышает вязкость при малом сдвиге намного сильнее, чем при 1000 с⁻¹ — используйте это, но следите за ограничением распыляемости."

brief:
  situation: |
    Вы — разработчик рецептур. Заказчик хочет распыляемое молочко для тела: 15 % масляной фазы, флакон с триггером.
    Первый прототип (минеральное масло, роторно-статорный гомогенизатор 3 минуты, 0,1 % ксантановой камеди)
    через месяц дал прозрачный слой внизу флакона.
  goal: |
    Подобрать прототип, у которого видимый слой (1 мм в столбе 50 мм) появится **не раньше чем через 24 месяца**,
    а вязкость при 1000 с⁻¹ останется **не выше 14 мПа·с** — иначе триггер не распылит.
  constraints: |
    На стенде не более **8 прогонов**. Перед каждым прогоном запишите прогноз — он не оценивается, но в разборе
    вы увидите, где интуиция расходилась с расчётом.

model:
  column_mm: 50
  visible_mm: 1
  target_days: 730
  eta1000_max: 14
  rz: 4.65
  rcf: 2000
  centrifuge_min: 30
  maxRuns: 8
  # c — массовая доля ксантана, %; eta0 — вязкость при малом сдвиге, Па·с; eta1000 — вязкость при 1000 с⁻¹, мПа·с
  xanthan:
    - { c: 0,    eta0: 0.001, eta1000: 1 }
    - { c: 0.05, eta0: 0.02,  eta1000: 2.5 }
    - { c: 0.1,  eta0: 0.3,   eta1000: 4 }
    - { c: 0.2,  eta0: 5,     eta1000: 8 }
    - { c: 0.3,  eta0: 30,    eta1000: 13 }
    - { c: 0.4,  eta0: 110,   eta1000: 19 }
    - { c: 0.5,  eta0: 300,   eta1000: 25 }
  oils:
    - { id: mineral, name: "Минеральное масло", rho: 850, note: "Исходный вариант заказчика" }
    - { id: ipm, name: "Изопропилмиристат", rho: 853, note: "Лёгкое, быстро впитывается" }
    - { id: cct, name: "Каприлик/каприк триглицерид", rho: 945, note: "Плотность ближе к воде; замену согласует заказчик" }
    - { id: dimeth, name: "Диметикон 100 сСт", rho: 965, note: "Меняет сенсорику и заявления о составе" }
  processes:
    - { id: paddle, name: "Лопастная мешалка", d: 15, note: "≈15 мкм" }
    - { id: rs3, name: "Ротор-статор, 3 мин", d: 5, note: "≈5 мкм" }
    - { id: rs10, name: "Ротор-статор, 10 мин", d: 3, note: "≈3 мкм" }
    - { id: hph, name: "Гомогенизатор высокого давления", d: 0.5, note: "≈0,5 мкм; аренда оборудования" }
  start: { oil: mineral, process: rs3, c: 0.1, phi: 15 }

predictions:
  - { id: lt30, text: "меньше месяца", max: 30 }
  - { id: m1-6, text: "1–6 месяцев", max: 180 }
  - { id: m6-24, text: "6–24 месяца", max: 730 }
  - { id: gt24, text: "больше 24 месяцев", max: 1.0e+12 }

questions:
  - type: mc
    q: Какой из трёх параметров входит в закон Стокса в квадрате — и что из этого следует для выбора рычага?
    options:
      - { text: "Вязкость; поэтому загуститель всегда эффективнее всего", why: "Вязкость стоит в знаменателе в первой степени. Её сила в другом — малой добавкой её можно изменить на порядки." }
      - { text: "Диаметр капли; уменьшение размера вдвое замедляет разделение вчетверо", correct: true, why: "Именно так. Сравните прогоны, различающиеся только способом гомогенизации — 5 → 3 мкм дают (5/3)² ≈ 2,8 раза." }
      - { text: "Разность плотностей; поэтому главное — выбор масла", why: "Разность плотностей входит в первой степени. Замена масла — сильный рычаг только потому, что Δρ можно уменьшить в несколько раз." }
  - type: mc
    q: Переход с 0,1 % на 0,2 % ксантана увеличивает время до расслоения примерно в 17 раз, а вязкость при 1000 с⁻¹ — всего вдвое. Как это объяснить?
    options:
      - { text: "Ошибка модели — вязкость не может вырасти в 17 раз от удвоения концентрации", why: "Может. Вязкость растворов структурирующих полимеров при малом сдвиге растёт с концентрацией очень круто, а не линейно." }
      - { text: "Капля движется при ничтожной скорости сдвига, где работает вязкость при малом сдвиге; триггер — при высокой, где раствор сильно разжижается", correct: true, why: "Это и есть причина, по которой псевдопластичный загуститель позволяет совместить стабильность и распыляемость. Одна цифра вязкости этого не покажет." }
      - { text: "Ксантан уменьшает размер капель", why: "В модели размер капель задаётся только способом гомогенизации." }
  - type: mc
    q: Для загущенного прототипа центрифуга (2000 g, 30 мин) показывает больший слой, чем даёт простой пересчёт «скорость при 1 g × 2000». Какой вывод корректен?
    options:
      - { text: "Центрифуга ошибается", why: "Прибор измеряет то, что происходит в его условиях. Вопрос в том, совпадают ли эти условия с хранением." }
      - { text: "В центрифуге капля нагружает среду сильнее, вязкость вокруг неё падает; тест строже хранения и линейно на срок годности не пересчитывается", correct: true, why: "Поэтому центрифугу используют для сравнения прототипов и быстрого отсева, а не для расчёта срока." }
      - { text: "Значит, прототип расслоится быстрее, чем показал расчёт хранения", why: "Нет — при 1 g напряжения на три порядка ниже, и среда сохраняет высокую вязкость." }

transfer:
  title: "Перенос: солнцезащитный флюид с оксидом цинка"
  intro: |
    Новая задача. В масляной фазе флюида (плотность 1000 кг/м³ для простоты расчёта) диспергирован оксид цинка, плотность 5600 кг/м³.
    Первичные частицы — 0,2 мкм, но в продукте они образуют агломераты около 2 мкм. Через два месяца на дне — плотный осадок.
  questions:
    - type: num
      q: Во сколько раз агломерат 2 мкм оседает быстрее первичной частицы 0,2 мкм (по Стоксу, остальное одинаково)?
      answer: 100
      tol: 0.05
      unit: раз
      explain: "v ∝ d². (2/0,2)² = 100. Отсюда первый рычаг — качество диспергирования и предотвращение агломерации, а не загуститель."
    - type: num
      q: "Какая вязкость среды при малом сдвиге нужна, чтобы агломерат 2 мкм оседал не быстрее 1 мм в год? Δρ = 4600 кг/м³. Ответ в Па·с."
      answer: 316
      tol: 0.12
      unit: Па·с
      explain: "1 мм/год = 3,17·10⁻¹¹ м/с. η = Δρ·g·d²/(18·v) = 4600·9,81·(2·10⁻⁶)²/(18·3,17·10⁻¹¹) ≈ 316 Па·с. Для жидкого флюида это недостижимо ньютоновской вязкостью — нужна среда с пределом текучести."
    - type: mc
      q: Какой порядок действий обоснован для этого флюида?
      options:
        - { text: "Поднять вязкость масляной фазы загустителем до нужной величины", why: "Расчёт показал, что нужно ≈300 Па·с при малом сдвиге — продукт перестанет быть флюидом, если это ньютоновская вязкость." }
        - { text: "Сначала разрушить агломераты и стабилизировать дисперсию, затем создать в среде структуру с пределом текучести и проверить хранением и вибрацией", correct: true, why: "Размер входит в квадрате — это самый сильный рычаг. Оставшуюся седиментацию останавливают структурой среды; а плотный осадок опасен ещё и тем, что не редиспергируется." }
        - { text: "Заменить оксид цинка на вещество меньшей плотности", why: "Фильтр — функциональный компонент; его замена меняет продукт и регуляторный статус." }
