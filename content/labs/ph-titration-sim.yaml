id: ph-titration-sim
engine: ph-titration
order: 49
area: production
role: Технолог варочного участка
minutes: 8
title: "Подгонка pH на партии 500 кг: нейтрализация карбомера без перелёта"
summary: "Дозируйте 10 % раствор NaOH порциями в 500-кг реактор с карбомером: попадите в окно pH 5,7–6,3 и вязкость ≥ 18 000 мПа·с, не допустив перелёта и солевых качелей."
skill: "Аккуратно вести нейтрализацию и корректировку pH на промышленной партии с учётом крутого перегиба буферной кривой и чувствительности карбомера к электролитам."
topics: [ph-buffers, polymer-thickeners]
brief:
  situation: "В реакторе 500 кг гидратированной водной фазы геля (0,5 % Carbomer + 0,2 % Citric Acid). Исходный pH = 3,35, масса жидкая (180 мПа·с)."
  goal: "Дозированием 10 % раствора NaOH вывести партию в допуск pH 5,7–6,3 с вязкостью ≥ 18 000 мПа·с без перелёта в щелочную зону и обратной коррекции кислотой."
  constraints: "Помните: около pH 5,0 буферная кривая резко уходит вверх! Если перелить щёлочь и потом «гасить» её лимонной кислотой, образуется избыток цитрата натрия (соль), который безвозвратно посадит вязкость карбомера."
dataNote: "Учебная буферная модель титрования 500-кг партии 0,5 % карбомера с учётом электролитного штрафа за перелёт."
hints:
  - "Сначала можно внести 1–2 крупные порции (+2,0 кг и +1,0 кг 10 % NaOH), чтобы подойти к pH ~4,6–5,0."
  - "Как только pH перевалил за 4,8, переходите на малые дозы (+0,5 кг и +0,2 кг) — кривая титрования здесь очень крутая!"
transfer:
  title: "Перенос: почему «качели» NaOH ↔ лимонная кислота опасны для геля"
  intro: "Аппаратчик случайно влил лишние 2 кг 10 % NaOH (pH стал 8,4), затем влил 10 % лимонную кислоту и вернул pH ровно к 6,0 — но гель остался в 2 раза жиже стандарта."
  questions:
    - type: mc
      q: "Почему при номинально правильном pH 6,0 вязкость геля на карбомере оказалась вдвое ниже нормы?"
      options:
        - text: "Реакция нейтрализации NaOH + лимонная кислота образовала в партии цитрат натрия — многозарядный электролит, который сжал полимерные цепи карбомера"
          correct: true
          why: "Верно! Кислота и щёлочь не «исчезают» — они превращаются в соль, а карбомер крайне чувствителен к ионной силе."
        - text: "Лимонная кислота необратимо вскипятила воду"
          why: "Теплота нейтрализации в 500 кг мала; вязкость убила именно накопленная соль."
        - text: "pH-метр сломался от щёлочи"
          why: "pH действительно 6,0, причина потери вязкости — рост ионной силы."
