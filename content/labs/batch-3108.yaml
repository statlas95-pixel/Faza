# Занятие-перенос к «Партии 2417»: тот же принцип расследования, другая система и другая причина.
# ВСЕ ДАННЫЕ — УЧЕБНЫЕ.

id: batch-3108
engine: investigation
order: 5
transferOf: batch-2417
title: "Перенос: партия 3108, гель-крем на карбомере"
summary: Снова низкая вязкость, но продукт другой и «очевидный» сценарий прошлого раза здесь не работает. Проверьте, переносится ли способ рассуждения, а не готовый ответ.
area: production
role: Ведущий технолог производства
minutes: 15
skill: Перенос принципа — проверить достоверность измерения, найти то, что изменилось, выбрать различающее наблюдение — на систему с другим механизмом загущения.
topics: [rheology-basics, lamellar-gel-network]
dataNote: Учебный случай. Чувствительность карбомеров к электролитам описана в документации производителя полимера; величины в сценарии придуманы.

brief:
  situation: |
    Через три недели после партии 2417. Гель-крем для лица на [[carbomer|карбомере]] (партия **3108**, 500 кг):
    вязкость **26 400 мПа·с** при норме 38 000–52 000. Мастер смены уже уверен: «Опять ОКК померил тёплую пробу».
  goal: Определить причину и решение по партии. Ресурса мало — выберите наблюдения, которые различают гипотезы.
  constraints: |
    У вас **3 единицы ресурса**. Отмечайте значимые записи в документах.

budget: 3

documents:
  - id: qc
    title: Протокол испытаний ОКК
    short: Протокол ОКК
    origin: Составляет лаборант ОКК; утверждает начальник ОКК.
    header:
      - [Форма, "Ф-ОКК-11, ред. 4"]
      - [Протокол №, "~3108-1"]
      - [Продукт / партия, "ГП-0502 гель-крем / ~3108"]
      - [Проба отобрана, "~02.12.2026, 11:20"]
    sections:
      - title: Результаты
        columns: [Показатель, Норма, Результат, Условия / примечание]
        rows:
          - { cells: [Внешний вид, "Однородный полупрозрачный гель-крем", "~соотв.", ""] }
          - { id: qc-ph, cells: ["pH", "5,5–6,5", "~5,9", ""] }
          - { id: qc-visc, cells: ["Вязкость, мПа·с", "38 000–52 000", "~26 400", "~RV, шп. 6, 10 об/мин, 60 с"] }
          - { id: qc-temp, cells: [Температура пробы при измерении, "25,0 ± 0,5 °C", "~25,1 °C", "~термостат 2 ч 10 мин"] }
          - { id: qc-age, cells: [Время измерения, "24 ± 2 ч после выгрузки", "~03.12, 11:40", "~по М-07; экспресс не выдавался"] }
    footer:
      - [Заключение, "~НЕ СООТВЕТСТВУЕТ по показателю «вязкость»"]
      - [Лаборант, "~Быстрова"]

  - id: br
    title: Протокол изготовления партии (выписка)
    short: Протокол варки
    origin: Заполняет аппаратчик по ходу варки.
    header:
      - [Продукт, "Гель-крем для лица, ГП-0502"]
      - [Партия, "~3108"]
      - [Отклонения от ТИ, "~нет"]
    sections:
      - title: Ключевые операции
        columns: [Операция, По ТИ, Факт]
        rows:
          - { id: br-carb, cells: ["Карбомер, загрузка", "2,00 кг (0,40 %)", "~2,00 кг, две подписи"] }
          - { id: br-hydr, cells: ["Набухание карбомера", "не менее 45 мин, без комков", "~60 мин, комков нет"] }
          - { id: br-naoh, cells: ["Нейтрализация, NaOH 10 %", "до pH 5,8–6,2; ориентир. 7,8 кг", "~7,9 кг; pH 5,9"] }
          - { id: br-extract, cells: ["Экстракт растительный водно-глицериновый, 3,0 %", "15,0 кг, ввод после нейтрализации", "~15,0 кг, партия EX-0774 (новая)"] }
          - { id: br-after, cells: ["Вязкость массы в аппарате (визуально)", "—", "~после ввода экстракта заметно жиже"] }

  - id: coa
    title: Паспорта поставщика — экстракт растительный
    short: Паспорта экстракта
    origin: Выдаёт поставщик на каждую партию сырья.
    header:
      - [Сырьё, "Экстракт водно-глицериновый (учебный)"]
      - [Внутренняя спецификация, "ВС-118 ред. 1"]
    sections:
      - title: Сравнение партий
        columns: [Показатель, Норма ВС-118, Партия EX-0651, Партия EX-0774]
        rows:
          - { cells: ["Сухой остаток, %", "4,0–8,0", "5,1", "7,6"] }
          - { cells: ["pH", "4,5–6,5", "5,4", "5,2"] }
          - { id: coa-ash, cells: ["Зольность, % (справочно)", "не нормируется", "0,6", "2,3"] }
          - { cells: [Заключение входного контроля, "—", "соответствует", "соответствует"] }

requests:
  - id: r-cond
    title: Удельная электропроводность партии 3108 и архивного образца партии 3096
    who: ОКК
    cost: 1
    lead: 30 минут
    result: |
      Кондуктометр, 25 °C, разведение 1:10 деионизованной водой.

      - Партия 3096 (экстракт EX-0651): **118 мкСм/см**
      - Партия 3108 (экстракт EX-0774): **264 мкСм/см**

      В партии 3108 содержание электролитов существенно выше.
    value: high
    valueText: Быстрое прямое наблюдение, которое различает «электролиты» и все остальные гипотезы.
  - id: r-lab
    title: Лабораторный гель 500 г с экстрактом старой и новой партии
    who: Лаборатория R&D
    cost: 2
    lead: Вязкость — через 24 ч
    result: |
      Два геля по рецептуре, отличие — только партия экстракта. Вязкость через 24 ч по М-07:

      - с EX-0651: **44 800 мПа·с**
      - с EX-0774: **27 100 мПа·с**
    value: high
    valueText: Контролируемый опыт с одним изменённым фактором — прямое доказательство причины.
  - id: r-ph
    title: Проба донейтрализации — поднять pH образца партии до 6,3
    who: Лаборатория R&D
    cost: 1
    lead: 2 часа
    result: |
      К 200 г партии 3108 добавлен NaOH 10 % до pH 6,3. Вязкость (экспресс, 25 °C): 27 900 мПа·с против 26 400 исходных.

      Донейтрализация вязкость практически не восстанавливает.
    value: mid
    valueText: Закрывает гипотезу о недостаточной нейтрализации — но она и так слаба, pH 5,9 находится в рабочем интервале.
  - id: r-remeasure
    title: Повторное измерение вязкости по методике
    who: ОКК
    cost: 1
    lead: 3 часа
    result: |
      Повторное измерение той же пробы, 25,0 °C: **26 100 мПа·с**. Результат подтверждён.
    value: low
    valueText: Первое измерение выполнено по методике — температура и возраст пробы записаны в протоколе. Повтор ничего не добавляет.

hypotheses:
  - id: meas
    group: measurement
    title: Измерение выполнено вне условий методики, как в прошлый раз
    statuses:
      main:
        verdict: wrong
        text: В протоколе ОКК записаны температура пробы 25,1 °C и время измерения через 24 часа — условия методики выполнены. Прошлый случай нельзя переносить как готовый ответ; переносится только сама проверка.
      contrib:
        verdict: wrong
        text: Условия измерения в протоколе соответствуют методике — вклада артефакта нет.
      excluded:
        verdict: ok
        needs: [qc-temp, qc-age, r-remeasure]
        text: Верно. Проверка заняла минуту — условия записаны в протоколе и соответствуют методике. Результату можно доверять, дефект реальный.
        noBasis: Вывод верный, но основание не отмечено — строки «температура пробы» и «время измерения» в протоколе ОКК.
      untested:
        verdict: wrong
        text: Для проверки достаточно протокола ОКК — в нём записаны температура и возраст пробы.
  - id: salt
    group: cause
    title: Новая партия экстракта внесла больше электролитов, и карбомерный гель потерял вязкость
    statuses:
      main:
        verdict: ok
        needs: [coa-ash, br-extract, br-after, r-cond, r-lab]
        text: Да. Изменилась партия экстракта, её зольность выше почти вчетверо (0,6 → 2,3 %), а аппаратчик записал, что масса стала жиже именно после ввода экстракта. Карбомерные гели чувствительны к электролитам — это указано в документации производителя полимера.
        noBasis: Гипотеза верна, но в ваших отметках нет её оснований — партия экстракта и наблюдение аппаратчика в протоколе варки, зольность в паспортах.
      contrib:
        verdict: weak
        text: Вы заметили изменение, но оценили его осторожнее, чем позволяют данные — других изменений в партии нет, а наблюдение аппаратчика привязывает падение вязкости к моменту ввода экстракта.
      excluded:
        verdict: wrong
        text: Паспорта показывают рост зольности экстракта с 0,6 до 2,3 %, а протокол варки — разжижение после его ввода. Исключить эту гипотезу нельзя.
      untested:
        verdict: wrong
        text: Основания есть в исходных документах — паспорта экстракта и запись аппаратчика.
  - id: neutral
    group: cause
    title: Недостаточная нейтрализация карбомера
    statuses:
      main:
        verdict: wrong
        text: pH 5,9 лежит внутри рабочего интервала 5,8–6,2, расход щёлочи 7,9 кг при ориентире 7,8. Признаков недонейтрализации нет.
      contrib:
        verdict: weak
        text: pH и расход щёлочи соответствуют инструкции; проба донейтрализации вязкость не восстанавливает.
      excluded:
        verdict: ok
        needs: [br-naoh, qc-ph, r-ph]
        text: Исключена корректно — pH и расход нейтрализатора в норме.
        noBasis: Вывод верный, но основание не отмечено — строка нейтрализации в протоколе варки или pH в протоколе ОКК.
      untested:
        verdict: weak
        text: Данные были в исходных документах — pH 5,9 и расход NaOH 7,9 кг.
  - id: carb
    group: cause
    title: Недовложение или неполное набухание карбомера
    statuses:
      main:
        verdict: wrong
        text: Загрузка 2,00 кг с двумя подписями, набухание 60 минут без комков — по инструкции.
      contrib:
        verdict: wrong
        text: Загрузка и набухание карбомера соответствуют инструкции.
      excluded:
        verdict: ok
        needs: [br-carb, br-hydr]
        text: Исключена корректно.
        noBasis: Вывод верный, но основание не отмечено — строки загрузки и набухания карбомера.
      untested:
        verdict: weak
        text: Данные были в протоколе варки.

dispositions:
  - id: release
    title: Выпустить — измерение наверняка снова некорректное
    verdict: wrong
    text: Измерение выполнено по методике. Перенос вывода прошлого случая без проверки — ровно та ошибка, от которой предостерегает это занятие.
  - id: hold
    title: Карантин, отклонение; остановить использование экстракта EX-0774 до выяснения; решение о партии после лабораторной проверки
    verdict: ok
    text: Соразмерно. Важная часть решения — блокировка партии сырья, иначе следующая варка повторит дефект.
  - id: rework-naoh
    title: Переработка — донейтрализовать партию до pH 6,3
    verdict: wrong
    text: Причина не в нейтрализации; добавление щёлочи увеличит содержание электролитов и сместит pH без пользы для вязкости.
  - id: rework-heat
    title: Переработка — нагреть и охладить по режиму, как партию 2417
    verdict: wrong
    text: Карбомерный гель загущается не кристаллизующейся сетью, и режим охлаждения на его вязкость так не влияет. Решение прошлого случая здесь неприменимо.
  - id: scrap
    title: Забраковать и утилизировать
    verdict: weak
    text: Возможно как итог, но преждевременно — сначала стоит оценить в лаборатории, корректируется ли вязкость допустимым и согласованным способом.

capaMax: 2
capa:
  - id: incoming
    title: Ввести во входной контроль экстракта нормируемый показатель — электропроводность или зольность
    verdict: ok
    text: Прямо закрывает причину — показатель, от которого зависит продукт, сейчас «справочный».
  - id: robust
    title: Поручить R&D оценить запас устойчивости рецептуры к электролитам
    verdict: ok
    text: Рецептура, в которой допустимая вариация сырья выводит продукт из нормы, недостаточно устойчива.
  - id: qc-rule
    title: Повторно обучить ОКК условиям измерения вязкости
    verdict: wrong
    text: В этом случае ОКК сработал безупречно — мера перенесена из прошлого случая без оснований.
  - id: more-carb
    title: Увеличить дозировку карбомера в рецептуре
    verdict: weak
    text: Компенсирует следствие, а не причину — при партии экстракта с низкой зольностью продукт окажется слишком густым.

rubric:
  - { id: measurement, title: Достоверность измерения, text: "Проверено ли, что результату можно доверять." }
  - { id: cause, title: Гипотезы и их основания, text: Соответствует ли статус каждой гипотезы данным. }
  - { id: disposition, title: Решение по партии, text: Соразмерно ли решение установленному. }
  - { id: capa, title: Предупреждение повторения, text: Направлены ли меры на причину. }

debrief:
  story: |
    **Что произошло.** Измерение выполнено по методике — дефект реальный. Единственное изменение — новая партия экстракта
    с повышенной зольностью; электролиты снизили вязкость карбомерного геля. Аппаратчик заметил разжижение сразу после ввода экстракта
    и записал это, но не счёл отклонением.
  principle: |
    Переносится **порядок рассуждения**, а не ответ: проверка измерения → что изменилось → различающее наблюдение → соразмерное решение.
    В прошлый раз проверка измерения показала артефакт, сейчас — подтвердила результат. Обе проверки были обязательны
    [@lubrizol-neutral].
