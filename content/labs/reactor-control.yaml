id: reactor-control
engine: reactor
order: 45
area: production
role: Оператор-технолог реактора
minutes: 10
title: "Пульт вакуумного реактора: сварить 500 кг крема без брака"
summary: Управляйте рубашкой нагрева/охлаждения, якорной мешалкой, ротор-статором, вакуумом и загрузкой фаз B и C на живой мнемосхеме реактора.
skill: Провести полный цикл промышленной варки эмульсии O/W в вакуумном реакторе без завоздушивания, термической деградации активов и разрушения сетки.
topics: [mixing-basics, deaeration, emulsification]
brief:
  situation: "В цехе запущена варка 500 кг базового крема O/W. Водная фаза A (370 кг, 24 °C) уже в реакторе; масляная фаза B (95 кг) расплавлена в плавильнике при 75 °C; фаза C (35 кг: пантенол, консервант, отдушка) готова к загрузке."
  goal: "Довести партию до выгрузки при ≤ 35 °C с каплями ≤ 4 мкм, воздухом ≤ 3 %, сохранностью активов ≥ 95 % и целой ламеллярной сеткой."
  constraints: "Не включайте ротор-статор без вакуума (−0,45 бар при > 62 °C, чтобы не вскипятить воду; −0,65 бар на охлаждении) и при низкой температуре (< 48 °C); не вводите фазу B в холодную воду и фазу C в горячую массу (> 40 °C); при охлаждении держите якорную мешалку включённой."
dataNote: Учебная физическая модель теплообмена, диспергирования и деаэрации для 500-кг вакуумного гомогенизатора (скорость времени ускорена).
hints:
  - Сначала включите нагрев рубашки и якорную мешалку. Дождитесь 72–76 °C, затем загрузите фазу B.
  - Перед включением гомогенизатора (ротор-статора) обязательно включите вакуумный насос (автоматика держит −0,45 бар при горячем эмульгировании без вскипания и −0,65 бар при охлаждении < 62 °C).
  - После того как капли станут ≤ 3,5 мкм, выключите гомогенизатор, переключите рубашку на охлаждение (якорь оставьте включённым!) и дождитесь ≤ 38 °C перед загрузкой фазы C.
transfer:
  title: Перенос принципа на смену состава
  intro: Партию успешно сварили. На следующей смене технолог предлагает оставить гомогенизатор включённым на 10 минут при 32 °C, чтобы «сделать крем ещё более гладким после ввода отдушки».
  questions:
    - type: mc
      q: Что произойдёт с кремом O/W на цетилстеариловом спирте, если включить ротор-статор на 3500 об/мин при 32 °C?
      options:
        - text: Ламеллярная гелевая сетка необратимо разрушится — вязкость крема резко просядет.
          correct: true
          why: Верно. Ниже точки кристаллизации жирных спиртов (~45–50 °C) высокий сдвиг ломает уже сформированный кристаллический каркас.
        - text: Капли станут в 5 раз мельче, а вязкость вырастет вдвое.
          why: При 32 °C масляная фаза уже частично закристаллизована — вместо дробления капель разрушается структура внешней сетки.
        - text: Ничего не изменится, если включён вакуум.
          why: Вакуум защищает от завоздушивания, но не от механического разрушения структуры ротор-статором.
