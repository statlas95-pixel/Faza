id: spf-formulator-lab
engine: spf-lab
order: 51
area: rnd
role: Ведущий R&D-разработчик солнцезащиты
minutes: 12
title: "Конструктор фотостабильного SPF 50+: спектр 290–400 нм, UVA-кружок и растворимость"
summary: "Сбалансируйте комбинацию органических УФ-фильтров и полярных эмолентов: достигните SPF ≥ 50, отношения UVA-PF ≥ 1/3 SPF (λc ≥ 370 нм), фотостабильности и отсутствия кристаллов при +4 °C."
skill: "Проектировать фотостабильную матрицу УФ-фильтров с расчётом широкополосного покрытия UVB/UVA, растворимости кристаллических фильтров и лимитов Прил. VI EU 1223/2009 / Прил. 5 ТР ТС 009/2011."
topics: [sunscreens-spf, inverse-emulsions-wo]
brief:
  situation: "Лабораторный прототип дневного флюида «SPF 50+» провалил предварительный in-vitro скрининг: авобензон деградировал под УФ-облучением, в холодильнике (+4 °C) выпали иглы твёрдых фильтров, а реальный SPF составил всего 24 [@trts009; @eu1223]."
  goal: "Настройте дозировки УФ-фильтров и полярных эфирных эмолентов так, чтобы одновременно выполнить все 5 критериев выпуска: 1) расчётный SPF ≥ 50; 2) UVA-PF ≥ 1/3 SPF и λc ≥ 370 нм; 3) запас растворимости кристаллов при +4 °C; 4) фотостабильность под УФ; 5) соблюдение лимитов регламентов (и бюджета суммы фильтров ≤ 22 %)."
  constraints: "Потолки ввода: DHHB (Uvinul A Plus) ≤ 10 %, Bemotrizinol (Tinosorb S) ≤ 10 %, Ethylhexyl Triazone (Uvinul T 150) ≤ 5 %, Avobenzone ≤ 5 %, Ensulizole ≤ 8 %, сумма всех УФ-фильтров ≤ 22 %."
dataNote: "Спектральная модель поглощения A(λ) в диапазоне 290–400 нм и расчёт потребности в полярных эфирах калиброваны по справочным максимумам поглощения УФ-фильтров и принципам ISO 24443 (только для учебных целей — реальный SPF подтверждается клинически по ISO 24444)."
hints:
  - "Связка «DHHB 4–5 % (UVA1) + Bemotrizinol 3,5–4,5 % (UVB+UVA + фотостабилизатор) + Ethylhexyl Triazone 3–3,5 % (мощный UVB) + Ensulizole 2 %» даёт высокий и ровный профиль без капризного авобензона."
  - "Твёрдые кристаллические фильтры (особенно Ethylhexyl Triazone) требуют достаточной доли полярных сложных эфиров (C12-15 Alkyl Benzoate / Dicaprylyl Carbonate, обычно 16–20 %), иначе при +4 °C выпадают кристаллы и плёнка рвётся."
transfer:
  title: "Перенос: почему нарушение реологии плёнки обрушивает реальный SPF вдвое?"
  intro: "Два крема содержат абсолютно одинаковый набор и процент УФ-фильтров, но на коже (ISO 24444) первый показал SPF 55, а второй — всего SPF 24."
  questions:
    - type: mc
      q: "Какой физико-коллоидный фактор объясняет двукратную разницу SPF при идентичной концентрации фильтров?"
      options:
        - text: "Равномерность оптической плёнки (2 мг/см²): при микрокристаллизации фильтров или быстрой коалесценции эмульсии на микрорельефе кожи образуются «проплешины», пропускающие УФ-лучи по экспоненте Бугера–Ламберта"
          correct: true
          why: "Верно! Пропускание T = 10^(−A) нелинейно: тонкие участки плёнки пропускают непропорционально большую дозу эритемного УФ-излучения."
        - text: "Во втором креме вода поглотила больше УФ-лучей"
          why: "Чистая вода прозрачна в диапазоне 290–400 нм."
        - text: "УФ-фильтры работают только в присутствии отдушки"
          why: "Отдушка не участвует в поглощении УФ и часто повышает риск фотосенсибилизации."
