id: wpu-biofilm-hunt
engine: wpu-audit
order: 52
area: production
role: Инженер по качеству GMP / микробиолог
minutes: 10
title: "Охота за биоплёнкой в петле воды очищенной (WPU): расследование B. cepacia"
summary: "В двух сериях детского геля обнаружена Burkholderia cepacia, хотя онлайн-кондуктометр петли воды показывает 0,8 мкСм/см. Проинспектируйте 4 точки кольца WPU, найдите «мёртвый тупик» и назначьте CAPA."
skill: "Локализовать очаг биоплёнки в распределительной петле воды очищенной по гидродинамическим и температурным данным и назначать инженерные меры по ISO 22716 / ISPE."
topics: [water-sanitation, cip-verification]
incidentSummary: "Отдел контроля качества забраковал две подряд серии нежного детского геля (pH 5,8): выделены грамотрицательные палочки комплекса Burkholderia cepacia (> 200 КОЕ/г). Главный энергетик утверждает, что вода ни при чём — «датчик проводимости на щите держит 0,8 мкСм/см круглые сутки» [@iso22716]."
points:
  - id: pt-t1
    code: T1
    name: "Выход установки RO + EDI (перед ёмкостью)"
    locationDesc: "Сразу после модуля электродеионизации на подаче в танк хранения."
    velocityMs: 1.8
    deadLegRatioLd: 1.0
    sanitizationTempC: 84
    conductivityUsCm: 0.6
    tocPpb: 45
    cfuPerMl: "< 1 КОЕ / 100 мл"
    gramStain: "Роста нет"
  - id: pt-t2
    code: T2
    name: "Подача из ёмкости хранения после УФ-лампы 254 нм"
    locationDesc: "Напорная линия циркуляционного насоса в начале распределительного кольца."
    velocityMs: 1.7
    deadLegRatioLd: 1.2
    sanitizationTempC: 83
    conductivityUsCm: 0.7
    tocPpb: 52
    cfuPerMl: "< 1 КОЕ / 100 мл"
    gramStain: "Роста нет"
  - id: pt-t3
    code: T3
    name: "Возврат циркуляционной петли в ёмкость (после цеха)"
    locationDesc: "Общая обратка кольца DN40 перед возвратом в ёмкость."
    velocityMs: 1.5
    deadLegRatioLd: 1.4
    sanitizationTempC: 81
    conductivityUsCm: 0.8
    tocPpb: 78
    cfuPerMl: "6 КОЕ / мл (единичные срывы)"
    gramStain: "Единичные грамотрицательные палочки"
  - id: pt-t4
    code: T4
    name: "Опуск к Реактору № 2 (с резервным заглушённым тройником 0,9 м)"
    locationDesc: "Вертикальный отвод DN25 к варочному котлу № 2; при монтаже оставлен резервный боковой отвод длиной 900 мм с шаровым краном на конце."
    velocityMs: 0.05
    deadLegRatioLd: 36.0
    sanitizationTempC: 58
    conductivityUsCm: 0.8
    tocPpb: 140
    cfuPerMl: "> 300 КОЕ / мл (сплошной газон)"
    gramStain: "Грамотрицательные палочки Burkholderia cepacia complex"
hotspotPointId: pt-t4
conductivityQuestions:
  - id: cond-blind
    text: "Клетки бактерий и нейтральный полисахаридный матрикс (EPS) биоплёнки не являются свободными электролитами — кондуктометр видит только неорганические ионы, но полностью «слеп» к микробному росту в тупике"
    correct: true
    why: "Верно! Даже 10³–10⁴ КОЕ/мл грамотрицательных палочек практически не меняют удельную электропроводность 0,8 мкСм/см."
  - id: cond-broken
    text: "Датчик проводимости просто забыли включить в розетку"
    why: "Датчик исправен и показывает реальную деионизацию воды (0,6–0,8 мкСм/см); проблема в физической природе измерения."
  - id: cond-uv
    text: "УФ-лампа в точке T2 превращает бактерии в дистиллированную воду по всей длине труб"
    why: "УФ-лампа обеззараживает только проходящий через неё поток и не действует на зрелую биоплёнку, сидящую ниже по течению в тупиковом отводе T4."
capaOptions:
  - id: cut-deadleg
    text: "Срезать заглушённый 900-мм тройник на опуске T4 (соблюсти правило тупиков L/D ≤ 1,5–3) и заменить шаровой кран на мембранный санитарный клапан zero-dead-leg"
    valid: true
    why: "Устраняет физическую застойную зону (L/D = 36) и полости шарового крана, где удерживается биоплёнка."
  - id: hot-loop-flush
    text: "Провести химическую щелочно-пероксидную мойку для удаления EPS-матрикса и настроить термическую санитацию ≥ 80 °C с обязательным протоком через открытые точки разбора T4"
    valid: true
    why: "Один нагрев без сноса застойной зоны оставлял конец тупика при 58 °C; проток при ≥ 80 °C прогревает сам кран отбора."
  - id: r2a-monitoring
    text: "Ввести регулярный микробиологический мониторинг точек разбора мембранной фильтрацией на голодном агаре R2A (5–7 суток) до допуска воды в варку"
    valid: true
    why: "Водные олиготрофы (B. cepacia, Ralstonia) адаптированы к бедной среде и лучше выявляются на R2A при 20–25 °C / 30–35 °C."
  - id: trust-cond-only
    text: "Ограничиться ужесточением порога электропроводности с 1,3 до 0,9 мкСм/см без переварки трубопровода"
    valid: false
    why: "При 0,8 мкСм/см биоплёнка в T4 продолжит сбрасывать сгустки B. cepacia в каждую вторую варку!"
  - id: add-chlorine-batch
    text: "Наливать гипохлорит натрия прямо в готовый детский гель перед фасовкой"
    valid: false
    why: "Грубейшее нарушение GMP и безопасности продукции — устранять нужно источник контаминации в системе водоподготовки."
brief:
  situation: "На заводе ЧП: две серии детского геля на Реакторе № 2 контаминированы комплексом Burkholderia cepacia (опасный водный патоген, устойчивый ко многим мягким консервантам). Энергослужба показывает идеальный тренд электропроводности 0,8 мкСм/см."
  goal: "Проинспектируйте все 4 точки циркуляционного кольца WPU (T1–T4), найдите точный источник срыва биоплёнки, объясните парадокс «чистого кондуктометра» и утвердите пакет инженерных CAPA."
  constraints: "В выбранный пакет CAPA должны войти ВСЕ валидные инженерно-микробиологические меры и ни одного ложного «костыля»."
dataNote: "Синтетический протокол расследования петли воды очищенной, основанный на требованиях ISO 22716 (GMP) и инженерных правилах проектирования чистых сред ISPE (критерий dead leg L/D ≤ 1,5–3 и скорость ≥ 1,2–1,5 м/с)."
hints:
  - "Сравните отношение длины отвода к диаметру (L/D) и реальную температуру при термической санитации в точках T1–T4."
  - "Обратите внимание на тип запорной арматуры: обычные шаровые краны имеют недренируемую полость вокруг шара — в косметическом GMP применяют мембранные клапаны."
transfer:
  title: "Перенос: почему отбор пробы воды «после 5-минутного слива и обжига спиртом» иногда маскирует проблему варки?"
  intro: "Лаборант перед отбором пробы на микробиологию спускал горячую воду 10 минут и тщательно прожёг штуцер, получив 0 КОЕ/мл, а аппаратчик утром открыл кран и сразу набрал первые 50 л в реактор."
  questions:
    - type: mc
      q: "В чём методическая ошибка такого контроля точки потребления воды?"
      options:
        - text: "Проба должна отражать реальную процедуру набора воды в производство ( плюс отдельный контроль состояния самой системы) — иначе длительный предслив смывает ночной застой в канализацию, а в реактор уходит первая порция с высокой обсеменённостью"
          correct: true
          why: "Верно! По GMP регламент предслива в СОП оператора цеха и в СОП отбора пробы ОКК должны строго совпадать."
        - text: "Сливать воду перед варкой вообще никогда нельзя"
          why: "Регламентированный предслив линии как раз полезен, но он должен быть закреплён и выполняться оператором перед КАЖДЫМ набором в реактор."
        - text: "Бактерии попадают в воду только из спиртовки"
          why: "Источник — застой в отводе/клапане при несовпадении процедуры отбора и реальной варки."
