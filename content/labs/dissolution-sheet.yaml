# Синтетические учебные данные.
engine: worksheet
area: production
minutes: 15
dataNote: Все коэффициенты, измерения и данные партии синтетические, составлены для учебного
  расчёта. Это не режим обработки реального сырья и не инструкция эксплуатации аппарата.
id: dissolution-sheet
order: 17
title: "Растворение: почему последние частицы не исчезают"
summary: По кривой концентрации различите медленный перенос и предел растворимости, оцените время и
  выберите проверку причины остатка.
role: технолог лаборатории
skill: отделить скорость растворения от насыщения и проверить ограничения модели
topics:
  - dissolution
  - solutions-basics
  - mixing-basics
brief:
  situation: В учебном аппарате твёрдое вещество X растворяется в водной фазе. Температура
    поддерживается постоянной; мастер хочет получить 110 кг/м³ и предлагает просто мешать дольше.
  goal: Проверить достижимость цели, рассчитать время до 90 кг/м³ и выбрать обоснованное действие.
  constraints: Для расчёта используйте модель dc/dt = k(c* − c). Твёрдое вещество в избытке; объём и
    эффективный k постоянны в рассматриваемом диапазоне.
sheet:
  title: Учебная модель растворения X
  origin: Синтетические данные, иллюстрирующие равновесие и массообмен.
  rows:
    - - Температура
      - 25 °C, постоянна
    - - Объём жидкой фазы
      - 1,0 м³, постоянен
    - - Концентрация насыщения c*
      - 100 кг/м³
    - - Начальная концентрация c₀
      - 0 кг/м³
    - - Эффективный k
      - 0,10 мин⁻¹
    - - Модель концентрации
      - c = c* − (c* − c₀)·exp(−kt)
    - - Модель времени
      - t = −ln((c* − c)/(c* − c₀)) / k
steps:
  - title: Равновесие и начальная скорость
    text: Перемешивание может изменить k. В этом примере температура и состав растворителя не меняются.
    questions:
      - type: mc
        q: Что характеризует c* = 100 кг/м³?
        options:
          - text: Массу вещества, которая растворяется за минуту
            why: Этот вывод не следует из заданных условий.
          - text: Равновесную концентрацию насыщения в заданных условиях
            correct: true
            why: Это соответствует модели и её явно указанным ограничениям.
          - text: Время полного исчезновения частиц
            why: Здесь смешаны разные физические величины или допущения.
      - type: num
        q: Какова начальная скорость dc/dt, кг/(м³·мин)?
        answer: 10
        tol: 0.03
        unit: кг/(м³·мин)
        explain: 0,10·(100−0)=10. Это скорость изменения концентрации, не коэффициент переноса.
        hint: Подставьте начальную концентрацию в k(c* − c).
  - title: Почему конец процесса медленнее
    text: Целевой уровень для расчёта — 90 кг/м³. Натуральный логарифм обозначен ln.
    questions:
      - type: num
        q: Через сколько минут модель даёт 90 кг/м³?
        answer: 23.03
        tol: 0.03
        unit: мин
        explain: −ln(0,1)/0,10 = 23,03 мин.
        hint: Напор в конце составляет 10 % начального.
      - type: num
        q: Какова скорость dc/dt при 90 кг/м³?
        answer: 1
        tol: 0.03
        unit: кг/(м³·мин)
        explain: 0,10·(100−90)=1, в десять раз меньше начальной скорости.
      - type: mc
        q: Почему нельзя разделить 90 на начальную скорость и считать 9 минут точным временем?
        options:
          - text: Натуральный логарифм нельзя использовать в инженерных расчётах
            why: Этот вывод не следует из заданных условий.
          - text: "Начальная скорость не сохраняется: концентрационный напор уменьшается"
            correct: true
            why: Это соответствует модели и её явно указанным ограничениям.
          - text: Перемешивание автоматически уменьшает молярную массу
            why: Здесь смешаны разные физические величины или допущения.
  - title: Проверка решения
    text: Сравниваем способы при тех же температуре и составе. Увеличение k до 0,20 мин⁻¹ — заданное
      учебное допущение, а не обещанный результат удвоения оборотов.
    questions:
      - type: mc
        q: Можно ли получить 110 кг/м³ простым увеличением времени в этой модели?
        options:
          - text: "Да: любой остаток исчезнет при достаточном времени"
            why: Этот вывод не следует из заданных условий.
          - text: "Нет: цель выше c*, нужно пересмотреть условия и подтвердить их применимость"
            correct: true
            why: Это соответствует модели и её явно указанным ограничениям.
          - text: "Да: обороты заменяют сведения о растворимости"
            why: Здесь смешаны разные физические величины или допущения.
      - type: num
        q: При k = 0,20 мин⁻¹ сколько времени займёт достижение 90 кг/м³?
        answer: 11.51
        tol: 0.03
        unit: мин
        explain: −ln(0,1)/0,20 = 11,51 мин.
      - type: mc
        q: Какая проверка помогает отличить плохое смачивание от предела растворимости?
        options:
          - text: Оценить только количество минут работы мешалки
            why: Этот вывод не следует из заданных условий.
          - text: Определить характер остатка и концентрацию в жидкой фазе при контролируемой температуре
            correct: true
            why: Это соответствует модели и её явно указанным ограничениям.
          - text: Измерить только массу этикетки на таре
            why: Здесь смешаны разные физические величины или допущения.
transfer:
  title: Перенос на менее интенсивный режим
  intro: В другой учебной серии k = 0,05 мин⁻¹; c*, c₀ и цель прежние. За пределами модели перенос на
    реальное оборудование требует проверки.
  questions:
    - type: num
      q: Каково время достижения 90 кг/м³?
      answer: 46.05
      tol: 0.03
      unit: мин
      explain: −ln(0,1)/0,05 = 46,05 мин.
    - type: mc
      q: Доказывает ли оставшийся комок набухающего полимера, что достигнута растворимость?
      options:
        - text: "Да: любой видимый комок — только насыщение"
          why: Этот вывод не следует из заданных условий.
        - text: "Нет: нужно различить смачивание, гидратацию и равновесие"
          correct: true
          why: Это соответствует модели и её явно указанным ограничениям.
        - text: "Да: модель кристалла точно описывает любой полимер"
          why: Здесь смешаны разные физические величины или допущения.
