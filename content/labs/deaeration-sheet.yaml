# Синтетические учебные данные.
engine: worksheet
area: production
minutes: 15
dataNote: Все коэффициенты, измерения и данные партии синтетические, составлены для учебного
  расчёта. Это не режим обработки реального сырья и не инструкция эксплуатации аппарата.
id: deaeration-sheet
order: 18
title: "Вакуум: удалить воздух и не потерять воду"
summary: Пересчитайте давление, расширение пузырька и газосодержание; оцените риск кипения и границы
  равновесного расчёта.
role: технолог производства
skill: различить давление, равновесие и кинетику при оценке деаэрации
topics:
  - deaeration
  - heat-transfer
  - disperse-systems
brief:
  situation: Водная учебная модель при 40 °C содержит вовлечённые пузырьки. Предлагают усилить
    разрежение до 5 кПа абсолютного давления, чтобы «убрать весь газ сразу».
  goal: Проверить расчёт давления и пузырьков, оценить риск потери воды и назвать ограничения вывода.
  constraints: Используйте только приведённые идеализированные модели. Они не задают безопасные
    параметры реальной рецептуры или аппарата.
sheet:
  title: Выписка к оценке деаэрации
  origin: Синтетические данные; давление пара воды при 40 °C округлено для учебного примера.
  rows:
    - - Атмосферное давление
      - 100 кПа
    - - Показание относительного манометра
      - −80 кПа
    - - Температура
      - 40 °C
    - - Давление насыщенного водяного пара
      - 7,4 кПа
    - - Исходный продукт
      - 1,00 л, из них сухой газ 0,05 л
    - - Плотность жидкой фазы
      - 1,020 г/мл
    - - Кажущаяся плотность пробы с пузырьками
      - 0,969 г/мл
    - - Модели
      - Pabs = Patm + Pgauge; PV = const для сухого пузырька; φ = 1 − ρapp/ρliquid
steps:
  - title: Давление и объём пузырьков
    text: "Для первых трёх вопросов используем отдельную модель сухого идеального газа: количество газа
      и температура постоянны, испарение и давление Лапласа не учитываются."
    questions:
      - type: num
        q: Каково абсолютное давление при показании −80 кПа?
        answer: 20
        tol: 0.03
        unit: кПа
        explain: 100 + (−80) = 20 кПа.
      - type: num
        q: Во сколько раз увеличится объём отдельного сухого пузырька при снижении давления со 100 до 20
          кПа?
        answer: 5
        tol: 0.03
        unit: раз
        explain: V₂/V₁ = P₁/P₂ = 100/20 = 5.
      - type: num
        q: До какого общего объёма расширится исходный 1,00 л продукта с 0,05 л газа в этой модели?
        answer: 1.2
        tol: 0.03
        unit: л
        explain: 0,95 л жидкости + 0,05·5 л газа = 1,20 л.
  - title: Равновесие и испарение
    text: "Теперь используем другую модель: газовая фаза насыщена водяным паром. При неизменном составе
      неконденсирующейся смеси c* пропорциональна её парциальному давлению Pabs − 7,4 кПа."
    questions:
      - type: num
        q: При снижении полного давления со 100 до 20 кПа новая равновесная концентрация газа составляет
          сколько процентов прежней?
        answer: 13.61
        tol: 0.03
        unit: "%"
        explain: 100·(20−7,4)/(100−7,4) = 13,61 %. Это равновесие, не концентрация сразу после изменения
          давления.
        hint: Вычтите давление водяного пара из каждого полного давления.
      - type: mc
        q: Что нужно учесть при предложении снизить давление водной модели до 5 кПа при 40 °C?
        options:
          - text: Кипения точно не будет, пока температура ниже 100 °C
            why: Этот вывод не следует из заданных условий.
          - text: Возможны кипение, вспенивание и потеря воды
            correct: true
            why: Это соответствует модели и её явно указанным ограничениям.
          - text: Любое снижение давления сохраняет состав неизменным
            why: Здесь смешаны разные физические величины или допущения.
  - title: Что подтверждает измерение
    text: Плотности сравниваются при одинаковой температуре; массой газа пренебрегаем. Различия состава
      и потери летучих компонентов в этой оценке не учитываются.
    questions:
      - type: num
        q: Какова объёмная доля пузырьков по измеренным плотностям, в процентах?
        answer: 5
        tol: 0.03
        unit: "%"
        explain: 100·(1−0,969/1,020) = 5 %.
      - type: mc
        q: Можно ли по отсутствию видимых пузырьков подтвердить удаление всего растворённого газа?
        options:
          - text: "Да: визуальная прозрачность всегда означает нулевое содержание газа"
            why: Этот вывод не следует из заданных условий.
          - text: "Нет: растворённый газ не измеряется простым осмотром; нужны подходящий метод и проверка
              условий"
            correct: true
            why: Это соответствует модели и её явно указанным ограничениям.
          - text: "Да: после возврата давления газ не может выделяться"
            why: Здесь смешаны разные физические величины или допущения.
transfer:
  title: Другой перепад давления
  intro: "Снова отдельная модель сухого идеального пузырька: температура и количество газа постоянны,
    испарения нет."
  questions:
    - type: num
      q: Во сколько раз изменится объём при снижении давления со 100 до 50 кПа?
      answer: 2
      tol: 0.03
      unit: раз
      explain: Объём увеличится в 100/50 = 2 раза.
    - type: mc
      q: Какой вывод о реальной партии нужно проверить отдельно?
      options:
        - text: Только вид жидкости в момент максимального разрежения
          why: Этот вывод не следует из заданных условий.
        - text: Сохранение массы, состава и свойств после обработки и при фасовке
          correct: true
          why: Это соответствует модели и её явно указанным ограничениям.
        - text: Гарантированную стерильность после любого вакуумирования
          why: Здесь смешаны разные физические величины или допущения.
