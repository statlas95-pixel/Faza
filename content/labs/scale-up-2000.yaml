# Занятие-расчёт. Движок: scaleup. Параметры аппаратов можно менять здесь.
# ВСЕ ЧИСЛА — УЧЕБНЫЕ: аппараты вымышлены, параметры правдоподобны по порядку величины.

id: scale-up-2000
engine: scaleup
order: 3
title: "Перенос на 2000 кг: что сохранить"
summary: Крем отработан на 5 кг. Рассчитайте обороты гомогенизатора, время обработки и охлаждения для реактора на 2000 кг — и посмотрите, какой получится первая партия при ваших решениях.
area: both
role: Технолог по переносу технологии
minutes: 25
skill: Перенос технологии — выбрать критерий масштабирования с учётом ограничений оборудования, пересчитать время через число проходов и тепловой баланс и спланировать проверку до первой партии.
topics: [scale-up, emulsification, lamellar-gel-network]
dataNote: Учебная модель. Размер капель — d ∝ ε^−0,4 при ε ∝ N³D²; необработанная доля — e^−n; охлаждение — рубашка с постоянной температурой хладагента. Реальные аппараты отклоняются от всех трёх допущений.

hints:
  - "Посчитайте окружную скорость в лаборатории: u = π·D·N."
  - "Переведите лабораторные минуты в число проходов и подумайте, сколько проходов реально сделать на реакторе."
  - "Время охлаждения растёт примерно как линейный размер аппарата — кубический корень из отношения масс."

brief:
  situation: |
    Вы — технолог по переносу. R&D передаёт крем на гелевой сети, отработанный в лабораторном реакторе на 5 кг.
    Первая производственная партия — 2000 кг, сырья на неё уходит на сумму, сопоставимую с месячным бюджетом лаборатории.
    В лабораторном протоколе написано: «гомогенизация 6000 об/мин, 5 минут; охлаждение до 40 °C».
  goal: Составить режим для реактора и план проверки, при котором первая партия не станет экспериментом.
  constraints: Все расчёты выполняются по данным из таблицы оборудования. Числа вводите сами — система проверит и расчёт, и то, что из него следует.

params:
  lab:   { D: 0.04, rpm: 6000, Q_lpm: 30, V_l: 5, time_min: 5, d32: 3.0, cool_min: 8 }
  plant: { D: 0.2, rpm_max: 1500, Q_lpm_ref: 600, rpm_ref: 1200, P_kw_max: 30, V_l: 2000, m: 2000, cp: 3800, U: 300, A: 7, T0: 75, T1: 40 }

criteria:
  - id: rpm
    title: Те же обороты — 6000 об/мин
    verdict: wrong
    text: При роторе 200 мм это окружная скорость 63 м/с — впятеро выше лабораторной и вне возможностей аппарата (максимум 1500 об/мин). Обороты сами по себе ничего не сохраняют.
  - id: tip
    title: Та же окружная скорость
    verdict: ok
    text: Распространённое первое приближение, поддержанное частью экспериментальных работ. Учебная модель занятия (по локальной диссипации энергии) предсказывает при этом более крупные капли, чем в лаборатории, — различие критериев и есть причина, по которой результат проверяют измерением.
  - id: eps
    title: Та же локальная диссипация энергии (N³D² = const)
    verdict: ok
    text: Следует из теории Колмогорова — Хинце. Требуемые обороты (≈2050) выше максимума аппарата — критерий упирается в оборудование, и вы обязаны решить, что делать с этим ограничением.
  - id: weber
    title: То же число Вебера (N²D³ = const)
    verdict: weak
    text: Сохранение We сохраняет отношение d/D, а не сам размер капли — при роторе в 5 раз больше капли по этой логике будут в 5 раз крупнее. Число Вебера используют как параметр корреляции, а не как условие переноса.

verification:
  max: 2
  options:
    - id: scaledown
      title: Лабораторная варка в «заводских» условиях — достижимая интенсивность, заводское число проходов, охлаждение за час
      verdict: ok
      text: Самая дешёвая проверка самых больших рисков — вы узнаёте, как рецептура ведёт себя при медленном охлаждении и более крупных каплях, за стоимость 5 кг сырья.
    - id: criteria
      title: До варки зафиксировать критерии приёмки первой партии — размер капель, вязкость по методике, вид под микроскопом
      verdict: ok
      text: Без заранее записанных критериев первая партия не отвечает на вопрос «получилось или нет».
    - id: pilot
      title: Промежуточная партия на пилотном реакторе 50 кг
      verdict: weak
      text: Полезно, если пилотный аппарат подобен производственному. Но сам по себе он не воспроизводит ни час охлаждения, ни малое число проходов большого реактора.
    - id: repeat
      title: Ещё три лабораторные варки по исходному лабораторному протоколу — подтвердить воспроизводимость
      verdict: weak
      text: Подтверждает то, что уже известно, — в условиях, которых на заводе не будет.
    - id: straight
      title: Сразу варить 2000 кг — расчёты выполнены
      verdict: wrong
      text: Расчёт показал, что завод отличается от лаборатории по трём параметрам одновременно. Варить партию без проверки — значит поставить эксперимент ценой в 2 тонны.

cooling:
  - id: w20
    title: Вода 20 °C в рубашку
    Tc: 20
    verdict: ok
    text: Штатный вариант. Охлаждение займёт около часа — в 7–8 раз дольше, чем в лаборатории. Рецептура должна быть проверена на таком режиме.
  - id: w7
    title: Захоложенная вода 7 °C
    Tc: 7
    verdict: weak
    text: Быстрее примерно на четверть, но у холодной стенки крем застывает и хуже отдаёт тепло, а структура у стенки и в объёме формируется по-разному. Допустимо только после проверки.
  - id: homog
    title: Вода 20 °C и гомогенизатор при охлаждении — для лучшего теплообмена
    Tc: 20
    verdict: wrong
    text: Гомогенизатор сам греет продукт и создаёт интенсивный сдвиг в интервале формирования гелевой сети. Последствия такого решения разобраны в занятии «Партия 2417».

transfer:
  title: "Перенос: реактор 500 кг с другим гомогенизатором"
  intro: |
    Тот же крем решено варить ещё и на реакторе 500 кг: ротор гомогенизатора 120 мм, циркуляция 250 л/мин, объём партии 500 л.
    Лабораторные данные прежние: ротор 40 мм, 6000 об/мин; охлаждение 5 кг — 8 минут.
  questions:
    - type: num
      q: Какие обороты дадут ту же окружную скорость, что в лаборатории? Ответ в об/мин.
      answer: 2000
      tol: 0.03
      unit: об/мин
      explain: "N₂ = N₁·D₁/D₂ = 6000·40/120 = 2000 об/мин."
    - type: num
      q: Сколько минут нужно гомогенизировать, чтобы партия в среднем прошла через аппарат 5 раз?
      answer: 10
      tol: 0.05
      unit: мин
      explain: "t = n·V/Q = 5·500/250 = 10 мин. Необработанная доля при этом e⁻⁵ ≈ 0,7 %."
    - type: num
      q: Оцените время охлаждения на этом реакторе при геометрическом подобии и тех же условиях теплообмена. Ответ в минутах.
      answer: 37
      tol: 0.12
      unit: мин
      explain: "Время ∝ линейному размеру: (500/5)^(1/3) ≈ 4,64. 8 мин · 4,64 ≈ 37 мин."
    - type: mc
      q: Партии на 500 кг и на 2000 кг охлаждаются 37 и 61 минуту. Что из этого следует для рецептуры?
      options:
        - { text: "Ничего — оба аппарата соблюдают одну инструкцию", why: "Инструкция одна, а тепловая история продукта разная — и структура гелевой сети может различаться." }
        - { text: "Нужно убедиться, что продукт укладывается в спецификацию во всём диапазоне скоростей охлаждения от 37 до 61 минуты", correct: true, why: "Это и есть проверка устойчивости рецептуры к масштабу — её делают в лаборатории, воспроизводя оба режима." }
        - { text: "Маленький реактор нужно охлаждать медленнее, чтобы сравнять время", why: "Возможный приём, но сначала стоит узнать, чувствительна ли рецептура к этой разнице, — иначе вы зря удлиняете цикл." }
