# Занятие-расчёт (движок worksheet). ДАННЫЕ ИЗМЕРЕНИЙ СИНТЕТИЧЕСКИЕ: изотерма построена для учебного неионогенного ПАВ.
id: cmc-sheet
engine: worksheet
order: 13
title: "Изотерма поверхностного натяжения: ККМ и площадь на молекулу"
summary: Лаборатория прислала протокол измерения поверхностного натяжения растворов нового эмульгатора. Найдите ККМ, рассчитайте поверхностный избыток и площадь, которую занимает молекула, — и решите, что это значит для расхода эмульгатора.
area: rnd
role: Специалист лаборатории R&D
minutes: 15
skill: Интерпретация изотермы поверхностного натяжения — определить ККМ по излому, рассчитать адсорбцию по уравнению Гиббса и площадь на молекулу, сделать вывод о расходе ПАВ.
topics: [surface-tension]
dataNote: Синтетические данные учебного неионогенного ПАВ, 25 °C. Реальные изотермы имеют разброс и могут показывать минимум из-за примесей.
hints:
  - "ККМ — концентрация, выше которой поверхностное натяжение почти перестаёт меняться."
  - "Наклон ниже ККМ берите как изменение γ на один порядок концентрации, затем переведите десятичный логарифм в натуральный делением на 2,303."

brief:
  situation: |
    Поставщик предлагает новый неионогенный эмульгатор. Лаборатория измерила поверхностное натяжение его водных растворов при 25 °C (метод отрыва кольца).
    Руководитель R&D просит оценить ККМ и расход эмульгатора на поверхность капель.
  goal: Найти ККМ, рассчитать площадь на молекулу и сделать вывод для рецептуры.
  constraints: Данные — в протоколе справа. R = 8,314 Дж/(моль·К), T = 298,15 К, Nᴀ = 6,022·10²³ моль⁻¹.

sheet:
  title: Протокол измерений поверхностного натяжения (учебный)
  origin: Лаборатория R&D; метод отрыва кольца, 25,0 °C; синтетические учебные данные.
  rows:
    - ["c = 0,01 ммоль/л", "γ = 70,5 мН/м"]
    - ["c = 0,03 ммоль/л", "γ = 66,5 мН/м"]
    - ["c = 0,1 ммоль/л", "γ = 56,0 мН/м"]
    - ["c = 0,3 ммоль/л", "γ = 46,5 мН/м"]
    - ["c = 1 ммоль/л", "γ = 36,0 мН/м"]
    - ["c = 3 ммоль/л", "γ = 35,8 мН/м"]
    - ["c = 10 ммоль/л", "γ = 35,7 мН/м"]
    - ["Вода (контроль)", "γ = 72,0 мН/м"]

steps:
  - title: ККМ
    text: Постройте мысленно зависимость γ от lg c.
    questions:
      - type: num
        q: При какой концентрации находится излом — ККМ, ммоль/л?
        answer: 1
        tol: 0.05
        unit: ммоль/л
        hint: "Выше этой концентрации γ меняется на десятые доли мН/м, ниже — на 10 мН/м на каждые полпорядка."
        explain: "Около 1 ммоль/л: от 1 до 10 ммоль/л γ почти постоянно (36,0 → 35,7), ниже — круто падает."
      - type: mc
        q: Почему выше ККМ поверхностное натяжение почти не меняется?
        options:
          - { text: "ПАВ разлагается", why: "Химических изменений здесь нет." }
          - { text: "Поверхность насыщена, а добавленный ПАВ уходит в мицеллы; концентрация свободных молекул почти постоянна", correct: true, why: "Поверхностное натяжение определяется свободными молекулами, а их концентрация выше ККМ почти не растёт." }
          - { text: "Метод кольца не измеряет натяжение ниже 36 мН/м", why: "Метод работает в этом диапазоне; дело в равновесии в растворе." }
  - title: Адсорбция по Гиббсу
    text: "Линейный участок ниже ККМ: от 0,1 до 1 ммоль/л γ падает с 56,0 до 36,0 мН/м."
    questions:
      - type: num
        q: Каков наклон dγ/d lg c на линейном участке, мН/м на порядок концентрации? (Ответ — положительное число, модуль наклона.)
        answer: 20
        tol: 0.02
        unit: мН/м
        hint: "Изменение γ при росте концентрации в 10 раз — от 0,1 до 1 ммоль/л."
        explain: "56,0 − 36,0 = 20 мН/м на порядок концентрации."
      - type: num
        q: "Рассчитайте поверхностный избыток Γ для неионогенного ПАВ (n = 1), мкмоль/м²."
        answer: 3.50
        tol: 0.03
        unit: мкмоль/м²
        hint: "Γ = (наклон / 2,303) / (R·T) = (0,020 / 2,303) / (8,314 · 298,15). Переведите моль/м² в мкмоль/м²."
        explain: "0,020 / 2,303 = 8,69·10⁻³ Н/м; Γ = 8,69·10⁻³ / 2478,8 = 3,50·10⁻⁶ моль/м² = 3,50 мкмоль/м²."
      - type: num
        q: Какую площадь занимает одна молекула в насыщенном адсорбционном слое, нм²?
        answer: 0.474
        tol: 0.03
        unit: нм²
        hint: "A = 1 / (Nᴀ · Γ); 1 м² = 10¹⁸ нм²."
        explain: "1 / (6,022·10²³ · 3,50·10⁻⁶) = 4,74·10⁻¹⁹ м² = 0,474 нм²."
    after: "**В отчёт:** ККМ ≈ 1 ммоль/л; Γ ≈ 3,5 мкмоль/м²; площадь на молекулу ≈ 0,47 нм² (синтетические данные)."
  - title: Вывод для рецептуры
    text: Эмульсия содержит 20 % масла; размер капель после гомогенизации — около 2 мкм.
    questions:
      - type: mc
        q: Как изменится расход эмульгатора на покрытие капель, если перейти к каплям 1 мкм при той же доле масла?
        options:
          - { text: "Не изменится", why: "Поверхность раздела зависит от размера капель." }
          - { text: "Удвоится — поверхность обратно пропорциональна диаметру", correct: true, why: "S/V = 6/d. При вдвое меньших каплях поверхность и расход на монослой вдвое больше." }
          - { text: "Уменьшится вдвое", why: "Мельче капли — больше поверхность." }
      - type: mc
        q: Можно ли по этой изотерме решить, что эмульгатор подходит для крема?
        options:
          - { text: "Да — низкая ККМ гарантирует стабильность", why: "ККМ и площадь на молекулу описывают адсорбцию, но не устойчивость к коалесценции, структуру крема и поведение при хранении." }
          - { text: "Нет — изотерма даёт адсорбционные характеристики; пригодность проверяют эмульгированием и испытаниями стабильности", correct: true, why: "Изотерма помогает сравнить ПАВ и оценить расход, но решение о рецептуре требует опытов с продуктом." }
          - { text: "Да — если ККМ ниже 10 ммоль/л", why: "Универсального порога не существует." }

transfer:
  title: "Перенос: ионное ПАВ"
  intro: |
    Для анионного ПАВ без избытка соли (n = 2) наклон изотермы ниже ККМ — 30 мН/м на порядок концентрации, 25 °C.
  questions:
    - type: num
      q: Каков поверхностный избыток Γ, мкмоль/м²?
      answer: 2.63
      tol: 0.03
      unit: мкмоль/м²
      explain: "Γ = (0,030 / 2,303) / (2 · 8,314 · 298,15) = 0,01303 / 4957,6 ≈ 2,63·10⁻⁶ моль/м²."
    - type: num
      q: Какую площадь занимает молекула, нм²?
      answer: 0.632
      tol: 0.03
      unit: нм²
      explain: "1 / (6,022·10²³ · 2,63·10⁻⁶) ≈ 6,3·10⁻¹⁹ м² = 0,63 нм². Различие площадей в двух примерах само по себе не устанавливает его молекулярную причину."
    - type: mc
      q: Почему для идеального полностью диссоциированного ПАВ 1:1 без добавленной соли используют n = 2?
      options:
        - { text: "Молекула ионного ПАВ вдвое длиннее", why: "Множитель не связан с длиной." }
        - { text: "При изменении концентрации ПАВ одновременно меняются активности иона ПАВ и его противоиона", correct: true, why: "При большом избытке инертного электролита n снова стремится к 1." }
        - { text: "Так принято для любых ПАВ", why: "Для неионогенных n = 1." }
