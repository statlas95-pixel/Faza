# Занятие по методам измерения. Движок: rheo. Параметры образцов (модель Гершеля — Балкли) можно менять здесь.
# ВСЕ ДАННЫЕ — УЧЕБНЫЕ: кривые рассчитаны по модели, а не измерены на приборе.

id: rheo-cabinet
engine: rheo
order: 4
title: "Кабинет реолога: какой тест ответит на вопрос"
summary: Три лосьона с одинаковой вязкостью по вискозиметру и три разные жалобы. Выберите измерения, прочитайте кривые и свяжите каждую жалобу с параметром, который за неё отвечает.
area: both
role: Специалист аналитической лаборатории R&D
minutes: 20
skill: Постановка измерения под вопрос — определить диапазон сдвига процесса, выбрать тест и сделать из кривой только тот вывод, который она поддерживает.
topics: [rheology-basics]
dataNote: Учебные данные. Кривые рассчитаны по модели Гершеля — Балкли и экспоненциальной модели восстановления; показание шпиндельного вискозиметра при 20 об/мин условно приравнено к точке 4 с⁻¹.

brief:
  situation: |
    Вы работаете в аналитической лаборатории R&D. Отдел разработки принёс три прототипа лосьона — A, B и C.
    На вискозиметре (20 об/мин) все три показывают около **12 000 мПа·с**. Но панель тестировщиков вернула три жалобы,
    и неизвестно, какая к какому образцу относится — анкеты перепутаны.
  goal: Для каждой жалобы определить образец и назвать измерение, которое это доказывает.
  constraints: Прибор свободен на три измерения из четырёх возможных. Ответ без подтверждающего измерения засчитывается как догадка.

samples:
  - { id: A, sy: 15, K: 10.9, n: 0.8,  floor: 0.8,  tau: 6 }
  - { id: B, sy: 0,  K: 25.7, n: 0.45, floor: 0.7,  tau: 10 }
  - { id: C, sy: 30, K: 7.4,  n: 0.65, floor: 0.25, tau: 240 }

maxTests: 3
tests:
  - id: single
    title: Повторить на вискозиметре при трёх скоростях (5, 20, 50 об/мин)
    time: 20 мин
    shows: Три точки в узком диапазоне 1–10 с⁻¹.
  - id: flow
    title: Кривая течения на реометре, 0,1–3000 с⁻¹
    time: 40 мин
    shows: Вязкость во всём диапазоне скоростей сдвига — от стекания до нанесения.
  - id: yield
    title: Рампа напряжения 0,1–100 Па — определение предела текучести
    time: 30 мин
    shows: Напряжение, при котором образец начинает течь.
  - id: thix
    title: Трёхинтервальный тест — покой, 60 с при 1000 с⁻¹, восстановление
    time: 30 мин
    shows: Как быстро структура восстанавливается после сильного сдвига.

rateQuestion:
  q: "Дозатор выдаёт 1,5 мл за 0,5 с через канал диаметром 3 мм. Оцените скорость сдвига у стенки канала (как для ньютоновской жидкости), с⁻¹."
  answer: 1132
  tol: 0.15
  unit: с⁻¹
  explain: "γ̇ = 4Q/(πR³) = 4·3·10⁻⁶/(3,14·(1,5·10⁻³)³) ≈ 1,1·10³ с⁻¹. Значит, образцы для жалобы на дозатор сравнивают около 1000 с⁻¹, а не при 4 с⁻¹."

claims:
  - id: pump
    text: «Дозатор идёт туго, приходится давить»
    answer: A
    proof: [flow]
    explain: При ≈1100 с⁻¹ вязкость образца A — около 2,7 Па·с, у C — 0,7, у B — 0,5. При 4 с⁻¹ все три одинаковы — вискозиметр этого различия не видит.
  - id: drip
    text: «Стекает с ладони, не успеваешь нанести»
    answer: B
    proof: [yield, flow]
    explain: Слой 1 мм создаёт напряжение ρ·g·h ≈ 10 Па. У образца B предела текучести нет — он течёт под собственным весом. У A (15 Па) и C (30 Па) предел текучести выше 10 Па, слой удерживается. На кривой течения это видно косвенно — по тому, что вязкость B при малых скоростях сдвига не уходит вверх; рампа напряжения показывает это прямо.
  - id: runny
    text: «После встряхивания флакона лосьон несколько минут жидкий, как вода, потом снова густой»
    answer: C
    proof: [thix]
    explain: Образец C через 30 с после сдвига восстанавливает около трети исходной вязкости и возвращается к 90 % лишь через 8 минут. A и B восстанавливаются за секунды.

transfer:
  title: "Перенос: новый образец D"
  intro: |
    Отдел разработки приносит образец D — крем-гель для душа, который должен висеть на вертикальной стенке мочалки слоем 0,5 мм
    и выдавливаться из тубы. Параметры по кривой течения: σ_y = 8 Па, K = 12 Па·сⁿ, n = 0,45. Плотность 1000 кг/м³.
  questions:
    - type: num
      q: Какое напряжение создаёт слой 0,5 мм на вертикальной поверхности? Ответ в Па.
      answer: 4.9
      tol: 0.06
      unit: Па
      explain: "σ = ρ·g·h = 1000·9,81·0,5·10⁻³ ≈ 4,9 Па."
    - type: mc
      q: Удержится ли слой 0,5 мм? А слой 1,5 мм?
      options:
        - { text: "Оба удержатся", why: "Слой 1,5 мм создаёт ≈14,7 Па — больше предела текучести 8 Па." }
        - { text: "0,5 мм удержится, 1,5 мм — потечёт", correct: true, why: "4,9 Па < 8 Па < 14,7 Па. Предел текучести задаёт максимальную толщину удерживаемого слоя — здесь около 0,8 мм." }
        - { text: "Оба потекут", why: "Слой 0,5 мм создаёт 4,9 Па — меньше предела текучести." }
    - type: num
      q: Рассчитайте вязкость образца D при 500 с⁻¹ (выдавливание из тубы). Ответ в Па·с.
      answer: 0.41
      tol: 0.1
      unit: Па·с
      explain: "σ = 8 + 12·500^0,45 = 8 + 12·16,4 ≈ 205 Па; η = σ/γ̇ = 205/500 ≈ 0,41 Па·с."
    - type: mc
      q: Какой из выводов НЕ следует из этих трёх параметров?
      options:
        - { text: "Максимальная толщина слоя, который не стекает", why: "Следует — из предела текучести." }
        - { text: "Усилие выдавливания по сравнению с другим образцом при той же скорости сдвига", why: "Следует — из вязкости при соответствующей скорости сдвига." }
        - { text: "Как быстро продукт загустеет на мочалке после выдавливания", correct: true, why: "Кривая течения не содержит времени. Для этого нужен тест на восстановление структуры." }
