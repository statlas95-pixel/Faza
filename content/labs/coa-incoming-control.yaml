id: coa-incoming-control
engine: coa
order: 44
area: production
minutes: 12
role: Специалист входного контроля качества (QC)
title: "Тренажёр входного контроля сырья: аудит сертификатов анализа (CoA)"
summary: "Сверьте 4 сертификата анализа (CoA) поступивших партий косметического сырья со спецификациями и примите решение: одобрить в цех, направить в карантин или отклонить."
skill: Выявлять несоответствия в сертификатах анализа (CoA) — окисление масел, пропуски микробиологии и нарушение прослеживаемости — до допуска сырья на склад
topics: [ingredient-documents, oil-oxidation, cip-verification]
brief:
  situation: "На склад сырья поступили 4 партии от разных поставщиков. Производство ждёт выдачи ярлыков статуса («Одобрено QC» / «Карантин» / «Отклонено»). По правилам GMP (ISO 22716) ни одна партия не может пойти в варку без проверки CoA."
  goal: "Просмотрите показатели каждой партии (срок переконтроля, химические и микробиологические параметры, полноту подписи и номера партии) и вынесите верное решение QC."
  constraints: "Дата проверки: 25.11.2026. Партии, спецификации и названия поставщиков — учебные синтетические данные."
dataNote: "Учебные сертификаты анализа (CoA) для отработки входного контроля косметического сырья."

checkDate: "25.11.2026"
lots:
  - id: lot-almond
    material: "Масло сладкого миндаля рафинированное"
    inci: "Prunus Amygdalus Dulcis Oil"
    supplier: "ООО «АгроОйл»"
    lotNo: "AO-2025-118"
    retestDate: "15.10.2026 (просрочено!)"
    signoff: "Нач. лаб. В. Громов, подпись и печать есть"
    rows:
      - { param: "Кислотное число, мг KOH/г", spec: "≤ 0,5", result: "0,4" }
      - { param: "Перекисное число, мэкв O₂/кг", spec: "≤ 10,0", result: "18,4", outOfSpec: true }
      - { param: "Внешний вид и запах", spec: "Прозрачная светло-жёлтая жидкость без прогорклости", result: "Слегка желтоватое, слабый посторонний запах", outOfSpec: true }
    expected: reject
    why: "Прямое несоответствие спецификации по перекисному числу (18,4 > 10,0 мэкв/кг — масло окислено/прогоркло) плюс истёкший срок переконтроля (15.10.2026). Партия подлежит отклонению и возврату поставщику."

  - id: lot-sles
    material: "Лауретсульфат натрия 70 % (паста)"
    inci: "Sodium Laureth Sulfate"
    supplier: "ChemSurf Europe"
    lotNo: "CS-70-260904"
    retestDate: "09.2027"
    signoff: "QA Manager M. Lindner, электронная верификация"
    rows:
      - { param: "Активное вещество, %", spec: "68,0–72,0", result: "69,4" }
      - { param: "pH (1 % водный раствор)", spec: "6,5–8,5", result: "7,3" }
      - { param: "1,4-диоксан, ppm", spec: "≤ 10", result: "4,2" }
      - { param: "Хлорид натрия (остаточный), %", spec: "≤ 0,5", result: "0,22" }
    expected: approve
    why: "Все физико-химические показатели и примесь 1,4-диоксана в пределах спецификации, срок годности актуален, прослеживаемость и подпись QA полные — партию можно одобрить (учесть 69,4 % акт. и 0,22 % NaCl при расчёте загрузки)."

  - id: lot-xanthan
    material: "Ксантановая камедь косметическая (прозрачная)"
    inci: "Xanthan Gum"
    supplier: "BioGum Trade"
    lotNo: "BG-26-4412"
    retestDate: "11.2028"
    signoff: "Технолог К. Белова, подпись есть"
    rows:
      - { param: "Вязкость (1 % в 1 % KCl), мПа·с", spec: "1200–1600", result: "1420" }
      - { param: "pH (1 % раствор)", spec: "6,0–8,0", result: "6,8" }
      - { param: "Потери при высушивании, %", spec: "≤ 15,0", result: "9,4" }
      - { param: "Микробиология (КМАФАнМ, дрожжи/плесени)", spec: "≤ 500 КОЕ/г, патогены отс.", result: "Испытание не проводилось", outOfSpec: true }
    expected: quarantine
    why: "Полисахаридные камеди — сырьё высокого микробиологического риска. Отсутствие данных по микробиологии не позволяет выпустить сырьё в цех, но и браковать его рано: партию переводят в карантин до проведения анализа в своей или аккредитованной лаборатории QC."

  - id: lot-phenox
    material: "Феноксиэтанол (консервант)"
    inci: "Phenoxyethanol"
    supplier: "PreservLab"
    lotNo: "Не указан (пустое поле)"
    retestDate: "06.2028"
    signoff: "Подпись отсутствует (черновик)"
    rows:
      - { param: "Основное вещество (ГХ), %", spec: "≥ 99,0", result: "99,6" }
      - { param: "Свободный фенол, ppm", spec: "≤ 10", result: "3,0" }
      - { param: "Цветность (APHA)", spec: "≤ 15", result: "6" }
    expected: quarantine
    why: "По химии показатели в норме, но документ недействителен по GMP: нет номера партии (невозможно связать CoA с бочками на складе) и нет подписи ответственного лица. Статус — карантин до получения официального подписанного CoA и сверки маркировки тары."

transfer:
  title: "Перенос: влияние разброса активного вещества SLES"
  intro: "В предыдущей партии SLES было 71,2 % активного вещества, а в новой одобренной партии `CS-70-260904` — 69,4 %."
  questions:
    - type: mc
      q: "Что нужно сделать технологу при запуске варки с новой партией SLES (69,4 % вместо 71,2 %)?"
      options:
        - text: "Пересчитать товарную загрузку SLES на целевую долю активного вещества и скорректировать баланс воды (проверить также остаточную соль на солевой кривой)"
          correct: true
          why: "При колебаниях концентрации товарного ПАВ сохранение одинаковой массы товарного сырья сдвинет активную массу и положение пика солевой кривой."
        - text: "Отклонить партию как брак, хотя она укладывается в спецификацию 68–72 %"
          why: "Партия полностью соответствует спецификации — достаточно корректно пересчитать загрузку."
