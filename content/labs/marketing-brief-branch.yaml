id: marketing-brief-branch
engine: branching
order: 48
area: rnd
minutes: 10
role: Ведущий R&D-химик
title: "Бриф от заказчика: Маркетинг vs Химия и регуляторика"
summary: "Проведите техническую экспертизу противоречивого брифа от бренд-менеджера: отделите реальные решения от невозможных требований и нарушений EU 2024/996 и ТР ТС 009/2011."
skill: Проводить технический аудит маркетингового брифа — находить физико-химические и нормативные противоречия и предлагать рабочие R&D-компромиссы.
topics: [unstable-actives, sunscreens-spf, raw-functions]
brief:
  situation: "Бренд-менеджер принёс срочный бриф на ночной лосьон для тела: «Хочу кристально прозрачный гель с 10 % масла ши, 0,4 % чистого ретинола, pH 3,5 и плашкой “0 % консервантов” в прозрачной банке»."
  goal: "За 3 шага разберите бриф с заказчиком: обоснуйте, что противоречит физике и закону, и согласуйте безопасную, стабильную концепцию продукта."
  constraints: "Опирайтесь на коллоидную химию, стабильность ретинола и действующие ограничения EU 2024/996 и ТР ТС 009/2011."
dataNote: "Синтетический переговорный кейс из типовой практики взаимодействия R&D и маркетинга."

start: step-optics
nodes:
  - id: step-optics
    title: "Шаг 1: «Кристально прозрачный водный гель с 10 % масла ши»"
    scene: "Заказчик настаивает: «У конкурентов есть прозрачный гель, почему мы не можем положить туда 10 % масла ши, чтобы он был питательным и прозрачным?»"
    readings:
      - { label: "Запрос", value: "Прозрачный гель + 10 % масла ши" }
      - { label: "Природа фаз", value: "Вода + твёрдый триглицерид (n_D разный)" }
    choices:
      - id: explain-optics
        label: "Объяснить оптику дисперсий: 10 % твёрдого масла в воде дадут молочную эмульсию (капли > 0,5 мкм рассеивают свет). Предложить два честных варианта: либо шелковистый непрозрачный крем-гель (O/W), либо прозрачный безводный масляный гель / мицеллярную дозу эмолента ≤ 0,3 % с солюбилизатором"
        verdict: ok
        consequence: "Заказчик увидел логику и согласился на нежный непрозрачный флюид-эмульсию (O/W) ради реального питания кожи!"
        next: step-retinol
      - id: add-40pct-peg
        label: "Пообещать растворить 10 % масла ши с помощью 45 % ПЭГ-40 касторового масла"
        verdict: wrong
        consequence: "45 % солюбилизатора сделают продукт невыносимо липким, раздражающим для кожи и заоблачно дорогим — провал на первых же пробах."
        next: end-failed
      - id: hide-oil
        label: "Молча положить 0,05 % масла ши вместо 10 %, а в брифе оставить «10 %»"
        verdict: wrong
        consequence: "Прямой обман потребителя и нарушение EU 655/2013 / ТР ТС 009/2011 по достоверности клеймов."
        next: end-failed

  - id: step-retinol
    title: "Шаг 2: «0,4 % чистого ретинола при pH 3,5 для лосьона тела»"
    scene: "В брифе стоит: «Лосьон для тела с 0,4 % чистого ретинола и молочной кислотой при pH 3,5 — чтобы мощнее обновлял кожу»."
    readings:
      - { label: "Категория", value: "Лосьон для тела (leave-on)" }
      - { label: "Ретинол в брифе", value: "0,4 % RE при pH 3,5" }
      - { label: "Лимит EU 2024/996 (тело)", value: "0,05 % RE" }
    choices:
      - id: fix-retinol
        label: "Указать на двойной запрет: 0,4 % превышает лимит EU 2024/996 для лосьона тела (0,05 % RE) в 8 раз, а при pH 3,5 ретинол быстро разрушается. Предложить либо лосьон тела с ≤ 0,05 % ретинола (или бакучиол 0,5 %) при pH 5,5–6,0, либо разнести AHA-эксфолиацию (pH 3,8) и ретинол в разные продукты"
        verdict: ok
        consequence: "Бренд-менеджер снял нарушение до запуска производства: выбрали безопасную дозировку (0,05 % RE для тела + pH 5,6 + антиоксидант)."
        next: step-preservative
      - id: keep-retinol
        label: "Согласиться на 0,4 % ретинола при pH 3,5 — главное, чтобы маркетинг был доволен"
        verdict: wrong
        consequence: "Продукт не пройдёт оценку безопасности в ЕС, вызовет сильное раздражение кожи, а ретинол распадётся ещё на складе."
        next: end-failed

  - id: step-preservative
    title: "Шаг 3: «0 % консервантов в прозрачной банке»"
    scene: "Последнее требование: «Напишем “0 % консервантов” и расфасуем в красивую прозрачную банку, чтобы был виден цвет флюида»."
    readings:
      - { label: "Водная фаза", value: "≈ 78 % Aqua" }
      - { label: "Актив", value: "Ретинол (фото- и O₂-лабильный)" }
    choices:
      - id: defend-safety
        label: "Отстоять микробиологическую и фотостабильность: в водной эмульсии консервант обязателен (по ISO 11930); можно сделать мягкую современную систему (Phenoxyethanol + Ethylhexylglycerin или пентиленгликоль + мягкий консервант без парабенов), а прозрачную банку заменить на непрозрачный airless-флакон для защиты ретинола от света и O₂"
        verdict: ok
        consequence: "ТЗ утверждено! Формула безопасна, стабильна, соответствует EU 2024/996, ТР ТС 009/2011 и готова к сборке в Лаборатории."
        next: end-success
      - id: zero-preservative
        label: "Убрать консерванты полностью — пусть хранится 2 недели в холодильнике"
        verdict: wrong
        consequence: "Для серийного розничного лосьона без холодовой цепи партия заплесневеет до продажи, а ретинол в прозрачной банке окислится за месяц."
        next: end-failed

  - id: end-success
    title: "Бриф успешно согласован!"
    scene: "Вы защитили физику, стабильность и регуляторику, не разрушив коммерческую привлекательность продукта."
    outcome:
      verdict: ok
      score: 1.0
      title: "Зрелая R&D-экспертиза брифа"
      summary: "Вы перевели противоречивые пожелания маркетинга в выполнимую, стабильную и законную рецептуру (флюид O/W, pH 5,6, ретинол ≤ 0,05 % для тела, рабочая консервация и airless-тара)."
      lesson: "Главная задача R&D на старте проекта — остановить невозможные или незаконные требования ДО варки, предлагая понятную технологическую альтернативу."

  - id: end-failed
    title: "Проект провалился на испытаниях или сертификации"
    scene: "Компромисс в ущерб физике и безопасности привёл к необратимому браку или запрету выпуска."
    outcome:
      verdict: wrong
      score: 0.25
      title: "Критическая ошибка в техническом задании"
      summary: "Нельзя игнорировать законы оптики дисперсий, пределы EU 2024/996 (0,05 % RE для тела), pH-стабильность ретинола и необходимость консервации водных систем."
      lesson: "Переиграйте бриф и найдите решение, которое одновременно безопасно по закону, стабильно по химии и привлекательно для клиента."
