# Занятие-расчёт по шагам. Движок: worksheet — полностью задаётся этим файлом; по образцу можно делать новые инженерные занятия.
# У каждого вопроса может быть hint: открытая подсказка засчитывается как решение с опорой.
# ВСЕ ДАННЫЕ — УЧЕБНЫЕ: аппарат вымышлен, вязкости и коэффициент мощности согласованы между собой, но не измерены.
id: mixing-sheet
engine: worksheet
order: 9
title: "Реактор Р-5: от воды до крема"
summary: Одна варка — три разных режима течения. По паспорту аппарата рассчитайте число Рейнольдса на каждой стадии, решите, какая мешалка должна работать, и что делать, когда привод подходит к пределу.
area: production
role: Технолог варочного участка
minutes: 20
skill: Оценка режима перемешивания — рассчитать число Рейнольдса и мощность, связать режим с тем, что происходит в аппарате, и выбрать управляющее действие.
topics: [mixing-basics, scale-up]
dataNote: Учебные данные. Вязкости на стадиях — кажущиеся, принятые для расчёта; коэффициент мощности якорной мешалки — учебный. Для своего аппарата берите значения из паспорта и измерений.

brief:
  situation: |
    Вы — технолог варочного участка. На реакторе **Р-5** (1000 л) ставят новый крем. Наладчик спрашивает, какие мешалки и на каких оборотах
    записать в режим для каждой стадии, а главный механик предупреждает: привод якорной мешалки — 5,5 кВт, и на густых продуктах он уже уходил в перегруз.
  goal: Рассчитать режим течения на трёх стадиях варки и записать в режим решения, которые из расчёта следуют.
  constraints: Все числа — из паспортного листа аппарата. Подсказку можно открыть у любого вопроса; решение с подсказкой засчитывается как выполненное с опорой.

sheet:
  title: Паспортный лист аппарата Р-5 (выписка)
  origin: Составлен службой главного механика по паспорту изготовителя и данным наладки.
  rows:
    - ["Рабочий объём", "1000 л; диаметр аппарата 1,20 м"]
    - ["Турбинная мешалка", "диаметр 0,40 м; 60–240 об/мин"]
    - ["Якорная мешалка со скребками", "диаметр 1,14 м; 10–40 об/мин; привод 5,5 кВт"]
    - ["Коэффициент мощности якорной мешалки в ламинарном режиме, K_p", "300 (учебное значение)"]
    - ["Плотность продукта на всех стадиях", "1000 кг/м³"]
    - ["Стадия 1 — водная фаза, 75 °C", "вязкость 0,001 Па·с"]
    - ["Стадия 2 — эмульсия после гомогенизации, 70 °C", "кажущаяся вязкость 0,5 Па·с"]
    - ["Стадия 3 — крем при охлаждении, 45 °C", "кажущаяся вязкость 40 Па·с"]
    - ["Стадия 3 — крем при 32 °C перед выгрузкой", "кажущаяся вязкость 80 Па·с"]

steps:
  - title: Стадия 1. Водная фаза
    text: Турбинная мешалка работает на 120 об/мин. В аппарате вода с растворёнными компонентами.
    questions:
      - type: num
        q: Чему равно число Рейнольдса для турбинной мешалки на этой стадии?
        answer: 320000
        tol: 0.05
        unit: ""
        hint: "Re = ρ·N·D²/μ. Обороты переведите в с⁻¹ — 120 об/мин = 2 с⁻¹; D² = 0,16 м²."
        explain: "Re = 1000 · 2 · 0,16 / 0,001 = 3,2·10⁵. Это развитый турбулентный режим."
      - type: mc
        q: Что это означает для растворения порошков на этой стадии?
        options:
          - { text: "Перемешивается только зона у мешалки", why: "Так было бы в ламинарном режиме. При Re порядка 10⁵ вихри вовлекают весь объём." }
          - { text: "Весь объём вовлечён в движение; якорная мешалка для перемешивания не нужна", correct: true, why: "В турбулентном режиме одна быстроходная мешалка обеспечивает циркуляцию по всему аппарату." }
          - { text: "Нужно увеличить обороты до максимума", why: "Режим уже турбулентный; рост оборотов увеличит мощность как куб и риск захвата воздуха." }
    after: "**Запись в режим:** стадия 1 — турбинная мешалка 120 об/мин, якорная на минимальных оборотах только для обновления слоя у стенки при нагреве."
  - title: Стадия 3. Крем при охлаждении
    text: Эмульсия загустела. Турбинная мешалка по-прежнему на 120 об/мин, кажущаяся вязкость крема 40 Па·с.
    questions:
      - type: num
        q: Чему равно число Рейнольдса для турбинной мешалки теперь?
        answer: 8
        tol: 0.06
        unit: ""
        hint: "Та же формула, изменилась только вязкость — 40 Па·с."
        explain: "Re = 1000 · 2 · 0,16 / 40 = 8. Режим ламинарный."
      - type: mc
        q: Оператор видит, что масса у стенок стоит. Что из этого следует для охлаждения через рубашку?
        options:
          - { text: "Охлаждение не изменится — рубашка работает", why: "Тепло от массы в центре должно пройти через неподвижный слой у стенки — он работает как изоляция." }
          - { text: "Охлаждение резко замедлится; слой у стенки переохладится, центр останется горячим", correct: true, why: "Неподвижный слой не обновляется. Отсюда и неоднородность температуры, и риск разной структуры крема у стенки и в объёме." }
          - { text: "Нужно поднять обороты турбинной мешалки до 240", why: "Зона движения расширится незначительно, а сдвиг и нагрев вырастут; до стенки диаметром 1,2 м мешалка 0,4 м не достанет." }
      - type: num
        q: Якорную мешалку включают на 30 об/мин. Чему равно её число Рейнольдса в креме 40 Па·с?
        answer: 16.2
        tol: 0.06
        unit: ""
        hint: "30 об/мин = 0,5 с⁻¹; D = 1,14 м, D² ≈ 1,30 м²."
        explain: "Re = 1000 · 0,5 · 1,30 / 40 ≈ 16. Режим тоже близок к ламинарному — но якорь проходит у самой стенки и проворачивает весь объём."
    after: "**Запись в режим:** со стадии загущения — якорная мешалка со скребками как основная; турбинную выключить или оставить на минимуме. Признак переключения — рост тока привода якорной мешалки и температура массы."
  - title: Привод якорной мешалки
    text: "В ламинарном режиме мощность P = K_p·μ·N²·D³. Якорь работает на 30 об/мин, D³ = 1,14³ ≈ 1,48 м³."
    questions:
      - type: num
        q: Какую мощность потребляет якорная мешалка в креме 40 Па·с? Ответ в кВт.
        answer: 4.44
        tol: 0.06
        unit: кВт
        hint: "P = 300 · 40 · 0,5² · 1,48. Результат в ваттах разделите на 1000."
        explain: "P = 300 · 40 · 0,25 · 1,48 ≈ 4440 Вт ≈ 4,4 кВт — в пределах привода 5,5 кВт."
      - type: num
        q: К выгрузке вязкость вырастает до 80 Па·с. До каких оборотов нужно снизить якорную мешалку, чтобы мощность не превысила 5,5 кВт? Ответ в об/мин.
        answer: 23.6
        tol: 0.06
        unit: об/мин
        hint: "При 30 об/мин и 80 Па·с мощность вдвое больше — около 8,9 кВт. Мощность пропорциональна квадрату оборотов: N = 30·√(5,5/8,9)."
        explain: "При 80 Па·с и 30 об/мин P ≈ 8,9 кВт. N = 30 · √(5,5 / 8,9) ≈ 23,6 об/мин."
      - type: mc
        q: Механик предлагает проще — останавливать якорь при перегрузе и включать снова. Почему это плохое решение?
        options:
          - { text: "Потому что тогда вырастет ток при пуске", why: "Пусковой ток — реальная проблема для привода, но не главная для продукта." }
          - { text: "Без движения слой у стенки не обновляется — охлаждение встанет, а крем у стенки и в объёме получит разную тепловую историю", correct: true, why: "Для крема на гелевой сети режим охлаждения определяет структуру. Снижение оборотов сохраняет обновление слоя, остановка — нет." }
          - { text: "Потому что это запрещено паспортом аппарата", why: "В паспортном листе такого запрета нет; причина — в поведении продукта." }
    after: "**Запись в режим:** при охлаждении ниже 40 °C — ступенчатое снижение оборотов якорной мешалки по току привода, без остановки."

transfer:
  title: "Перенос: пилотный реактор 250 л"
  intro: |
    Тот же крем решено отработать на пилотном реакторе: турбинная мешалка диаметром 0,25 м, 180 об/мин. На стадии геля кажущаяся вязкость 5 Па·с, плотность 1000 кг/м³.
  questions:
    - type: num
      q: Чему равно число Рейнольдса?
      answer: 37.5
      tol: 0.05
      unit: ""
      explain: "N = 3 с⁻¹; D² = 0,0625 м². Re = 1000 · 3 · 0,0625 / 5 = 37,5."
    - type: mc
      q: Какую формулу мощности применять для этого случая?
      options:
        - { text: "Турбулентную — P = N_p·ρ·N³·D⁵", why: "Она справедлива при Re порядка 10⁴ и выше. Здесь Re ≈ 40." }
        - { text: "Ни одна из двух не точна — это переходная область; ближе ламинарная, а надёжнее измерить ток привода", correct: true, why: "Между ламинарным и турбулентным режимом коэффициент мощности меняется; расчёт даёт ориентир, измерение — ответ." }
        - { text: "Любую — результат одинаков", why: "В разных режимах мощность по-разному зависит от оборотов и вязкости." }
    - type: num
      q: Если считать режим ламинарным, во сколько раз вырастет мощность при удвоении оборотов?
      answer: 4
      tol: 0.02
      unit: раз
      explain: "P ∝ N² — удвоение оборотов даёт четырёхкратный рост."
