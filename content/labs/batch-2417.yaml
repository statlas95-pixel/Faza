        text: По протоколу загрузка цетеарилового спирта 40,05 кг при норме 40,0, взвешивание с двойной подписью. Данных о недовложении нет.
      contrib:
        verdict: wrong
        text: Загрузка структурообразователей соответствует рецептуре и подтверждена второй подписью.
      excluded:
