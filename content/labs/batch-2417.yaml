# Занятие-расследование. Движок: investigation.
# Чтобы создать новое занятие такого типа — скопируйте этот файл под новым именем,
# поменяйте id и содержимое. Код менять не нужно. Правила формата — в docs/AUTHORING.md.
#
# Соглашения:
#   • ячейка таблицы, начинающаяся с «~», показывается как рукописная запись;
#   • id строки нужен только тем строкам, на которые ссылаются правила оценки (needs);
#   • needs — список id строк документов и/или запросов; основание засчитывается,
#     если ученик отметил ХОТЯ БЫ ОДНУ такую строку или получил ХОТЯ БЫ ОДИН такой запрос.
#
# ВСЕ ДАННЫЕ ЭТОГО ЗАНЯТИЯ — УЧЕБНЫЕ: предприятие, документы, числа придуманы и согласованы между собой.

id: batch-2417
engine: investigation
order: 1
title: "Партия 2417: вязкость ниже нормы"
summary: Крем выгружен, ОКК не пропускает партию по вязкости. У вас протокол варки, результаты испытаний и паспорта сырья. Решите, что запросить, в чём причина и что делать с 800 кг продукта.
area: production
role: Ведущий технолог производства
minutes: 35
skill: Расследование отклонения — отделить артефакт измерения от реального дефекта, проверить гипотезы различающими наблюдениями и принять соразмерное решение по партии.
topics: [lamellar-gel-network, rheology-basics]
transfer: batch-3108
dataNote: Учебный случай. Предприятие, документы и все числа вымышлены. Направление эффекта «сдвиг при охлаждении снижает вязкость» принято как условие сценария и требует экспертной оценки для конкретных составов.

hints:
  - "Прежде чем искать причину, проверьте, можно ли доверять числу 17 800: сравните условия измерения в протоколе ОКК с требованиями методики."
  - "Найдите в сводке по партиям ту, что сварена на том же сырье, что и 2417. Чем ещё эти две партии отличаются?"
  - "Сопоставьте стадию охлаждения в протоколе варки с пунктами технологической инструкции — запись на полях подскажет, что было сделано иначе."

brief:
  situation: |
    Четверг, 11:05. Вы — ведущий технолог фабрики. Звонит начальник смены: партия **2417** крема для рук
    (800 кг, реактор РГ-1000) выгружена в 09:45, но ОКК выдал заключение «не соответствует» по вязкости:
    **17 800 мПа·с** при норме 30 000–45 000.

    Линия фасовки зарезервирована под эту партию на завтра, 14:00. Начальник смены предлагает «подождать, она ещё наберёт».
    Начальник ОКК настаивает на браке.
  goal: Установить причину, оценить, каким данным можно доверять, и принять решение по партии и по предупреждению повторения.
  constraints: |
    Исходные документы доступны сразу. Дополнительные сведения запрашиваются у лаборатории и производства —
    у вас **7 единиц ресурса**, на всё их не хватит. Отмечайте в документах записи, которые считаете значимыми:
    на них будут опираться ваши выводы.

budget: 7

