requests:
  - id: r-remeasure
    title: Повторное измерение вязкости строго по методике М-07
    who: ОКК
    cost: 1
    lead: Результат завтра в 10:00 (за 4 часа до фасовки)
    result: |
      **13.11.2026, 10:05.** Проба партии 2417, возраст 24 ч 15 мин, термостатирование при 25,0 °C — 2,5 ч.
      RV, шпиндель 6, 10 об/мин, отсчёт 60 с.

      Результат: **24 600 мПа·с** (два параллельных: 24 400 и 24 800).

      Норма 30 000–45 000. *Измерение соответствует методике; результат ниже нормы.*
    value: high
    valueText: Единственный способ узнать истинное значение показателя. Без него нельзя утверждать ни что партия бракована, ни что «дефект» создан измерением.

  - id: r-scada
    title: Тренды температуры и оборотов из журнала контроллера реактора
    who: Служба КИПиА
    cost: 1
    lead: 30 минут
    result: |
      Выгрузка архива РГ-1000 за 12.11.2026:

      | Интервал | Гомогенизатор | Якорь | Вода в рубашке | T массы |
      |---|---|---|---|---|
      | 08:00–08:10 | 3000 об/мин | 30 | пар выкл. | 78 → 79 °C |
      | 08:10–08:52 | **3000 об/мин** | 20 | **9 °C (захоложенная)** | 79 → 41 °C |
      | 08:52–09:10 | выкл. | 20 | 9 °C | 41 → 39 °C |
      | 09:10–09:12 | 1500 об/мин | 20 | 9 °C | 39 °C |

      Средняя скорость охлаждения в интервале 08:10–08:52 — 0,9 °C/мин (в партиях 2409–2414 — около 0,55 °C/мин).
    value: mid
    valueText: Объективно подтверждает запись аппаратчика и уточняет, что вместе со сдвигом изменился и хладагент. Новой гипотезы не добавляет, но переводит «запись на полях» в приборный факт.

  - id: r-operator
    title: Беседа с аппаратчиком и мастером смены
    who: Вы лично
    cost: 1
    lead: 30 минут
    result: |
      **Аппаратчик Корнеев:** «Мойку сдали на сорок минут позже. Мастер сказала догонять. С гомогенизатором и холодной водой
      остывает быстрее — на геле для душа всегда так делаем, и ничего. В ТИ написано "выключить", но не написано почему».

      **Мастер Лапина:** «Разрешила устно. Отклонение не оформляли — параметры на выходе ведь в норме: 41 градус, время меньше.
      В графе "Отклонения" поставили "нет"».
    value: mid
    valueText: Объясняет, почему отступление произошло и почему не было оформлено, — это материал для предупреждающих действий, а не для определения причины.

  - id: r-micro
    title: Микроскопия партии 2417 и архивного образца партии 2414
    who: Лаборатория R&D
    cost: 1
    lead: 1 час
    result: |
      Оптический микроскоп, ×400, проходящий свет; разведение 1:10 водой.

      - Партия 2417: капли преимущественно 1–5 мкм, единичные до 8 мкм.
      - Партия 2414 (архив): капли преимущественно 1–5 мкм, единичные до 7 мкм.

      Различий в размере капель не выявлено. *Оценка визуальная, без подсчёта распределения.*
    value: mid
    valueText: Закрывает гипотезу о плохом эмульгировании. О состоянии гелевой сети обычная микроскопия не говорит.

  - id: r-dry
    title: Потеря массы при высушивании (содержание летучих)
    who: ОКК
    cost: 1
    lead: 3 часа
    result: |
      Высушивание при 105 °C до постоянной массы, два параллельных.

      Результат: **73,4 %** и 73,6 %. Расчётный интервал по рецептуре с учётом допусков: 72,5–74,5 %.

      *Лишней воды в партии нет.*
    value: mid
    valueText: Дёшево и однозначно закрывает гипотезу о лишней воде, которую запись в протоколе варки закрыть не может (остатки после мойки в него не попадают).

  - id: r-labraw
    title: Лабораторная варка 1 кг на цетеариловом спирте CA-2291 по стандартному режиму
    who: Лаборатория R&D
    cost: 3
    lead: Вязкость — завтра к 13:00
    result: |
      Варка 1 кг по рецептуре Р-112, сырьё из тех же партий, что в 2417. Гомогенизатор выключен перед охлаждением,
      охлаждение на водяной бане 28 °C, 25 мин до 40 °C.

      Вязкость через 24 ч при 25 °C по М-07: **34 500 мПа·с**.

      Для сравнения, лабораторные варки на CA-2104 в 2025–2026 гг.: 36 000–39 000 мПа·с.
    value: mid
    valueText: Показывает, что новое сырьё при правильном режиме даёт продукт в норме. Тот же вывод бесплатно следует из сводки по партиям (2414).

  - id: r-scaledown
    title: Лабораторная варка 1 кг с гомогенизатором, включённым до 41 °C, и форсированным охлаждением
    who: Лаборатория R&D
    cost: 3
    lead: Вязкость — завтра к 13:00
    result: |
      Варка 1 кг по рецептуре Р-112, сырьё из тех же партий, что в 2417. Гомогенизатор работал при охлаждении до 41 °C,
      охлаждение на ледяной бане, 11 мин до 41 °C.

      Вязкость через 24 ч при 25 °C по М-07: **22 900 мПа·с**.

      Образец, сваренный параллельно по стандартному режиму: 34 500 мПа·с.
      *Опыт не разделяет вклад сдвига и вклад быстрого охлаждения — оба условия изменены одновременно.*
    value: high
    valueText: Единственный опыт, который воспроизводит подозрительное условие при прочих равных, то есть превращает «совпадение по времени» в причинную связь.

  - id: r-centrifuge
    title: Центрифужный тест и закладка партии 2417 на 40 °C
    who: Лаборатория R&D
    cost: 2
    lead: Центрифуга — 2 часа; термошкаф — от 4 недель
    result: |
      Центрифугирование 3000 g, 30 мин, 25 °C: расслоения нет (как и у архивного образца 2414).

      Образцы заложены на 40 °C и на циклы −5/+40 °C; первые данные — через 4 недели.
    value: low
    valueText: Не помогает установить причину. Был бы нужен только для обоснования выпуска с отступлением от спецификации — а к завтрашнему решению данных хранения не будет.

hypotheses:
  - id: meas
    group: measurement
    title: Результат ОКК 17 800 мПа·с получен вне условий методики и занижен
    statuses:
      main:
        verdict: weak
        needs: [qc-temp, qc-age, spec-temp, spec-age]
        text: Вы правы в том, что измерение некорректно — проба тёплая (29,5 °C вместо 25,0) и свежая (40 минут вместо 24 часов), оба отступления занижают результат. Но назвать это основной причиной можно только после повторного измерения. Оно даёт 24 600 мПа·с — ниже нормы. Значит, артефакт объясняет часть разрыва, но не весь.
        noBasis: Вы назвали измерение основной причиной, не отметив ни одной записи об условиях измерения. Сравните строки «температура пробы» и «время измерения» в протоколе ОКК с п. 4 методики М-07.
      contrib:
        verdict: ok
        needs: [qc-temp, qc-age, spec-temp, spec-age, r-remeasure]
        text: Точно. Число 17 800 нельзя использовать для заключения — оно получено при 29,5 °C через 40 минут после выгрузки. Это не отменяет возможного реального дефекта, но меняет его масштаб — с «почти вдвое ниже нормы» до «на 18 % ниже».
        noBasis: Вывод верный, но в ваших отметках нет записей, на которых он основан. Основание — расхождение между условиями в протоколе ОКК (29,5 °C; 10:30) и требованиями М-07 (25,0 °C; 24 ч).
      excluded:
        verdict: wrong
        text: Измерение выполнено с двумя отступлениями от методики М-07 — по температуре и по возрасту пробы. Оба занижают результат. Заключение ОКК по такому измерению неправомерно, какой бы ни оказалась истинная вязкость.
      untested:
        verdict: wrong
        text: Данные для проверки были в исходных документах, запрос не требовался — достаточно сопоставить протокол ОКК с методикой М-07.

  - id: proc
    group: cause
    title: Гомогенизатор работал при охлаждении до 41 °C, охлаждение форсировано захоложенной водой
    statuses:
      main:
        verdict: ok
        needs: [br-homog, br-note, br-cool-start, r-scada, r-scaledown, trend-2417]
        text: Да. Это единственное, чем партия 2417 отличается от нормальной партии 2414, сваренной на том же сырье. Гелевая сеть формируется именно в интервале охлаждения, и партия прошла его под интенсивным сдвигом и вдвое быстрее обычного.
        noBasis: Гипотеза верна, но в ваших отметках нет записей, которые на неё указывают. Основание — строки 08:10 и 08:52 протокола варки, запись на полях и длительность охлаждения 42 минуты в сводке.
      contrib:
        verdict: weak
        text: Отступление от режима вы заметили, но оценили осторожнее, чем позволяют данные. Партия 2414 на том же сырье и при штатном режиме в норме — после этого сравнения режим охлаждения остаётся единственным существенным отличием.
      excluded:
        verdict: wrong
        text: Протокол варки фиксирует прямое нарушение п. 4.1 и 4.3 ТИ-112, причём на той стадии, где формируется структура крема. Исключить эту гипотезу нельзя — ни один документ ей не противоречит.
      untested:
        verdict: wrong
        text: Запись «гомогенизатор выкл. 08:52» и заметка на полях находятся в протоколе варки. Сопоставьте их с п. 4.1 инструкции.

  - id: raw
    group: cause
    title: Новая партия цетеарилового спирта CA-2291 с другим соотношением C16/C18
    statuses:
      main:
        verdict: wrong
        text: Соотношение C16/C18 действительно изменилось заметно (31/68 → 49/50), и это разумное подозрение. Но партия 2414 сварена на том же CA-2291 и показала 36 500 мПа·с. Сырьё не может быть основной причиной отклонения, которого не было на предыдущей партии.
      contrib:
        verdict: ok
        needs: [coa-ratio, r-labraw]
        text: Обоснованная позиция. Партия 2414 на этом сырье в норме, но у нижней границы прежнего разброса (36 500 против 37 800–39 200), и лабораторная варка даёт 34 500. Небольшой вклад сырья возможен; он не объясняет провала до 24 600.
        noBasis: Позиция разумная, но основание — строка «C16 / C18» в паспортах — у вас не отмечено.
      excluded:
        verdict: ok
        needs: [trend-2414, r-labraw]
        text: Как основная причина — исключена корректно. Партия 2414 на том же сырье в норме. Оговорка для отчёта — небольшое снижение (36 500 против 37 800–39 200) стоит отслеживать на следующих партиях.
        noBasis: Вывод верный, но основание не отмечено. Различающее наблюдение — строка партии 2414 в сводке — то же сырьё CA-2291, штатный режим, вязкость 36 500.
      untested:
        verdict: weak
        text: Проверка не требовала запроса — в сводке по партиям видно, что партия 2414 сварена на CA-2291 и соответствует норме.

  - id: water
    group: cause
    title: Лишняя вода в партии (остатки после мойки, ошибка дозирования)
    statuses:
      main:
        verdict: wrong
        text: Задержка мойки — законный повод подумать об остатках воды. Но данных в пользу этой гипотезы нет, а потеря массы при высушивании (73,4 % при расчётных 72,5–74,5) её опровергает.
      contrib:
        verdict: weak
        text: Подозрение понятно, но подтверждений нет. Гипотеза проверяется за три часа определением потери массы при высушивании.
      excluded:
        verdict: ok
        needs: [r-dry]
        text: Исключена корректно — содержание летучих в расчётном интервале.
        noBasis: Скорее всего вы правы, но оснований у вас нет. Запись «577,5 кг по расходомеру» говорит только о дозированной воде; вода, оставшаяся в аппарате и трубопроводах после задержанной мойки, в протокол варки не попадает. Гипотезу закрывает определение потери массы при высушивании.
      untested:
        verdict: ok
        text: Честная оценка. По имеющимся у вас данным гипотеза не проверена; закрыть её можно определением потери массы при высушивании (1 единица ресурса, 3 часа).

  - id: emul
    group: cause
    title: Недостаточное эмульгирование — крупные капли
    statuses:
      main:
        verdict: wrong
        text: Стадия эмульгирования проведена по инструкции (3000 об/мин, 10 мин, 78 °C), микроскопия различий с партией 2414 не показывает. К тому же в креме на гелевой сети вязкость определяется сетью в водной фазе, а не размером капель.
      contrib:
        verdict: wrong
        text: Параметры эмульгирования соответствуют инструкции, и данных о крупных каплях нет.
      excluded:
        verdict: ok
        needs: [br-emul, r-micro]
        text: Исключена корректно — параметры стадии соответствуют ТИ; микроскопия, если вы её запрашивали, это подтверждает.
        noBasis: Вывод верный, но основание не отмечено — строка 08:00–08:10 протокола варки или результат микроскопии.
      untested:
        verdict: weak
        text: Минимальное основание уже было в протоколе варки — параметры эмульгирования соответствуют ТИ.

  - id: dose
