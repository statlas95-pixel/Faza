dispositions:
  - id: release
    title: Выпустить партию на фасовку завтра в 14:00 — «она ещё наберёт»
    verdict: wrong
    text: Выпуск продукции без подтверждённого соответствия спецификации недопустим. Корректное измерение даёт 24 600 мПа·с — ниже нормы. Нарастание структуры после 24 часов возможно, но это предположение, а не результат.
  - id: hold
    title: Карантин, оформление отклонения, повторное измерение по методике — решение после результата
    verdict: ok
    text: Соразмерный первый шаг. Партия изолирована, фасовка перенесена, нарушение режима оформлено задним числом как отклонение, решение будет принято по корректным данным.
    variants:
      - when: [r-remeasure]
        verdict: weak
        text: Карантин и отклонение — правильно. Но результат повторного измерения вы уже получили (24 600 мПа·с, ниже нормы), поэтому «решение после результата» откладывает то, что уже можно решать — переработку или списание.
  - id: rework
    title: Карантин и отклонение; переработка — повторный нагрев до 75–80 °C и охлаждение по ТИ, с расширенным контролем
    verdict: weak
    text: Переработка возможна, но вы назначаете её, не назвав нарушение режима основной причиной. Если причина в другом, повторный цикл её не устранит, а партия получит вторую термическую нагрузку.
    variants:
      - when: ["main:proc"]
        verdict: ok
        text: Решение следует из вашего вывода о причине. Если структура испорчена режимом охлаждения, повторное плавление и охлаждение по инструкции — логичный способ её восстановить. Условия — оформленное и согласованное службой качества отклонение, предварительная проверка на лабораторной пробе, расширенный контроль после переработки (вязкость через 24 ч, микробиология, запах и содержание консерванта после второго нагрева).
  - id: scrap
    title: Забраковать и утилизировать партию
    verdict: weak
    text: Допустимо, но преждевременно — 800 кг списываются без оценки возможности переработки. К такому решению приходят, если переработка технически невозможна или не согласована службой качества.
  - id: concession
    title: Выпустить по разовому расширенному допуску (от 24 000 мПа·с)
    verdict: wrong
    text: Расширять допуск под результат конкретной партии — значит подгонять спецификацию под брак. Для такого решения нужны данные о стабильности и потребительских свойствах продукта с такой вязкостью; к завтрашнему дню их не будет.

capaMax: 3
capa:
  - id: interlock
    title: Изменить ТИ-112 и рецепт контроллера — запрет охлаждения при включённом гомогенизаторе, с объяснением причины в тексте ТИ
    verdict: ok
    text: Устраняет причину технически и закрывает пробел, на который указал аппаратчик — в инструкции не было сказано, зачем требование.
  - id: train
    title: Провести разбор случая со сменами — как режим охлаждения влияет на структуру крема
    verdict: ok
    text: Аппаратчик перенёс на крем приём, безвредный для геля для душа. Это пробел в понимании, а не недисциплинированность.
  - id: deviation
    title: Закрепить правило — любое отступление от ТИ оформляется как отклонение до выполнения; пересмотреть графики с учётом мойки
    verdict: ok
    text: Устное разрешение и «отклонений нет» в протоколе — системная проблема. Причиной была спешка из-за задержанной мойки.
  - id: qc-rule
    title: Запретить ОКК выдавать заключение по вязкости вне условий М-07; экспресс-измерение помечать как ориентировочное
    verdict: ok
    text: Заключение «не соответствует» по измерению при 29,5 °C через 40 минут — отдельная ошибка, которая могла привести к неверному решению в любую сторону.
  - id: incoming
    title: Добавить во входной контроль цетеарилового спирта нормирование соотношения C16/C18
    verdict: weak
    text: Разумная мера на перспективу — соотношение изменилось заметно, и показатель сейчас не нормируется. Но к причине этого отклонения она не относится.
  - id: punish
    title: Дисциплинарное взыскание аппаратчику
    verdict: wrong
    text: Аппаратчик действовал с разрешения мастера и записал свои действия в протокол. Наказание не устраняет причин (спешка, отсутствие объяснения в ТИ, отсутствие блокировки) и приучит не записывать отступления.
  - id: more-wax
    title: Увеличить долю цетеарилового спирта в рецептуре на 0,5 % «для запаса»
    verdict: wrong
    text: Это маскирует нарушение режима изменением рецептуры и меняет продукт для всех будущих партий.

rubric:
  - id: measurement
    title: Достоверность измерения
    text: Проверено ли, что результату можно доверять, прежде чем расследовать причину.
  - id: cause
    title: Гипотезы и их основания
    text: Соответствует ли статус каждой гипотезы данным, и видели ли вы эти данные.
  - id: disposition
    title: Решение по партии
    text: Соразмерно ли решение тому, что установлено.
  - id: capa
    title: Предупреждение повторения
    text: Направлены ли меры на системные причины.

debrief:
  story: |
    **Что произошло в этом сценарии.** Мойка реактора закончилась на 40 минут позже. Чтобы догнать график, смена охлаждала партию
    захоложенной водой (9 °C вместо 25–30 °C) и не выключила гомогенизатор. Партия прошла интервал формирования
    гелевой сети за 42 минуты вместо обычных 70 и под интенсивным сдвигом. Отступление согласовали устно и не оформили.

    ОКК по просьбе производства измерил вязкость сразу — тёплой и «молодой» пробы — и получил 17 800 мПа·с.
    Истинное значение по методике — 24 600 мПа·с: партия действительно ниже нормы, но разрыв в 2,3 раза меньше, чем казалось.

    Смена сырья — совпадение по времени: предыдущая партия на том же цетеариловом спирте в норме.
  principle: |
    1. **Сначала — можно ли верить числу.** Проверка условий измерения ничего не стоит и меняет масштаб проблемы.
    2. **Ищите, что изменилось, и то, что не изменилось.** Партия 2414 — готовый контрольный опыт: то же сырьё, другой режим.
    3. **Совпадение по времени — не причина.** Гипотезу подтверждает наблюдение, которое различает её и альтернативы.
    4. **Решение должно следовать из установленного**, а меры — устранять условия, в которых ошибка стала возможной.
