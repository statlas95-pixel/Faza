id: stability-triage
engine: triage
order: 53
area: rnd
role: Руководитель R&D и претензионной лаборатории
minutes: 12
title: "Триаж рекламаций рынка: 4 расследования деградации и расслоения"
summary: "Разберите четыре реальные претензии дистрибьюторов (побуревший витамин C, вздутый крем с мочевиной, зернистый бальзам ши и полосящий тональный флюид): установите точный физико-химический механизм и инженерное решение."
skill: "Диагностировать корневой механизм химической и коллоидной деградации по симптомам рекламации и назначать адресную переработку рецептуры и процесса."
topics: [unstable-actives, pigment-dispersions, anhydrous-sticks-balms]
cases:
  - id: vitc-browning
    product: "Кейс 1 · Водная сыворотка «Сияние 15 % L-Ascorbic Acid» в прозрачном флаконе с пипеткой"
    complaint: "Жалоба сети: через 2 месяца на полке сыворотка потемнела до цвета крепкого чая, а резиновая груша пипетки надулась."
    labFindings: "Архивный образец (+4 °C): бесцветный, pH 3,9. Образец с полки: тёмно-янтарный, pH 3,7, в рецептуре нет хелатора и феруловой кислоты; следы Fe³⁺ из воды 0,15 мг/л."
    mechanisms:
      - id: asc-ox
        text: "Металл-катализируемое и фотоокисление аскорбат-иона в дегидроаскорбиновую и 2,3-дикетогулоновую кислоту с декарбоксилированием (выделение CO₂ и бурых фурфуралов)"
        correct: true
        why: "Точно! Необратимый гидролиз лактонного кольца ДГАК даёт 2,3-ДКГК, газообразный CO₂ (вздутие пипетки) и темноокрашенные полимеры."
      - id: asc-micro
        text: "Рост чёрной плесени при pH 3,7 без изменения химии витамина C"
        why: "Посев стерилен; равномерное янтарное окрашивание и CO₂ — классическая картина окислительного распада L-аскорбиновой кислоты."
      - id: asc-freeze
        text: "Обратимая кристаллизация воды на витрине"
        why: "Окрашивание в бурый цвет необратимо и вызвано химической деградацией."
    fixes:
      - id: asc-fix-ok
        text: "Опустить pH в окно 2,8–3,2, ввести 0,5 % Ferulic Acid + 1 % Tocopherol + 0,1 % Disodium EDTA, барботировать азотом и перевести в непрозрачный airless"
        correct: true
        why: "Верно! Низкий pH удерживает неионизированную форму H₂A, ЭДТА связывает железо, триада C+E+феруловая гасит радикалы, а airless отсекает O₂ и свет."
      - id: asc-fix-ph7
        text: "Поднять pH L-аскорбиновой кислоты до 7,0 щёлочью NaOH и оставить прозрачную пипетку"
        why: "При pH 7,0 чистая L-аскорбиновая кислота полностью ионизирована и окисляется до бурого цвета за считанные дни!"
      - id: asc-fix-parfum
        text: "Добавить жёлтый краситель и 1 % отдушки, чтобы скрыть потемнение"
        why: "Маскировка деградации не сохраняет активность витамина C и не убирает газовыделение CO₂."
  - id: urea-ammonia
    product: "Кейс 2 · Кератолитический крем для стоп с 10 % Urea (мочевины) в ламинатной тубе"
    complaint: "Жалоба дистрибьютора с южного склада (+35…+40 °C): тубы раздулись «подушкой», при открытии резкий запах нашатыря."
    labFindings: "Стартовый pH при выпуске был 5,8 (без буфера, подведён каплей лимонной кислоты). В рекламационных тубах pH = 8,65."
    mechanisms:
      - id: urea-hyd
        text: "Термический гидролиз мочевины в водной среде на аммиак (NH₃ — резкий запах и скачок pH > 8,5) и углекислый газ (CO₂ — вздутие тубы)"
        correct: true
        why: "Верно! CO(NH₂)₂ + H₂O → 2 NH₃ + CO₂; без буферной ёмкости первые следы аммиака сдвигают pH вверх, ускоряя распад эмульсии и консервантов."
      - id: urea-ox
        text: "Прогоркание минерального масла с выделением метана"
        why: "Запах нашатыря и скачок pH до 8,65 однозначно указывают на аммиак от распада мочевины."
      - id: urea-pack
        text: "Растворение алюминиевого барьера тубы чистой водой"
        why: "Ламинатная туба имеет внутренний ПЭ-слой; газ изнутри — это CO₂ от гидролиза небуферизованной мочевины."
    fixes:
      - id: urea-fix-ok
        text: "Заложить лактатный буфер высокой ёмкости (Lactic Acid + Sodium Lactate ~2–3 % при pH 5,2–5,8) в связке со сложным эфиром-стабилизатором (Triacetin / Triethyl Citrate)"
        correct: true
        why: "Эталонное решение! Лактатный буфер удерживает pH, а сложный эфир при локальном подщелачивании отщепляет кислоту и нейтрализует аммиак in-situ."
      - id: urea-fix-boil
        text: "Варить мочевину в фазе A при 85 °C в течение 2 часов, чтобы «выгнать газ заранее»"
        why: "Нагрев раствора мочевины выше 45–50 °C разрушит её прямо в варочном котле ещё до фасовки!"
      - id: urea-fix-carbomer
        text: "Увеличить Carbomer до 1,5 % без буфера"
        why: "Соли буфера и образующийся карбонат аммония всё равно разжижат карбомер и не остановят гидролиз."
  - id: balm-bloom
    product: "Кейс 3 · Безводный питательный стик-бальзам для губ с 35 % масла ши и 15 % кокосового масла"
    complaint: "Жалоба покупателей: стик царапает губы твёрдыми белыми крупинками («песок»), хотя при растирании между пальцами крупинки полностью тают."
    labFindings: "Партия разливалась при 62 °C и медленно остывала в закрытых коробах на паллете 12 часов; в рецептуре только пчелиный воск и растительные баттеры."
    mechanisms:
      - id: shea-poly
        text: "Фракционная кристаллизация и полиморфный переход высокоплавких стеариновых триглицеридов масла ши (SOS/SSO) при медленном охлаждении в крупные твёрдые β-сферолиты"
        correct: true
        why: "Верно! При медленном остывании высокоплавкие триглицериды успевают сегрегироваться из жидких олеиновых фракций в крупные зернистые кристаллы."
      - id: shea-sand
        text: "Загрязнение кварцевым песком из мешков сырья"
        why: "Кварцевый песок не тает при температуре тела 36–37 °C на пальцах!"
      - id: shea-sugar
        text: "Кристаллизация глюкозы из масла ши"
        why: "Рафинированное масло ши состоит из триглицеридов и неомыляемой фракции и не содержит свободных сахаров."
    fixes:
      - id: shea-fix-ok
        text: "Прогреть жировую фазу на 15–20 °C выше точки плавления (75–80 °C для стирания «памяти кристаллов»), ввести 3–5 % микрокристаллического воска / Polyglyceryl-3 Beeswax и обеспечить быстрое активное охлаждение форм"
        correct: true
        why: "Верно! Разветвлённые углеводороды микрокристаллического воска и быстрое охлаждение блокируют рост крупных β-сферолитов, давая гладкую микрокристаллическую сетку."
      - id: shea-fix-slow
        text: "Укутать горячие пеналы термоодеялом, чтобы остывали 48 часов"
        why: "Чем медленнее охлаждение баттера ши, тем крупнее вырастают зернистые кристаллы!"
      - id: shea-fix-water
        text: "Влить в безводный расплав 10 % воды без эмульгатора"
        why: "Вода не смешается с расплавом восков и отслоится на дне пенала."
  - id: foundation-streak
    product: "Кейс 4 · Устойчивый тональный флюид W/O (14 % смеси TiO₂ и жёлтого/красного/чёрного оксидов железа в летучем эмоленте)"
    complaint: "Жалоба визажистов: во флаконе отслоилось прозрачное масло сверху, а при нанесении на кожу тон ложится рыжими и белыми полосами («распадается цвет»)."
    labFindings: "При удешевлении заменили силанизированные пигменты на необработанные и убрали Polyhydroxystearic Acid; микроскопия показывает рыхлые агломераты 25–40 мкм."
    mechanisms:
      - id: pig-floc
        text: "Дифференциальная флокуляция и седиментация гидрофильных пигментов разной плотности/размера в неполярной среде без стерического диспергатора и реологического предела текучести"
        correct: true
        why: "Точно! Необработанные TiO₂ и оксиды железа по-разному слипаются в неполярном масле — при сдвиге на коже агломераты размазываются в цветные полосы (color flooding/streaking)."
      - id: pig-chem
        text: "Химическое восстановление диоксида титана до металлического титана при 25 °C"
        why: "TiO₂ и оксиды железа термически и химически сверхстабильны; дефект чисто коллоидно-дисперсионный."
      - id: pig-evap
        text: "Полное испарение оксидов железа через закрытую крышку"
        why: "Неорганические пигменты абсолютно нелетучи."
    fixes:
      - id: pig-fix-ok
        text: "Вернуть гидрофобно обработанные пигменты (Triethoxycaprylylsilane / Methicone), ввести 1,0–1,5 % Polyhydroxystearic Acid, размолоть пасту до D90 < 5 мкм и создать предел текучести органоглиной (Disteardimonium Hectorite)"
        correct: true
        why: "Безупречно! Гидрофобная прививка снижает краевой угол смачивания, PHSA даёт стерический барьер против слипания, а гекторит предотвращает оседание и синерезис масла."
      - id: pig-fix-spoon
        text: "Перемешивать необработанные порошки якорной мешалкой на 40 об/мин без диспергатора"
        why: "Якорная мешалка не создаёт сдвиговых напряжений для разрушения сухих агломератов пигмента."
      - id: pig-fix-edta
        text: "Добавить 0,2 % Disodium EDTA в масляную фазу"
        why: "Динатрий ЭДТА нерастворим в масле и не стабилизирует суспензии пигментов."
brief:
  situation: "На утреннем совещании по качеству на ваш стол легли четыре срочные рекламации с рынка и дистрибьюторских складов: сыворотка с витамином C, крем с 10 % мочевины, бальзам для губ с маслом ши и тональный флюид W/O."
  goal: "Для каждого из четырёх продуктов установите точный физико-химический механизм брака и утвердите системную доработку рецептуры и технологии."
  constraints: "Оцениваются обе части каждого расследования (механизм + инженерное решение = 8 контрольных точек)."
dataNote: "Четыре типовых промышленных кейса претензионной лаборатории R&D, опирающиеся на кинетику деградации активов, полиморфизм триглицеридов и коллоидную химию пигментных паст."
hints:
  - "Газовыделение в водной аскорбиновой кислоте и в креме с мочевиной имеет общий газообразный продукт декарбоксилирования/гидролиза — CO₂, но pH при этом ведёт себя противоположно!"
  - "Если крупинки в безводном бальзаме полностью тают на коже при 36 °C — это полиморфные кристаллы высокоплавких триглицеридов, а не механическая примесь."
transfer:
  title: "Перенос: проба Гринделя (шкала степени перетира по ГОСТ / ISO 1524)"
  intro: "Технолог проверяет готовность пигментной пасты тонального крема на клине «гриндометра» (шкала от 50 мкм до 0 мкм): сплошные царапины начинаются уже на отметке 32 мкм."
  questions:
    - type: mc
      q: "Можно ли передавать такую пигментную пасту на объединение с эмульсией?"
      options:
        - text: "Нет: агломераты 32 мкм дадут тусклый оттенок, полошение на коже и быстрое оседание — нужен домол на бисерной мельнице / высокосдвиговом диспергаторе до перетира < 5–10 мкм"
          correct: true
          why: "Верно! Полная красящая сила и гладкая сенсорика тональной эмульсии раскрываются только при разрушении агломератов ниже 5–10 мкм по клину Гринделя."
        - text: "Да, чем крупнее куски пигмента, тем выше укрывистость"
          why: "Слипшиеся агломераты прячут внутреннюю поверхность частиц и резко снижают укрывистость (красящую силу) на грамм пигмента!"
        - text: "Достаточно процедить через сито 1 мм"
          why: "Сито 1000 мкм никак не задержит агломераты размером 32 мкм."
