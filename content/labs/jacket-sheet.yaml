# Занятие-расчёт (движок worksheet). ВСЕ ДАННЫЕ — УЧЕБНЫЕ: коэффициенты теплоотдачи — порядки величин для иллюстрации.
id: jacket-sheet
engine: worksheet
order: 16
title: "Рубашка реактора: где теряется тепло"
summary: Охлаждение крема на реакторе стало медленнее. Механик предлагает увеличить расход воды, мастер — снизить её температуру. Найдите лимитирующее сопротивление и оцените, какая мера действительно ускорит охлаждение.
area: production
role: Технолог варочного участка
minutes: 15
skill: Анализ теплообмена в аппарате — рассчитать коэффициент теплопередачи через сумму сопротивлений, найти лимитирующее звено и выбрать эффективную меру.
topics: [heat-transfer, scale-up]
dataNote: Учебные данные. Коэффициенты теплоотдачи — типичные порядки величин; для реального аппарата их определяют по паспорту или по записи температуры партии.
hints:
  - "1/K = 1/α₁ + δ/λ + 1/α₂. Толщину стенки переведите в метры."
  - "Сравните слагаемые: самое большое и определяет K."

brief:
  situation: |
    Реактор Р-5, площадь рубашки 4 м². После замены якорной мешалки (скребки поставили «временно» без прижима) охлаждение крема от 75 до 40 °C стало заметно дольше.
    Механик предлагает увеличить расход воды в рубашке, мастер — перейти на захоложенную воду.
  goal: Найти, какое звено ограничивает теплообмен, и выбрать меру.
  constraints: Данные — в выписке. Подсказку можно открыть у любого вопроса.

sheet:
  title: Данные по теплообмену реактора Р-5 (учебные)
  origin: Паспорт аппарата и оценки службы главного механика.
  rows:
    - ["Площадь рубашки", "4 м²"]
    - ["Стенка", "нержавеющая сталь, 6 мм, λ = 16 Вт/(м·К)"]
    - ["Теплоотдача со стороны воды, α₂", "2000 Вт/(м²·К) при штатном расходе"]
    - ["Теплоотдача со стороны крема, α₁, скребки без прижима", "150 Вт/(м²·К)"]
    - ["Теплоотдача со стороны крема, α₁, исправные скребки", "600 Вт/(м²·К)"]
    - ["Разность температур продукт — вода (средняя оценка)", "40 К"]

steps:
  - title: Коэффициент теплопередачи сейчас
    text: Скребки стоят без прижима, α₁ = 150 Вт/(м²·К).
    questions:
      - type: num
        q: Каков коэффициент теплопередачи K, Вт/(м²·К)?
        answer: 132.6
        tol: 0.02
        unit: Вт/(м²·К)
        hint: "1/K = 1/150 + 0,006/16 + 1/2000 = 0,00667 + 0,000375 + 0,0005."
        explain: "1/K = 0,007542 м²·К/Вт; K ≈ 132,6 Вт/(м²·К)."
      - type: num
        q: Какую долю общего сопротивления составляет сторона продукта, %?
        answer: 88.4
        tol: 0.02
        unit: "%"
        hint: "0,00667 / 0,007542."
        explain: "≈ 88 %. Сторона продукта — лимитирующее звено."
      - type: num
        q: Какой тепловой поток снимает рубашка, кВт?
        answer: 21.2
        tol: 0.02
        unit: кВт
        hint: "Q = K·A·ΔT = 132,6 · 4 · 40."
        explain: "≈ 21,2 кВт."
  - title: Предложения механика и мастера
    text: Механик увеличит расход воды так, что α₂ вырастет до 3000 Вт/(м²·К).
    questions:
      - type: num
        q: Каким станет K при α₂ = 3000 Вт/(м²·К), Вт/(м²·К)?
        answer: 135.6
        tol: 0.02
        unit: Вт/(м²·К)
        hint: "1/K = 0,00667 + 0,000375 + 0,000333."
        explain: "1/K = 0,007375; K ≈ 135,6 Вт/(м²·К) — рост всего около 2 %."
      - type: mc
        q: Мастер предлагает захоложенную воду. Что это даст и чем рискованно?
        options:
          - { text: "Ничего не даст — K не изменится", why: "K действительно почти не изменится, но вырастет разность температур, а значит и поток тепла." }
          - { text: "Поток вырастет за счёт разности температур, но слой крема у стенки переохладится и застынет раньше объёма — сопротивление растёт, структура у стенки и в объёме разная", correct: true, why: "Мера помогает частично и требует проверки свойств продукта." }
          - { text: "Ускорит охлаждение в разы без побочных эффектов", why: "Лимитирующее звено — сторона продукта, и холодная стенка его не устраняет." }
  - title: Решение
    text: Исправные скребки с прижимом дают α₁ = 600 Вт/(м²·К).
    questions:
      - type: num
        q: Каким станет K с исправными скребками (α₂ штатный, 2000), Вт/(м²·К)?
        answer: 393.4
        tol: 0.02
        unit: Вт/(м²·К)
        hint: "1/K = 1/600 + 0,000375 + 0,0005."
        explain: "1/K = 0,002542; K ≈ 393 Вт/(м²·К) — втрое больше, чем сейчас."
      - type: mc
        q: Что записать в план мероприятий?
        options:
          - { text: "Увеличить расход воды", why: "Даёт около 2 % — не устраняет причину." }
          - { text: "Восстановить прижим скребков; добавить контроль их состояния в график ТО и проверку времени охлаждения партии как индикатор", correct: true, why: "Устраняет лимитирующее сопротивление и даёт способ заметить проблему в будущем." }
          - { text: "Перейти на захоложенную воду", why: "Вторичная мера с риском для структуры продукта." }

transfer:
  title: "Перенос: другой аппарат"
  intro: |
    Реактор со стенкой 8 мм (λ = 16 Вт/(м·К)), α₁ = 300 Вт/(м²·К), α₂ = 2500 Вт/(м²·К).
  questions:
    - type: num
      q: Каков коэффициент теплопередачи, Вт/(м²·К)?
      answer: 236.2
      tol: 0.02
      unit: Вт/(м²·К)
      explain: "1/K = 1/300 + 0,008/16 + 1/2500 = 0,003333 + 0,0005 + 0,0004 = 0,004233; K ≈ 236 Вт/(м²·К)."
    - type: mc
      q: Если стенку заменить на 4 мм, насколько вырастет K?
      options:
        - { text: "Вдвое", why: "Стенка — малая часть сопротивления." }
        - { text: "Примерно на 6 %", correct: true, why: "1/K = 0,003333 + 0,00025 + 0,0004 = 0,003983; K ≈ 251 — рост около 6 %." }
        - { text: "Не изменится вовсе", why: "Немного изменится — но стенка не лимитирует." }
    - type: num
      q: На сколько процентов сопротивления приходится сторона продукта в этом аппарате?
      answer: 78.7
      tol: 0.02
      unit: "%"
      explain: "0,003333 / 0,004233 ≈ 0,787 — около 79 %."
