# Занятие по планированию эксперимента. Движок: doe. Модель отклика и бюджет можно менять здесь.
# ВСЕ ДАННЫЕ — СИНТЕТИЧЕСКИЕ: отклик считается по формуле ниже с воспроизводимым случайным разбросом.

id: doe-gel
engine: doe
order: 7
title: "Десять опытов: гель с активом"
summary: Три фактора, бюджет на десять лабораторных варок и обязательный актив, который снижает вязкость. Составьте план опытов сами — разбор покажет, какие выводы он позволял сделать, а какие остались догадкой.
area: rnd
role: Разработчик рецептур
minutes: 25
skill: Планирование эксперимента — распределить ограниченный бюджет опытов так, чтобы оценить эффекты, взаимодействие и шум, и отделить доказанный вывод от предположения.
topics: [doe-basics, rheology-basics]
dataNote: Синтетический эксперимент. Вязкость рассчитывается по линейной модели с взаимодействием и нормальным разбросом (стандартное отклонение 2 Па·с); разброс воспроизводим в пределах попытки и меняется между попытками. Числа не относятся к конкретному сырью.

hints:
  - "Сформулируйте вопрос как решение: какая рецептура должна оказаться в норме? Её стоит сварить напрямую."
  - "Чтобы увидеть, зависит ли действие актива от уровня загустителя, нужны все четыре сочетания этих двух факторов."
  - "Оставьте часть бюджета на повторы: без них вывод «не влияет» ничем не подтверждён."

brief:
  situation: |
    Вы — разработчик рецептур. Нужен гель с вязкостью **38–46 Па·с**. Маркетинг требует ввести увлажняющий актив
    на основе соли органической кислоты в дозировке **2 %** — без него продукт не выйдет. Коллега предупреждает:
    «Актив роняет вязкость, заложи загустителя с запасом». Насколько — никто не измерял.
  goal: |
    Определить, какой уровень загустителя нужен при 2 % актива, влияет ли скорость мешалки при нейтрализации
    и можно ли доверять прогнозу. Затем — дать прогноз вязкости для выбранной рецептуры.
  constraints: |
    Бюджет — **10 лабораторных варок**. Каждая варка — одно сочетание уровней трёх факторов.
    Опыты можно ставить в несколько заходов: посмотреть результаты и спланировать следующие.

budget: 10
unit: Па·с
target: { min: 38, max: 46 }
factors:
  - { id: A, name: "Загуститель (полимер)", low: "0,3 %", high: "0,5 %" }
  - { id: B, name: "Актив (соль органической кислоты)", low: "0 %", high: "2 %" }
  - { id: C, name: "Скорость мешалки при нейтрализации", low: "50 об/мин", high: "150 об/мин" }
# y = b0 + a·A + b·B + c·C + ab·A·B, уровни кодированы −1/+1
model: { b0: 42, a: 12, b: -9, c: 0, ab: -5, sigma: 2 }

transfer:
  title: "Перенос: два фактора, четыре опыта"
  intro: |
    Другая рецептура — крем-гель. Изучались масло (A: 5 % и 15 %) и эмульгатор (B: 1 % и 3 %). Отклик — вязкость, Па·с.
    Результаты: (A−, B−) = 20; (A+, B−) = 30; (A−, B+) = 26; (A+, B+) = 50.
  questions:
    - type: num
      q: Чему равен главный эффект масла (A)?
      answer: 17
      tol: 0.03
      unit: Па·с
      explain: "((30 − 20) + (50 − 26)) / 2 = (10 + 24) / 2 = 17."
    - type: num
      q: Чему равно взаимодействие AB?
      answer: 7
      tol: 0.05
      unit: Па·с
      explain: "((50 − 26) − (30 − 20)) / 2 = (24 − 10) / 2 = 7."
    - type: num
      q: Какой прогноз для точки (A+, B+) дал бы подход «по одному фактору» от базы (A−, B−)?
      answer: 36
      tol: 0.03
      unit: Па·с
      explain: "20 + (30 − 20) + (26 − 20) = 36. Факт — 50; разница 14 равна удвоенному взаимодействию."
    - type: mc
      q: Все четыре опыта поставлены по одному разу. Что из перечисленного утверждать нельзя?
      options:
        - { text: "Оценки эффектов A, B и взаимодействия AB", why: "Их можно вычислить — четыре опыта дают четыре оценки (среднее и три эффекта)." }
        - { text: "Что взаимодействие 7 Па·с превышает случайный разброс", correct: true, why: "Без повторных опытов разброс неизвестен. Взаимодействие вычислено, но отличить его от шума нечем." }
        - { text: "Что прогноз «по одному фактору» расходится с фактом в этой точке", why: "Это прямое сравнение двух чисел; оно верно для этих данных." }
