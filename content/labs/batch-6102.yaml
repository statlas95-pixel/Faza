  - { id: measurement, title: Достоверность результата, text: Подтверждён ли результат до принятия необратимого решения. }
  - { id: cause, title: Источник и причина слабой защиты, text: "Найдены ли оба пути и на что опираются выводы." }
  - { id: disposition, title: Решение по партии, text: Соразмерно ли оно установленному. }
  - { id: capa, title: Предупреждение повторения, text: "Закрывают ли меры условия, а не симптом." }

debrief:
  story: |
    **Что произошло в этом сценарии.** Санитарную обработку петли воды перенесли из-за ремонта насоса; микрофлора в точке отбора росла три недели,
    и в день варки вода уже не соответствовала норме — но результат анализа пришёл через три дня. Одновременно в варке не хватило раствора лимонной кислоты:
    ввели остаток, pH остался 6,4. При таком pH консерванты — соли слабых кислот — почти полностью диссоциированы, и защита, подтверждённая при pH 5,3, не работает.

    Каждая причина по отдельности, вероятно, не дала бы отклонения: партия 6098 сварена на воде с 62 КОЕ/мл при правильном pH и осталась в норме.
  principle: |
    1. **Сначала подтвердить результат** — один посев без контроля не основание для необратимого решения.
    2. **Два вопроса — два ответа:** откуда пришли микроорганизмы и почему рецептура их не подавила [@halla2018].
    3. **Защита подтверждена только в условиях теста** [@iso11930]: партия вне рабочего интервала pH остаётся без подтверждения.
    4. **Партию не «лечат»**; закрывают условия, в которых отклонение стало возможным.

transferQuiz:
  title: "Перенос: другой консервант, другой pH"
  intro: |
    Новая рецептура — тоник с бензоатом натрия (pKa бензойной кислоты ≈ 4,2, справочно). Маркетинг просит поднять pH с 4,5 до 5,5 «для мягкости».
  questions:
    - type: num
      q: Какова доля недиссоциированной бензойной кислоты при pH 4,5? Ответ в процентах.
      answer: 33.4
      tol: 0.06
      unit: "%"
      explain: "1/(1 + 10^(4,5 − 4,2)) = 1/(1 + 2,0) ≈ 33 %."
    - type: num
      q: А при pH 5,5? Ответ в процентах.
      answer: 4.77
      tol: 0.08
      unit: "%"
      explain: "1/(1 + 10^(5,5 − 4,2)) = 1/(1 + 20) ≈ 4,8 %. Доля действующей формы упала примерно в 7 раз."
    - type: mc
      q: Что из этого следует для решения о смене pH?
      options:
        - { text: "Достаточно увеличить дозировку бензоата в 7 раз", why: "Дозировки консервантов ограничены нормативно, а расчёт доли — только первый ориентир: защиту подтверждают испытанием." }
        - { text: "Продукт с pH 5,5 — новая рецептура с точки зрения защиты: нужна новая оценка и, вероятно, другая консервирующая система", correct: true, why: "Прежний тест относился к pH 4,5. Изменение pH на единицу меняет защиту в разы — это повод для повторной оценки по принятой методике." }
        - { text: "Ничего: концентрация консерванта не меняется", why: "Меняется доля действующей формы — та самая, от которой зависит защита." }
