# Занятие-расследование (движок investigation). ВСЕ ДАННЫЕ — УЧЕБНЫЕ: предприятие, документы и числа вымышлены.
id: batch-6102
engine: investigation
order: 8
title: "Партия 6102: рост в лосьоне"
summary: Микробиология не пропускает партию лосьона. Консервант введён по рецептуре, сырьё чистое. Найдите, откуда пришла контаминация и почему защита рецептуры не сработала, — это разные записи в разных документах.
area: both
role: Технолог, ответственный за расследование отклонения
minutes: 30
skill: Расследование микробиологического отклонения — разделить источник контаминации и причину слабой защиты, подтвердить результат и выбрать меры, закрывающие оба пути.
topics: [preservation]
dataNote: Учебный случай. Числа микробиологических показателей и нормы — внутренние нормы вымышленного предприятия, а не требования регламента. Значения pKa — справочные.

hints:
  - "Разделите два вопроса: откуда микроорганизмы попали в партию и почему консервирующая система их не подавила."
  - "По первому вопросу посмотрите журнал системы водоподготовки: и график обработки, и тренд точки отбора."
  - "По второму — сравните pH партии в протоколе варки с интервалом, для которого подтверждена защита, и посмотрите, сколько кислоты введено."

brief:
  situation: |
    Пятница. Микробиологическая лаборатория сообщает результат по партии **6102** лосьона для тела (600 кг, сварена в понедельник):
    общее число микроорганизмов **6,4·10³ КОЕ/г** при внутренней норме не более 1·10³. Партия расфасована и стоит на карантинном складе.
    Начальник производства предлагает «добавить консерванта и перефасовать».
  goal: Установить, откуда микроорганизмы попали в партию и почему консервирующая система их не подавила; принять решение по партии и по мерам.
  constraints: |
    Исходные документы доступны сразу. На дополнительные исследования — **5 единиц ресурса**.
    Отмечайте записи, на которые будете опираться.

budget: 5

documents:
  - id: micro
    title: Протокол микробиологических испытаний
    short: Протокол микробиологии
    origin: Составляет микробиолог по результатам посева пробы готовой продукции; результат готов через 3–5 суток после отбора.
    header:
      - [Форма, "Ф-МБ-03, ред. 2"]
      - [Продукт / партия, "Лосьон для тела ГП-0610 / ~6102"]
      - [Проба отобрана, "~09.11.2026, из первой паллеты"]
      - [Результат выдан, "~13.11.2026"]
    sections:
      - title: Результаты
        columns: [Показатель, Внутренняя норма СП-0610, Результат, Примечание]
        rows:
          - { id: mb-count, cells: ["Общее число мезофильных аэробных микроорганизмов, КОЕ/г", "не более 1·10³", "~6,4·10³", "~один посев"] }
          - { cells: ["Дрожжи и плесневые грибы, КОЕ/г", "не более 1·10²", "~менее 10", ""] }
          - { cells: ["Специфицированные микроорганизмы в 1 г", "не допускаются", "~не обнаружены", ""] }
          - { id: mb-morph, cells: ["Морфология преобладающих колоний", "—", "~грамотрицательные палочки, оксидаза +", "~идентификация не проводилась"] }
    footer:
      - [Заключение, "~НЕ СООТВЕТСТВУЕТ по общему числу микроорганизмов"]
      - [Микробиолог, "~Савина"]

  - id: br
    title: Протокол изготовления партии (выписка)
    short: Протокол варки
    origin: Заполняет аппаратчик по ходу варки; проверяет мастер смены.
    header:
      - [Продукт, "Лосьон для тела ГП-0610, рецептура Р-140 ред. 2"]
      - [Партия / дата, "~6102 / 09.11.2026"]
      - [Аппарат, "Р-2, 800 л"]
    sections:
      - title: Загрузка и контрольные точки
        columns: [Операция, По рецептуре / норма, Факт, Подпись]
        rows:
          - { id: br-water, cells: ["Вода очищенная, точка отбора П-4", "468 кг", "~468 кг", "~Жук."] }
          - { id: br-pres, cells: ["Бензоат натрия / сорбат калия", "2,40 кг / 1,20 кг", "~2,40 / 1,20, две подписи", "~Жук. / Мор."] }
          - { cells: ["Экстракт растительный", "6,0 кг", "~6,0 кг, партия EX-0780", "~Жук."] }
          - { id: br-acid, cells: ["Лимонная кислота, р-р 10 %", "6,0 кг (до pH 5,0–5,6)", "~2,0 кг — остаток в канистре", "~Жук."] }
          - { id: br-ph, cells: ["pH после корректировки", "5,0–5,6", "~6,4", "~Жук."] }
          - { cells: ["Выгрузка, передача на фасовку", "—", "~09.11, 15:40", "~Жук."] }
    footer:
      - [Отклонения от ТИ, "~нет"]
      - [Мастер смены, "~Морозова"]

  - id: dossier
    title: Досье консервирующей системы ГП-0610
    short: Досье консервирования
    origin: Составлено R&D при постановке продукта; содержит условия, при которых защита подтверждена.
    header:
      - [Документ, "Д-КС-0610, ред. 1"]
      - [Консервирующая система, "Бензоат натрия 0,40 % + сорбат калия 0,20 %"]
    sections:
      - title: Условия применимости
        columns: [Параметр, Значение]
        rows:
          - { id: ds-ph, cells: ["Рабочий интервал pH продукта", "5,0–5,6"] }
          - { id: ds-test, cells: ["Тест эффективности консервирования", "проведён на образце с pH 5,3; результат удовлетворительный"] }
          - { cells: ["pKa (справочно, 25 °C)", "бензойная кислота ≈ 4,2; сорбиновая кислота ≈ 4,76"] }
          - { cells: ["Примечание", "при pH выше 5,6 защита не подтверждалась"] }

  - id: water
    title: Журнал системы водоподготовки
    short: Журнал воды
    origin: Ведёт служба главного инженера; микробиологию точек отбора делает лаборатория, результат готов через 3 суток.
    header:
      - [Система, "Петля очищенной воды, участок 2"]
      - [Регламент, "Санитарная обработка петли — каждые 14 суток"]
    sections:
      - title: Санитарная обработка
        columns: [Дата, Операция, Отметка]
        rows:
          - { cells: ["03.10.2026", "Санитарная обработка петли", "выполнена"] }
          - { id: w-san, cells: ["17.10.2026", "Санитарная обработка петли", "выполнена"] }
          - { id: w-skip, cells: ["31.10.2026", "Санитарная обработка петли", "~перенесена — ремонт насоса"] }
      - title: Микробиология воды, точка П-4, КОЕ/мл (внутренняя норма не более 100)
        columns: [Дата отбора, Результат, Дата выдачи результата]
        rows:
          - { cells: ["20.10.2026", "менее 10", "23.10"] }
          - { cells: ["27.10.2026", "14", "30.10"] }
          - { id: w-rise, cells: ["03.11.2026", "62", "06.11"] }
          - { id: w-out, cells: ["09.11.2026", "~210", "~12.11 — после варки партии 6102"] }

  - id: trend
    title: Сводка по партиям ГП-0610
    short: Сводка по партиям
    origin: Ведёт ОКК.
    header:
      - [Период, "октябрь — ноябрь 2026"]
    sections:
      - title: Партии
        columns: [Партия, Дата, pH, "Общее число микроорганизмов, КОЕ/г", Заключение]
        rows:
          - { cells: ["6089", "19.10", "5,3", "менее 10", "соотв."] }
          - { id: tr-6098, cells: ["6098", "02.11", "5,4", "40", "соотв."] }
          - { id: tr-6102, cells: ["6102", "09.11", "6,4", "6,4·10³", "не соотв."] }

requests:
  - id: r-repeat
    title: Повторный посев из трёх паллет с отрицательным контролем
    who: Микробиологическая лаборатория
    cost: 2
    lead: 3 суток
    result: |
      Три пробы из разных паллет, параллельно — отрицательный контроль (стерильный разбавитель).

      | Проба | КОЕ/г |
      |---|---|
      | Паллета 1 | 5,9·10³ |
      | Паллета 4 | 7,2·10³ |
      | Паллета 7 | 6,6·10³ |
      | Отрицательный контроль | роста нет |

      Результат подтверждён; загрязнение при анализе исключено.
    value: high
    valueText: Единственный способ отличить загрязнённую партию от загрязнения при посеве. Первый результат получен по одному посеву.
  - id: r-water3
    title: Отбор воды в трёх точках петли сегодня
    who: Лаборатория + служба главного инженера
    cost: 2
    lead: 3 суток
    result: |
      | Точка | КОЕ/мл |
      |---|---|
      | После ультрафиолетовой лампы | 3 |
      | Накопительная ёмкость | 150 |
      | П-4 (участок 2, возврат петли) | 240 |

      Морфология колоний совпадает с выделенными из партии 6102: грамотрицательные палочки, оксидаза +.
    value: high
    valueText: Связывает микрофлору партии с петлёй воды и показывает, где именно в петле идёт рост.
  - id: r-hplc
    title: Содержание консервантов в партии (ВЭЖХ)
    who: Аналитическая лаборатория
    cost: 1
    lead: 1 сутки
    result: |
      Бензоат натрия: **0,39 %** (норма 0,36–0,44). Сорбат калия: **0,20 %** (норма 0,18–0,22).

      Консерванты введены в полном объёме.
    value: mid
    valueText: Закрывает гипотезу о недовложении. Но содержание — не то же, что активность — при pH 6,4 в действующей форме находится малая часть.
  - id: r-extract
    title: Микробиология остатка экстракта EX-0780
    who: Микробиологическая лаборатория
    cost: 1
    lead: 3 суток
    result: |
      Общее число микроорганизмов: менее 10 КОЕ/г. Экстракт не является источником.
    value: mid
    valueText: Закрывает сырьевую гипотезу; косвенно то же следует из сводки — партия 6098 сварена на том же экстракте.
  - id: r-adjust
    title: Лабораторная проба — довести pH образца партии до 5,3 и пересеять через 7 суток
    who: Лаборатория R&D
    cost: 2
    lead: 7 суток
    result: |
      Образец партии 6102, pH доведён до 5,3. Через 7 суток: 1,1·10³ КОЕ/г (исходно 6,4·10³).

      Число снижается, но остаётся выше нормы; продукты жизнедеятельности микроорганизмов и возможные изменения запаха не оценивались.
    value: low
    valueText: Показывает, что «исправление» pH не возвращает партию в норму за разумный срок, — и не отвечает ни на один вопрос о причине.

hypotheses:
  - id: meas
    group: measurement
    title: Результат — следствие загрязнения при посеве, а не свойства партии
    statuses:
      main: { verdict: wrong, text: "Гипотезу стоило проверить, но назначать её основной нельзя — оснований нет, а повторный посев с контролем её опровергает." }
      contrib: { verdict: wrong, text: "Отрицательный контроль чист, три паллеты дают близкие числа — вклада анализа нет." }
      excluded:
        verdict: ok
        needs: [r-repeat]
        text: Исключена корректно — три паллеты дают близкие результаты, отрицательный контроль без роста.
        noBasis: Скорее всего вы правы, но основания у вас нет. Первый результат получен по одному посеву; исключить загрязнение при анализе можно только повтором с контролем.
      untested:
        verdict: ok
        text: Честная оценка. По имеющимся у вас данным гипотеза не проверена; закрывает её повторный посев с отрицательным контролем.
  - id: ph
    group: cause
    title: pH партии 6,4 вместо 5,0–5,6 — консерванты большей частью в недействующей форме
    statuses:
      main:
        verdict: ok
        needs: [br-ph, br-acid, tr-6102, ds-ph, ds-test]
        text: Да — это причина, по которой рецептура не подавила микрофлору. Кислоты введено 2,0 кг вместо 6,0, pH 6,4 записан в протоколе рядом с нормой 5,0–5,6. При таком pH в недиссоциированной форме около 2 % сорбиновой и менее 1 % бензойной кислоты; защита подтверждалась только до pH 5,6.
        noBasis: Гипотеза верна, но записи, на которых она стоит, у вас не отмечены — строки «лимонная кислота» и «pH после корректировки» в протоколе варки, интервал pH в досье.
      contrib:
        verdict: ok
        needs: [br-ph, br-acid, tr-6102, ds-ph, ds-test]
        text: Обоснованная позиция — pH объясняет, почему микроорганизмы выжили и размножились, но не откуда они взялись. Обе причины необходимы.
        noBasis: Позиция разумная, но основание не отмечено — pH 6,4 в протоколе варки и интервал 5,0–5,6 в досье.
      excluded: { verdict: wrong, text: "В протоколе варки записан pH 6,4 при норме 5,0–5,6, а досье прямо говорит, что выше 5,6 защита не подтверждалась. Исключить эту гипотезу нельзя." }
      untested: { verdict: wrong, text: "Данные были в исходных документах — протокол варки и досье консервирующей системы." }
  - id: water
    group: cause
    title: Микроорганизмы внесены с водой — санитарная обработка петли пропущена, показатели точки П-4 росли
    statuses:
      main:
        verdict: ok
        needs: [w-skip, w-rise, w-out, r-water3, mb-morph]
        text: Да — это источник. Обработка 31.10 перенесена, число микроорганизмов в точке П-4 росло три недели и в день варки составило 210 КОЕ/мл при норме 100. Результат пришёл уже после варки. Морфология колоний типична для водных систем.
        noBasis: Гипотеза верна, но основания у вас не отмечены — пропущенная обработка и рост показателей точки П-4 в журнале воды.
      contrib:
        verdict: ok
        needs: [w-skip, w-rise, w-out, r-water3, mb-morph]
        text: Обоснованная позиция — вода принесла микроорганизмы, а сорванный pH позволил им размножиться. Ни одна из причин по отдельности не объясняет результат полностью.
        noBasis: Позиция разумная, но основание не отмечено — журнал воды.
      excluded: { verdict: wrong, text: "Журнал воды показывает пропущенную санитарную обработку и превышение нормы в точке отбора в день варки. Исключить воду нельзя." }
      untested: { verdict: wrong, text: "Журнал системы водоподготовки был среди исходных документов." }
  - id: raw
    group: cause
    title: Контаминировано сырьё — растительный экстракт
    statuses:
      main: { verdict: wrong, text: "Экстракт — разумный кандидат, но партия 6098 сварена на том же экстракте и чиста, а остаток экстракта при проверке чист." }
      contrib: { verdict: weak, text: "Подтверждений нет — партия 6098 на том же экстракте в норме." }
      excluded:
        verdict: ok
        needs: [r-extract, tr-6098]
        text: Исключена корректно.
        noBasis: "Вывод верный, но основание не отмечено — строка партии 6098 в сводке (тот же период, норма) или посев экстракта."
      untested: { verdict: weak, text: "Косвенное основание было в сводке по партиям — предыдущая партия в норме." }
  - id: dose
    group: cause
    title: Недовложение консервантов
    statuses:
      main: { verdict: wrong, text: "Загрузка консервантов записана с двумя подписями и соответствует рецептуре; анализ это подтверждает. Консерванта достаточно — недостаточно его действующей формы." }
      contrib: { verdict: wrong, text: "Загрузка соответствует рецептуре." }
      excluded:
        verdict: ok
        needs: [br-pres, r-hplc]
        text: Исключена корректно — загрузка с двойной подписью, содержание в норме.
        noBasis: Вывод верный, но основание не отмечено — строка загрузки консервантов или результат анализа.
      untested: { verdict: weak, text: "Основание было в протоколе варки — загрузка с двумя подписями." }

dispositions:
  - id: release
    title: Выпустить — специфицированные микроорганизмы не обнаружены
    verdict: wrong
    text: Партия не соответствует норме по общему числу микроорганизмов и выпущена вне условий, при которых подтверждена её защита. Отсутствие отдельных видов этого не отменяет.
  - id: fix
    title: Довести pH до нормы, добавить консервант и перефасовать
    verdict: wrong
    text: Корректировка не устраняет уже накопленную микрофлору и продукты её жизнедеятельности и не подтверждена испытанием; лабораторная проба показывает, что за неделю партия в норму не возвращается. Это маскировка отклонения.
  - id: hold
    title: Карантин, оформление отклонения, повторный посев с контролем; блокировка воды участка 2 до санитарной обработки
    verdict: ok
    text: Соразмерно. Партия изолирована, результат будет подтверждён, а источник перекрыт — иначе следующая варка повторит отклонение.
    variants:
      - when: [r-repeat]
        verdict: weak
        text: Карантин и блокировка воды — правильно. Но повторный посев вы уже получили, результат подтверждён — решение о партии можно принимать.
  - id: scrap
    title: Забраковать партию; блокировать воду участка 2 до санитарной обработки и повторных анализов
    verdict: weak
    text: Вероятный итог, но вы принимаете его по одному посеву без контроля. Сначала результат подтверждают.
    variants:
      - when: [r-repeat]
        verdict: ok
        text: Решение следует из подтверждённого результата. Блокировка воды перекрывает источник для следующих партий.

capaMax: 3
capa:
  - id: ph-gate
    title: Сделать pH контрольной точкой — при выходе за норму варка останавливается и оформляется отклонение
    verdict: ok
    text: pH 6,4 был записан рядом с нормой 5,0–5,6 и подписан, а в графе отклонений стоит «нет». Контрольная точка без обязательного действия не работает.
  - id: water-rule
    title: Запретить перенос санитарной обработки без компенсирующих мер; ввести порог тревоги по тренду точки отбора
    verdict: ok
    text: Рост 14 → 62 → 210 был виден за неделю до варки; при пороге тревоги ниже нормы обработку провели бы раньше.
  - id: stock
    title: Проверка наличия полного количества корректирующих растворов перед началом варки
    verdict: ok
    text: Кислоты ввели столько, сколько оставалось в канистре. Это организационная причина сорванного pH.
  - id: more-pres
    title: Увеличить дозировку консервантов в рецептуре
    verdict: wrong
    text: Консерванта было достаточно; при pH 6,4 и удвоенная доза дала бы малую долю действующей формы. Мера не закрывает ни источник, ни причину.
  - id: punish
    title: Дисциплинарное взыскание аппаратчику
    verdict: wrong
    text: Аппаратчик записал и недостаток кислоты, и pH. Система позволила продолжить варку — менять нужно её.
  - id: reform
    title: Поручить R&D оценить консервирующую систему, менее зависимую от pH
    verdict: weak
    text: Разумно как долгосрочная мера повышения устойчивости рецептуры, но к причинам этого отклонения не относится.

