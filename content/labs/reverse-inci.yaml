id: reverse-inci
engine: reverse-inci
order: 46
area: rnd
role: R&D-химик
minutes: 10
title: "Реверс-инжиниринг INCI: разбери крем конкурента по этикетке"
summary: Найдите на этикетке маркер границы 1 %, распределите компоненты по фазам A/B/C, определите тип эмульсионной системы и перенесите скелет рецептуры в Лабораторию.
skill: Читать список INCI как технологическую карту — находить маркер 1 %, восстанавливать фазы и объяснять назначение функциональных добавок.
topics: [raw-functions, emulsifier-selection]
productName: "Барьерный крем-флюид для лица (образец конкурента, 50 мл)"
claims: "С 4 % ниацинамида, маслом ши и пантенолом · не оставляет белых следов · без отдушки"
inciList:
  - inci: Aqua
  - inci: Caprylic/Capric Triglyceride
  - inci: Glycerin
  - inci: Niacinamide
  - inci: Cetearyl Alcohol
  - inci: Glyceryl Stearate
  - inci: PEG-100 Stearate
  - inci: Butyrospermum Parkii Butter
  - inci: Dimethicone
  - inci: Phenoxyethanol
  - inci: Panthenol
  - inci: Xanthan Gum
  - inci: Tocopherol
  - inci: Disodium EDTA
onePercentMarker: Phenoxyethanol
onePercentWhy: "Феноксиэтанол законодательно ограничен пределом 1,0 % (ТР ТС 009/2011 и EU 1223/2009), поэтому он служит надёжным «маяком» границы 1 %: по ст. 19 EU 1223/2009 и ст. 5 п. 9.3 ТР ТС 009/2011 компоненты менее 1 % (< 1 %) перечисляются в произвольном порядке, а всё, что стоит после феноксиэтанола, заведомо не превышает 1 %."
phaseTargets:
  - inci: Glycerin
    expected: A
    why: Водорастворимый термостабильный увлажнитель — вводится в водную фазу A.
  - inci: Cetearyl Alcohol
    expected: B
    why: Твёрдый жирный спирт-структурообразователь — плавится в масляной фазе B при ~70–75 °C.
  - inci: Glyceryl Stearate
    expected: B
    why: Липофильный соэмульгатор — плавится в масляной фазе B в паре с PEG-100 Stearate.
  - inci: Butyrospermum Parkii Butter
    expected: B
    why: Твёрдое масло ши — компонент масляной фазы B.
  - inci: Niacinamide
    expected: C
    why: Актив, чувствительный к длительному нагреву и кислому гидролизу — обычно вводится на охлаждении (фаза C, ≤ 45 °C).
  - inci: Phenoxyethanol
    expected: C
    why: Консервант — вводится на стадии охлаждения в фазу C (≤ 45 °C).
questions:
  - id: emul-type
    prompt: Какая эмульгирующая система формирует этот крем?
    options:
      - id: arlacel
        text: Неионогенная система O/W «Glyceryl Stearate + PEG-100 Stearate» с жирноспиртовым каркасом Cetearyl Alcohol
        correct: true
        why: Верно. Пара Glyceryl Stearate (ГЛБ 3,8) + PEG-100 Stearate (ГЛБ 18,8) — классическая база O/W (тип Arlacel 165), устойчивая к электролитам и широкому pH.
      - id: wo
        text: Обратная эмульсия W/O на основе масла ши и диметикона
        why: Вода на первом месте и пара с высоким ГЛБ (PEG-100 Stearate) однозначно указывают на прямую эмульсию O/W.
      - id: cationic
        text: Катионная эмульсия для волос
        why: В составе нет катионных ПАВ (BTMS/цетримония).
  - id: dimethicone-role
    prompt: Зачем в формуле стоит Dimethicone (~1–2 %) сразу перед феноксиэтанолом?
    options:
      - id: soaping
        text: Гасит эффект «мыльного следа» (soaping) от Cetearyl Alcohol и улучшает скольжение при нанесении
        correct: true
        why: Верно. Даже 1 % диметикона резко снижает поверхностное натяжение и полностью убирает белые разводы при растирании.
      - id: pres
        text: Работает как основной консервант против плесени
        why: Силиконы химически инертны и не обладают антимикробной активностью.
      - id: ph
        text: Снижает pH крема до 4,0
        why: Диметикон не растворим в воде и не влияет на pH.
  - id: edta-role
    prompt: Какую роль выполняет Disodium EDTA в самом конце списка INCI?
    options:
      - id: chelator
        text: Связывает ионы металлов (Ca²⁺, Mg²⁺, Fe³⁺), усиливает консервант и защищает масла от окисления
        correct: true
        why: Верно. 0,05–0,1 % хелатора дестабилизирует мембраны бактерий и блокирует каталитическое прогоркание масла ши.
      - id: thickener
        text: Загущает водную фазу вместо карбомера
        why: Загущение здесь обеспечивает Xanthan Gum и ламеллярный каркас, а ЭДТА — хелатор.
      - id: uv
        text: Защищает кожу от УФ-излучения
        why: ЭДТА не является УФ-фильтром.
brief:
  situation: Маркетинг принёс популярный крем конкурента и просит оценить, как он устроен технологически, сколько там реально пантенола и какую базу собрать в Лаборатории.
  goal: Определить границу 1 % по списку INCI, разнести ключевые компоненты по фазам A/B/C и расшифровать роль функциональных добавок.
  constraints: Используйте законодательные лимиты и знания о растворимости/термостабильности сырья — без угадывания.
dataNote: Учебный INCI-состав, построенный по реальным правилам маркировки EU 1223/2009 и ТР ТС 009/2011.
hints:
  - Ищите в списке консервант со строгим законодательным потолком 1,0 % — он надёжно маркирует границу 1 %.
  - Жирные спирты, масла и эмульгаторы идут в масляную фазу B; термолабильные активы и консерванты — в фазу C.
transfer:
  title: Перенос на маркетинговый клайм
  intro: На этикетке выше написано «с пантенолом», при этом `Panthenol` стоит ПОСЛЕ `Phenoxyethanol`.
  questions:
    - type: mc
      q: Какой вывод технолог сделает о реальной дозировке пантенола в этом креме?
      options:
        - text: Пантенола в креме не более 1 % (вероятно 0,5–0,8 %), так как он стоит после феноксиэтанола с лимитом 1,0 %.
          correct: true
          why: Верно. Поскольку Phenoxyethanol ≤ 1,0 %, любой ингредиент правее него не может превышать 1 %.
        - text: Пантенола минимум 5 %, потому что он указан на лицевой стороне упаковки.
          why: Закон не обязывает класть 5 % ради упоминания на лицевой этикетке — реальный порядок раскрывает только INCI.
        - text: По списку INCI невозможно сделать никаких оценок дозировки.
          why: Маркеры с известным лимитом (феноксиэтанол 1 %, ксантан ~0,2–0,5 %) позволяют очень точно оценить порядок концентраций.
