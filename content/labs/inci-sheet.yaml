# Занятие-расчёт (движок worksheet). Состав — типовой учебный, не относится к конкретному продукту.
id: inci-sheet
engine: worksheet
order: 12
title: "Читаем состав: крем для лица по списку INCI"
summary: Маркетинг принёс крем конкурента и спрашивает, «сколько там ниацинамида» и «на чём он сделан». Восстановите функции компонентов и границы концентраций — и отделите то, что следует из списка, от догадок.
area: rnd
role: Разработчик рецептур
minutes: 12
skill: Чтение рецептуры и состава — определить функцию каждого компонента и оценить концентрации по порядку в списке INCI, не выходя за пределы того, что из него следует.
topics: [raw-functions]
dataNote: Учебный состав типового крема. Правило порядка ингредиентов и предел 1 % для феноксиэтанола приведены для ЕС (Регламент 1223/2009).
hints:
  - "Найдите в списке компонент с известным максимумом не выше 1 % — всё, что после него, присутствует не выше 1 %."
  - "Порядок даёт только неравенства. Ингредиенты до маркера тоже могут оказаться ниже 1 %."

brief:
  situation: |
    Маркетинг передал упаковку крема-конкурента: «Сделайте так же, но с большим количеством ниацинамида. Сколько его там?»
  goal: Разобрать состав по функциям и ответить, что о концентрациях можно утверждать, а что нельзя.
  constraints: Состав — в выписке справа (рынок ЕС, маркировка по Регламенту 1223/2009).

sheet:
  title: Состав на упаковке (INCI), по порядку
  origin: Типовой учебный состав крема для лица.
  rows:
    - ["1–3", "Aqua · Caprylic/Capric Triglyceride · Glycerin"]
    - ["4–6", "Cetearyl Alcohol · Glyceryl Stearate · Butyrospermum Parkii Butter"]
    - ["7–9", "Niacinamide · Dimethicone · Cetearyl Glucoside"]
    - ["10–12", "Phenoxyethanol · Xanthan Gum · Panthenol"]
    - ["13–17", "Tocopherol · Parfum · Disodium EDTA · Citric Acid · Ethylhexylglycerin"]
    - ["Справка", "В ЕС феноксиэтанол разрешён как консервант не более 1 %"]

steps:
  - title: Функции
    text: Определите роль компонентов в рецептуре.
    questions:
      - type: mc
        q: Какую роль выполняет Cetearyl Alcohol?
        options:
          - { text: "Консервант", why: "Жирные спирты консервантами не являются." }
          - { text: "Структурообразователь: вместе с эмульгаторами образует гелевую сеть и создаёт консистенцию", correct: true, why: "Цетеариловый спирт — основа консистенции классических кремов." }
          - { text: "Растворитель", why: "Это твёрдый при комнатной температуре жирный спирт." }
      - type: mc
        q: Какие компоненты — эмульгаторы?
        options:
          - { text: "Glyceryl Stearate и Cetearyl Glucoside", correct: true, why: "Оба — ПАВ, стабилизирующие эмульсию масло в воде; глицерилстеарат также структурирует." }
          - { text: "Glycerin и Panthenol", why: "Это водорастворимые увлажняющие компоненты." }
          - { text: "Dimethicone и Tocopherol", why: "Эмолент и антиоксидант." }
      - type: mc
        q: Зачем в составе Disodium EDTA?
        options:
          - { text: "Хелатирующий агент: связывает ионы металлов", correct: true, why: "Защищает от влияния жёсткости и следов металлов, катализирующих окисление." }
          - { text: "Загуститель", why: "Загущает ксантановая камедь." }
          - { text: "Регулятор pH", why: "Это функция лимонной кислоты в этом составе." }
  - title: Концентрации
    text: Используйте правило порядка ингредиентов и маркер 1 %.
    questions:
      - type: mc
        q: Что можно утверждать о концентрации Panthenol?
        options:
          - { text: "Не более 1 %", correct: true, why: "Он стоит после феноксиэтанола, максимум которого 1 %. Ингредиент концентрацией выше 1 % должен был бы стоять раньше." }
          - { text: "Около 5 %", why: "Это противоречит положению после маркера 1 %." }
          - { text: "Ничего", why: "Верхнюю границу задаёт маркер." }
      - type: mc
        q: Можно ли по списку утверждать, что ниацинамида больше 1 %?
        options:
          - { text: "Да — он стоит до феноксиэтанола", why: "Ингредиенты ниже 1 % могут идти в любом порядке после тех, что выше 1 %. Стоящие до маркера тоже могут быть ниже 1 %." }
          - { text: "Нет — порядок даёт только неравенства; ниацинамид может быть и выше, и ниже 1 %", correct: true, why: "Из списка следует лишь, что его не больше, чем масла ши (если оба выше 1 %). Остальное — гипотеза для лабораторного анализа." }
          - { text: "Да — ниацинамид всегда вводят больше 1 %", why: "Это предположение о практике, а не вывод из списка." }
      - type: mc
        q: Что ответить маркетингу на вопрос «сколько там ниацинамида»?
        options:
          - { text: "Около 5 %, как обычно у таких кремов", why: "Это догадка о практике отрасли, а не вывод из данных." }
          - { text: "Из состава следует только верхняя граница по соседям; точную концентрацию даст лабораторный анализ", correct: true, why: "Честный ответ отделяет выводы из списка от предположений." }
          - { text: "Меньше 1 %", why: "Список этого не утверждает." }

transfer:
  title: "Перенос: шампунь"
  intro: |
    Состав шампуня (ЕС): Aqua · Sodium Laureth Sulfate · Cocamidopropyl Betaine · Sodium Chloride · Glycol Distearate · Parfum · Sodium Benzoate · Citric Acid.
  questions:
    - type: mc
      q: Какую роль в шампуне выполняет Sodium Chloride?
      options:
        - { text: "Консервант", why: "Поваренная соль консервантом не является." }
        - { text: "Загуститель ПАВ-системы: сдвигает её по солевой кривой", correct: true, why: "Электролит превращает мелкие мицеллы в длинные червеобразные — вязкость растёт." }
        - { text: "Регулятор pH", why: "Это функция лимонной кислоты." }
    - type: mc
      q: Можно ли по этому списку утверждать, что Parfum не более 1 %?
      options:
        - { text: "Да — отдушка всегда меньше 1 %", why: "Это практика, а не вывод из списка." }
        - { text: "Нет — перед Parfum нет ингредиента с известным максимумом не выше 1 %", correct: true, why: "Маркера нет, и правило порядка не даёт верхней границы." }
        - { text: "Да — Parfum стоит после хлорида натрия", why: "Хлорида натрия может быть больше 1 %; это не маркер." }
