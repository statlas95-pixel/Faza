id: gmp-batch-record
engine: gmp
order: 40
area: production
minutes: 15
role: Инженер по качеству (QA) / технолог цеха
title: "Тренажёр GMP (ISO 22716): разбор маршрутной карты партии"
summary: "Проверьте заполненную маршрутную карту (Batch Record), выделите критические контрольные точки (CCP), найдите скрытые отклонения, примите решение по партии и составьте план CAPA."
skill: Проверять полноту и корректность Batch Record, отличать критические контрольные точки, фиксировать отклонения и формировать план CAPA
topics: [cip-verification, water-sanitation, preservation]
brief:
  situation: "Ночная смена завершила варку партии крема КР-2611-04 (500 кг) в реакторе Р-205 и передала маршрутную карту (Batch Record) в отдел обеспечения качества (QA) для разрешения фасовки. Сменный мастер торопит выпуск — линия фасовки стоит в простое."
  goal: "Проведите аудит маршрутной карты по принципам GMP [@iso22716]: отметьте критические контрольные точки (CCP), выявите все технологические и документальные отклонения, выберите решение по судьбе партии и сформируйте корректирующие и предупреждающие меры (CAPA)."
  constraints: "Учебный сценарий построен на общих принципах прослеживаемости, внутрипроизводственного контроля критических параметров (включая CCP/CPP из практики анализа рисков) и управления отклонениями ISO 22716. Цифровые нормы в карте — внутренние спецификации учебного предприятия."
dataNote: "Маршрутная карта, фамилии и номера приборов вымышлены для учебного разбора GMP; опирайтесь на логику прослеживаемости и контроля критических параметров."

batchMeta:
  batchNo: "КР-2611-04"
  product: "Увлажняющий крем O/W (с феноксиэтанолом 0,8 % и пантенолом 2,0 %)"
  equipment: "Вакуумный реактор Р-205, линия очистки воды ОС-2"
  batchSize: "500 кг"
  date: "24.11.2026 (ночная смена)"

steps:
  - id: s1
    time: "22:10"
    stage: "Проверка чистоты и CIP-мойки реактора Р-205 перед загрузкой"
    spec: "Протокол CIP № и смыв/визуальный контроль подтверждены оператором и QA; остаточная проводимость промывной воды ≤ 2,0 мкСм/см."
    recorded: "«Чисто», протокол CIP не указан, проводимость не записана."
    signoff: "Оператор И. Петров (подпись QA отсутствует)"
    isCcp: true
    ccpWhy: "Состояние и санитарная чистота реактора до загрузки — критическая точка предотвращения микробной и перекрёстной контаминации."
    hasDeviation: true
    deviationType: critical
    deviationWhy: "Отсутствует ссылка на протокол CIP, нет числового результата проводимости и нет второй подписи (верификации). По GMP незадокументированная проверка считается невыполненной."

  - id: s2
    time: "22:25"
    stage: "Отбор очищенной воды для фазы A (371 кг)"
    spec: "Электропроводность воды ≤ 2,0 мкСм/см (20 °C); температура петли рециркуляции ≥ 70 °C либо подтверждённый микробиологический контроль."
    recorded: "Проводимость 4,8 мкСм/см, петля 24 °C (санитизация последний раз 12 дней назад)."
    signoff: "Оператор И. Петров"
    isCcp: true
    ccpWhy: "Вода составляет > 70 % массы эмульсии и является главным источником микробиологического и ионного риска."
    hasDeviation: true
    deviationType: critical
    deviationWhy: "Превышение спецификации по электропроводности (4,8 > 2,0 мкСм/см) и отсутствие актуальной санитизации контура при холодной петле создают высокий риск контаминации и дестабилизации."

  - id: s3
    time: "22:45"
    stage: "Взвешивание и загрузка глицерина (20,0 кг) в фазу A"
    spec: "20,0 ± 0,2 кг; сырьё с действующим статусом «Одобрено QC»."
    recorded: "20,05 кг, партия сырья ГЛ-114 (одобрена QC до 08.2027)."
    signoff: "Оператор И. Петров / контролёр А. Сидорова"
    isCcp: false
    ccpWhy: "Взвешивание инертного увлажнителя с допуском ±1 % важно для рецептуры, но при двойном контроле не является критической точкой безопасности."
    hasDeviation: false
    deviationWhy: "Масса в допуске, указан номер партии сырья, статус QC актуален, есть двойная подпись."

  - id: s4
    time: "23:15"
    stage: "Плавление масляной фазы B (эмоленты и эмульгаторы, 95,0 кг)"
    spec: "Нагрев до 75 ± 2 °C до полного расплавления твёрдых восков и жирных спиртов."
    recorded: "75,5 °C, расплав прозрачный и однородный, выдержка 10 мин."
    signoff: "Оператор И. Петров"
    isCcp: false
    ccpWhy: "Температура плавления влияет на качество эмульгирования, но в данном этапе отклонений нет и сам нагрев не несёт критического риска безопасности продукта."
    hasDeviation: false
    deviationWhy: "Параметры температуры и визуального контроля полностью соответствуют спецификации."

  - id: s5
    time: "23:45"
    stage: "Эмульгирование и гомогенизация в реакторе Р-205"
    spec: "2500 об/мин, 12 мин, вакуум −0,45 бар; температура 72–75 °C."
    recorded: "2500 об/мин, 12 мин, вакуум −0,45 бар, температура 73 °C. Записано аккуратно, без исправлений."
    signoff: "Оператор И. Петров"
    isCcp: true
    ccpWhy: "Режим гомогенизации и вакуумирования определяет размер капель и стабильность эмульсии (критический параметр процесса)."
    hasDeviation: false
    deviationWhy: "Все заданные параметры процесса выдержаны и корректно зафиксированы."

  - id: s6
    time: "00:35"
    stage: "Ввод фазы C: пантенол (10,0 кг) и феноксиэтанол (4,0 кг)"
    spec: "Температура массы перед вводом ≤ 40 °C; масса феноксиэтанола 4,00 ± 0,04 кг."
    recorded: "Введено при 54 °C (чтобы успеть до конца смены). Масса феноксиэтанола замазана штрих-корректором, поверх написано «4,0 кг»."
    signoff: "Оператор И. Петров"
    isCcp: true
    ccpWhy: "Температура ввода и точная дозировка консерванта/термолабильного актива напрямую определяют микробиологическую безопасность и соблюдение лимита 1,0 % по ТР ТС / EU."
    hasDeviation: true
    deviationType: critical
    deviationWhy: "Двойное нарушение: ввод термолабильных компонентов при 54 °C (> 40 °C) и грубое нарушение принципов целостности данных ALCOA/GMP — использование штрих-корректора без зачёркивания одной линией, причины, даты и подписи."

  - id: s7
    time: "01:15"
    stage: "Измерение pH и вязкости готовой массы (in-process control)"
    spec: "pH 5,2–5,8 при 20–25 °C; прибор с действующей калибровкой; вязкость 18–26 Па·с."
    recorded: "pH 5,5 (прибор pH-03, калибровка истекла 18.11.2026); вязкость 21,4 Па·с (вискозиметр В-02, калиброван до 05.2027)."
    signoff: "Лаборант Е. Волкова"
    isCcp: false
    ccpWhy: "Сам замер in-process — контрольная проверка, достоверность которой зависит от калибровки измерительного средства."
    hasDeviation: true
    deviationType: major
    deviationWhy: "Измерение pH выполнено прибором с просроченной калибровкой (истекла 6 дней назад) — результат pH 5,5 юридически и технически недействителен до перепроверки калиброванным прибором."

  - id: s8
    time: "01:40"
    stage: "Отбор арбитражной и микробиологической пробы из верхней, средней и нижней зон"
    spec: "Стерильная тара, 3 точки отбора, маркировка номером партии и датой, передача в QC."
    recorded: "Пробы отобраны в стерильные контейнеры (3 зоны), маркировка КР-2611-04 / 24.11.2026, переданы в QC."
    signoff: "Лаборант Е. Волкова"
    isCcp: false
    ccpWhy: "Отбор проб — обязательная процедура контроля качества, выполненная по инструкции."
    hasDeviation: false
    deviationWhy: "Пробоотбор и маркировка выполнены без замечаний."

dispositions:
  - id: release
    title: "Разрешить фасовку сразу, чтобы не простаивала линия, а документы дооформить утром"
    verdict: wrong
    why: "Выпуск партии с открытыми критическими отклонениями по чистоте оборудования, воде и дозировке консерванта недопустим по GMP."
  - id: quarantine
    title: "Поместить партию в карантин, открыть протокол отклонения, перепроверить pH калиброванным прибором, провести микробиологический контроль и анализ дозировки феноксиэтанола"
    verdict: ok
    why: "Единственное корректное решение по GMP: изолировать партию в карантине, зафиксировать все отклонения и принимать решение о выпуске или браке только на основании объективных анализов."
  - id: destroy
    title: "Немедленно утилизировать 500 кг крема без проведения расследования и анализов"
    verdict: weak
    why: "Утилизация без расследования лишает производство данных о первопричине (и не устраняет риск повторения в следующей смене); сначала — карантин и расследование."

capa:
  - id: capa-water
    kind: corrective
    title: "Внеплановая санитизация контура очищенной воды ОС-2 и повторный контроль проводимости и микробиологии до следующей варки"
    valid: true
    why: "Корректирующая мера напрямую устраняет источник повышенной проводимости и микробиологического риска."
  - id: capa-calib
    kind: corrective
    title: "Вывести pH-метр pH-03 из эксплуатации, провести поверку/калибровку и перепроверить все партии, измеренные после 18.11.2026"
    valid: true
    why: "Обязательная оценка влияния (impact assessment) при выявлении просроченной калибровки прибора."
  - id: capa-alcoa
    kind: preventive
    title: "Провести инструктаж смены по правилам внесения исправлений (ALCOA: зачёркивание одной линией, причина, дата, подпись; запрет корректоров) и ввести обязательную подпись QA до загрузки реактора"
    valid: true
    why: "Системная предупреждающая мера, устраняющая организационную причину пропуска верификации CIP и нарушений записей."
  - id: capa-interlock
    kind: preventive
    title: "Ввести технологический чек-лист / блокировку на этапе охлаждения: ввод фазы C разрешён только при подтверждённой температуре ≤ 40 °C"
    valid: true
    why: "Предупреждающая мера защищает процесс от спешки оператора на этапе ввода активов и консерванта."
  - id: capa-rewrite
    kind: corrective
    title: "Переписать маршрутную карту на чистом бланке без замазки и поставить недостающие подписи задним числом"
    valid: false
    why: "Фальсификация производственной документации — грубейшее нарушение GMP, недопустимое ни при каких обстоятельствах."
  - id: capa-skip-qa
    kind: preventive
    title: "Убрать обязательную подпись QA перед загрузкой, чтобы ночная смена не тратила время на ожидание"
    valid: false
    why: "Исключение независимой проверки чистоты оборудования резко повышает риск контаминации и не решает проблему."
  - id: capa-more-preservative
    kind: corrective
    title: "Долить в партию ещё 0,5 % феноксиэтанола «на всякий случай», чтобы компенсировать плохую воду"
    valid: false
    why: "Суммарная концентрация феноксиэтанола станет 1,3 %, что нарушит законодательный лимит 1,0 % (EU 1223/2009 и ТР ТС 009/2011), а вода с высокой проводимостью всё равно останется некондиционной."

transfer:
  title: "Перенос принципа: как правильно исправить описку в маршрутной карте?"
  intro: "На следующей смене оператор случайно записал «40,0 кг» вместо «4,0 кг» в строке взвешивания консерванта."
  questions:
    - type: mc
      q: "Как оформить исправление в бумажной маршрутной карте по требованиям GMP (ALCOA)?"
      options:
        - text: "Зачеркнуть неверную запись одной тонкой линией так, чтобы исходное число читалось, рядом записать «4,0 кг», указать причину («описка»), дату и подпись"
          correct: true
          why: "Исходная запись должна оставаться читаемой, а любое изменение — прослеживаемым (кто, когда и почему исправил)."
        - text: "Аккуратно замазать цифру корректором и вписать верное значение"
          why: "Корректор уничтожает аудиторский след — это критическое нарушение целостности данных."
        - text: "Вырвать лист и переписать страницу заново, уничтожив испорченный лист"
          why: "Уничтожение первичной записи нарушает прослеживаемость и целостность Batch Record."
    - type: mc
      q: "Зачем при просроченной калибровке pH-метра проверяют не только текущую партию, но и предыдущие партии с даты окончания срока?"
      options:
        - text: "Чтобы оценить масштаб влияния (impact assessment): все измерения после даты истечения калибровки могли иметь систематическую погрешность"
          correct: true
          why: "В GMP любое отклонение средства измерения требует оценки влияния на всю продукцию, проверенную этим прибором за спорный период."
        - text: "Только для отчётности перед бухгалтерией"
          why: "Проверка нужна для гарантии качества и безопасности выпущенных партий."
        - text: "Проверять предыдущие партии не нужно, если их уже успели расфасовать"
          why: "Если фасованная партия вышла за пределы спецификации по pH, это напрямую влияет на работу консерванта и стабильность."
