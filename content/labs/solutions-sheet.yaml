# Занятие-расчёт (движок worksheet). ВСЕ ДАННЫЕ — УЧЕБНЫЕ; плотность раствора NaOH — справочная.
id: solutions-sheet
engine: worksheet
order: 10
title: "Карта взвешивания: растворы и товарное сырьё"
summary: Перед варкой геля для душа нужно приготовить корректирующие растворы и пересчитать ПАВ с активного вещества на товарную форму. Ошибка здесь проявится только на контроле готового продукта.
area: production
role: Технолог, готовящий карту взвешивания
minutes: 15
skill: Расчёт растворов и загрузок — пересчитать кристаллогидрат, приготовить раствор разбавлением, перейти от активного вещества к товарной форме и свести баланс воды.
topics: [solutions-basics]
dataNote: Учебные данные. Содержание основного вещества в товарных ПАВ задано как в паспорте партии; плотность 50 % раствора NaOH — справочная (≈1,52 кг/л при 20 °C).
hints:
  - "Во всех расчётах сохраняется масса вещества: m₁·w₁ = m₂·w₂."
  - "Рецептура по активному веществу: товарного продукта нужно больше — делите на долю основного вещества."

brief:
  situation: |
    Завтра варка **800 кг** геля для душа. Мастер просит подготовить карту взвешивания: два корректирующих раствора и пересчёт ПАВ.
    Рецептура задаёт ПАВ **по активному веществу**, а на складе — товарные формы.
  goal: Рассчитать загрузки так, чтобы фактический состав партии совпал с рецептурой.
  constraints: Все исходные данные — в выписке справа. Подсказку можно открыть у любого вопроса; решение с подсказкой засчитывается как выполненное с опорой.

sheet:
  title: Исходные данные к карте взвешивания (выписка)
  origin: Составлено по рецептуре Р-210 и паспортам партий сырья (учебные).
  rows:
    - ["Масса партии", "800 кг"]
    - ["Раствор лимонной кислоты", "нужно 20 кг раствора 10 % в пересчёте на безводную кислоту"]
    - ["Лимонная кислота на складе", "моногидрат, M = 210,14 г/моль (безводная — 192,12 г/моль)"]
    - ["Раствор гидроксида натрия", "нужно 30 кг раствора 10 %"]
    - ["Гидроксид натрия на складе", "раствор 50 %, плотность ≈ 1,52 кг/л"]
    - ["Лауретсульфат натрия по рецептуре", "9,0 % по активному веществу"]
    - ["Лауретсульфат натрия на складе", "паста, основное вещество 70 % (паспорт партии), остальное — вода"]
    - ["Кокамидопропилбетаин по рецептуре", "3,0 % по активному веществу"]
    - ["Кокамидопропилбетаин на складе", "раствор, основное вещество 30 %, остальное — в основном вода"]

steps:
  - title: Раствор лимонной кислоты
    text: Рецептура раствора задана на безводную кислоту, а на складе — моногидрат.
    questions:
      - type: num
        q: Сколько килограммов моногидрата лимонной кислоты нужно взвесить?
        answer: 2.19
        tol: 0.015
        unit: кг
        hint: "Безводной кислоты нужно 20 × 0,10 = 2,0 кг. Моногидрата — больше в отношении молярных масс 210,14 / 192,12."
        explain: "2,0 × 210,14 / 192,12 ≈ 2,19 кг."
      - type: num
        q: Сколько воды добавить, чтобы получить 20 кг раствора?
        answer: 17.81
        tol: 0.01
        unit: кг
        hint: "Вода — остаток до 20 кг после моногидрата. Вода кристаллизации уже учтена в массе моногидрата."
        explain: "20 − 2,19 = 17,81 кг."
    after: "**В карту:** «Лимонная кислота моногидрат — 2,19 кг; вода очищенная — 17,81 кг». Форма сырья указана явно."
  - title: Раствор гидроксида натрия
    text: Раствор готовят разбавлением товарного 50 % раствора.
    questions:
      - type: num
        q: Сколько килограммов 50 % раствора NaOH нужно для 30 кг раствора 10 %?
        answer: 6
        tol: 0.01
        unit: кг
        hint: "m₁·w₁ = m₂·w₂: 30 × 0,10 = m × 0,50."
        explain: "30 × 0,10 / 0,50 = 6,0 кг; воды — 24,0 кг."
      - type: num
        q: Аппаратчик отмерил не 6 кг, а 6 литров 50 % раствора и долил 24 кг воды. Какой получилась массовая доля NaOH, %?
        answer: 13.8
        tol: 0.02
        unit: "%"
        hint: "6 л × 1,52 кг/л = 9,12 кг раствора, в нём 4,56 кг NaOH. Общая масса — 9,12 + 24."
        explain: "4,56 / (9,12 + 24) = 4,56 / 33,12 ≈ 13,8 %. Раствор крепче на треть — доводка pH пойдёт «скачками»."
      - type: mc
        q: Как исключить эту ошибку в будущем?
        options:
          - { text: "Написать в карте «6 л» вместо «6 кг»", why: "Объём зависит от температуры и плотности; рецептура задана по массе." }
          - { text: "Указывать в карте массу и дозировать по весам; если используется мерник — давать пересчитанный по плотности объём", correct: true, why: "Масса однозначна. Пересчёт на объём допустим, но делается расчётом, а не на глаз." }
          - { text: "Использовать раствор 10 % сразу от поставщика", why: "Возможно, но не устраняет саму путаницу массы и объёма для других растворов." }
    after: "**В карту:** «NaOH 50 % — 6,00 кг (по весам); вода — 24,0 кг»."
  - title: ПАВ и баланс воды
    text: Рецептура задаёт ПАВ по активному веществу. Товарные формы приносят с собой воду.
    questions:
      - type: num
        q: Сколько килограммов пасты лауретсульфата натрия (70 %) нужно на партию?
        answer: 102.86
        tol: 0.01
        unit: кг
        hint: "Активного вещества нужно 800 × 0,09 = 72 кг. Пасты — 72 / 0,70."
        explain: "72 / 0,70 ≈ 102,86 кг."
      - type: num
        q: Сколько килограммов воды принесут в партию паста лауретсульфата и раствор бетаина (30 %) вместе (для учебного расчёта считайте весь остаток в товарной форме водой)?
        answer: 86.86
        tol: 0.015
        unit: кг
        hint: "Бетаина: активного 800 × 0,03 = 24 кг, раствора 24 / 0,30 = 80 кг. Вода — масса товарной формы минус активное вещество: 30,86 + 56,0."
        explain: "Паста: 102,86 − 72 = 30,86 кг; бетаин: 80 − 24 = 56,0 кг. Всего ≈ 86,86 кг воды."
      - type: mc
        q: Как правильно рассчитать загрузку воды по рецептуре «вода — до 100 %»?
        options:
          - { text: "Взять воду так, как если бы ПАВ были активными веществами: 800 − 72 − 24 − …", why: "Тогда в партию попадут лишние ~87 кг воды — ПАВ окажется меньше заданного." }
          - { text: "Перевести все компоненты в товарную форму и взять воду как остаток до массы партии", correct: true, why: "Вода из товарных форм уже учтена, и сумма загрузок равна 800 кг." }
          - { text: "Воду не менять — разница в пределах допуска", why: "Почти 11 % массы партии — это не допуск, а другой продукт." }
    after: "**В карту:** ПАВ — в товарной форме с указанием содержания основного вещества по паспорту партии; вода — остаток до 800 кг."

transfer:
  title: "Перенос: другая партия, другие формы"
  intro: |
    Партия 500 кг. Лауретсульфат натрия по рецептуре — 8 % по активному веществу, на складе — жидкая форма с основным веществом 27 %.
    Для корректировки нужно 10 кг раствора NaOH 20 % из того же 50 % раствора и 5 кг безводной лимонной кислоты, а на складе — моногидрат.
  questions:
    - type: num
      q: Сколько жидкого лауретсульфата натрия (27 %) нужно?
      answer: 148.15
      tol: 0.01
      unit: кг
      explain: "500 × 0,08 / 0,27 ≈ 148,15 кг. Воды он принесёт ≈ 108 кг."
    - type: num
      q: Сколько 50 % раствора NaOH взять для 10 кг раствора 20 %?
      answer: 4
      tol: 0.01
      unit: кг
      explain: "10 × 0,20 / 0,50 = 4,0 кг; воды — 6,0 кг."
    - type: num
      q: Сколько моногидрата лимонной кислоты соответствует 5 кг безводной?
      answer: 5.47
      tol: 0.01
      unit: кг
      explain: "5 × 210,14 / 192,12 ≈ 5,47 кг."
