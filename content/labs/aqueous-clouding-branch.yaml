id: aqueous-clouding-branch
engine: branching
order: 42
area: rnd
minutes: 10
role: Химик-разработчик R&D
title: "Симулятор брака водных систем: помутнение и обвал вязкости"
summary: "Разберитесь с помутнением прозрачного очищающего геля и падением вязкости на солевой кривой, не испортив партию несовместимыми добавками."
skill: Диагностировать причины помутнения водных систем с отдушкой и корректно исправлять пересол без коллапса полимеров
topics: [surfactant-thickening, polymer-thickeners, ionic-strength]
brief:
  situation: "Опытная партия прозрачного геля для умывания (10 % SLES, 3,5 % CAPB, 0,4 % отдушки, 1,6 % Полисорбата 20, соль NaCl) после охлаждения до 20 °C стала молочно-мутной, а после «дозагущения» оператором вязкость рухнула с 3200 до 450 мПа·с."
  goal: "Пошагово найдите причины обоих дефектов (помутнение + потеря вязкости) и выберите корректное технологическое решение."
  constraints: "Учебный ветвящийся кейс на синтетических данных; проверяет физико-химическую логику солюбилизации и солевой кривой."
dataNote: "Показатели мутности и вязкости синтетические; моделируют реальное поведение мицеллярной солюбилизации и пересола ПАВ-систем."

start: cloud-check
nodes:
  - id: cloud-check
    title: "Шаг 1: Почему прозрачный гель помутнел?"
    scene: "В журнале варки видно, что оператор влил 0,4 % отдушки прямо в холодную воду с ПАВ, а Полисорбат 20 добавил в самом конце. Проба мутная при 20 °C; под микроскопом видны микрокапли масла 2–5 мкм."
    readings:
      - { label: "Внешний вид", value: "молочно-мутный гель" }
      - { label: "Микроскопия", value: "капли отдушки 2–5 мкм" }
      - { label: "pH", value: "5,3" }
    choices:
      - id: premix-solubilizer
        label: "Сделать лабораторную пробу с правильным порядком загрузки: сначала смешать отдушку с Полисорбатом 20 (премикс 1:4) до прозрачности, затем ввести в водно-ПАВ раствор"
        verdict: ok
        consequence: "Премикс обеспечил мицеллярную солюбилизацию капель отдушки (< 20 нм) — система стала кристально прозрачной!"
        next: viscosity-drop
      - id: add-salt-to-clear
        label: "Добавить ещё 1,5 % хлорида натрия, чтобы «удержать капли» за счёт вязкости"
        verdict: wrong
        consequence: "Соль не солюбилизирует отдушку, а наоборот высаливает гидрофобные компоненты и усугубляет помутнение + переводит систему за пик солевой кривой."
        next: end-salted-out
      - id: heat-to-80
        label: "Нагреть всю партию с отдушкой до 80 °C, чтобы капли растворились"
        verdict: weak
        consequence: "При нагреве часть отдушки улетучилась, а при обратном охлаждении до 20 °C помутнение вернулось (точка помутнения и недостаточная предварительная солюбилизация не решены)."
        next: viscosity-drop

  - id: viscosity-drop
    title: "Шаг 2: Вязкость партии рухнула до 450 мПа·с после добавки соли"
    scene: "Прозрачность восстановлена, но выяснилось, что в цеховой партии уже суммарно 2,6 % NaCl (при пике солевой кривой данной рецептуры около 1,6 % NaCl). Оператор спрашивает, как спасти вязкость."
    readings:
      - { label: "Текущая вязкость", value: "450 мПа·с (норма 2500–4000)" }
      - { label: "Фактическая соль NaCl", value: "2,6 % (пик кривой ≈ 1,6 %)" }
      - { label: "Система ПАВ", value: "SLES 10 % + CAPB 3,5 %" }
    choices:
      - id: dilute-with-saltfree-base
        label: "Прекратить дозировку соли (пересол пройден!): проверить разбавление пробы бессолевой базой ПАВ, чтобы вернуть концентрацию NaCl к восходящей ветви (~1,4–1,5 %)"
        verdict: ok
        consequence: "Разбавление бессолевой базой вернуло ионную силу к левому плечу солевой кривой — червеобразные мицеллы восстановились, вязкость вышла на 3400 мПа·с при полной прозрачности."
        next: end-fixed
      - id: add-more-salt
        label: "Досыпать ещё 0,8 % NaCl — раз вязкость низкая, значит соли мало"
        verdict: wrong
        consequence: "Система ещё глубже ушла в правую ветвь солевой кривой: разветвлённые мицеллы схлопнулись, вязкость упала до 120 мПа·с (как вода)."
        next: end-salted-out
      - id: add-carbomer-to-salty
        label: "Добавить 0,6 % обычного карбомера прямо в солёный гель"
        verdict: wrong
        consequence: "При 2,6 % NaCl высокая ионная сила экранировала отрицательно заряженные карбоксилатные группы (−COO⁻) вдоль цепей полиакрилата — клубки сжались, полимер выпал хлопьями, вязкость не выросла, а гель снова помутнел."
        next: end-carbomer-fail

  - id: end-fixed
    title: "Прозрачность и вязкость восстановлены!"
    scene: "Контрольная проба прозрачна, вязкость 3400 мПа·с (20 °C), тест на охлаждение +5 °C пройден без помутнения."
    outcome:
      verdict: ok
      score: 1.0
      title: "Верная диагностика солюбилизации и солевой кривой"
      summary: "Вы устранили помутнение правильным премиксом солюбилизатора и распознали пересол справа от пика солевой кривой."
      lesson: "Отдушку вводят через прозрачный премикс с солюбилизатором; если вязкость ПАВ-системы упала после добавления соли, сначала проверьте, не пройдён ли максимум солевой кривой."

  - id: end-salted-out
    title: "Глубокий пересол и расслоение"
    scene: "Вязкость упала до 120 мПа·с, на поверхности появилась масляная плёнка высаленной отдушки."
    outcome:
      verdict: wrong
      score: 0.2
      title: "Переход за максимум солевой кривой"
      summary: "Избыточная соль разрушила вязкость и ухудшила солюбилизацию."
      lesson: "На правой ветви солевой кривой добавление соли не повышает, а необратимо снижает вязкость; исправление возможно только снижением доли соли (разбавлением бессолевой базой)."

  - id: end-carbomer-fail
    title: "Коллапс карбомера в электролитной среде"
    scene: "В геле с 2,6 % NaCl карбомер не набух и выпал в виде мутной взвеси."
    outcome:
      verdict: wrong
      score: 0.25
      title: "Несовместимость карбомера с электролитами"
      summary: "Стандартный полиакрилат не работает в присутствии высоких концентраций NaCl."
      lesson: "В солёных ПАВ-системах избегайте чувствительных карбомеров — управляйте вязкостью через соотношение ПАВ и солевую кривую либо используйте электролитоустойчивые загустители."

transfer:
  title: "Перенос: проверка на точку помутнения"
  intro: "Прозрачный гель с отдушкой и солюбилизатором выглядит чистым при 22 °C."
  questions:
    - type: mc
      q: "Какую быструю лабораторную проверку стоит провести до утверждения рецептуры прозрачного геля?"
      options:
        - text: "Выдержать образец при пониженной температуре (+4…+5 °C) и проверить возврат прозрачности при нагреве, а также снять полную солевую кривую с запасом до пика"
          correct: true
          why: "Охлаждение выявляет риск помутнения и кристаллизации при хранении, а запас до пика солевой кривой защищает от разброса остаточной соли в товарном SLES/CAPB."
        - text: "Проверить только цвет при 25 °C через 5 минут после перемешивания"
          why: "Краткий осмотр при комнатной температуре не выявляет ни холодового помутнения, ни риска пересола при смене партии сырья."
