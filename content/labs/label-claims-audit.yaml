id: label-claims-audit
engine: label-audit
order: 45
area: rnd
minutes: 10
role: Специалист по регуляторике и маркировке
title: "Тренажёр этикетки и клеймов: аудит упаковки (EU 1223/2009 · ТР ТС 009/2011)"
summary: "Проверьте макет этикетки крема перед отправкой в типографию: найдите ошибки порядка INCI, пропущенный аллерген, некорректные сроки годности и запрещённые медицинские клеймы."
skill: Проверять проект косметической маркировки на соответствие правилам порядка INCI, декларирования аллергенов, обязательных реквизитов и допустимости косметических заявлений
topics: [raw-functions, preservation]
brief:
  situation: "Отдел маркетинга прислал финальный макет этикетки для «Успокаивающего крема для лица» (несмываемый продукт leave-on, 50 мл). Реальная рецептура: Aqua 78 %, Caprylic/Capric Triglyceride 8 %, Glycerin 4 %, Cetearyl Alcohol 3 %, Sorbitan Stearate 2 %, Polysorbate 60 2 %, Panthenol 1,8 %, Phenoxyethanol 0,8 %, Benzyl Alcohol 0,2 %, Tocopherol 0,2 %. Завтра макет уходит в печать."
  goal: "Отметьте все фрагменты макета этикетки, содержащие нарушения правил маркировки (ст. 19 EU 1223/2009 и ТР ТС 009/2011), и оставьте нетронутыми корректные элементы."
  constraints: "Учебный макет этикетки; проверяет ключевые базовые правила маркировки косметической продукции."
dataNote: "Синтетический макет этикетки на базе базовых правил ст. 19 EU 1223/2009 и ТР ТС 009/2011; перед коммерческой печатью всегда сверяйте действующую редакцию регламента."

productTitle: "Успокаивающий крем для лица (50 мл · leave-on)"
formulaNote: "Фактическая рецептура: Aqua 78 %, Caprylic/Capric Triglyceride 8 %, Glycerin 4 %, Cetearyl Alcohol 3 %, Sorbitan Stearate 2 %, Polysorbate 60 2 %, Panthenol 1,8 %, Phenoxyethanol 0,8 %, Benzyl Alcohol 0,2 %, Tocopherol 0,2 %."

items:
  - id: lbl-order
    section: inci
    snippet: "INCI: Aqua, Caprylic/Capric Triglyceride, Cetearyl Alcohol, Sorbitan Stearate, Polysorbate 60, Panthenol, Phenoxyethanol, Glycerin, Tocopherol"
    hasViolation: true
    standard: "EU 1223/2009 (ст. 19) · ТР ТС 009/2011"
    why: "Нарушен порядок убывания массы для компонентов > 1 %: Glycerin (4 %) стоит после Phenoxyethanol (0,8 %), хотя обязан идти третьим сразу после Caprylic/Capric Triglyceride (8 %)."

  - id: lbl-allergen
    section: inci
    snippet: "Бензиловый спирт (0,2 % в составе) не указан в списке INCI, чтобы «состав выглядел короче»"
    hasViolation: true
    standard: "EU 1223/2009 (Прил. III, ст. 19) · ТР ТС 009/2011"
    why: "Во-первых, нельзя скрывать намеренно добавленный компонент рецептуры; во-вторых, Benzyl Alcohol превышает порог обязательного декларирования аллергена (> 0,001 % для leave-on) в 200 раз."

  - id: lbl-under1
    section: inci
    snippet: "Компоненты ≤ 1 % (Tocopherol 0,2 % и Phenoxyethanol 0,8 %) перечислены после 1 %-й черты в произвольном порядке относительно друг друга"
    hasViolation: false
    standard: "EU 1223/2009 (ст. 19)"
    why: "Это допустимо: ингредиенты с концентрацией ≤ 1 % разрешается указывать в любом порядке после ингредиентов с концентрацией > 1 %."

  - id: lbl-medical-claim
    section: claims
    snippet: "Клейм на лицевой стороне: «Лечит атопический дерматит, розацеа и восстанавливает кожу на клеточном уровне за 24 часа»"
    hasViolation: true
    standard: "EU 1223/2009 (ст. 2, ст. 20) · ТР ТС 009/2011 (ст. 5)"
    why: "Запрещённый медицинский/лечебный клейм! Косметика не может заявлять лечение заболеваний (дерматит, розацеа) — это выводит продукт за рамки определения парфюмерно-косметической продукции."

  - id: lbl-free-from
    section: claims
    snippet: "Плашка на лицевой стороне: «0 % консервантов · полностью без химии»"
    hasViolation: true
    standard: "EU 655/2013 (критерии правдивости клеймов) · ТР ТС 009/2011"
    why: "Прямое введение потребителя в заблуждение: в составе 0,8 % феноксиэтанола и 0,2 % бензилового спирта (классические консерванты), а заявление «без химии» научно некорректно."

  - id: lbl-valid-claim
    section: claims
    snippet: "Описание на обороте: «Смягчает сухую кожу и помогает поддерживать ощущение комфорта»"
    hasViolation: false
    standard: "EU 1223/2009 · ТР ТС 009/2011"
    why: "Корректное косметическое заявление: описывает уходовый/органолептический эффект без лечебных претензий."

  - id: lbl-expiry
    section: mandatory
    snippet: "Срок годности на макете: не указан (оставлено «уточнить позже»), символ PAO (открытая баночка) отсутствует"
    hasViolation: true
    standard: "EU 1223/2009 (ст. 19) · ТР ТС 009/2011 (ст. 5, п. 9)"
    why: "Срок годности (или дата минимальной стойкости / символ PAO при сроке > 30 месяцев в ЕС; в ЕАЭС срок годности обязателен всегда) — обязательный реквизит маркировки."

  - id: lbl-batch
    section: mandatory
    snippet: "На шве тубы предусмотрены номер партии, номинальный объём «50 мл» и наименование/адрес изготовителя"
    hasViolation: false
    standard: "EU 1223/2009 (ст. 19) · ТР ТС 009/2011"
    why: "Обязательные реквизиты прослеживаемости, номинального количества и ответственного лица присутствуют."

transfer:
  title: "Перенос: пограничный случай 1 %-й черты INCI"
  intro: "В сыворотке 3 % ниацинамида, 0,9 % феноксиэтанола, 0,5 % гиалуроната натрия и 0,1 % ЭДТА."
  questions:
    - type: mc
      q: "Какой порядок этих четырёх компонентов в INCI соответствует ст. 19 EU 1223/2009?"
      options:
        - text: "Niacinamide обязательно раньше всех трёх; остальные три (≤ 1 %) могут идти в любом порядке после него"
          correct: true
          why: "Всё, что > 1 %, идёт строго по убыванию массы; всё, что ≤ 1 %, — в любом порядке после 1 %-й границы."
        - text: "Все четыре компонента можно поставить в алфавитном порядке"
          why: "Niacinamide (3 %) превышает 1 % и обязан стоять на своём месте по убыванию массы."
