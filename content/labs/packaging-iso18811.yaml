        pumpState: "Помпа с внешней пружиной (glass ball + PE тракт) работает безупречно"
        passed: true
        why: "ПЭТФ устойчив к органическим кислотам pH 3,5, а вынесенная из потока пружина исключает коррозию металла."
      - packId: pp-jar
        weightLossPct: 3.1
        wallState: "Усыхание геля по краям резьбы, кристаллизация салициловой кислоты на ободке"
        organoleptic: "Потеря массы 3,1 % превышает порог 2,0 %"
        pumpState: "Кристаллы на резьбе нарушают герметичность"
        passed: false
        why: "Испарение воды > 2 % в банке приводит к высаливанию колючих кристаллов салициловой кислоты на горловине."
      - packId: pp-airless
        weightLossPct: 0.4
        wallState: "Корпус в норме"
        organoleptic: "Лёгкое окрашивание первой дозы из-за металлического шарика клапана внутри дешёвой версии"
        pumpState: "Допустимо только при заказе полностью безметаллового клапана (удорожание в 2,5 раза)"
        passed: false
        why: "Без специальной спецификации metal-free шарик обратного клапана корродирует при pH 3,5."
      - packId: alu-std-pump
        weightLossPct: 0.6
        wallState: "Вздутие тубы водородом, питтинговая коррозия пружины SUS302"
        organoleptic: "Гель приобрёл серый/розоватый оттенок (комплексы железа с салицилатом!)"
        pumpState: "Заклинивание ржавой пружины на 3-й неделе +45 °C"
        passed: false
        why: "Салициловая кислота при pH 3,5 растворяет оксидную плёнку стали и даёт фиолетово-розовый комплекс с Fe³⁺!"
questions:
  - id: weight-loss-limit
    prompt: "Какой практический инженерный критерий потери массы (weight loss) обычно закладывают на 4 недели при +45 °C по подходам ISO/TR 18811 для водных эмульсий и гелей?"
    options:
      - id: under-2pct
        text: "Не более 1,5–2,0 % за 4 недели при +45 °C (превышение сигнализирует о высокой паропроницаемости стенок или негерметичности укупорки)"
        correct: true
        why: "Верно! Потеря массы > 2 % за месяц при +45 °C ведёт к пересыханию продукта, росту концентрации консервантов/кислот и усадке объёма за срок годности."
      - id: under-15pct
        text: "До 15 % потери воды считается нормой для любой банки"
        why: "При потере 15 % крем превратится в сухую корку и нарушит номинальный объём фасовки."
      - id: zero-not-measured
        text: "Массу тары в тестах стабильности вообще не взвешивают"
        why: "Гравиметрический контроль потери массы в финальной упаковке — обязательный пункт протокола совместимости."
  - id: escr-meaning
    prompt: "Почему испытание совместимости всегда проводят с РЕАЛЬНОЙ затянутой укупоркой и наклеенной этикеткой, а не просто погружая кусочек пластика в стакан с кремом?"
    options:
      - id: stress-cracking
        text: "Чтобы выявить растрескивание под механическим напряжением (ESCR на резьбе горловины), миграцию клея этикетки и работу клапанов помпы в сборе"
        correct: true
        why: "Верно! ПАВ и отдушки вызывают растрескивание (Environmental Stress Cracking) именно в зонах растягивающих напряжений затянутой резьбы."
      - id: faster-heating
        text: "Только для красоты фотографии в отчёте"
        why: "Сборка выявляет механические отказы резьбы, прокладок и пружин, которые не видны на свободном купоне пластика."
      - id: micro-only
        text: "Исключительно для проверки стерильности этикетки"
        why: "Главная цель — физико-механическая и химическая совместимость всей системы «продукт — флакон — укупорка — этикетка»."
brief:
  situation: "В R&D-отдел одновременно переданы на запуск три продукта: гидрофильное масло с D-лимоненом, ночная сыворотка с 0,3 % ретинола и кислотный пилинг pH 3,5. Нужно утвердить первичную тару по итогам 4-недельного теста при +45 °C [@isotr18811]."
  goal: "Изучите матрицу испытаний 3 × 5 в термошкафу +45 °C, подберите безотказную упаковку для каждого из трёх продуктов и ответьте на контрольные вопросы инженера по упаковке."
  constraints: "Учитывайте не только внешний вид крема, но и потерю массы (< 2 %), деформацию стенок (панелинг), фото/кислородный барьер и контакт кислот с металлом дозатора."
dataNote: "Учебная матрица результатов ускоренного теста совместимости (4 нед. +45 °C), построенная по отраслевым руководствам ISO/TR 18811 и практике упаковочных лабораторий."
hints:
  - "Полярный полиэфир (PET) отлично держит неполярные эфирные масла и терпены, тогда как неполярный LDPE впитывает их и втягивается внутрь."
  - "Салициловая кислота даёт характерное окрашивание при малейшем выщелачивании ионов железа из пружины дозатора."
transfer:
  title: "Перенос: окисление D-Limonene и аллергенный статус"
  intro: "В прозрачном полупустом флаконе гидрофильное масло с цитрусовой отдушкой простояло на освещённой витрине 6 месяцев."
  questions:
    - type: mc
      q: "Почему защита терпенов (Limonene, Linalool) от воздуха и света критична не только для запаха, но и для токсикологической безопасности?"
      options:
        - text: "Сам чистый D-Limonene — слабый аллерген, но при автоокислении кислородом воздуха образует гидропероксиды лимонена — сильные контактные сенсибилизаторы кожи"
          correct: true
          why: "Верно! Именно гидропероксиды окисленных терпенов вызывают контактный дерматит — поэтому IFRA требует ввода антиоксиданта (токоферол/BHT) и барьерной упаковки."
        - text: "На свету лимонен превращается в воду"
          why: "Терпены окисляются по радикальному механизму до гидропероксидов, эпоксидов и карвона."
        - text: "Окисление терпенов повышает SPF продукта"
          why: "Пероксиды терпенов раздражают кожу и не дают солнцезащиты."
