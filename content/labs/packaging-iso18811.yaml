id: packaging-iso18811
engine: pack-compat
order: 50
area: rnd
role: Инженер по упаковке / R&D-технолог
minutes: 10
title: "Совместимость рецептуры и упаковки (ISO/TR 18811): тест 4 недели при +45 °C"
summary: "Проведите виртуальные испытания трёх продуктов в пяти типах первичной тары (LDPE, ПЭТФ, ПП-банка, Airless, янтарное стекло) и исключите панелинг, окисление и коррозию пружины."
skill: "Подбирать материал первичной упаковки и дозатор под химический профиль рецептуры и интерпретировать протокол совместимости по ISO/TR 18811."
topics: [packaging-compatibility, fragrances-allergens]
packs:
  - id: ldpe-bottle
    name: "Тонкостенный флакон LDPE (ПЭНД) с флип-топом"
    material: "Неполярный аморфно-кристаллический полиолефин (LDPE)"
    barrierNote: "Мягкий на нажим, высокий барьер к воде, но проницаем для кислорода и набухает от терпенов/масел."
  - id: pet-pump
    name: "Толстостенный флакон PET (ПЭТФ) с дозатором (внешняя пружина)"
    material: "Полярный полиэфир (PET) + помпа без контакта металла с продуктом"
    barrierNote: "Отличная стойкость к маслам, эфирным терпенам и кислотам pH ≥ 3,2; хороший газовый барьер."
  - id: pp-jar
    name: "Широкогорлая банка PP (полипропилен) с вкладышем"
    material: "Жёсткий полипропилен (PP)"
    barrierNote: "Химически стоек, но при каждом открытии даёт полный контакт с воздухом, светом и пальцами."
  - id: pp-airless
    name: "Непрозрачный многослойный PP/EVOH Airless-диспенсер"
    material: "PP + барьерный слой EVOH + вакуумный поршень без воздушной шапки"
    barrierNote: "Исключает обратный подсос воздуха и УФ-свет; минимальная потеря массы (< 0,4 %)."
  - id: alu-std-pump
    name: "Нелакированная алюминиевая туба / стандартная помпа с пружиной SUS302 в потоке"
    material: "Металл в прямом контакте с кислой/электролитной средой"
    barrierNote: "Уязвим к питтинговой коррозии и выщелачиванию ионов Fe/Ni/Al при pH < 4,0."
products:
  - id: citrus-oil
    name: "Гидрофильное масло для умывания с 1,2 % масла сладкого апельсина (D-Limonene)"
    composition: "Безводная смесь Caprylic/Capric Triglyceride, PEG-20 Glyceryl Triisostearate и цитрусовых терпенов."
    correctPackId: pet-pump
    results:
      - packId: ldpe-bottle
        weightLossPct: 1.8
        wallState: "Сильное втягивание стенок («панелинг»), липкость наружной поверхности под этикеткой"
        organoleptic: "Ослабление верхних цитрусовых нот"
        pumpState: "Крышка закрывается с перекосом из-за набухания горловины"
        passed: false
        why: "Неполярный D-Limonene активно диффундирует в LDPE, пластифицирует полиолефин и вызывает панелинг."
      - packId: pet-pump
        weightLossPct: 0.2
        wallState: "Геометрия и жёсткость без изменений, этикетка держится прочно"
        organoleptic: "Аромат и прозрачность соответствуют контролю +4 °C"
        pumpState: "Плавный ход дозатора, герметичность в вакуум-камере (−0,5 бар) пройдена"
        passed: true
        why: "Полярный ПЭТФ не сорбирует неполярные терпены и масла — эталонный выбор для гидрофильных масел."
      - packId: pp-jar
        weightLossPct: 0.9
        wallState: "Крышка слегка разбухла по резьбе, подтёки жидкого масла"
        organoleptic: "Рост перекисного числа из-за широкого зеркала контакта с воздухом"
        pumpState: "Банка неудобна и негерметична для жидкого масла"
        passed: false
        why: "Жидкое масло в широкогорлой банке вытекает по резьбе и быстро окисляется."
      - packId: pp-airless
        weightLossPct: 0.3
        wallState: "Лёгкое набухание ПЭ-манжеты поршня от терпенов на 4-й неделе"
        organoleptic: "Без изменений"
        pumpState: "Поршень начал проскальзывать на низкой вязкости масла"
        passed: false
        why: "Классический поршневой airless плохо держит маловязкие масла с терпенами (риск протечки манжеты)."
      - packId: alu-std-pump
        weightLossPct: 0.4
        wallState: "Корпус цел"
        organoleptic: "Лёгкий металлический тон окисленных терпенов"
        pumpState: "Подклинивание клапана"
        passed: false
        why: "Ионы металлов катализируют автоокисление D-лимонена в гидропероксиды (сильные сенсибилизаторы!)."
  - id: retinol-serum
    name: "Ночная эмульсионная сыворотка с 0,3 % чистого Retinol (pH 5,8)"
    composition: "Лёгкая эмульсия O/W с 0,3 % ретинола, токоферолом и бисабололом."
    correctPackId: pp-airless
    results:
      - packId: ldpe-bottle
        weightLossPct: 1.4
        wallState: "Стенки полупрозрачные, без деформации"
        organoleptic: "Пожелтение до тёмно-оранжевого (ΔE = 6,8), падение титра ретинола на 42 %"
        pumpState: "Флип-топ подсасывает воздух после каждого сжатия"
        passed: false
        why: "Высокая кислородопроницаемость LDPE и подсос воздуха быстро разрушают ретинол."
      - packId: pet-pump
        weightLossPct: 0.7
        wallState: "Прозрачный корпус пропускает свет"
        organoleptic: "На свету титр ретинола упал на 35 %, заметное пожелтение у стенок"
        pumpState: "Воздушная шапка в стандартном флаконе окисляет верхний слой"
        passed: false
        why: "Прозрачный флакон с подсосом воздуха не защищает 0,3 % ретинола от фотоизомеризации и O₂."
      - packId: pp-jar
        weightLossPct: 2.6
        wallState: "Потеря воды выше нормы (> 2,0 %)"
        organoleptic: "Побурение поверхности крема, окислительный запах"
        pumpState: "Открытое горло — максимальный контакт с O₂ и микрофлорой"
        passed: false
        why: "Открытая банка полностью непригодна для чистого ретинола: потеря воды 2,6 % и быстрое окисление."
      - packId: pp-airless
        weightLossPct: 0.3
        wallState: "Корпус непрозрачный, геометрия стабильна"
        organoleptic: "Цвет светло-кремовый (ΔE = 0,7), сохранность ретинола по ВЭЖХ 96 %"
        pumpState: "Чёткая дозировка без обратного подсоса воздуха"
        passed: true
        why: "Непрозрачный многослойный airless с барьером EVOH исключает кислород и свет — стандарт для ретинола."
      - packId: alu-std-pump
        weightLossPct: 0.5
        wallState: "Микропоры на сгибе нелакированной тубы"
        organoleptic: "Потемнение у горлышка от катализа следами металла"
        pumpState: "Контакт с металлом ускоряет распад ретинола"
        passed: false
        why: "Ретинол крайне чувствителен к следам ионов металлов — требуется инертный полимерный тракт."
  - id: aha-peel
    name: "Кислотный гель-пилинг 10 % Glycolic Acid + 2 % Salicylic Acid (pH 3,5)"
    composition: "Водно-гликолевый гель на ксантане/тауратном сополимере с высокой кислотностью."
    correctPackId: pet-pump
    results:
      - packId: ldpe-bottle
        weightLossPct: 1.1
        wallState: "Без деформации"
        organoleptic: "Неравномерное дозирование геля через широкий флип-топ (риск попадания в глаза)"
        pumpState: "Подтекание кислого геля на крышке"
        passed: false
        why: "Флип-топ небезопасен для точного дозирования кислотного пилинга pH 3,5."
      - packId: pet-pump
        weightLossPct: 0.5
        wallState: "Тёмный (янтарный) ПЭТФ без изменений, ΔpH = 0,03"
