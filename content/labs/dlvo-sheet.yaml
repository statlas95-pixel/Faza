# Занятие-расчёт (движок worksheet). ВСЕ ДАННЫЕ — УЧЕБНЫЕ; формула дебаевской длины — для водных растворов при 25 °C.
id: dlvo-sheet
engine: worksheet
order: 14
title: "Соль и дисперсия: ионная сила, дебаевская длина, правило Шульце — Гарди"
summary: Суспензия пигмента стабилизирована зарядом частиц. Маркетинг просит добавить экстракт и солевой актив. Рассчитайте, что эти добавки сделают с двойным электрическим слоем, и выберите безопасный вариант.
area: rnd
role: Разработчик рецептур
minutes: 15
skill: Оценка электролитной устойчивости дисперсии — рассчитать ионную силу, дебаевскую длину и относительную коагулирующую силу ионов и выбрать способ стабилизации.
topics: [colloid-stability]
dataNote: Учебные данные. κ⁻¹ ≈ 0,304/√I нм — для водных растворов при 25 °C; правило Шульце — Гарди даёт предельную оценку (z⁻⁶), реальные отношения обычно меньше.
hints:
  - "I = ½ Σ cᵢ·zᵢ². Для NaCl I = c; для CaCl₂ — считайте оба иона: Ca²⁺ c, Cl⁻ 2c."
  - "Дебаевская длина обратно пропорциональна квадратному корню из ионной силы."

brief:
  situation: |
    Тональная основа содержит суспензию пигмента, стабилизированную зарядом частиц (дзета-потенциал около −40 мВ в исходной среде).
    Предлагают ввести экстракт, который приносит 0,01 моль/л хлорида кальция, и солевой увлажнитель — 0,15 моль/л одно-однозарядной соли.
  goal: Оценить, как каждая добавка меняет двойной электрический слой, и предложить решение.
  constraints: Справка — в выписке. Логарифмы и корни считайте на калькуляторе.

sheet:
  title: Справка к расчёту
  origin: Общеизвестные соотношения коллоидной химии; числа рецептуры — учебные.
  rows:
    - ["Ионная сила", "I = ½ Σ cᵢ zᵢ², моль/л"]
    - ["Дебаевская длина (вода, 25 °C)", "κ⁻¹ ≈ 0,304 / √I нм"]
    - ["Исходная среда", "I ≈ 0,001 моль/л"]
    - ["Добавка А — экстракт", "приносит CaCl₂ 0,01 моль/л"]
    - ["Добавка Б — солевой увлажнитель", "соль 1:1, 0,15 моль/л"]
    - ["Правило Шульце — Гарди", "критическая концентрация коагуляции ∝ z⁻⁶ (предельная оценка)"]

steps:
  - title: Ионная сила и толщина двойного слоя
    text: Сравните исходную среду и среду с добавками.
    questions:
      - type: num
        q: Какова дебаевская длина в исходной среде (I = 0,001 моль/л), нм?
        answer: 9.61
        tol: 0.02
        unit: нм
        hint: "0,304 / √0,001 = 0,304 / 0,0316."
        explain: "≈ 9,6 нм — двойной слой «толстый», отталкивание действует на большом расстоянии."
      - type: num
        q: Какую ионную силу даёт 0,01 моль/л CaCl₂, моль/л?
        answer: 0.03
        tol: 0.02
        unit: моль/л
        hint: "½ · (0,01 · 2² + 0,02 · 1²)."
        explain: "½ · (0,04 + 0,02) = 0,03 моль/л."
      - type: num
        q: Какова дебаевская длина при I = 0,15 моль/л (добавка Б), нм?
        answer: 0.785
        tol: 0.02
        unit: нм
        hint: "0,304 / √0,15."
        explain: "≈ 0,78 нм — двойной слой сжат более чем в 12 раз по сравнению с исходной средой."
  - title: Какая добавка опаснее
    text: Порог коагуляции зависит не только от ионной силы, но и от заряда противоиона.
    questions:
      - type: num
        q: Частицы заряжены отрицательно. Во сколько раз Ca²⁺ эффективнее Na⁺ как коагулянт по предельной оценке Шульце — Гарди?
        answer: 64
        tol: 0.01
        unit: раз
        hint: "Противоион для отрицательных частиц — катион; отношение (2/1)⁶."
        explain: "2⁶ = 64."
      - type: mc
        q: Какой вывод корректен?
        options:
          - { text: "Опасна только добавка Б — у неё больше ионная сила", why: "Ионная сила — не единственный фактор: многозарядные противоионы коагулируют при намного меньших концентрациях." }
          - { text: "Обе добавки опасны для электростатически стабилизированной суспензии: Б — сильным сжатием двойного слоя, А — двухзарядным противоионом", correct: true, why: "Порог коагуляции для Ca²⁺ ниже на порядки, поэтому даже 0,01 моль/л может быть критичным; проверяют экспериментально." }
          - { text: "Ни одна не опасна — дзета-потенциал −40 мВ", why: "Дзета-потенциал измерен в исходной среде; с ростом ионной силы и при адсорбции Ca²⁺ он уменьшается по модулю." }
  - title: Решение
    text: Добавки нужны маркетингу. Что предложить?
    questions:
      - type: mc
        q: Какое решение наиболее надёжно?
        options:
          - { text: "Поднять дзета-потенциал, увеличив pH", why: "Может помочь в исходной среде, но не решает проблему сжатия слоя при высокой ионной силе." }
          - { text: "Перейти на стерическую (полимерную) или комбинированную стабилизацию пигмента и ввести хелатирующий агент против Ca²⁺; проверить хранением", correct: true, why: "Стерический барьер мало чувствителен к ионной силе, хелатирующий агент снижает концентрацию свободного кальция." }
          - { text: "Ввести добавки, но увеличить вязкость", why: "Вязкость замедлит оседание агрегатов, но не предотвратит их образование." }

transfer:
  title: "Перенос: сульфат магния"
  intro: |
    В другую рецептуру предлагают ввести сульфат магния 0,05 моль/л. Дисперсия частиц тоже стабилизирована зарядом. Для расчёта примите полную диссоциацию и пренебрегите другими ионами и ионными парами.
  questions:
    - type: num
      q: Какова ионная сила 0,05 моль/л MgSO₄, моль/л?
      answer: 0.2
      tol: 0.02
      unit: моль/л
      explain: "½ · (0,05 · 2² + 0,05 · 2²) = 0,2 моль/л."
    - type: num
      q: Какова дебаевская длина, нм?
      answer: 0.68
      tol: 0.02
      unit: нм
      explain: "0,304 / √0,2 ≈ 0,68 нм."
    - type: mc
      q: Частицы заряжены положительно. Какой ион MgSO₄ — противоион и определяет коагуляцию?
      options:
        - { text: "Mg²⁺", why: "Противоион имеет заряд, противоположный заряду частицы." }
        - { text: "SO₄²⁻", correct: true, why: "Для положительных частиц противоион — анион; сульфат двухзаряден и эффективен как коагулянт." }
        - { text: "Оба одинаково", why: "Коагуляцию определяет противоион." }
