# Занятие-расчёт (движок worksheet). ВСЕ ДАННЫЕ — УЧЕБНЫЕ; pKa — справочные значения при 25 °C.
id: ph-sheet
engine: worksheet
order: 11
title: "Корректировка pH: буфер и две партии"
summary: Рассчитайте буфер под заданный pH, объясните, почему одна партия «прыгает» при доводке, а другая нет, и решите, как измерять pH горячей пробы.
area: both
role: Технолог-разработчик
minutes: 15
skill: Работа с pH и буферами — рассчитать соотношение кислоты и соли по уравнению Гендерсона — Хассельбальха, оценить буферную ёмкость и корректно измерить pH.
topics: [ph-buffers]
dataNote: Учебные данные. Расчёты по уравнению Гендерсона — Хассельбальха используют концентрации вместо активностей; при высокой ионной силе фактический pH может отличаться на десятые доли единицы.
hints:
  - "pH = pKa + lg([соль]/[кислота]). При равных количествах pH = pKa."
  - "Буфер работает примерно в области pKa ± 1: сравните рабочий pH с pKa кислот, которые есть в рецептуре."

brief:
  situation: |
    R&D переводит лосьон на лактатный буфер, а производство жалуется: при доводке pH одной партии каждая порция кислоты даёт скачок,
    а у другой pH почти не двигается.
  goal: Рассчитать буфер, объяснить поведение партий и записать правило измерения pH в инструкцию.
  constraints: Справочные данные — в выписке справа. Логарифмы считайте на калькуляторе.

sheet:
  title: Справка по слабым кислотам (25 °C, справочные значения)
  origin: Общеизвестные справочные значения; для расчёта в концентрированных системах — только ориентир.
  rows:
    - ["Молочная кислота", "pKa ≈ 3,86"]
    - ["Бензойная кислота", "pKa ≈ 4,20"]
    - ["Сорбиновая кислота", "pKa ≈ 4,76"]
    - ["Лимонная кислота", "pKa₁ ≈ 3,13; pKa₂ ≈ 4,76; pKa₃ ≈ 6,40"]
    - ["Буферная ёмкость одной слабой кислоты", "максимальна при pH = pKa: β_max ≈ 0,58·C"]

steps:
  - title: Лактатный буфер
    text: Буфер составляют из молочной кислоты и лактата натрия.
    questions:
      - type: num
        q: "Каков pH смеси лактат натрия / молочная кислота в мольном отношении 2 : 1?"
        answer: 4.16
        tol: 0.008
        unit: ""
        hint: "pH = 3,86 + lg 2; lg 2 ≈ 0,301."
        explain: "3,86 + 0,30 = 4,16."
      - type: num
        q: Какое мольное отношение лактат / кислота нужно для pH 4,5?
        answer: 4.37
        tol: 0.03
        unit: ""
        hint: "lg(соль/кислота) = 4,5 − 3,86 = 0,64; отношение = 10^0,64."
        explain: "10^0,64 ≈ 4,37."
      - type: num
        q: Буфер с общей концентрацией лактата 0,1 моль/л. Какова его максимальная буферная ёмкость, моль/(л·ед. pH)?
        answer: 0.058
        tol: 0.04
        unit: ""
        hint: "β_max ≈ 0,58·C."
        explain: "0,58 × 0,1 ≈ 0,058 моль/(л·ед. pH). При pH 4,5 (в пределах pKa ± 1) ёмкость ниже максимума, но ещё значительна."
    after: "**В рецептуру:** соотношение задаётся по молям; массы пересчитывают через молярные массы с учётом концентрации товарной молочной кислоты."
  - title: Две партии при доводке pH
    text: |
      Партия А — гель для душа с pH 6,8, в рецептуре нет заметных количеств слабых кислот. Партия Б — лосьон с лактатным буфером, pH 4,5.
      В обе ввели одинаковую порцию 10 % раствора лимонной кислоты. pH партии А упал на 1,5 единицы, партии Б — на 0,1.
    questions:
      - type: mc
        q: Почему партия А так сильно отреагировала?
        options:
          - { text: "Раствор кислоты был крепче, чем нужно", why: "Порция одинаковая для обеих партий; партия Б реагирует слабо — дело в партии, а не в растворе." }
          - { text: "В партии А почти нет буфера: ионы водорода не связываются сопряжённым основанием", correct: true, why: "Без слабых кислот и их солей в рабочей области pH ёмкость системы мала, и малая порция даёт большой сдвиг." }
          - { text: "pH-метр неисправен", why: "Тогда ошибка была бы и в партии Б." }
      - type: mc
        q: Как доводить pH такой партии на производстве?
        options:
          - { text: "Сразу всем расчётным количеством", why: "В небуферированной системе расчёт неточен, и перелёт нормы весьма вероятен." }
          - { text: "Малыми порциями более разбавленного раствора, с перемешиванием и замером после каждой", correct: true, why: "Это снижает шаг изменения pH и позволяет остановиться в норме." }
          - { text: "Добавить буфер с pKa около 9", why: "Буфер работает около своего pKa; для pH 6–7 он бесполезен и меняет рецептуру." }
  - title: Измерение pH горячей пробы
    text: Аппаратчик отбирает пробу при 60 °C и сразу измеряет pH-метром с автоматической термокомпенсацией. Методика требует измерения при 25 °C.
    questions:
      - type: mc
        q: Что делает автоматическая термокомпенсация?
        options:
          - { text: "Пересчитывает pH пробы к 25 °C", why: "Для этого нужно знать состав и температурную зависимость равновесий пробы — прибор их не знает." }
          - { text: "Учитывает зависимость крутизны электродной функции от температуры", correct: true, why: "Поэтому показание соответствует pH пробы при её фактической температуре, а не при 25 °C." }
          - { text: "Ничего, если электрод откалиброван", why: "Калибровка и термокомпенсация решают разные задачи." }
      - type: mc
        q: Что записать в инструкцию?
        options:
          - { text: "Измерять при любой температуре — прибор скомпенсирует", why: "Компенсация не пересчитывает pH пробы к 25 °C." }
          - { text: "Охладить пробу до температуры методики и измерить; горячее измерение — только ориентир для смены", correct: true, why: "Значение для заключения о соответствии получают при условиях методики." }
          - { text: "Вычесть из горячего значения 0,5", why: "Поправка зависит от состава продукта; универсальной нет." }

transfer:
  title: "Перенос: цитратный буфер"
  intro: |
    Для тоника нужен pH 5,0 и устойчивость pH при хранении. Рассматривают цитратный буфер (вторая ступень диссоциации, pKa₂ ≈ 4,76).
  questions:
    - type: num
      q: Какое мольное отношение «двухзамещённый цитрат / однозамещённый цитрат» даст pH 5,0?
      answer: 1.74
      tol: 0.03
      unit: ""
      explain: "lg(отношение) = 5,0 − 4,76 = 0,24; 10^0,24 ≈ 1,74."
    - type: mc
      q: Для какого рабочего pH цитратная система буферирует лучше, чем лактатная?
      options:
        - { text: "Для pH 3,9", why: "Здесь pKa молочной кислоты (3,86) почти совпадает с рабочим pH — лактат хорош." }
        - { text: "Для pH 5,5", correct: true, why: "pH 5,5 далеко от pKa молочной кислоты (больше чем на 1,5 единицы), но лежит между pKa₂ и pKa₃ лимонной кислоты." }
        - { text: "Ни для какого — у них одинаковая ёмкость", why: "Ёмкость зависит от того, насколько рабочий pH близок к pKa." }
    - type: num
      q: При pH 4,76 какая доля второй ступени цитрата находится в кислотной (протонированной) форме, %?
      answer: 50
      tol: 0.02
      unit: "%"
      explain: "При pH = pKa соотношение форм 1 : 1 — по 50 %."
