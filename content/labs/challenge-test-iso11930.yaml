id: challenge-test-iso11930
engine: challenge-test
order: 47
area: rnd
role: Микробиолог / R&D-технолог
minutes: 10
title: "Challenge Test (ISO 11930): разбор провала консервации на 28-й день"
summary: Оцените 28-дневный протокол нагрузочного теста по 5 тест-штаммам ISO 11930, классифицируйте критерий A/B и почините консервирующую систему без передозировки.
skill: Интерпретировать протокол Challenge Test (ISO 11930) по логарифмическому снижению КОЕ и подбирать корректировку консервирующей системы с учётом pH и упаковки.
topics: [preservation, packaging-compatibility]
formulaInfo: "Увлажняющий крем O/W в открытой банке 50 мл · pH 6,1 · Консервант: Sodium Benzoate 0,35 % + Potassium Sorbate 0,25 % (без хелатора)"
strains:
  - id: pa
    name: "Pseudomonas aeruginosa (грамотриц. бактерия)"
    group: bacteria
    logDropD7: 3.4
    logDropD14: 4.1
    logDropD28: 4.5
    isoA: "D7 ≥ 3; D14 ≥ 3 (без роста); D28 без роста"
    isoB: "D14 ≥ 3; D28 без роста"
    passedA: true
    passedB: true
  - id: sa
    name: "Staphylococcus aureus (грамполож. бактерия)"
    group: bacteria
    logDropD7: 3.2
    logDropD14: 3.9
    logDropD28: 4.2
    isoA: "D7 ≥ 3; D14 ≥ 3 (без роста); D28 без роста"
    isoB: "D14 ≥ 3; D28 без роста"
    passedA: true
    passedB: true
  - id: ec
    name: "Escherichia coli (грамотриц. бактерия)"
    group: bacteria
    logDropD7: 3.5
    logDropD14: 4.0
    logDropD28: 4.3
    isoA: "D7 ≥ 3; D14 ≥ 3 (без роста); D28 без роста"
    isoB: "D14 ≥ 3; D28 без роста"
    passedA: true
    passedB: true
  - id: ca
    name: "Candida albicans (дрожжи)"
    group: yeast
    logDropD7: 0.7
    logDropD14: 1.4
    logDropD28: 1.8
    isoA: "D7 ≥ 1; D14 без роста; D28 без роста"
    isoB: "D14 ≥ 1; D28 без роста"
    passedA: false
    passedB: true
  - id: ab
    name: "Aspergillus brasiliensis (плесневый гриб)"
    group: mold
    logDropD7: -0.2
    logDropD14: -0.5
    logDropD28: -0.9
    isoA: "D14 ≥ 0; D28 ≥ 1"
    isoB: "D14 ≥ 0; D28 ≥ 0 (без роста)"
    passedA: false
    passedB: false
failedStrainId: ab
expectedCriterion: fail
criterionWhy: "По ISO 11930 тест считается пройденным по критерию A или B, только если ВСЕ 5 тест-штаммов выполняют требования. Здесь C. albicans укладывается лишь в критерий B, а по плесени A. brasiliensis зафиксирован активный рост (−0,5 и −0,9 log) — тест полностью НЕ пройден."
remedies:
  - id: ph-boost-pack
    text: "Снизить pH до 4,9–5,1 (вернуть активную сорбиновую кислоту) или перейти на pH-независимый Phenoxyethanol 0,8 % + фунгицидный бустер + 0,1 % Disodium EDTA и заменить открытую банку на тубу/airless"
    correct: true
    why: "Верно! При pH 6,1 у сорбиновой кислоты (pKa 4,76) остаётся менее 5 % активной недиссоциированной формы — плесень растёт беспрепятственно. Снижение pH + хелатор + защищённая тара устраняют провал системно."
  - id: double-sorbate
    text: "Оставить pH 6,1 и открытую банку, но увеличить сорбат калия до 1,2 %"
    why: "Во-первых, 1,2 % сорбата калия (0,90 % в пересчёте на сорбиновую кислоту) нарушает лимит 0,6 % по EU Annex V и ТР ТС Прил. 4! Во-вторых, при pH 6,1 он всё равно неактивен."
  - id: release-anyway
    text: "Выпустить партию по критерию B, так как все три бактерии уложились в критерий A"
    why: "По ISO 11930 провал даже по одному штамму (плесень A. brasiliensis) запрещает выпуск — крем заплесневеет у потребителя в открытой банке."
brief:
  situation: "Из микробиологической лаборатории пришёл 28-дневный отчёт нагрузочного теста (Challenge Test по ISO 11930) на новую партию увлажняющего крема в открытой банке (pH 6,1, бензоат натрия + сорбат калия)."
  goal: "Найдите провалившийся тест-штамм, вынесите вердикт по критериям ISO 11930 (A / B / провал) и выберите корректный план доработки формулы и упаковки."
  constraints: "Помните лимиты EU 1223/2009 Прил. V и ТР ТС 009/2011 Прил. 4 (сорбиновая кислота ≤ 0,6 %, бензойная ≤ 0,5 % в leave-on)."
dataNote: "Логарифмические значения снижения КОЕ — синтетические учебные данные, построенные по реальным таблицам критериев ISO 11930."
hints:
  - "Отрицательное значение Δlog означает, что число микроорганизмов не упало, а выросло по сравнению с исходным заражением."
  - "Сравните pH крема (6,1) с pKa сорбиновой кислоты (4,76) и бензойной кислоты (4,20)."
transfer:
  title: "Перенос: когда допускается Критерий B по ISO 11930?"
  intro: "После доработки все бактерии и дрожжи прошли с запасом, но A. brasiliensis дал Δlog = 0,4 на 28-й день (критерий B: нет роста, но меньше 1,0 log)."
  questions:
    - type: mc
      q: "При каком условии стандарт ISO 11930 разрешает выпуск продукта, прошедшего по Критерию B?"
      options:
        - text: "Если дополнительная оценка рисков подтверждает защиту за счёт упаковки/факторов рецептуры (например, герметичный airless-флакон или однодозовая ампула, исключающая занос микрофлоры)"
          correct: true
          why: "Верно! Критерий B допустим только при документально обоснованных защитных факторах (упаковка без контакта с руками, низкая активность воды и т. д.)."
        - text: "Критерий B разрешает выпуск в любой открытой банке без ограничений"
          why: "Открытая банка несёт максимальный риск вторичной контаминации — для неё требуется критерий A."
        - text: "Критерий B применим только к безводным маслам"
          why: "Безводные системы с aw < 0,6 вообще оцениваются по категории низкого микробиологического риска (ISO 29621)."
