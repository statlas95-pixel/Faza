# Входная диагностика. Каждое задание проверяет один навык через действие.
# kind: recognize (распознать) | decide (выбрать действие или недостающие данные) | calc (расчёт).
# result у варианта: ok | partial | wrong. Кнопки «Не знаю» и «Пропустить» есть у каждого задания.
# after — уточняющее задание показывается только при указанном результате предыдущего.
# first — цели, для которых задание идёт в начале (различает маршруты).
- id: d-rheo
  skill: rheo
  kind: decide
  first: [rnd, bridge, base]
  short: два крема с одинаковой вязкостью, один стекает
  q: Два крема показывают на вискозиметре одинаковые 12 000 мПа·с. Первый держится на вертикальной поверхности, второй стекает. Какое измерение покажет разницу?
  options:
    - { text: "Повторить на том же вискозиметре с большим числом параллелей", result: wrong, note: "повтор той же точки" }
    - { text: "Кривая течения при высоких скоростях сдвига, около 1000 с⁻¹", result: partial, note: "кривая течения, но не тот диапазон" }
    - { text: "Определение предела текучести или вязкости при очень малых напряжениях", result: ok, note: "предел текучести" }
- id: d-rheo-calc
  skill: rheo
  kind: calc
  after: { item: d-rheo, result: [ok] }
  short: напряжение в слое 2 мм
  q: Слой крема толщиной 2 мм на вертикальной стенке, плотность 1000 кг/м³. Какое напряжение сдвига он создаёт у стенки? Ответ в Па.
  answer: 19.6
  tol: 0.06
  unit: Па
- id: d-mech
  skill: mech
  kind: recognize
  first: [rnd, base]
  short: слой в лосьоне исчезает при встряхивании
  q: Через месяц в лосьоне появился прозрачный слой снизу. После встряхивания он исчезает, размер капель под микроскопом прежний. Что произошло и что менять в первую очередь?
  options:
    - { text: "Коалесценция — менять эмульгатор", result: wrong, note: "коалесценция" }
    - { text: "Кримирование — увеличить дозировку эмульгатора", result: partial, note: "кримирование, но рычаг не тот" }
    - { text: "Кримирование — уменьшать размер капель или повышать вязкость среды при малом сдвиге", result: ok, note: "кримирование, верный рычаг" }
- id: d-struct
  skill: struct
  kind: decide
  first: [prod, bridge]
  short: низкая вязкость через 40 минут после выгрузки
  q: Крем на цетеариловом спирте. ОКК измерил вязкость через 40 минут после выгрузки — ниже нормы. Методика требует измерять через 24 часа при 25 °C. Ваше первое действие?
  options:
    - { text: "Ввести дополнительный загуститель, пока партия в реакторе", result: wrong, note: "корректировать сразу" }
    - { text: "Сверить загрузки сырья по протоколу варки", result: partial, note: "проверка загрузок раньше проверки измерения" }
    - { text: "Не делать выводов по этому числу: повторить измерение по методике", result: ok, note: "сначала достоверность измерения" }
- id: d-mixing
  skill: mixing
  kind: recognize
  first: [prod, base]
  short: турбинная мешалка в загустевающем креме
  q: В реакторе с быстроходной турбинной мешалкой вода превращается по ходу варки в крем с вязкостью около 40 Па·с. Что произойдёт с перемешиванием?
  options:
    - { text: "Ничего существенного: обороты те же", result: wrong, note: "ничего не изменится" }
    - { text: "Вырастет нагрузка на привод, перемешивание останется прежним", result: partial, note: "только нагрузка на привод" }
    - { text: "Течение станет ламинарным, движение сохранится только вблизи мешалки — нужна якорная или скребковая", result: ok, note: "смена режима и застойные зоны" }
- id: d-scale
  skill: scale
  kind: calc
  first: [prod]
  short: обороты для той же окружной скорости
  q: Лабораторный гомогенизатор — ротор 50 мм, 6000 об/мин. Производственный — ротор 250 мм. Какие обороты дадут ту же окружную скорость? Ответ в об/мин.
  answer: 1200
  tol: 0.03
  unit: об/мин
- id: d-emul
  skill: emul
  kind: decide
  after: { item: d-scale, result: [ok] }
  short: 1,5 прохода вместо 30
  q: В лаборатории 5 минут гомогенизации — это 30 проходов партии через аппарат. На реакторе те же 5 минут — 1,5 прохода. Что из этого следует?
  options:
    - { text: "Ничего: время то же, значит режим перенесён", result: wrong, note: "время как критерий" }
    - { text: "Нужно увеличить обороты, чтобы компенсировать", result: partial, note: "обороты вместо проходов" }
    - { text: "Заметная доля продукта не пройдёт через зону диспергирования — время нужно пересчитать по числу проходов", result: ok, note: "число проходов" }
- id: d-surf
  skill: surf
  kind: decide
  short: партия справа от максимума солевой кривой
  q: Шампунь загущают солью. Партия в норме по вязкости, но, судя по кривой, находится справа от максимума. Отдушка после ввода снизила вязкость чуть ниже нормы. Что делать?
  options:
    - { text: "Добавить ещё соли малой порцией", result: wrong, note: "добавить соль справа от максимума" }
    - { text: "Добавить воды", result: partial, note: "разбавление водой" }
    - { text: "Соль только ухудшит: исправляет разбавление несолёной основой, а на будущее — останавливаться слева от максимума", result: ok, note: "правый склон, соль не поможет" }
- id: d-micro
  skill: micro
  kind: recognize
  short: сорбат калия при pH 6,5
  q: В креме консервант — сорбат калия. По просьбе маркетинга pH подняли с 5,0 до 6,5, дозировку не меняли. Как изменится защита?
  options:
    - { text: "Не изменится: концентрация консерванта та же", result: wrong, note: "концентрация та же" }
    - { text: "Улучшится: в нейтральной среде консерванты стабильнее", result: wrong, note: "улучшится" }
    - { text: "Резко ослабнет: действует недиссоциированная кислота, а её доля при pH 6,5 в десятки раз меньше", result: ok, note: "доля недиссоциированной формы" }
- id: d-doe
  skill: doe
  kind: decide
  first: [rnd, bridge]
  short: прогноз по двум факторам не сошёлся
  q: Загуститель и актив подбирали по отдельности от базовой рецептуры. Образец с обоими изменениями оказался намного жиже прогноза. Каких данных не хватало?
  options:
    - { text: "Более точного взвешивания компонентов", result: wrong, note: "точность взвешивания" }
    - { text: "Повторных опытов базовой рецептуры", result: partial, note: "повторы, но не сочетания" }
    - { text: "Опытов, где оба фактора изменены одновременно, — чтобы увидеть их взаимодействие", result: ok, note: "взаимодействие факторов" }
- id: d-stab
  skill: stabtest
  kind: decide
  after: { item: d-mech, result: [ok, partial] }
  short: центрифуга пройдена, через полгода расслоение
  q: Образец выдержал 30 минут при 3000 g, а через полгода расслоился. Какое объяснение стоит проверить первым?
  options:
    - { text: "Центрифуга была неисправна", result: wrong, note: "неисправность прибора" }
    - { text: "Нужно было крутить дольше", result: partial, note: "дольше центрифугировать" }
    - { text: "Сработал механизм, который центрифуга не ускоряет, — например, рост капель из-за созревания или перестройка структуры", result: ok, note: "другой механизм" }
- id: d-sol
  skill: solcalc
  kind: calc
  first: [grad, base]
  short: 50 % щёлочь для 10 % раствора
  q: Сколько килограммов 50 % раствора гидроксида натрия нужно, чтобы приготовить 20 кг раствора 10 %?
  answer: 4
  tol: 0.02
  unit: кг
- id: d-ph
  skill: acidbase
  kind: recognize
  first: [grad]
  short: pH одной партии прыгает, другой — нет
  q: Одинаковая порция раствора лимонной кислоты сдвинула pH партии А на 1,5 единицы, а партии Б — на 0,1. Обе партии сварены правильно. В чём вероятная причина?
  options:
    - { text: "В партию А случайно ввели более крепкий раствор кислоты", result: wrong, note: "крепость раствора" }
    - { text: "Партии отличаются температурой при измерении", result: partial, note: "температура измерения" }
    - { text: "Разная буферная ёмкость: в партии Б есть слабые кислоты и их соли с pKa около рабочего pH", result: ok, note: "буферная ёмкость" }
- id: d-colloid
  skill: colloidstab
  kind: recognize
  first: [grad, rnd]
  short: суспензия расслоилась после добавки соли
  q: Суспензия пигмента, стабилизированная только зарядом частиц, расслоилась после добавки экстракта с солями. Аналог со стабилизатором-полимером — нет. Почему?
  options:
    - { text: "Соль увеличила плотность среды, и частицы всплыли", result: wrong, note: "плотность среды" }
    - { text: "Соль изменила pH", result: partial, note: "изменение pH" }
    - { text: "Соль сжала двойной электрический слой и сняла электростатический барьер; стерическая защита полимером к соли малочувствительна", result: ok, note: "сжатие двойного слоя" }
- id: d-heat
  skill: heat
  kind: decide
  first: [grad, prod]
  short: медленное охлаждение крема в рубашке
  q: Крем охлаждается через рубашку медленно. Сопротивления теплопередаче — со стороны крема 0,0067, стенки 0,0004, воды 0,0005 м²·К/Вт. Какая мера даст наибольший эффект?
  options:
    - { text: "Заменить стенку на более тонкую", result: wrong, note: "тоньше стенка" }
    - { text: "Перейти на более холодную воду", result: partial, note: "холоднее хладагент" }
    - { text: "Обновлять слой у стенки — исправные скребки, подходящая мешалка: основное сопротивление на стороне крема", result: ok, note: "сторона продукта" }
