- id: graduate
  name: Выпускник химического вуза
  description: Опора на физическую и коллоидную химию, основы ПАХТ. Не требует знания цеховых методик и торговых марок сырья.
  time: 5–7 минут
- id: starter
  name: Начинающий специалист
  description: Короткие вопросы по базовым понятиям и понятным рабочим ситуациям. Подходит при небольшом опыте в косметической промышленности.
  time: 4–6 минут
- id: experienced
  name: Опытный специалист
  description: Теория механизмов, интерпретация измерений и выбор решений. Уточняющие вопросы появляются после верного ответа.
  time: 8–10 минут
