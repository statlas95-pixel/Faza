<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Cosmetic formula architecture">
  
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Anatomy of a Cosmetic O/W Formula (Phase A + Phase B + Phase C = 100%)</text>
  <g transform="translate(26,50)">
        <rect width="234" height="192" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.8"/>
        <text x="117" y="26" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0C5E80">Phase A · Aqueous (~65–80%)</text>
        <g font-family="sans-serif" font-size="11" fill="#182026">
          <text x="18" y="58">• Purified water (q.s. 100%)</text>
          <text x="18" y="84">• Humectants (Glycerin 3–5%)</text>
          <text x="18" y="110">• Polymers (Xanthan / Carbomer)</text>
          <text x="18" y="136">• Chelator (EDTA 0.1%)</text>
        </g>
        <text x="117" y="172" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#0369A1">70–75 °C</text>
      </g>
      <g transform="translate(274,50)">
        <rect width="218" height="192" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.8"/>
        <text x="109" y="26" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#92400E">Phase B · Lipid (~15–25%)</text>
        <g font-family="sans-serif" font-size="11" fill="#182026">
          <text x="16" y="58">• Emollients & oils</text>
          <text x="16" y="84">• O/W Emulsifiers (HLB)</text>
          <text x="16" y="110">• Fatty alcohols / waxes</text>
          <text x="16" y="136">• Lipophilic UV / BHT</text>
        </g>
        <text x="109" y="172" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#B45309">70–75 °C</text>
      </g>
      <g transform="translate(506,50)">
        <rect width="228" height="192" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.8"/>
        <text x="114" y="26" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5B21B6">Phase C · Cool-Down (~2–8%)</text>
        <g font-family="sans-serif" font-size="11" fill="#182026">
          <text x="16" y="58">• Heat-labile actives</text>
          <text x="16" y="84">• Preservative system</text>
          <text x="16" y="110">• Fragrance / Vitamin E</text>
          <text x="16" y="136">• pH adjustment (final)</text>
        </g>
        <text x="114" y="172" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#6D28D9">≤ 35–40 °C</text>
      </g>
</svg>
