<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Four mechanisms of O/W emulsion physical instability">
  <rect width="760" height="270" rx="18" fill="#FBF8F3" stroke="#E4DACB"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#2A1B3D">Four Mechanisms of O/W Emulsion Physical Instability</text>
  <g transform="translate(24,48)">
    <rect width="164" height="198" rx="14" fill="#FFFFFF" stroke="#E6DACB"/>
    <rect x="44" y="20" width="76" height="106" rx="12" fill="#E3F4F2" stroke="#0E7C7B" stroke-width="1.8"/>
    <g fill="#FF9E6D" stroke="#C84B2A" stroke-width="1">
      <circle cx="60" cy="34" r="6"/><circle cx="75" cy="32" r="5.5"/><circle cx="90" cy="35" r="6"/><circle cx="104" cy="33" r="5.5"/>
      <circle cx="67" cy="46" r="5.5"/><circle cx="83" cy="47" r="6"/><circle cx="98" cy="46" r="5.5"/>
      <circle cx="76" cy="59" r="5"/><circle cx="91" cy="58" r="5"/>
    </g>
    <path d="M82 112 L82 74" stroke="#0E7C7B" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="82,69 77,77 87,77" fill="#0E7C7B"/>
    <text x="82" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#2A1B3D">1. Creaming</text>
    <text x="82" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B4C6E">Stokes upward drift</text>
    <text x="82" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0E7C7B" font-weight="600">Reversible on shaking</text>
  </g>
  <g transform="translate(206,48)">
    <rect width="164" height="198" rx="14" fill="#FFFFFF" stroke="#E6DACB"/>
    <rect x="44" y="20" width="76" height="106" rx="12" fill="#E3F4F2" stroke="#6E4FA3" stroke-width="1.8"/>
    <g fill="#FF9E6D" stroke="#C84B2A" stroke-width="1">
      <circle cx="66" cy="54" r="6"/><circle cx="77" cy="51" r="5.5"/><circle cx="72" cy="63" r="5.5"/><circle cx="83" cy="61" r="6"/>
      <circle cx="92" cy="92" r="6"/><circle cx="102" cy="87" r="5.5"/><circle cx="98" cy="99" r="5.5"/><circle cx="86" cy="101" r="5"/>
    </g>
    <text x="82" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#2A1B3D">2. Flocculation</text>
    <text x="82" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B4C6E">Clustering into flocs</text>
    <text x="82" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#6E4FA3" font-weight="600">Interfacial films intact</text>
  </g>
  <g transform="translate(388,48)">
    <rect width="164" height="198" rx="14" fill="#FFFFFF" stroke="#E6DACB"/>
    <rect x="44" y="20" width="76" height="106" rx="12" fill="#E3F4F2" stroke="#D9482B" stroke-width="1.8"/>
    <rect x="45.5" y="21.5" width="73" height="24" rx="8" fill="#F2B84B"/>
    <g fill="#FF9E6D" stroke="#C84B2A" stroke-width="1.2">
      <circle cx="68" cy="66" r="12"/><circle cx="95" cy="78" r="14"/><circle cx="74" cy="102" r="10"/>
    </g>
    <text x="82" y="148" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#2A1B3D">3. Coalescence</text>
    <text x="82" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B4C6E">Droplet fusion → free oil</text>
    <text x="82" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#D9482B" font-weight="600">Irreversible separation</text>
  </g>
  <g transform="translate(570,48)">
    <rect width="164" height="198" rx="14" fill="#FFFFFF" stroke="#E6DACB"/>
    <rect x="44" y="20" width="76" height="106" rx="12" fill="#E3F4F2" stroke="#C98A00" stroke-width="1.8"/>
    <circle cx="62" cy="54" r="4" fill="#FF9E6D" stroke="#C84B2A" stroke-dasharray="2 2"/>
    <circle cx="64" cy="96" r="3.5" fill="#FF9E6D" stroke="#C84B2A" stroke-dasharray="2 2"/>
    <circle cx="94" cy="74" r="17" fill="#FF9E6D" stroke="#C84B2A" stroke-width="1.3"/>
    <path d="M68 58 L77 65 M69 93 L78 86" stroke="#C98A00" stroke-width="1.6" stroke-dasharray="2 2"/>
    <text x="82" y="148" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2A1B3D">4. Ostwald Ripening</text>
    <text x="82" y="166" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B4C6E">Diffusion: small → large</text>
    <text x="82" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9A6800" font-weight="600">r³ grows linearly with t</text>
  </g>
</svg>
