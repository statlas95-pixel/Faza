<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Converting 70% SLES commercial paste and MgSO4·7H2O hydrate to target active matter and closing the formula water balance q.s. ad 100%">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#182026"/>
    </marker>
  </defs>
  <rect width="760" height="320" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Active-Matter Conversion &amp; Formula Water Balance (q.s. ad 100%)</text>

  <!-- Stage 1: Target active spec -->
  <g transform="translate(24,44)">
    <rect width="224" height="190" rx="14" fill="#EFF9FF" stroke="#0C5E80" stroke-width="1.4"/>
    <text x="112" y="21" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0C5E80">1. Target Active Specification</text>

    <rect x="12" y="32" width="200" height="66" rx="9" fill="#FFFFFF" stroke="#DCE6EE"/>
    <text x="22" y="49" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">SLES (100% active) = 10.5%</text>
    <text x="22" y="65" font-family="sans-serif" font-size="9.5" fill="#5B6770">Commercial paste: 70% act. / 30% H₂O</text>
    <text x="22" y="86" font-family="monospace" font-size="10.5" font-weight="700" fill="#0C5E80">m_raw = 10.5 / 0.70 = 15.00%</text>

    <rect x="12" y="106" width="200" height="72" rx="9" fill="#FFFFFF" stroke="#DCE6EE"/>
    <text x="22" y="123" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">MgSO₄ (anhydr.) = 1.00%</text>
    <text x="22" y="138" font-family="sans-serif" font-size="9.5" fill="#5B6770">Crystal hydrate MgSO₄·7H₂O</text>
    <text x="22" y="152" font-family="monospace" font-size="9.5" fill="#5B6770">w = 120.4 / 246.5 = 48.8%</text>
    <text x="22" y="169" font-family="monospace" font-size="10.5" font-weight="700" fill="#6D28D9">m_raw = 1.00 / 0.488 = 2.05%</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="252" y1="139" x2="274" y2="139" stroke="#182026" stroke-width="1.8" marker-end="url(#arrDark)"/>

  <!-- Stage 2: Carried water split -->
  <g transform="translate(278,44)">
    <rect width="214" height="190" rx="14" fill="#FFF7ED" stroke="#B45309" stroke-width="1.4"/>
    <text x="107" y="21" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#B45309">2. Water Carried by Raw Materials</text>

    <!-- Bar 1: SLES 70% -->
    <text x="14" y="45" font-family="sans-serif" font-size="10" font-weight="700" fill="#182026">70% SLES Paste (15.00%):</text>
    <rect x="14" y="52" width="130" height="24" rx="5" fill="#E6F6FE" stroke="#0C5E80" stroke-width="1.2"/>
    <text x="79" y="68" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#0C5E80">10.50% active</text>
    <rect x="146" y="52" width="54" height="24" rx="5" fill="#FFEAE7" stroke="#C4382A" stroke-width="1.2"/>
    <text x="173" y="68" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#C4382A">4.50%</text>

    <!-- Bar 2: MgSO4.7H2O -->
    <text x="14" y="100" font-family="sans-serif" font-size="10" font-weight="700" fill="#182026">MgSO₄·7H₂O (2.05%):</text>
    <rect x="14" y="107" width="91" height="24" rx="5" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.2"/>
    <text x="59" y="123" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#6D28D9">1.00% salt</text>
    <rect x="107" y="107" width="93" height="24" rx="5" fill="#FFEAE7" stroke="#C4382A" stroke-width="1.2"/>
    <text x="153" y="123" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#C4382A">1.05% H₂O</text>

    <!-- Carried water sum -->
    <rect x="14" y="144" width="186" height="34" rx="8" fill="#FFF1F0" stroke="#C4382A" stroke-width="1.4"/>
    <text x="107" y="159" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Subtract from water phase:</text>
    <text x="107" y="173" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#C4382A">ΔH₂O = 4.50 + 1.05 = 5.55%</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="496" y1="139" x2="518" y2="139" stroke="#182026" stroke-width="1.8" marker-end="url(#arrDark)"/>

  <!-- Stage 3: Closing q.s. ad 100% -->
  <g transform="translate(522,44)">
    <rect width="214" height="190" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="1.4"/>
    <text x="107" y="21" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#047857">3. Closing q.s. ad 100%</text>

    <rect x="12" y="32" width="190" height="146" rx="9" fill="#FFFFFF" stroke="#DCE6EE"/>
    <g font-family="sans-serif" font-size="10" fill="#182026">
      <text x="22" y="51">SLES (70% paste)</text>
      <text x="192" y="51" text-anchor="end" font-family="monospace" font-weight="700">15.00%</text>

      <text x="22" y="70">MgSO₄·7H₂O</text>
      <text x="192" y="70" text-anchor="end" font-family="monospace" font-weight="700">2.05%</text>

      <text x="22" y="89">Other (glycerin, etc.)</text>
      <text x="192" y="89" text-anchor="end" font-family="monospace" font-weight="700">5.00%</text>
    </g>
    <line x1="22" y1="99" x2="192" y2="99" stroke="#DCE6EE" stroke-width="1.2"/>

    <text x="22" y="118" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#047857">Added Water (q.s.)</text>
    <text x="192" y="118" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#047857">77.95%</text>
    <text x="107" y="135" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B6770">100 − 22.05 = 77.95%</text>

    <line x1="22" y1="145" x2="192" y2="145" stroke="#182026" stroke-width="1.2"/>
    <text x="22" y="165" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">TOTAL BATCH</text>
    <text x="192" y="165" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#182026">100.00%</text>
  </g>

  <!-- Bottom visual 100% stacked mass-balance bar -->
  <rect x="24" y="246" width="712" height="58" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="40" y="264" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">100% Formula Mass Balance (active matter + carried water + q.s. added water):</text>

  <!-- Stacked segments totaling width=680 (x=40..720) -->
  <rect x="40" y="272" width="76" height="22" rx="4" fill="#E6F6FE" stroke="#0C5E80" stroke-width="1.2"/>
  <text x="78" y="286" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#0C5E80">10.5%</text>

  <rect x="118" y="272" width="44" height="22" rx="4" fill="#FFEAE7" stroke="#C4382A" stroke-width="1.2"/>
  <text x="140" y="286" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#C4382A">4.5%</text>

  <rect x="164" y="272" width="22" height="22" rx="4" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.2"/>
  <text x="175" y="286" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#6D28D9">1%</text>

  <rect x="188" y="272" width="28" height="22" rx="4" fill="#FFEAE7" stroke="#C4382A" stroke-width="1.2"/>
  <text x="202" y="286" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#C4382A">1.05</text>

  <rect x="218" y="272" width="46" height="22" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
  <text x="241" y="286" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#B45309">5.0%</text>

  <rect x="266" y="272" width="454" height="22" rx="4" fill="#ECFDF5" stroke="#047857" stroke-width="1.4"/>
  <text x="493" y="287" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857">Added Water q.s. = 77.95%   (total water in product: 77.95 + 5.55 = 83.50%)</text>
</svg>
