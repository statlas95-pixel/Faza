<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Weak acid titration curve showing the pKa ± 1 buffer plateau zone and sharp pH jump at the equivalence point">
  <rect width="760" height="320" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Weak Acid Titration Curve &amp; Buffer Plateau Zone (pKa ± 1)</text>

  <!-- Left main chart card -->
  <rect x="24" y="44" width="484" height="258" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>

  <!-- Buffer horizontal band pKa ± 1 for pKa=4.76 (pH 3.76..5.76 -> y=210..175) -->
  <rect x="76" y="175" width="406" height="35" fill="#ECFDF5" opacity="0.85"/>
  <rect x="102" y="175" width="238" height="35" fill="#DDF3EC" stroke="#047857" stroke-width="1.1" stroke-dasharray="4 3"/>

  <!-- Sharp pH jump band around eq=1.0 -->
  <rect x="346" y="66" width="40" height="192" fill="#FFF1F0" opacity="0.8"/>

  <!-- Horizontal gridlines -->
  <g stroke="#DCE6EE" stroke-width="1" stroke-dasharray="3 3">
    <line x1="76" y1="76" x2="482" y2="76"/>
    <line x1="76" y1="111" x2="482" y2="111"/>
    <line x1="76" y1="146" x2="482" y2="146"/>
    <line x1="76" y1="181" x2="482" y2="181"/>
    <line x1="76" y1="216" x2="482" y2="216"/>
    <line x1="76" y1="250" x2="482" y2="250"/>
  </g>

  <!-- Axes -->
  <line x1="76" y1="258" x2="486" y2="258" stroke="#182026" stroke-width="1.6"/>
  <line x1="76" y1="62" x2="76" y2="258" stroke="#182026" stroke-width="1.6"/>

  <!-- Y axis ticks & labels -->
  <g font-family="monospace" font-size="10" fill="#5B6770" text-anchor="end">
    <text x="68" y="80">11</text>
    <text x="68" y="115">9</text>
    <text x="68" y="150">7</text>
    <text x="68" y="185">5</text>
    <text x="68" y="220">3</text>
    <text x="68" y="254">1</text>
  </g>
  <text x="41" y="160" transform="rotate(-90 41 160)" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#182026">Solution pH</text>

  <!-- X axis ticks & labels -->
  <g stroke="#182026" stroke-width="1.2">
    <line x1="76" y1="254" x2="76" y2="262"/>
    <line x1="149" y1="254" x2="149" y2="262"/>
    <line x1="221" y1="254" x2="221" y2="262"/>
    <line x1="294" y1="254" x2="294" y2="262"/>
    <line x1="366" y1="254" x2="366" y2="262"/>
    <line x1="439" y1="254" x2="439" y2="262"/>
  </g>
  <g font-family="monospace" font-size="10" fill="#5B6770" text-anchor="middle">
    <text x="76" y="275">0</text>
    <text x="149" y="275">0.25</text>
    <text x="221" y="275">0.50</text>
    <text x="294" y="275">0.75</text>
    <text x="366" y="275" font-weight="700" fill="#C4382A">1.00</text>
    <text x="439" y="275">1.25</text>
  </g>
  <text x="280" y="293" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#182026">Equivalents of Added Base NaOH (n_OH / n_HA)</text>

  <!-- Reference vertical lines -->
  <line x1="221" y1="175" x2="221" y2="258" stroke="#047857" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="366" y1="66" x2="366" y2="258" stroke="#C4382A" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- Titration curve -->
  <path d="M 76 234 C 86 218 96 212 108 209 C 145 201 182 197 221 192 C 260 187 298 183 334 176 C 351 172 359 156 366 125 C 373 94 382 78 402 74 C 428 70 456 68 480 67" fill="none" stroke="#0C5E80" stroke-width="3"/>

  <!-- Key points -->
  <circle cx="221" cy="192" r="5" fill="#047857" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="366" cy="125" r="5" fill="#C4382A" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Callouts inside plot -->
  <rect x="116" y="132" width="208" height="34" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.2"/>
  <text x="220" y="147" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#047857">Buffer Plateau: pKa ± 1</text>
  <text x="220" y="160" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#047857">pH = pKa (β_max, [A⁻]=[HA])</text>
  <line x1="221" y1="166" x2="221" y2="186" stroke="#047857" stroke-width="1.2"/>

  <rect x="218" y="72" width="126" height="44" rx="8" fill="#FFF1F0" stroke="#C4382A" stroke-width="1.2"/>
  <text x="281" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#C4382A">Equivalence Point</text>
  <text x="281" y="102" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#C4382A">Sharp pH jump!</text>
  <text x="281" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B6770">1 drop → ΔpH &gt; 3</text>
  <line x1="344" y1="98" x2="361" y2="122" stroke="#C4382A" stroke-width="1.3"/>

  <!-- Right info panel -->
  <g transform="translate(520,44)">
    <rect width="216" height="258" rx="14" fill="#EFF9FF" stroke="#0C5E80" stroke-width="1.4"/>

    <!-- Equation box -->
    <rect x="12" y="12" width="192" height="66" rx="10" fill="#FFFFFF" stroke="#DCE6EE"/>
    <text x="108" y="30" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">Henderson–Hasselbalch</text>
    <text x="108" y="51" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0C5E80">pH = pKa + log([A⁻]/[HA])</text>
    <text x="108" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5B6770">1:10 to 10:1 ratio → ±1 pH unit</text>

    <!-- Cosmetic buffers box -->
    <rect x="12" y="88" width="192" height="98" rx="10" fill="#FFFFFF" stroke="#DCE6EE"/>
    <text x="108" y="106" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#182026">Cosmetic Buffers:</text>
    <text x="22" y="126" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857">• Lactate</text>
    <text x="194" y="126" text-anchor="end" font-family="monospace" font-size="9.5" fill="#182026">pKa = 3.86</text>
    <text x="22" y="146" font-family="sans-serif" font-size="10" font-weight="700" fill="#0C5E80">• Citrate</text>
    <text x="194" y="146" text-anchor="end" font-family="monospace" font-size="9.5" fill="#182026">3.1 / 4.8 / 6.4</text>
    <text x="22" y="166" font-family="sans-serif" font-size="10" font-weight="700" fill="#6D28D9">• Phosphate</text>
    <text x="194" y="166" text-anchor="end" font-family="monospace" font-size="9.5" fill="#182026">pKa₂ = 7.20</text>
    <text x="108" y="180" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#5B6770">Citrate stabilizes skin pH (4.5–5.5)</text>

    <!-- Practical warning box -->
    <rect x="12" y="196" width="192" height="50" rx="10" fill="#FFF1F0" stroke="#C4382A" stroke-width="1.2"/>
    <text x="108" y="214" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#C4382A">Outside pKa ± 1:</text>
    <text x="108" y="229" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">buffer capacity collapses —</text>
    <text x="108" y="241" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#182026">trace NaOH swings pH wildly</text>
  </g>
</svg>
