<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Fragrance pyramid and EU 2023/1545">
  
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Fragrance Volatility Pyramid &amp; EU 2023/1545 (81 Allergens)</text>
  <g transform="translate(36,48)">
        <polygon points="154,14 210,74 98,74" fill="#8ED6F8" stroke="#0284C7" stroke-width="1.6"/>
        <polygon points="94,78 214,78 248,136 60,136" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1.6"/>
        <polygon points="56,140 252,140 286,194 22,194" fill="#FDE68A" stroke="#D97706" stroke-width="1.6"/>
        <text x="154" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0C5E80">Top (Citrus)</text>
        <text x="154" y="112" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">Heart (Floral · Linalool)</text>
        <text x="154" y="172" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#78350F">Base (Vanillin · Musk · Woods)</text>
      </g>
      <g transform="translate(368,52)">
        <rect width="356" height="190" rx="14" fill="#FFFFFF" stroke="#DCE6EE" stroke-width="1.6"/>
        <text x="178" y="26" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#182026">Mandatory INCI Disclosure Thresholds</text>
        <rect x="20" y="42" width="316" height="46" rx="10" fill="#FFF1F0" stroke="#FF968A"/>
        <text x="34" y="62" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#9A3528">Leave-on (creams, serums):</text>
        <text x="34" y="79" font-family="monospace" font-size="11.5" font-weight="700" fill="#B91C1C">&gt; 0.001 % (10 ppm) → Must list in INCI</text>
        <rect x="20" y="98" width="316" height="46" rx="10" fill="#EFF9FF" stroke="#8ED6F8"/>
        <text x="34" y="118" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0C5E80">Rinse-off (shampoos, gels):</text>
        <text x="34" y="135" font-family="monospace" font-size="11.5" font-weight="700" fill="#0369A1">&gt; 0.01 % (100 ppm) → Must list in INCI</text>
        <text x="178" y="170" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">IFRA 51st Amendment sets max safe dosage by category</text>
      </g>
</svg>
