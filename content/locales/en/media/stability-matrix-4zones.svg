        <text x="84" y="92" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#182026">Yellowing ΔE &amp;</text>
        <text x="84" y="110" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#182026">fragrance decay</text>
