<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Four zone stability protocol">
  
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Stability Testing Matrix (ISO/TR 18811): What Each Chamber Detects</text>
  <g transform="translate(26,50)">
        <rect width="168" height="192" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.8"/>
