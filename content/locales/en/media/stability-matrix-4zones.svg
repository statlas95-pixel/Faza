        <text x="84" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5B6770">Winter logistics</text>
      </g>
      <g transform="translate(386,50)">
        <rect width="168" height="192" rx="14" fill="#FFF1F0" stroke="#FF968A" stroke-width="1.8"/>
        <text x="84" y="30" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#9A3528">+45 °C</text>
        <text x="84" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#B91C1C">Thermal Oven (3 mo)</text>
        <text x="84" y="92" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#182026">Coalescence, pH</text>
