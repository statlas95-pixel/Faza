        <text x="84" y="30" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#5B21B6">−10 ↔ +25 °C</text>
        <text x="84" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#6D28D9">Freeze–Thaw (3–5×)</text>
        <text x="84" y="92" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#182026">Emulsion break &amp;</text>
