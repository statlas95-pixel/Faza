<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Stoichiometry and commercial active-matter calculation flowchart">
  <rect width="760" height="300" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">From Chemical Formula to Batch Weighing Sheet: 4 Steps</text>

  <rect x="22" y="54" width="164" height="220" rx="12" fill="#EFF9FF" stroke="#1F648A" stroke-width="1.3"/>
  <text x="104" y="76" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0C5E80">1. Stoichiometry</text>
  <rect x="34" y="90" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="104" y="110" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#182026">n = m / M</text>
  <text x="104" y="126" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B6770">C = n / V (mol/L)</text>
  <text x="104" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">Neutralization, buffers,</text>
  <text x="104" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">salt dissociation:</text>
  <text x="104" y="192" text-anchor="middle" font-family="monospace" font-size="10" fill="#0C5E80">NaCl → Na⁺ + Cl⁻</text>
  <text x="104" y="208" text-anchor="middle" font-family="monospace" font-size="10" fill="#C4382A">MgSO₄ → Mg²⁺ + SO₄²⁻</text>
  <text x="104" y="238" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Divalent z = 2 increases</text>
  <text x="104" y="252" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">ionic strength 4×!</text>

  <line x1="186" y1="158" x2="202" y2="158" stroke="#0C5E80" stroke-width="2"/>
  <polygon points="200,153 208,158 200,163" fill="#0C5E80"/>

  <rect x="208" y="54" width="164" height="220" rx="12" fill="#FFF7ED" stroke="#B45309" stroke-width="1.3"/>
  <text x="290" y="76" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#B45309">2. Crystal Hydrates</text>
  <rect x="220" y="90" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="290" y="110" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#182026">MgSO₄·7H₂O</text>
  <text x="290" y="126" text-anchor="middle" font-family="monospace" font-size="10" fill="#B45309">M = 246.5 g/mol</text>
  <text x="290" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">Anhydrous MgSO₄:</text>
  <text x="290" y="172" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#182026">120.4 / 246.5 = 48.8%</text>
  <text x="290" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#B45309">To add 1.0 g pure salt,</text>
  <text x="290" y="212" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#B45309">weigh 2.05 g hydrate!</text>
  <text x="290" y="240" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Same for citric acid</text>
  <text x="290" y="254" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">monohydrate (91.4%)</text>

  <line x1="372" y1="158" x2="388" y2="158" stroke="#0C5E80" stroke-width="2"/>
  <polygon points="386,153 394,158 386,163" fill="#0C5E80"/>

  <rect x="394" y="54" width="164" height="220" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.3"/>
  <text x="476" y="76" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#6D28D9">3. Commercial Grade</text>
  <rect x="406" y="90" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="476" y="110" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#182026">m_raw = m_act / w</text>
  <text x="476" y="126" text-anchor="middle" font-family="monospace" font-size="10" fill="#6D28D9">w from lot CoA</text>
  <text x="476" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">Target 10% active SLES</text>
  <text x="476" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">from 70% paste:</text>
  <text x="476" y="194" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#6D28D9">10 / 0.70 = 14.29%</text>
  <text x="476" y="218" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">Paste brings 4.29% water</text>
  <text x="476" y="232" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">into the vessel</text>
  <text x="476" y="252" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">(plus CAPB salt per CoA!)</text>

  <line x1="558" y1="158" x2="574" y2="158" stroke="#0C5E80" stroke-width="2"/>
  <polygon points="572,153 580,158 572,163" fill="#0C5E80"/>

  <rect x="580" y="54" width="158" height="220" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="1.3"/>
  <text x="659" y="76" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#047857">4. 100% Balance</text>
  <rect x="592" y="90" width="134" height="44" rx="8" fill="#FFFFFF" stroke="#DCE6EE"/>
  <text x="659" y="110" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#047857">Σ wᵢ = 100.00%</text>
  <text x="659" y="126" text-anchor="middle" font-family="monospace" font-size="10" fill="#5B6770">Aqua q.s. ad 100</text>
  <text x="659" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">Subtract water carried by</text>
  <text x="659" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">all liquid solutions and</text>
  <text x="659" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#182026">pH adjusters.</text>
  <text x="659" y="214" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857">Result: exact batch</text>
  <text x="659" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857">weighing sheet (g / kg)</text>
  <text x="659" y="252" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5B6770">for any batch scale</text>
</svg>