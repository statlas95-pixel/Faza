<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Dilution-deposition coacervate mechanism on hair cuticle">
  <rect width="760" height="264" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">Dilution-Deposition Coacervate Mechanism During Shampoo Rinsing</text>
  <g transform="translate(26,48)">
    <rect width="224" height="194" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
    <text x="112" y="22" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#182026">1. Concentrated Shampoo</text>
    <circle cx="72" cy="78" r="22" fill="#E6F6FE" stroke="#0E8B99" stroke-width="1.8"/>
    <circle cx="152" cy="84" r="22" fill="#E6F6FE" stroke="#0E8B99" stroke-width="1.8"/>
    <path d="M48 92 Q112 52 176 96" fill="none" stroke="#E05545" stroke-width="2.5"/>
    <text x="112" y="128" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Excess SLES micelles solubilize</text>
    <text x="112" y="143" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">cationic polymer in clear bulk</text>
    <rect x="24" y="158" width="176" height="20" rx="6" fill="#FFEAE7"/>
    <text x="112" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#C4382A">−  −  Hair Cuticle (−SO₃⁻)  −  −</text>
  </g>
  <g transform="translate(268,48)">
    <rect width="224" height="194" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
    <text x="112" y="22" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#182026">2. Water Dilution (Lochhead Zone)</text>
    <ellipse cx="112" cy="84" rx="54" ry="26" fill="#F2FBD9" stroke="#3D5A08" stroke-width="1.8"/>
    <path d="M74 84 Q112 66 150 86 Q112 102 74 84" fill="none" stroke="#E05545" stroke-width="2.4"/>
    <circle cx="96" cy="84" r="6" fill="#8ED6F8"/><circle cx="128" cy="84" r="6" fill="#8ED6F8"/>
    <text x="112" y="128" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Micelle dissociation precipitates</text>
    <text x="112" y="143" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3D5A08" font-weight="600">coacervate + silicone droplets</text>
    <rect x="24" y="158" width="176" height="20" rx="6" fill="#FFEAE7"/>
    <text x="112" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#C4382A">−  −  Electrostatic (+) → (−)  −  −</text>
  </g>
  <g transform="translate(510,48)">
    <rect width="224" height="194" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
    <text x="112" y="22" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#182026">3. Post-Rinse Conditioning</text>
    <text x="112" y="76" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5B6770">Thin lubricating film lowers</text>
    <text x="112" y="92" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0E8B99" font-weight="600">combing friction &amp; static charge</text>
    <rect x="24" y="142" width="176" height="14" rx="5" fill="#C8E972" stroke="#3D5A08" stroke-width="1.2"/>
    <text x="112" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#182026">+  +  Coacervate Film  +  +</text>
    <rect x="24" y="158" width="176" height="20" rx="6" fill="#FFEAE7"/>
    <text x="112" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#C4382A">−  −  Damaged Cuticle  −  −</text>
  </g>
</svg>
