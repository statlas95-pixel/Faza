<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="UVB and UVA filter absorption spectra and critical wavelength">
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#182026">UVB / UVA Filter Spectral Overlap &amp; the UVA-PF ≥ 1/3 SPF Rule</text>
  <rect x="64" y="48" width="160" height="164" fill="#FFEAE7" opacity="0.55"/>
  <rect x="224" y="48" width="160" height="164" fill="#E6F6FE" opacity="0.65"/>
