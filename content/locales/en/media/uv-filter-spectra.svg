    <line x1="0" y1="6" x2="22" y2="6" stroke="#E05545" stroke-width="2.8"/><text x="28" y="10">UVB filter (Uvinul T 150)</text>
    <line x1="205" y1="6" x2="227" y2="6" stroke="#1F648A" stroke-width="2.8" stroke-dasharray="5 3"/><text x="233" y="10">UVA filter (Uvinul A Plus / Avobenzone)</text>
    <line x1="480" y1="6" x2="502" y2="6" stroke="#0E8B99" stroke-width="3.2"/><text x="508" y="10">Broad-spectrum (Tinosorb S)</text>
