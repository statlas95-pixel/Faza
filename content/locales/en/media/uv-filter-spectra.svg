  <text x="304" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0C5E80">UVA II (320–340 nm)</text>
  <text x="542" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#3D5A08">UVA I (340–400 nm)</text>
  <line x1="64" y1="212" x2="700" y2="212" stroke="#182026" stroke-width="1.5"/>
  <line x1="64" y="48" x2="64" y2="212" stroke="#182026" stroke-width="1.5"/>
  <path d="M64 185 Q120 72 164 82 Q208 92 256 206 L700 210" fill="none" stroke="#E05545" stroke-width="2.8"/>
  <path d="M236 208 Q360 198 446 94 Q518 78 588 184 Q634 208 700 210" fill="none" stroke="#1F648A" stroke-width="2.8" stroke-dasharray="6 3"/>
  <path d="M64 152 Q154 88 264 114 Q388 86 488 106 Q576 138 666 206 L700 210" fill="none" stroke="#0E8B99" stroke-width="3.2"/>
  <line x1="556" y1="48" x2="556" y2="212" stroke="#3D5A08" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="552" y="198" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#3D5A08">λc ≥ 370 nm</text>
  <text x="64" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#5B6770">290</text>
  <text x="224" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#5B6770">320</text>
  <text x="384" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#5B6770">340</text>
  <text x="556" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#5B6770">370</text>
  <text x="700" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#5B6770">400 nm</text>
