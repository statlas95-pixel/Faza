<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Darcy porous flow">
  <style>
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes rise{0%{transform:translateY(14px);opacity:.25}50%{opacity:.95}100%{transform:translateY(-22px);opacity:.1}}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.55}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .flow{stroke-dasharray:6 4;animation:flow 1.8s linear infinite}
  .rise{animation:rise 2.8s ease-in-out infinite}
  .rise2{animation:rise 3.4s ease-in-out infinite .9s}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @media (prefers-reduced-motion:reduce){.flow,.rise,.rise2,.pulse,.spin{animation:none!important}}
</style>
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Darcy Flow Through Porous Bed: Q = (k · A · ΔP) / (μ · L)</text>
  <g transform="translate(36,48)">
        <rect width="688" height="196" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.6"/>
        <rect x="196" y="24" width="296" height="132" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/>
        <g fill="#94A3B8">
          <circle cx="232" cy="54" r="14"/><circle cx="284" cy="48" r="16"/><circle cx="342" cy="56" r="15"/><circle cx="400" cy="48" r="15"/><circle cx="452" cy="58" r="14"/>
          <circle cx="256" cy="96" r="15"/><circle cx="314" cy="94" r="16"/><circle cx="372" cy="98" r="14"/><circle cx="428" cy="94" r="16"/>
          <circle cx="228" cy="134" r="14"/><circle cx="286" cy="136" r="15"/><circle cx="346" cy="134" r="16"/><circle cx="406" cy="136" r="14"/><circle cx="458" cy="134" r="13"/>
        </g>
        <g stroke="#0284C7" stroke-width="2.6" fill="none" class="flow">
          <path d="M46,66 L196,66 Q244,72 300,72 T492,66 L640,66"/>
          <path d="M46,114 L196,114 Q256,116 324,114 T492,114 L640,114"/>
        </g>
        <text x="118" y="48" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0C5E80">P₁ (Inlet)</text>
        <text x="568" y="48" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#047857">P₂ (Filtrate)</text>
        <text x="344" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#182026">Lower viscosity μ (heating) or adding filter aid (perlite/celite) preserves permeability k</text>
      </g>
</svg>
