<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Thermal resistance cascade across a jacketed reactor wall showing limiting viscous cream film, fouling layer, stainless steel wall, coolant film, and temperature drop curve">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9z" fill="#C4382A"/>
    </marker>
  </defs>
  <rect width="760" height="320" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Thermal Resistance Cascade Across a Jacketed Reactor Wall (1/U)</text>

  <!-- Main cross-section card -->
  <rect x="24" y="44" width="712" height="208" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>

  <!-- Heat flux arrow at top -->
  <line x1="250" y1="59" x2="496" y2="59" stroke="#C4382A" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="374" y="55" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#C4382A">Heat Flux q = U · A · ΔT  →</text>

  <!-- 6 vertical zones -->
  <rect x="48" y="68" width="114" height="158" fill="#FFF1F0"/>
  <rect x="162" y="68" width="192" height="158" fill="#FFEAE7"/>
  <rect x="354" y="68" width="62" height="158" fill="#FEF3C7"/>
  <rect x="416" y="68" width="82" height="158" fill="#E2E8F0"/>
  <rect x="498" y="68" width="90" height="158" fill="#EFF9FF"/>
  <rect x="588" y="68" width="124" height="158" fill="#E6F6FE"/>

  <!-- Zone boundary lines -->
  <line x1="162" y1="68" x2="162" y2="226" stroke="#C4382A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="354" y1="68" x2="354" y2="226" stroke="#B45309" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="416" y1="68" x2="416" y2="226" stroke="#182026" stroke-width="1.8"/>
  <line x1="498" y1="68" x2="498" y2="226" stroke="#182026" stroke-width="1.8"/>
  <line x1="588" y1="68" x2="588" y2="226" stroke="#0C5E80" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="48" y="68" width="664" height="158" fill="none" stroke="#DCE6EE" stroke-width="1.2"/>

  <!-- Layer headers -->
  <g font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <text x="105" y="84" fill="#C4382A">Bulk Cream</text>
    <text x="258" y="84" fill="#C4382A">Product Film (Limiting!)</text>
    <text x="385" y="84" fill="#B45309">Fouling</text>
    <text x="457" y="84" fill="#182026">316L Steel</text>
    <text x="543" y="84" fill="#0C5E80">Coolant Film</text>
    <text x="650" y="84" fill="#0C5E80">Jacket Bulk</text>
  </g>

  <!-- Temperature profile curve T(x) -->
  <path d="M 54 106 L 162 106 C 216 122 288 156 354 180 L 416 190 L 498 196 L 588 202 L 704 202" fill="none" stroke="#C4382A" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Interface nodes -->
  <g fill="#C4382A" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="162" cy="106" r="4"/>
    <circle cx="354" cy="180" r="4"/>
    <circle cx="416" cy="190" r="4"/>
    <circle cx="498" cy="196" r="4"/>
    <circle cx="588" cy="202" r="4"/>
  </g>

  <!-- Bulk temperature labels -->
  <text x="105" y="100" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#C4382A">T₁ = 75 °C</text>
  <text x="650" y="194" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0C5E80">T₂ = 18 °C</text>

  <!-- Delta T callout -->
  <line x1="176" y1="108" x2="176" y2="178" stroke="#C4382A" stroke-width="1.4" stroke-dasharray="3 2"/>
  <line x1="172" y1="178" x2="348" y2="178" stroke="#C4382A" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="184" y="140" width="136" height="32" rx="7" fill="#FFFFFF" stroke="#C4382A" stroke-width="1.1"/>
  <text x="252" y="154" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#C4382A">ΔT₁ ≈ 48 °C (~85%)</text>
  <text x="252" y="167" text-anchor="middle" font-family="sans-serif" font-size="8.8" fill="#5B6770">Controlling bottleneck!</text>

  <!-- Resistance share labels -->
  <g font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">
    <text x="258" y="218" fill="#C4382A">1/α₁ ≈ 85% R</text>
    <text x="385" y="218" fill="#B45309">R_f</text>
    <text x="457" y="218" fill="#182026">δ/λ ≈ 5%</text>
    <text x="543" y="218" fill="#0C5E80">1/α₂ ≈ 6%</text>
  </g>
  <g font-family="sans-serif" font-size="9" fill="#5B6770" text-anchor="middle">
    <text x="105" y="242">Agitated core</text>
    <text x="258" y="242">Stagnant viscous layer (α₁ ≈ 150)</text>
    <text x="457" y="242">6 mm steel</text>
    <text x="650" y="242">Turbulent coolant (α₂ ≈ 2000)</text>
  </g>

  <!-- Bottom formula bar -->
  <rect x="24" y="262" width="712" height="42" rx="11" fill="#EFF9FF" stroke="#0C5E80" stroke-width="1.3"/>
  <text x="380" y="280" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0C5E80">1/U = 1/α₁ (limiting) + R_f + δ/λ + 1/α₂</text>
  <text x="380" y="296" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#182026">Thinner steel barely helps — anchor scrapers sweep the wall film 1/α₁ and boost overall U by 3–5×</text>
</svg>
