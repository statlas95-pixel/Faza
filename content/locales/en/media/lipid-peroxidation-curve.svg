<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Lipid peroxidation curve">
  
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">PUFA Oxidation Kinetics: Peroxide Value (PV) &amp; Induction Period</text>
  <g transform="translate(56,48)">
        <rect x="0" y="0" width="648" height="196" rx="14" fill="#FFFFFF" stroke="#DCE6EE"/>
        <line x1="60" y1="158" x2="606" y2="158" stroke="#64748B" stroke-width="1.6"/>
        <line x1="60" y1="22" x2="60" y2="158" stroke="#64748B" stroke-width="1.6"/>
        <line x1="60" y1="104" x2="606" y2="104" stroke="#EF4444" stroke-dasharray="5 3" opacity=".7"/>
        <text x="602" y="98" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="700" fill="#DC2626">Rancidity limit (PV ≈ 10 meq/kg)</text>
        <path d="M60,152 Q160,148 210,104 T310,28" fill="none" stroke="#EF4444" stroke-width="3"/>
        <path d="M60,152 Q360,150 470,136 T600,66" fill="none" stroke="#10B981" stroke-width="3"/>
        <text x="234" y="48" font-family="sans-serif" font-size="11" font-weight="700" fill="#DC2626">Unprotected PUFA</text>
        <text x="410" y="132" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857">Tocopherol + EDTA (long induction)</text>
        <text x="330" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Storage time (days at 40 °C)</text>
        <text x="22" y="92" text-anchor="middle" transform="rotate(-90 22 92)" font-family="sans-serif" font-size="11" fill="#475569">PV</text>
      </g>
</svg>
