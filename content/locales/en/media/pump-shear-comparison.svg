<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Rotary lobe vs centrifugal pump">
  <style>
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes rise{0%{transform:translateY(14px);opacity:.25}50%{opacity:.95}100%{transform:translateY(-22px);opacity:.1}}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.55}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .flow{stroke-dasharray:6 4;animation:flow 1.8s linear infinite}
  .rise{animation:rise 2.8s ease-in-out infinite}
  .rise2{animation:rise 3.4s ease-in-out infinite .9s}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @media (prefers-reduced-motion:reduce){.flow,.rise,.rise2,.pulse,.spin{animation:none!important}}
</style>
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Pump Selection: Gentle Rotary Lobe (Creams) vs Centrifugal (Water)</text>
  <g transform="translate(28,48)">
        <rect width="340" height="198" rx="14" fill="#ECFDF5" stroke="#34D399" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#065F46">Rotary Lobe / Progressive Cavity (PD)</text>
        <rect x="92" y="54" width="156" height="86" rx="43" fill="#FFFFFF" stroke="#059669" stroke-width="2.4"/>
        <g transform="translate(136,97)" class="spin"><ellipse cx="0" cy="0" rx="22" ry="12" fill="#10B981"/><ellipse cx="0" cy="0" rx="12" ry="22" fill="#10B981"/></g>
        <g transform="translate(204,97)" class="spin"><ellipse cx="0" cy="0" rx="22" ry="12" fill="#34D399"/><ellipse cx="0" cy="0" rx="12" ry="22" fill="#34D399"/></g>
        <text x="170" y="164" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#065F46">Low shear · Preserves LGN &amp; viscosity</text>
        <text x="170" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Creams, gels, shampoos (> 0.5 Pa·s)</text>
      </g>
      <g transform="translate(392,48)">
        <rect width="340" height="198" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0C5E80">Centrifugal Impeller (High RPM)</text>
        <circle cx="170" cy="97" r="42" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.4"/>
        <g transform="translate(170,97)" class="spin" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round">
          <line x1="-28" y1="0" x2="28" y2="0"/><line x1="0" y1="-28" x2="0" y2="28"/><line x1="-20" y1="-20" x2="20" y2="20"/><line x1="-20" y1="20" x2="20" y2="-20"/>
        </g>
        <text x="170" y="164" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0C5E80">Best for WPU loops, toners, CIP</text>
        <text x="170" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#B91C1C">High shear breaks creams &amp; foams surfactants!</text>
      </g>
</svg>
