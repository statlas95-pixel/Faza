<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="TDS SDS CoA triangle">
  
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Incoming Raw Material Dossier: TDS · SDS · CoA</text>
  <g transform="translate(26,52)">
        <rect width="218" height="186" rx="14" fill="#EFF9FF" stroke="#8ED6F8" stroke-width="1.8"/>
        <text x="109" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0C5E80">TDS</text>
        <text x="109" y="46" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0369A1">Technical Data Sheet</text>
        <g font-family="sans-serif" font-size="10.5" fill="#182026">
          <text x="18" y="78">• INCI &amp; active matter %</text>
          <text x="18" y="100">• Recommended % &amp; pH</text>
          <text x="18" y="122">• Solubility &amp; max temp</text>
          <text x="18" y="144">• Shelf life &amp; storage</text>
        </g>
        <text x="109" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0C5E80">Used in R&amp;D Design</text>
      </g>
      <g transform="translate(271,52)">
        <rect width="218" height="186" rx="14" fill="#FFF1F0" stroke="#FF968A" stroke-width="1.8"/>
        <text x="109" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#9A3528">SDS (MSDS)</text>
        <text x="109" y="46" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#B91C1C">Safety Data Sheet (16 sec)</text>
        <g font-family="sans-serif" font-size="10.5" fill="#182026">
          <text x="18" y="78">• GHS H/P hazard codes</text>
          <text x="18" y="100">• PPE &amp; ventilation</text>
          <text x="18" y="122">• CAS / EC impurities</text>
          <text x="18" y="144">• Flash point &amp; disposal</text>
        </g>
        <text x="109" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#9A3528">Used in HSE &amp; PIF</text>
      </g>
      <g transform="translate(516,52)">
        <rect width="218" height="186" rx="14" fill="#ECFDF5" stroke="#34D399" stroke-width="1.8"/>
        <text x="109" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#065F46">CoA</text>
        <text x="109" y="46" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#047857">Certificate of Analysis</text>
        <g font-family="sans-serif" font-size="10.5" fill="#182026">
          <text x="18" y="78">• Exact Lot # &amp; Exp date</text>
          <text x="18" y="100">• Actual % NaCl / Assay</text>
          <text x="18" y="122">• Peroxide / Acid value</text>
          <text x="18" y="144">• Microbiology TAMC/TYMC</text>
        </g>
        <text x="109" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#065F46">Incoming QC Gate</text>
      </g>
</svg>
