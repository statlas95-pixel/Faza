<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Griffin HLB scale 0 to 20 and lever-rule calculation blending low and high HLB emulsifiers">
  <rect width="760" height="320" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Griffin HLB Scale (0–20) &amp; Lever-Rule Emulsifier Blend Calculation</text>

  <!-- Polarity captions -->
  <text x="40" y="54" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#C4382A">← Lipophilic (oil-soluble)</text>
  <text x="720" y="54" text-anchor="end" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0C5E80">Hydrophilic (water-soluble) →</text>

  <!-- Functional HLB bands: x = 40 + hlb * 34 -->
  <!-- Row 1 (y=64, h=24) -->
  <rect x="74" y="64" width="68" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
  <text x="108" y="79" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#B45309">Antifoam 1–3</text>

  <rect x="142" y="64" width="102" height="24" rx="6" fill="#FFEAE7" stroke="#C4382A" stroke-width="1.2"/>
  <text x="193" y="79" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#C4382A">W/O emuls. 3–6</text>

  <rect x="278" y="64" width="68" height="24" rx="6" fill="#F2FBD9" stroke="#3D5A08" stroke-width="1.2"/>
  <text x="312" y="79" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#3D5A08">Wetting 7–9</text>

  <rect x="482" y="64" width="68" height="24" rx="6" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.2"/>
  <text x="516" y="79" text-anchor="middle" font-family="sans-serif" font-size="9.2" font-weight="700" fill="#6D28D9">Deterg. 13–15</text>

  <rect x="550" y="64" width="102" height="24" rx="6" fill="#ECFDF5" stroke="#047857" stroke-width="1.2"/>
  <text x="601" y="79" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#047857">Solubilizers 15–18</text>

  <!-- Row 2 (y=94, h=24): O/W emulsifiers 8–16 -->
  <rect x="312" y="94" width="272" height="24" rx="6" fill="#E6F6FE" stroke="#0C5E80" stroke-width="1.3"/>
  <text x="448" y="109" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0C5E80">O/W Emulsifiers (HLB 8–16)</text>

  <!-- HLB Axis 0–20 -->
  <line x1="40" y1="128" x2="720" y2="128" stroke="#182026" stroke-width="1.8"/>
  <g stroke="#182026" stroke-width="1.2">
    <line x1="40" y1="124" x2="40" y2="133"/>
    <line x1="108" y1="124" x2="108" y2="133"/>
    <line x1="176" y1="124" x2="176" y2="133"/>
    <line x1="244" y1="124" x2="244" y2="133"/>
    <line x1="312" y1="124" x2="312" y2="133"/>
    <line x1="380" y1="124" x2="380" y2="133"/>
    <line x1="448" y1="124" x2="448" y2="133"/>
    <line x1="516" y1="124" x2="516" y2="133"/>
    <line x1="584" y1="124" x2="584" y2="133"/>
    <line x1="652" y1="124" x2="652" y2="133"/>
    <line x1="720" y1="124" x2="720" y2="133"/>
  </g>
  <g font-family="monospace" font-size="10.5" fill="#5B6770" text-anchor="middle">
    <text x="40" y="147">0</text>
    <text x="108" y="147">2</text>
    <text x="176" y="147">4</text>
    <text x="244" y="147">6</text>
    <text x="312" y="147">8</text>
    <text x="380" y="147">10</text>
    <text x="448" y="147">12</text>
    <text x="516" y="147">14</text>
    <text x="584" y="147">16</text>
    <text x="652" y="147">18</text>
    <text x="720" y="147">20</text>
  </g>

  <!-- Lever-rule beam panel aligned to scale: 4.3 -> 186, 9.0 -> 346, 15.0 -> 550 -->
  <rect x="20" y="158" width="720" height="88" rx="12" fill="#FFFFFF" stroke="#DCE6EE"/>

  <line x1="186" y1="128" x2="186" y2="196" stroke="#C4382A" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="346" y1="128" x2="346" y2="196" stroke="#047857" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="550" y1="128" x2="550" y2="196" stroke="#0C5E80" stroke-width="1.3" stroke-dasharray="3 3"/>

  <line x1="186" y1="198" x2="550" y2="198" stroke="#182026" stroke-width="3.2" stroke-linecap="round"/>
  <polygon points="346,200 335,218 357,218" fill="#047857"/>
  <circle cx="186" cy="198" r="6" fill="#C4382A"/>
  <circle cx="550" cy="198" r="6" fill="#0C5E80"/>

  <text x="266" y="188" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#C4382A">ΔL = 9.0 − 4.3 = 4.7</text>
  <text x="448" y="188" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#0C5E80">ΔR = 15.0 − 9.0 = 6.0</text>
  <text x="346" y="234" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#047857">reqHLB = 9.0 (target)</text>

  <!-- Low-HLB Emulsifier A -->
  <rect x="30" y="168" width="142" height="68" rx="9" fill="#FFF1F0" stroke="#C4382A" stroke-width="1.2"/>
  <text x="101" y="185" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#C4382A">Emulsifier A</text>
  <text x="101" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#182026">HLB_A = 4.3</text>
  <text x="101" y="214" text-anchor="middle" font-family="sans-serif" font-size="9.2" fill="#5B6770">Sorbitan stearate</text>
  <text x="101" y="229" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#C4382A">w_A = 56.1%</text>

  <!-- High-HLB Emulsifier B -->
  <rect x="564" y="168" width="166" height="68" rx="9" fill="#EFF9FF" stroke="#0C5E80" stroke-width="1.2"/>
  <text x="647" y="185" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#0C5E80">Emulsifier B</text>
  <text x="647" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#182026">HLB_B = 15.0</text>
  <text x="647" y="214" text-anchor="middle" font-family="sans-serif" font-size="9.2" fill="#5B6770">Polysorbate 60</text>
  <text x="647" y="229" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#0C5E80">w_B = 43.9%</text>

  <!-- Worked calculation footer -->
  <rect x="20" y="254" width="720" height="50" rx="11" fill="#ECFDF5" stroke="#047857" stroke-width="1.3"/>
  <text x="380" y="274" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#182026">w_A = (15.0 − 9.0) / (15.0 − 4.3) = 6.0 / 10.7 = 56.1%   ·   w_B = 4.7 / 10.7 = 43.9%</text>
  <text x="380" y="294" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#047857" font-weight="700">Balance check: 0.561 × 4.3 + 0.439 × 15.0 = 2.41 + 6.59 = 9.00 = reqHLB (sum = 100%)</text>
</svg>
