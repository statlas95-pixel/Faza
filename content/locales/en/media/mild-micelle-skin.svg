<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Mild surfactant mixed micelles">
  <style>
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes rise{0%{transform:translateY(14px);opacity:.25}50%{opacity:.95}100%{transform:translateY(-22px);opacity:.1}}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.55}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .flow{stroke-dasharray:6 4;animation:flow 1.8s linear infinite}
  .rise{animation:rise 2.8s ease-in-out infinite}
  .rise2{animation:rise 3.4s ease-in-out infinite .9s}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @media (prefers-reduced-motion:reduce){.flow,.rise,.rise2,.pulse,.spin{animation:none!important}}
</style>
  <rect width="760" height="270" rx="18" fill="#F7FAFC" stroke="#DCE6EE"/>
  <text x="380" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" font-weight="700" fill="#182026">Why Co-Surfactants Make Cleansers Milder (Micelle Size &amp; CMC)</text>
  <g transform="translate(28,46)">
        <rect width="340" height="202" rx="14" fill="#FFF1F0" stroke="#FF968A" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#9A3528">Single Anionic (SLS): High CMC · Small Micelles</text>
        <g fill="#EF4444" opacity=".82">
          <circle cx="88" cy="68" r="10"/><circle cx="152" cy="72" r="10"/><circle cx="222" cy="66" r="10"/><circle cx="276" cy="74" r="6"/>
        </g>
        <rect x="24" y="114" width="292" height="44" rx="8" fill="#FDE68A" stroke="#D97706"/>
        <text x="170" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#78350F">Stratum Corneum (lipids + keratin)</text>
        <g stroke="#DC2626" stroke-width="2" class="flow"><line x1="88" y1="80" x2="88" y2="122"/><line x1="152" y1="84" x2="152" y2="122"/><line x1="222" y1="78" x2="222" y2="122"/></g>
        <text x="170" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9A3528">Free monomers &amp; tiny micelles swell proteins &amp; strip lipids</text>
      </g>
      <g transform="translate(392,46)">
        <rect width="340" height="202" rx="14" fill="#ECFDF5" stroke="#34D399" stroke-width="1.6"/>
        <text x="170" y="24" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#065F46">SLES + CAPB / Glucoside: Large Mixed Micelles</text>
        <g fill="#10B981" stroke="#047857" stroke-width="2" opacity=".82">
          <circle cx="104" cy="72" r="24"/><circle cx="226" cy="72" r="26"/>
        </g>
        <text x="104" y="76" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#FFF">d &gt; 6 nm</text>
        <text x="226" y="76" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#FFF">d &gt; 6 nm</text>
        <rect x="24" y="114" width="292" height="44" rx="8" fill="#FEF9C3" stroke="#CA8A04"/>
        <text x="170" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#713F12">Intact Stratum Corneum Barrier</text>
        <text x="170" y="182" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#065F46" font-weight="600">Too large to penetrate · low free monomer concentration</text>
      </g>
</svg>
