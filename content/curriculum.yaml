  - id: bridge
    name: Перейти из производства в R&D
    hint: От процесса — к причинам и эксперименту
    order: [rheology-basics, polymer-thickeners, emulsion-stability, emulsifier-selection, inverse-emulsions-wo, sunscreens-spf, pigment-dispersions, anhydrous-sticks-balms, fragrances-allergens, unstable-actives, doe-basics, fractional-design, stability-testing, packaging-compatibility, preservation, lamellar-gel-network, surfactant-thickening, cleanser-mildness, hair-care-systems, scale-up, emulsification, mixing-basics, impeller-geometry, dissolution, micellar-solubility, ph-buffers, raw-functions, oil-oxidation, ingredient-documents, solutions-basics, ionic-strength, water-raw, water-sanitation, cip-verification, disperse-systems, surface-adsorption, particle-sizing, surface-tension, powder-wetting, foam-control, fluid-flow, pump-selection, porous-flow, filtration, heat-transfer, fat-melting, flow-exchangers, deaeration, colloid-stability]
  - id: base
    name: Освоить основы с начала
    hint: По порядку карты знаний
    order: [raw-functions, oil-oxidation, ingredient-documents, solutions-basics, ionic-strength, water-raw, water-sanitation, cip-verification, ph-buffers, disperse-systems, surface-adsorption, particle-sizing, surface-tension, powder-wetting, foam-control, emulsion-stability, emulsifier-selection, inverse-emulsions-wo, sunscreens-spf, pigment-dispersions, anhydrous-sticks-balms, fragrances-allergens, rheology-basics, polymer-thickeners, surfactant-thickening, cleanser-mildness, hair-care-systems, lamellar-gel-network, unstable-actives, stability-testing, packaging-compatibility, preservation, doe-basics, fractional-design, fluid-flow, pump-selection, porous-flow, filtration, heat-transfer, fat-melting, flow-exchangers, deaeration, mixing-basics, impeller-geometry, dissolution, micellar-solubility, emulsification, scale-up, colloid-stability]
contexts:
  - { id: grad, name: "Выпускник вуза — знаю теорию, мало практики" }
  - { id: floor, name: Работаю на варочном участке или в цехе }
  - { id: lab, name: Работаю в лаборатории или R&D }
  - { id: study, name: Учусь или только начинаю }
sections:
  - id: chem
    name: Основы косметической химии
    text: От сырья и водных растворов через основы коллоидной и поверхностной химии — к эмульсиям, реологии, стабильности и микробиологической чистоте.
    color: apricot
    modules:
      - id: chem-raw
        name: Сырьё и водные растворы
        topics: [{ id: raw-functions }, { id: solutions-basics }, { id: water-raw }, { id: ph-buffers, prereq: [solutions-basics] }, { id: ionic-strength, prereq: [solutions-basics] }, { id: micellar-solubility, prereq: [dissolution] }, { id: oil-oxidation, prereq: [raw-functions] }, { id: ingredient-documents, prereq: [raw-functions] }]
      - id: chem-colloid
        name: Основы коллоидной и поверхностной химии
        topics: [{ id: disperse-systems }, { id: surface-tension, prereq: [disperse-systems] }, { id: colloid-stability, prereq: [surface-tension] }, { id: powder-wetting, prereq: [surface-tension] }, { id: surface-adsorption, prereq: [disperse-systems] }, { id: foam-control, prereq: [surface-tension] }, { id: particle-sizing, prereq: [disperse-systems] }]
      - id: chem-surf
        name: ПАВ-системы
        topics: [{ id: surfactant-thickening, prereq: [rheology-basics, surface-tension] }, { id: emulsifier-selection, prereq: [emulsion-stability] }, { id: cleanser-mildness, prereq: [surfactant-thickening] }]
      - id: chem-disp
        name: Дисперсные системы и эмульсии
        topics: [{ id: emulsion-stability, prereq: [disperse-systems] }, { id: lamellar-gel-network, prereq: [rheology-basics] }, { id: inverse-emulsions-wo, prereq: [emulsion-stability, emulsifier-selection] }]
      - id: chem-rheo
        name: Полимеры и реология
        topics: [{ id: rheology-basics }, { id: polymer-thickeners, prereq: [rheology-basics] }]
      - id: chem-stab
        name: Стабильность и эксперимент
        topics: [{ id: stability-testing, prereq: [emulsion-stability, rheology-basics] }, { id: doe-basics }, { id: fractional-design, prereq: [doe-basics] }]
      - id: chem-micro
        name: Консервирование и микробиологическая чистота
        topics: [{ id: preservation, prereq: [ph-buffers] }, { id: water-sanitation, prereq: [water-raw] }]
      - id: chem-applied
        name: Прикладные категории и упаковка
        topics: [{ id: sunscreens-spf, prereq: [emulsifier-selection] }, { id: hair-care-systems, prereq: [surfactant-thickening] }, { id: unstable-actives, prereq: [ph-buffers] }, { id: packaging-compatibility, prereq: [stability-testing] }]
      - id: chem-color
        name: Декоративная косметика, стики и отдушки
        topics: [{ id: pigment-dispersions, prereq: [powder-wetting, surface-adsorption] }, { id: anhydrous-sticks-balms, prereq: [fat-melting, oil-oxidation] }, { id: fragrances-allergens, prereq: [micellar-solubility, ingredient-documents] }]
  - id: proc
    name: Процессы и аппараты
    text: Инженерные основы (гидравлика, теплообмен, перемешивание) и типовые процессы косметического производства — что происходит в аппарате физически, чем управляет технолог и по чему судить о результате.
    color: teal
    modules:
      - id: proc-flow
        name: "Основы ПАХТ: гидравлика"
        topics: [{ id: fluid-flow, prereq: [rheology-basics] }, { id: pump-selection, prereq: [fluid-flow] }, { id: porous-flow, prereq: [fluid-flow] }]
      - id: proc-mix
        name: Гидродинамика и перемешивание
        topics: [{ id: mixing-basics, prereq: [fluid-flow] }, { id: dissolution, prereq: [solutions-basics] }, { id: impeller-geometry, prereq: [mixing-basics] }]
      - id: proc-disp
        name: Диспергирование и гомогенизация
        topics: [{ id: emulsification, prereq: [emulsion-stability] }]
      - id: proc-heat
        name: "Основы ПАХТ: теплообмен"
        topics: [{ id: heat-transfer }, { id: fat-melting, prereq: [heat-transfer] }, { id: flow-exchangers, prereq: [heat-transfer] }]
        also: [scale-up]
      - id: proc-scale
        name: Масштабирование
        topics: [{ id: scale-up, prereq: [emulsification, mixing-basics, heat-transfer] }]
      - id: proc-aux
        name: Вспомогательные операции
        topics: [{ id: deaeration, prereq: [disperse-systems, heat-transfer] }, { id: filtration, prereq: [porous-flow] }, { id: cip-verification, prereq: [water-sanitation] }]
